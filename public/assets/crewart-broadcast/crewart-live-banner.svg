<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="460" viewBox="0 0 1600 460" role="img" aria-labelledby="title desc">
  <title id="title">CREWART live</title>
  <desc id="desc">Modern antique CREWART broadcast banner</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1b2021"/>
      <stop offset="1" stop-color="#0e1112"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#75633f"/>
      <stop offset=".5" stop-color="#d4bd86"/>
      <stop offset="1" stop-color="#75633f"/>
    </linearGradient>
    <pattern id="grain" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0v56" fill="none" stroke="#f2ead8" stroke-opacity=".025"/>
    </pattern>
    <filter id="lift" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-opacity=".34"/>
    </filter>
  </defs>
  <rect width="1600" height="460" rx="32" fill="url(#surface)"/>
  <rect width="1600" height="460" rx="32" fill="url(#grain)"/>
  <rect x="22" y="22" width="1556" height="416" rx="22" fill="none" stroke="#b59a62" stroke-opacity=".46" stroke-width="2"/>
  <rect x="34" y="34" width="1532" height="392" rx="16" fill="none" stroke="#d4bd86" stroke-opacity=".09"/>
  <g filter="url(#lift)">
    <rect x="86" y="84" width="1428" height="292" rx="20" fill="#141819" fill-opacity=".94" stroke="#b59a62" stroke-opacity=".32"/>
    <rect x="86" y="84" width="7" height="292" rx="3.5" fill="url(#brass)"/>
  </g>
  <text x="144" y="151" fill="#b59a62" font-family="Pretendard,Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="8">CREO BROADCAST  ·  LIVE AUCTION</text>
  <text x="136" y="279" fill="#f2ead8" font-family="Pretendard,Arial,sans-serif" font-size="112" font-weight="800" letter-spacing="-5">CREWART</text>
  <text x="140" y="332" fill="#bdb4a2" font-family="Pretendard,Arial,sans-serif" font-size="28" font-weight="600" letter-spacing="3">HOUSE HONOUR  ·  R G B Y</text>
  <g transform="translate(1125 142)">
    <rect width="70" height="176" rx="12" fill="#642f39"/><text x="35" y="108" text-anchor="middle" fill="#fff" font-family="Pretendard,Arial,sans-serif" font-size="48" font-weight="800">R</text>
    <rect x="82" width="70" height="176" rx="12" fill="#2f6b4c"/><text x="117" y="108" text-anchor="middle" fill="#fff" font-family="Pretendard,Arial,sans-serif" font-size="48" font-weight="800">G</text>
    <rect x="164" width="70" height="176" rx="12" fill="#355f95"/><text x="199" y="108" text-anchor="middle" fill="#fff" font-family="Pretendard,Arial,sans-serif" font-size="48" font-weight="800">B</text>
    <rect x="246" width="70" height="176" rx="12" fill="#b78b2f"/><text x="281" y="108" text-anchor="middle" fill="#fff" font-family="Pretendard,Arial,sans-serif" font-size="48" font-weight="800">Y</text>
  </g>
</svg>
