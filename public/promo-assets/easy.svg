<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="420" viewBox="0 0 1500 420"><rect width="1500" height="420" fill="#f5f6f8"/><g font-family="Malgun Gothic" fill="#202632"><text x="90" y="80" font-size="28" font-weight="700">낙찰 그다음까지, 간편하게</text><g text-anchor="middle"><rect x="90" y="124" width="340" height="170" rx="22" fill="#fee500"/><text x="260" y="189" font-size="26">자동 발송</text><text x="260" y="250" font-size="44" font-weight="700">카톡 알림톡</text><text x="490" y="234" font-size="52" fill="#728176">→</text><rect x="550" y="124" width="380" height="170" rx="22" fill="#e0ebe5"/><text x="740" y="189" font-size="26">내역 · 결제 안내</text><text x="740" y="250" font-size="44" font-weight="700">전용 페이지</text><text x="990" y="234" font-size="52" fill="#728176">→</text><rect x="1050" y="124" width="360" height="170" rx="22" fill="#e0ebe5"/><text x="1230" y="189" font-size="26">집 근처 업체에서</text><text x="1230" y="250" font-size="44" font-weight="700">픽업</text></g><text x="90" y="367" font-size="28" fill="#526359">배송 정보는 한 번 등록하면 다음에도 그대로</text></g></svg>