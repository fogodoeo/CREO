function theme(c){for(const[k,v]of Object.entries(c.theme||{}))document.documentElement.style.setProperty('--'+k,v)}
function pageAssets(assets,pageNo,kind){return(assets||[]).filter(asset=>asset.kind===kind&&(asset.page==='all'||asset.page===String(pageNo))).sort((a,b)=>(a.sortOrder||0)-(b.sortOrder||0)||String(a.name).localeCompare(String(b.name),'ko'))}

function ticker(c,text,assets,pageNo,position='auto'){const sponsors=pageAssets(assets,pageNo,'sponsor'),edge=position&&position!=='auto'?` data-edge="${esc(position)}"`:'';return`<div class="ticker"${edge}><span class="ticker-badge">${esc(c.shortName||c.name)}</span><div class="ticker-text">${esc(text||c.description||'경매가 곧 시작됩니다')}</div>${sponsors.length?`<div class="ticker-sponsors">${sponsors.slice(0,5).map(asset=>`<img src="${esc(asset.imageUrl)}" alt="${esc(asset.name)}">`).join('')}</div>`:''}</div>`}
function eventChip(c,label){const logo=c.logoUrl?`<img src="${esc(c.logoUrl)}" alt="">`:'',eyebrow=c.overlay?.skin==='heritage'?'AUCTION HOUSE':c.overlay?.skin==='metal'?'LIVE AUCTION':'CREO AUCTION';return`<div class="event-chip glass">${logo}<span><small>${eyebrow}</small><br>${esc(c.shortName||c.name)}</span></div><div class="page-label glass">${label}</div>`}
function banner(on,url,assets,pageNo,className='',position='auto'){if(!on)return'';const rows=pageAssets(assets,pageNo,'banner'),choices=rows.length?rows:(url?[{imageUrl:url,name:''}]:[]);if(!choices.length)return'';const asset=choices[Math.floor(Date.now()/6000)%choices.length];return`<img class="banner ${esc(className)}${placed(position)}" src="${esc(asset.imageUrl)}" alt="${esc(asset.name||'')}">`}
function showBanner(c,value){return Boolean(value)}
function pageOne(c,s,assets){const notice=s.notice||c.description||'방송 준비 중';const noticeHtml=s.page1NoticeOn!==false?`<div class="announcement glass${placed(s.page1NoticePosition)}"><small>LIVE INFORMATION</small><h1>${esc(notice)}</h1><p>${esc(s.noticeDetail||'')}</p></div>`:'';const hostRows=[{name:s.hostName1||'진행자',role:s.hostRole1||'MAIN HOST'},{name:s.hostName2,role:s.hostRole2||'CO-HOST'},{name:s.hostName3,role:s.hostRole3||'GUEST'}].filter(row=>String(row.name||'').trim());const hosts=s.page1HostsOn!==false?`<div class="host-stack${placed(s.page1HostsPosition)}">${hostRows.map((row,index)=>`<div class="host-card glass${index?' muted':''}"><small>${esc(row.role)}</small><strong>${esc(row.name)}</strong></div>`).join('')}</div>`:'';return`<section class="layer enter">${eventChip(c,'1P · HOST')}${noticeHtml}${hosts}${banner(showBanner(c,s.page1BannerOn),s.page1BannerUrl,assets,1,'is-page1',s.page1BannerPosition)}${s.page1TickerOn!==false?ticker(c,s.page1Ticker,assets,1,s.page1TickerPosition):''}</section>`}
function activeItem(s,items){return items.find(i=>i.id===s.activeItemId)||items.find(i=>String(i.status).toLowerCase()==='live')||null}
function vendorLogo(item,assets){if(item.vendorLogoUrl)return item.vendorLogoUrl;const target=String(item.vendorName||'').trim().toLocaleLowerCase('ko');if(!target)return'';const exact=(assets||[]).find(asset=>asset.kind==='vendor'&&String(asset.targetName||'').trim().toLocaleLowerCase('ko')===target);if(exact)return exact.imageUrl;const partial=(assets||[]).find(asset=>asset.kind==='vendor'&&(target.includes(String(asset.targetName||'').trim().toLocaleLowerCase('ko'))||String(asset.targetName||'').trim().toLocaleLowerCase('ko').includes(target)));return partial?.imageUrl||''}
function bidSortValue(bid,index){for(const value of [bid?.timestamp,bid?.created_at,bid?.time]){const parsed=Date.parse(String(value||''));if(Number.isFinite(parsed))return parsed}return index}
function pageTwoBidRows(item){const rows=Array.isArray(item?.bidLog)?item.bidLog:[],top=new Map;rows.forEach((bid,index)=>{const name=String(bid?.name||bid?.bidder_key||'입찰자').trim(),key=String(bid?.bidder_key||name).trim(),amount=Number(bid?.amount)||0,current=top.get(key);if(!current||amount>current.amount||(amount===current.amount&&bidSortValue(bid,index)>current.sort))top.set(key,{...bid,name,key,amount,sort:bidSortValue(bid,index)})});return[...top.values()].sort((a,b)=>b.amount-a.amount||b.sort-a.sort).slice(0,8)}

function pageTwo(c,s,items,assets){const item=activeItem(s,items);if(!item)return`<section class="layer">${eventChip(c,'2P · ITEM')}<div class="standby-note glass">개체 정보 대기 중</div>${banner(showBanner(c,s.page2BannerOn),s.page2BannerUrl,assets,2,'',s.page2BannerPosition)}${s.page2TickerOn!==false?ticker(c,s.page2Ticker,assets,2,s.page2TickerPosition):''}</section>`;const sold=s.mode==='sold',logo=vendorLogo(item,assets),logoMarkup=logo?`<img src="${esc(logo)}" alt="${esc(item.vendorName||'')} 로고">`:'',vendorTag=s.page2VendorTagOn!==false&&item.vendorName?`<span class="vendor-tag">[${esc(item.vendorName)}]</span>`:'',price=`<div class="price"><span>${sold?'낙찰가':'시작가'}</span><b>${money(sold?item.soldPrice:item.startPrice)}<small>원</small></b></div>`,priceInside=s.page2PricePosition==='auto'&&s.page2InfoOn!==false;const info=s.page2InfoOn!==false?`<div class="item-head glass${placed(s.page2HeaderPosition)}"><div class="item-name"><small>${sold?'SOLD':'NOW AUCTION'}</small><div class="item-title-line">${vendorTag}<strong>${esc(item.name)}</strong></div></div><div class="item-meta">${logo?`<img class="item-meta-logo" src="${esc(logo)}" alt="">`:''}<span>LOT <b>${String(item.lotNumber).padStart(3,'0')}</b></span></div></div><div class="item-copy${placed(s.page2InfoPosition)}"><div class="lot">LOT ${String(item.lotNumber).padStart(3,'0')}</div><h1>${esc(item.name)}</h1><div class="vendor">${logoMarkup}<span>${esc(item.vendorName||'')}</span></div>${item.note?`<div class="note">${esc(item.note)}</div>`:''}${s.page2PriceOn!==false&&priceInside?price:''}</div>`:'';const separatePrice=s.page2PriceOn!==false&&!priceInside?`<div class="price-card glass${placed(s.page2PricePosition)}">${price}</div>`:'';const photo=s.page2PhotoOn!==false?`<div class="item-photo glass${placed(s.page2PhotoPosition)}">${item.photoUrl?`<img src="${esc(item.photoUrl)}" alt="">`:'<div class="photo-empty">C</div>'}</div>`:'';const soldNotice=sold&&s.page2SoldOn!==false?`<div class="sold-notice sold-flash${placed(s.page2SoldPosition)}"><small>SOLD</small><strong>${esc(item.name)}</strong><span>${money(item.soldPrice)}원 · ${esc(item.vendorName||'')}</span></div>`:'';return`<section class="layer enter">${info}${pageTwoBidders(item,s)}${photo}${separatePrice}${soldNotice}${banner(showBanner(c,s.page2BannerOn),s.page2BannerUrl,assets,2,'',s.page2BannerPosition)}${s.page2TickerOn!==false?ticker(c,s.page2Ticker,assets,2,s.page2TickerPosition):''}</section>`}
function aggregateStats(items,key,fallback='미지정'){const map=new Map;for(const item of items){const name=String(item[key]||fallback).trim()||fallback;const row=map.get(name)||{name,count:0,sold:0,total:0};row.count++;if(Number(item.soldPrice)>0){row.sold++;row.total+=Number(item.soldPrice)}map.set(name,row)}return[...map.values()].sort((a,b)=>b.total-a.total||b.sold-a.sold||a.name.localeCompare(b.name,'ko'))}

function houseKey(name){const raw=String(name||'').trim().toUpperCase();return({RED:'R',GREEN:'G',BLUE:'B',YELLOW:'Y'})[raw]||(['R','G','B','Y'].includes(raw)?raw:String(name||''))}
function houseColor(name){return({R:'#8a2b31',G:'#285b3b',B:'#31558c',Y:'#b07d20'})[houseKey(name)]||'#c39a4a'}
function scoreboardRows(channel,items,board){const groups=new Map((channel.groups||[]).map(group=>[group.id,group])),rows=new Map;for(const item of items){const sold=CreoAuctionContract.isSoldStatus(item.status)||Number(item.soldPrice)>0;if(!sold)continue;let key='',label='',color='',logo='';if(board.dimension==='vendor'){key=item.vendorId||item.vendorName||'unknown';label=item.vendorName||'미지정';logo=item.vendorLogoUrl||''}else if(board.dimension==='group'){const raw=item.groupId||String(item.teamName||'').trim().toLowerCase();const group=groups.get(raw)||(channel.groups||[]).find(row=>row.name===item.teamName||row.shortName===item.teamName);key=group?.id||raw||'unknown';label=group?.shortName||group?.name||item.teamName||'미지정';color=group?.color||'';logo=group?.logoUrl||''}else if(board.dimension==='category'){key=item.category||'미지정';label=key}else{key=item.winnerAlias||'미지정';label=key}const row=rows.get(key)||{name:label,count:0,sold:0,total:0,color,logo};row.count++;row.sold++;row.total+=board.metric==='soldCount'?1:board.metric==='points'?Number(item.points)||0:Number(item.soldPrice)||0;rows.set(key,row)}return[...rows.values()].sort((a,b)=>b.total-a.total||b.sold-a.sold||a.name.localeCompare(b.name,'ko')).slice(0,board.topN||8)}
function mapLegacyItem(item){const status=CreoAuctionContract.normalizeStatus(item.status);return{id:`legacy_${item.row}`,lotNumber:Number(item.num)||0,name:item.name||item.displayName||'개체',vendorName:item.company||'',startPrice:Number(item.startPrice||item.price)||0,soldPrice:Number(item.soldPrice||item.sold_price)||0,status,note:item.note||'',photoUrl:item.photoItem||''}}

function pageThree(c,s,items){if(!s.page3On)return'';if(s.quizOn){const open=s.quizStatus==='open',closed=s.quizStatus==='closed',winner=String(s.quizWinner||'').trim(),answer=String(s.quizAnswer||'').trim(),zone=s.page3QuizPosition&&s.page3QuizPosition!=='auto'?` data-zone="${esc(s.page3QuizPosition)}"`:'';return`<section class="layer enter"><div class="quiz-board"${zone}><div class="quiz-card glass"><small>${closed?'QUIZ RESULT':open?'SURPRISE QUIZ · OPEN':'SURPRISE QUIZ'}</small><h1>${esc(s.quizQuestion||'문제를 준비하고 있습니다.')}</h1>${open?'<p>채팅으로 정답을 입력해주세요. 가장 먼저 맞힌 사람이 정답자입니다.</p>':'<p>잠시 후 정답 접수를 시작합니다.</p>'}${closed?`<div class="quiz-winner">${answer?`정답 <b>${esc(answer)}</b><br>`:''}${winner?`첫 정답자 · ${esc(winner)}`:'정답자 확인 중'}</div>`:''}</div></div></section>`}const board=(c.scoreboards||[]).find(row=>row.id===s.scoreboardId)||(c.scoreboards||[])[0]||null,mode=s.extraMode==='bracket'?'bracket':board?.dimension==='group'?'team':s.extraMode||'vendor',rows=board?scoreboardRows(c,items,board):mode==='team'?teamStats(items):vendorStats(items),unit=board?.unit||'원',title=s.page3Title||board?.name||(mode==='team'?'팀별 낙찰금액':mode==='vendor'?'업체별 낙찰금액':mode==='bracket'?'대진표 · 팀 현황':mode==='ranking'?'낙찰 순위':'낙찰 현황'),zone=s.page3BoardPosition&&s.page3BoardPosition!=='auto'?` data-zone="${esc(s.page3BoardPosition)}"`:'';let body='';if(mode==='bracket'){const pairs=[];for(let i=0;i<rows.length;i+=2){const a=rows[i],b=rows[i+1];pairs.push(`<div class="match glass"><div class="team"><small>GROUP ${String.fromCharCode(65+i)}</small><strong>${esc(a.name)}</strong><b>${boardValue(a,board,unit)}</b></div><div class="versus">VS</div><div class="team"><small>GROUP ${String.fromCharCode(66+i)}</small><strong>${esc(b?.name||'대기')}</strong><b>${b?boardValue(b,board,unit):'-'}</b></div></div>`)}body=`<div class="match-grid">${pairs.slice(0,board?.topN||8).join('')||'<div class="standby-note glass">대진 정보 대기 중</div>'}</div>`}else{body=`<div class="ranking">${rows.slice(0,board?.topN||8).map((r,i)=>`<div class="rank-card glass" style="--house-color:${esc(r.color||'var(--secondary)')}"><em>${i+1}</em><strong>${esc(r.name)}</strong><span>${boardValue(r,board,unit)}</span></div>`).join('')||'<div class="standby-note glass">집계 정보 대기 중</div>'}</div>`}return`<section class="layer enter"><div class="board"${zone}><div class="board-head"><div><small>LIVE AUCTION TOTAL</small><h1>${esc(title)}</h1></div><span>${esc(c.shortName||c.name)} · 3P</span></div>${body}</div></section>`}
function pageThreeFrame(channel,label,body,zone=''){const zoneAttr=zone&&zone!=='auto'?` data-zone="${esc(zone)}"`:'';return`<section class="layer enter" data-page3-renderer="${esc(document.body.dataset.page3Renderer||'scoreboard')}"><div class="board"${zoneAttr}><div class="board-head"><div><small>LIVE AUCTION TOTAL</small><h1>${esc(label)}</h1></div><span>${esc(channel.shortName||channel.name)} · 3P</span></div>${body}</div></section>`}
function renderScoreboardPageThree(channel,state,items){const board=(channel.scoreboards||[]).find(row=>row.id===state.scoreboardId)||(channel.scoreboards||[])[0]||null;const mode=board?.dimension==='group'?'team':state.extraMode||'vendor';const rows=board?scoreboardRows(channel,items,board):mode==='team'?teamStats(items):vendorStats(items);const unit=board?.unit||'원';const title=state.page3Title||board?.name||(mode==='team'?'팀별 낙찰금액':mode==='vendor'?'업체별 낙찰금액':'낙찰 현황');const body=`<div class="ranking">${rows.slice(0,board?.topN||8).map((row,index)=>`<div class="rank-card glass" style="--house-color:${esc(row.color||'var(--secondary)')}" data-rank="${index+1}"><em>${index+1}</em><strong>${esc(row.name)}</strong><span>${boardValue(row,board,unit)}</span></div>`).join('')||'<div class="standby-note glass">집계 정보 대기 중</div>'}</div>`;return pageThreeFrame(channel,title,body,state.page3BoardPosition)}
function renderTournamentPageThree(channel,state,items){const board=(channel.scoreboards||[]).find(row=>row.dimension==='group')||(channel.scoreboards||[])[0]||null;const rows=scoreboardRows(channel,items,board||{dimension:'group',metric:'soldAmount',topN:8,unit:'원'});const pairs=[];for(let index=0;index<rows.length;index+=2){const left=rows[index],right=rows[index+1];pairs.push(`<div class="match glass"><div class="team"><small>GROUP ${String.fromCharCode(65+index)}</small><strong>${esc(left?.name||'대기')}</strong><b>${left?boardValue(left,board,board?.unit||'원'):'-'}</b></div><div class="versus">VS</div><div class="team"><small>GROUP ${String.fromCharCode(66+index)}</small><strong>${esc(right?.name||'대기')}</strong><b>${right?boardValue(right,board,board?.unit||'원'):'-'}</b></div></div>`)}const body=`<div class="match-grid">${pairs.slice(0,board?.topN||8).join('')||'<div class="standby-note glass">대진 정보 대기 중</div>'}</div>`;return pageThreeFrame(channel,state.page3Title||'대진표',body,state.page3BoardPosition)}
function renderAcademyPageThree(channel,state,items){const board=(channel.scoreboards||[]).find(row=>row.dimension==='group')||(channel.scoreboards||[])[0]||null;const rows=scoreboardRows(channel,items,board||{dimension:'group',metric:'points',topN:4,unit:'점'});const body=`<div class="ranking academy-ranking">${rows.slice(0,board?.topN||4).map((row,index)=>`<article class="rank-card glass" style="--house-color:${esc(row.color||'var(--secondary)')}" data-house="${esc(row.name)}">${row.logo?`<img class="house-logo" src="${esc(row.logo)}" alt="">`:''}<em>${index+1}</em><strong>${esc(row.name)}</strong><span>${boardValue(row,board,board?.unit||'점')}</span></article>`).join('')||'<div class="standby-note glass">기숙사 집계 정보 대기 중</div>'}</div>`;return pageThreeFrame(channel,state.page3Title||'기숙사 컵',body,state.page3BoardPosition)}
function profilePageThree(channel,state,items){const contract=CreoBroadcastProfiles.pageContract(channel,3);document.body.dataset.page3Renderer=contract.id;if(state.quizOn){return pageThree(channel,state,items)}if(contract.id==='tournament')return renderTournamentPageThree(channel,state,items);if(contract.id==='academy')return renderAcademyPageThree(channel,state,items);return renderScoreboardPageThree(channel,state,items)}
function render(data){const profile=CreoBroadcastProfiles.resolve(data.channel);document.body.dataset.channel=data.channel?.id||'';document.body.dataset.skin=data.channel?.overlay?.skin||'clean';document.body.dataset.layout=data.channel?.overlay?.layout||'balanced';document.body.dataset.broadcastProfile=profile.id;theme(data.channel);const state={...CreoBroadcastProfiles.defaultState(data.channel),...(data.state||{})},items=data.items||[],assets=data.assets?.length?data.assets:(profile.assetPack==='crewart'?CREWART_DEFAULT_ASSETS:[]);stage.innerHTML=page===1?pageOne(data.channel,state,assets):page===2?pageTwo(data.channel,state,items,assets):profilePageThree(data.channel,state,items)}
function renderIfChanged(data){const banners=pageAssets(data.assets,page,'banner'),rotation=banners.length>1?Math.floor(Date.now()/6000):0;const revision=String(data.revision??data.state?.revision??data.state?.updatedAt??'0')+':'+page+':'+rotation+':'+data.assets.map(a=>`${a.id}:${a.imageUrl}`).join('|')+':'+data.items.map(i=>`${i.id}:${i.status}:${i.soldPrice}`).join('|');if(revision!==lastRevision){render(data);lastRevision=revision}}
async function refreshFull(){if(fullRefreshInFlight)return false;if(!channelId){error.hidden=false;error.textContent='채널 ID가 없습니다.';return false}fullRefreshInFlight=true;try{const res=await fetch(`/api/platform/channels/${encodeURIComponent(channelId)}/broadcast`,{cache:'no-store'});if(!res.ok)throw new Error(`연결 오류 ${res.status}`);const data=await res.json();data.assets=data.assets||[];data.items=data.items||[];if(CreoBroadcastProfiles.usesLegacyData(data.channel)&&typeof getBroadcastItemsCached==='function'){const legacy=await getBroadcastItemsCached(false,15000);if(legacy.length){const selected=legacy.find(i=>`legacy_${i.row}`===data.state?.activeItemId)||legacy.find(i=>String(i.status||'').includes('진행'));if(selected&&typeof enrichBroadcastItem==='function'){try{const rich=await enrichBroadcastItem(selected);const at=legacy.findIndex(i=>i.row===selected.row);if(at>=0)legacy[at]=rich}catch(_){}}data.items=legacy.map(mapLegacyItem)}}latestData=data;lastPulseRevision=String(data.revision??0);lastFullRefreshAt=Date.now();renderIfChanged(data);error.hidden=true;return true}catch(e){error.hidden=false;error.textContent=e.message;return false}finally{fullRefreshInFlight=false}}
async function pollPulse(){if(document.hidden||pulseInFlight||fullRefreshInFlight||!channelId)return;pulseInFlight=true;try{const res=await fetch(`/api/platform/channels/${encodeURIComponent(channelId)}/broadcast-pulse`,{cache:'no-store'});if(!res.ok)throw new Error(`연결 오류 ${res.status}`);const pulse=await res.json(),next=String(pulse.revision??0);if(lastPulseRevision===null||next!==lastPulseRevision||Date.now()-lastFullRefreshAt>=30000){if(!await refreshFull())return}error.hidden=true}catch(e){error.hidden=false;error.textContent=e.message}finally{pulseInFlight=false}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)void pollPulse()});
void refreshFull();setInterval(pollPulse,350);setInterval(()=>{if(latestData)renderIfChanged(latestData)},1000);
</script></body></html>
