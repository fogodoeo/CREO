<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>배송 등록 조회 | CREO</title>
    <script src="platform-client.js?v=20260803-admin-session-v2"></script>
    <script src="supabase-bridge.js?v=20260717-egress-hotfix-v1"></script>
    <script src="channel-adapters.js?v=20260813-modular-v1"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css">
    <style>
        :root { --bg:#f4f7fb; --card:#fff; --line:#e3e9f1; --text:#172033; --muted:#6b7280; --blue:#2563eb; --green:#15803d; --orange:#c2410c; --red:#b91c1c; --shadow:0 10px 30px rgba(23,32,51,.07); font-family:'Pretendard Variable','Pretendard',sans-serif; }
        * { box-sizing:border-box; }
        body { margin:0; min-height:100vh; background:linear-gradient(180deg,#f8fafc,#eef3f8); color:var(--text); }
        button,select,input,a { font:inherit; }
        .app { width:min(100%,1040px); margin:0 auto; padding:18px 18px 72px; }
        .topbar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; }
        .back { display:inline-flex; align-items:center; gap:5px; color:#475569; font-size:13px; font-weight:750; text-decoration:none; }
        .refresh { padding:8px 12px; border:1px solid var(--line); border-radius:9px; background:#fff; color:#475569; font-size:11px; font-weight:750; cursor:pointer; }
        .hero { margin-bottom:12px; padding:18px 20px; border:1px solid var(--line); border-radius:16px; background:#fff; box-shadow:var(--shadow); }
        .hero small { color:var(--blue); font-size:10px; font-weight:900; letter-spacing:.12em; }
        .hero h1 { margin:0; font-size:24px; letter-spacing:-.05em; }
        .hero p { margin:0; color:var(--muted); font-size:13px; line-height:1.55; }
        .stats { display:grid; grid-template-columns:repeat(3,1fr); margin-top:14px; border:1px solid var(--line); border-radius:11px; overflow:hidden; }
        .stat { padding:12px 14px; border-right:1px solid var(--line); background:#fafbfd; }
        .stat:last-child { border-right:0; }
        .stat span { display:block; color:#7b8492; font-size:10px; }
        .stat strong { display:block; margin-top:4px; font-size:18px; }
        .mode-section { padding:14px; border:1px solid var(--line); border-radius:15px; background:#fff; box-shadow:var(--shadow); }
        .section-title { margin-bottom:14px; }
        .section-title small { color:var(--blue); font-size:10px; font-weight:850; letter-spacing:.1em; }
        .section-title h2 { margin:4px 0 3px; font-size:18px; }
        .section-title p { margin:0; color:var(--muted); font-size:12px; }
        .basis-tabs { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-bottom:10px; padding:5px; border:1px solid var(--line); border-radius:14px; background:#eef2f7; }
        .basis-tab { min-height:42px; border:0; border-radius:10px; background:transparent; color:#64748b; font-size:12px; font-weight:850; cursor:pointer; }
        .basis-tab.active { background:#fff; color:var(--blue); box-shadow:0 3px 10px rgba(23,32,51,.09); }
        .view { display:none; }
        .view.active { display:block; }
        .view-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:14px; }
        .view-back { padding:7px 10px; border:1px solid var(--line); border-radius:8px; background:#f8fafc; color:#475569; font-size:11px; font-weight:750; cursor:pointer; }
        .picker { width:100%; min-height:44px; padding:0 13px; border:1px solid #d7dee8; border-radius:11px; background:#fff; color:var(--text); font-size:13px; font-weight:700; outline:none; }
        .picker:focus { border-color:#7aa7f8; box-shadow:0 0 0 3px rgba(37,99,235,.1); }
        .winner-search { margin-bottom:10px; }
        .directory { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; max-height:430px; overflow-y:auto; }
        .directory-btn { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 13px; border:1px solid var(--line); border-radius:11px; background:#fff; color:inherit; text-align:left; cursor:pointer; }
        .directory-main { min-width:0; }
        .directory-btn strong { display:block; font-size:13px; }
        .directory-meta { display:block; margin-top:3px; overflow:hidden; color:var(--muted); font-size:10px; text-overflow:ellipsis; white-space:nowrap; }
        .directory-side { display:flex; flex:0 0 auto; flex-direction:column; align-items:flex-end; gap:5px; }
        .directory-side em { color:var(--blue); font-size:10px; font-style:normal; font-weight:800; }
        .directory-side .badge { min-height:22px; margin:0; padding:0 7px; }
        .result { margin-top:16px; }
        .result-head { display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin-bottom:10px; padding:0 2px; }
        .result-head strong { font-size:18px; }
        .result-head span { color:var(--muted); font-size:11px; }
        .record-list { display:grid; gap:10px; }
        .record { padding:17px; border:1px solid var(--line); border-radius:15px; background:#fff; }
        .record-top { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
        .record-person strong { display:block; font-size:15px; }
        .record-person a { display:inline-block; margin-top:4px; color:#475569; font-size:12px; font-weight:650; text-decoration:none; }
        .badge { display:inline-flex; align-items:center; min-height:26px; padding:0 8px; border:1px solid #dce2ea; border-radius:999px; background:#f8fafc; color:#667085; font-size:9px; font-weight:850; }
        .badge.complete { border-color:#bbe6cb; background:#f0fdf4; color:var(--green); }
        .badge.partial { border-color:#fed7aa; background:#fff7ed; color:var(--orange); }
        .badge.mismatch { border-color:#fecaca; background:#fef2f2; color:var(--red); }
        .record-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px; padding-top:11px; border-top:1px solid #edf0f4; }
        .info-block span { display:block; color:#7a8493; font-size:9px; font-weight:700; }
        .info-block strong { display:block; margin-top:4px; color:#344054; font-size:11px; line-height:1.55; }
        .items { display:flex; flex-wrap:wrap; gap:5px; margin-top:11px; }
        .item-chip { padding:4px 7px; border-radius:7px; background:#f1f5f9; color:#475569; font-size:9px; font-weight:700; }
        .company-directory { display:grid; gap:12px; }
        .company-group { overflow:hidden; border:1px solid var(--line); border-radius:15px; background:#fff; }
        .company-group-head { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 16px; border-bottom:1px solid #edf0f4; background:#f8fafc; }
        .company-group-title strong { display:block; font-size:16px; }
        .company-group-title span { display:block; margin-top:3px; color:var(--muted); font-size:10px; }
        .company-progress { flex:0 0 auto; color:var(--green); font-size:10px; font-weight:850; }
        .company-items { display:grid; }
        .company-item { padding:13px 16px; border-bottom:1px solid #edf0f4; }
        .company-item:last-child { border-bottom:0; }
        .company-item-top { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
        .company-item-main { min-width:0; }
        .company-item-main strong { display:block; overflow:hidden; color:#243047; font-size:13px; text-overflow:ellipsis; white-space:nowrap; }
        .company-item-main span { display:block; margin-top:4px; color:#667085; font-size:10px; }
        .company-item-main a { color:#475569; font-weight:700; text-decoration:none; }
        .company-item-detail { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px; margin-top:10px; padding:9px 10px; border-radius:9px; background:#f8fafc; }
        .company-item-detail span { min-width:0; color:#8a94a3; font-size:8px; font-weight:700; }
        .company-item-detail b { display:block; margin-top:3px; overflow:hidden; color:#475569; font-size:9px; text-overflow:ellipsis; white-space:nowrap; }
        .log-list { display:grid; gap:10px; }
        .log-card { padding:15px; border:1px solid var(--line); border-radius:13px; background:#fff; }
        .log-card-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
        .log-card-head strong { display:block; font-size:13px; }
        .log-card-head span { display:block; margin-top:3px; color:var(--muted); font-size:10px; }
        .log-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:11px; }
        .log-box { min-width:0; padding:10px; border-radius:9px; background:#f8fafc; }
        .log-box span { display:block; color:#7a8493; font-size:8px; font-weight:800; }
        .log-box b { display:block; margin-top:4px; color:#344054; font-size:10px; line-height:1.45; word-break:break-word; }
        .empty { padding:34px 12px; color:#98a2b3; font-size:12px; text-align:center; }
        .loading { position:fixed; inset:0; z-index:20; display:grid; place-items:center; background:rgba(244,247,251,.86); color:#475569; font-size:13px; font-weight:800; backdrop-filter:blur(4px); }
        .toast { position:fixed; left:50%; bottom:60px; z-index:30; transform:translate(-50%,20px); padding:11px 15px; border-radius:10px; background:#172033; color:#fff; font-size:11px; font-weight:750; opacity:0; pointer-events:none; transition:.2s; }
        .toast.show { transform:translate(-50%,0); opacity:1; }
        .app-bottom-nav { position:fixed; left:50%; bottom:max(2px,env(safe-area-inset-bottom)); z-index:1900; display:grid; grid-template-columns:repeat(3,1fr); gap:2px; width:min(410px,calc(100% - 8px)); height:50px; padding:3px; border:1px solid rgba(148,163,184,.34); border-radius:14px; background:rgba(248,250,252,.97); box-shadow:0 10px 30px rgba(15,23,42,.18); transform:translateX(-50%); backdrop-filter:blur(16px); }
        .app-bottom-nav a { display:flex; align-items:center; justify-content:center; min-width:0; border-radius:10px; color:#64748b; font-size:10.5px; font-weight:850; text-decoration:none; white-space:nowrap; }
        .app-bottom-nav a.active { background:#2563eb; color:#fff; }
        .app-bottom-nav .utility { margin-left:2px; border-left:1px solid #d7dee8; border-radius:0 10px 10px 0; color:#334155; }
        .app-bottom-nav .admin-only-nav { display:none; }
        .app-bottom-nav.rates-unlocked { grid-template-columns:repeat(4,1fr); }
        .app-bottom-nav.rates-unlocked .admin-only-nav { display:flex; }
        @media (max-width:700px) {
            .app { padding:12px 12px 68px; }
            .topbar { margin-bottom:12px; }
            .hero { padding:15px; }
            .mode-section { padding:9px; border-radius:13px; }
            .hero h1 { font-size:23px; }
            .stats { grid-template-columns:repeat(2,1fr); }
            .stats { grid-template-columns:repeat(3,1fr); }
            .stat:nth-child(2) { border-right:1px solid var(--line); }
            .directory { grid-template-columns:1fr; max-height:none; }
            .record-grid { grid-template-columns:1fr; gap:9px; }
            .info-block { padding-top:8px; border-top:1px dashed #e5e9f0; }
            .company-group-head { padding:13px; }
            .company-item { padding:12px 13px; }
            .company-item-detail { grid-template-columns:minmax(0,1fr) auto; }
            .log-grid { grid-template-columns:1fr; }
        }
    </style>
</head>
<body>
    <main class="app">
        <header class="hero">
            <nav class="topbar"><h1>전체조회</h1><button class="refresh" type="button" onclick="reloadData(this)">새로고침</button></nav>
            <div class="stats" id="stats"></div>
        </header>

        <div class="basis-tabs" aria-label="조회 기준">
            <button class="basis-tab active" id="basis-winner" type="button" onclick="openMode('winner')">낙찰자</button>
            <button class="basis-tab" id="basis-company" type="button" onclick="openMode('company')">업체</button>
            <button class="basis-tab" id="basis-audit" type="button" onclick="openMode('audit')">변경내역</button>
        </div>

        <section class="mode-section view" id="mode-company">
            <select class="picker" id="company-picker" onchange="renderCompany(this.value)"><option value="">전체 업체 보기</option></select>
            <div class="result" id="company-result"></div>
        </section>

        <section class="mode-section view active" id="mode-winner">
            <input class="picker winner-search" id="winner-search" type="search" placeholder="이름 또는 연락처 검색" oninput="handleWinnerSearch(this)">
            <div class="directory" id="winner-directory"></div>
            <div class="result" id="winner-result"></div>
        </section>

        <section class="mode-section view" id="mode-audit">
            <div class="result" id="audit-result"></div>
        </section>
    </main>
    <nav class="app-bottom-nav" aria-label="CREO 공통 페이지 이동">
        <a id="shipping-channel-home" href="/">채널홈</a>
        <a id="shipping-workspace-link" href="#">업체</a>
        <a href="shipping.html">배송관리</a>
        <a class="active" href="shipping-status.html" aria-current="page">전체조회</a>
        <a class="admin-only-nav" id="shipping-rates-nav" href="shipping-rates.html">요금표</a>
        <a class="utility" href="shipping.html?changeCompany=1">업체변경</a>
    </nav>
    <div class="loading" id="loading">배송 등록 데이터를 불러오는 중...</div>
    <div class="toast" id="toast"></div>
    <script>
        let soldItems = [];
        let winnerGroups = [];
        let auditLogs = [];
        let shippingAdapter = null;
        let shippingAdapterContext = null;
        const SHIPPING_CHANNEL_ID = String(new URLSearchParams(location.search).get('channel') || 'cdcup').toLowerCase().replace(/[^a-z0-9-]/g,'') || 'cdcup';
        document.getElementById('shipping-channel-home').href='/?channel='+encodeURIComponent(SHIPPING_CHANNEL_ID);
        document.getElementById('shipping-workspace-link').href='channel-workspace.html?channel='+encodeURIComponent(SHIPPING_CHANNEL_ID);
        const MOBILE_STATUS_HISTORY = matchMedia('(max-width:820px)').matches;
        let activeMode = 'winner';
        let selectedWinnerKey = '';
        let winnerSearchActive = false;

        document.querySelectorAll('.app-bottom-nav a').forEach(link => {
            const url = new URL(link.getAttribute('href'), location.href);
            url.searchParams.set('channel', SHIPPING_CHANNEL_ID);
            link.href = url.pathname + url.search;
        });

        async function ensureShippingAdapter() {
            if (shippingAdapter) return shippingAdapter;
            const channel = (await CreoPlatform.api(`channels/${encodeURIComponent(SHIPPING_CHANNEL_ID)}`)).channel;
            shippingAdapter = CreoChannelAdapters.resolve(channel);
            shippingAdapterContext = { channel };
            const workspaceLink = document.getElementById('shipping-workspace-link');
            if (workspaceLink) {
                const target = new URL(channel.legacy?.managementUrl || 'channel-workspace.html', location.href);
                target.searchParams.set('channel', channel.id);
                workspaceLink.href = target.origin === location.origin
                    ? `${target.pathname}${target.search}${target.hash}`
                    : target.href;
            }
            return shippingAdapter;
        }

        async function syncAdminNavigation() {
            const nav = document.querySelector('.app-bottom-nav');
            nav?.classList.remove('rates-unlocked');
            try { if (await CreoPlatform.verifyAdmin()) nav?.classList.add('rates-unlocked'); }
            catch (_) { nav?.classList.remove('rates-unlocked'); }
        }

        function esc(value) { return String(value == null ? '' : value).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
        function winnerIdentity(item) {
            const clean = String(item.winner || '').replace(/[\[\]]/g,'').trim();
            const match = clean.match(/01[0-9][\-.\s]?\d{3,4}[\-.\s]?\d{4}|(?<!\d)\d{8}(?!\d)/);
            const embedded = match ? match[0] : '';
            const source = embedded ? clean.replace(embedded,' ').replace(/\s+/g,' ').trim() : clean;
            const name = source.split('/').map(v=>v.trim()).filter(Boolean)[0] || '이름 없음';
            const phone = String(item.winner_phone || embedded).replace(/[^0-9]/g,'');
            return { key:phone ? 'phone:'+phone : 'name:'+name.toLowerCase(), name, phone };
        }
        function fmtPhone(value) {
            const p=String(value||'').replace(/[^0-9]/g,'');
            if(p.length===11) return p.slice(0,3)+'-'+p.slice(3,7)+'-'+p.slice(7);
            if(p.length===10) return p.slice(0,3)+'-'+p.slice(3,6)+'-'+p.slice(6);
            return p || '연락처 없음';
        }
        function fmtTime(value) {
            const d=new Date(value||0); if(Number.isNaN(d.getTime())||!value) return '-';
            return d.toLocaleString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
        }
        function auditShippingLabel(data) {
            if(!data) return '-';
            if(!data.shipping_type) return '미등록';
            if(data.shipping_type==='직접수령') return '직접수령';
            if(data.shipping_type==='배송') return (data.shipping_company||'배송')+' · '+(data.shipping_region||'배송지 미입력')+' · '+(Number(data.shipping_cost)||0).toLocaleString()+'원';
            return data.shipping_type;
        }
        function auditActorLabel(log) {
            const actor=log.actor||{};
            const winner=log.winner||{};
            const by=actor.label||actor.type||'미확인';
            const name=actor.name_masked||winner.name_masked||'';
            const phone=actor.phone_last4||winner.phone_last4||'';
            return by+(name?' · '+name:'')+(phone?' · 끝 '+phone:'');
        }
        function shippingSignature(item) { return [item.shipping_type||'',item.shipping_company||'',item.shipping_region||''].join('|'); }
        function parseRegion(raw) {
            const text=String(raw||'').trim();
            const memo=(text.match(/\[(?:메모|요청):\s*([^\]]*)\]/)||[])[1]||'';
            return { location:text.replace(/\s*\[(?:메모|요청):[^\]]*\]\s*$/,'').trim(), memo:memo.trim() };
        }
        function groupStatus(items) {
            const registered=items.filter(i=>i.shipping_type);
            const signatures=[...new Set(registered.map(shippingSignature))];
            if(!registered.length) return 'pending';
            if(registered.length<items.length) return 'partial';
            if(signatures.length>1) return 'mismatch';
            return 'complete';
        }
        function statusMeta(status) {
            return { complete:['등록 완료','complete'], pending:['미등록',''], partial:['부분 등록','partial'], mismatch:['입력 불일치','mismatch'] }[status];
        }
        function shippingInfo(group) {
            const registered=group.items.filter(i=>i.shipping_type).sort((a,b)=>new Date(b.updated_at||0)-new Date(a.updated_at||0));
            const item=registered[0];
            if(!item) return { label:'수령 방법 미등록', detail:'-', company:'', memo:'' };
            if(item.shipping_type==='직접수령') return { label:'현장 직접 수령', detail:'배송비 없음', company:'', memo:parseRegion(item.shipping_region).memo };
            const parsed=parseRegion(item.shipping_region);
            return { label:(item.shipping_company||'배송')+' · '+(parsed.location||'상세 미입력'), detail:'배송비 '+group.shippingCost.toLocaleString()+'원', company:item.shipping_company||'', memo:parsed.memo };
        }
        function buildGroups() {
            const map={};
            soldItems.forEach(item=>{ const id=winnerIdentity(item); if(!map[id.key]) map[id.key]={...id,items:[]}; map[id.key].items.push(item); });
            winnerGroups=Object.values(map).map(group=>{
                const companies=[...new Set(group.items.map(i=>String(i.company||'').trim()).filter(Boolean))].sort();
                const latest=Math.max(0,...group.items.filter(i=>i.shipping_type).map(i=>new Date(i.updated_at||0).getTime()).filter(Number.isFinite));
                const shippingCost=group.items.reduce((sum,i)=>sum+(Number(i.shipping_cost)||0),0);
                const totalBid=group.items.reduce((sum,i)=>sum+(Number(i.sold_price||i.soldPrice)||0)*10000,0);
                return {...group,companies,status:groupStatus(group.items),latest,shippingCost,totalBid};
            }).sort((a,b)=>{
                const priority={mismatch:0,partial:1,pending:2,complete:3};
                return priority[a.status]-priority[b.status] || a.name.localeCompare(b.name,'ko');
            });
        }
        function openMode(mode, fromHistory = false) {
            if (MOBILE_STATUS_HISTORY && !fromHistory && mode !== activeMode) history.pushState({ creoShippingStatus:true, mode, winner:'' }, '', location.href);
            activeMode = mode;
            selectedWinnerKey = '';
            document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
            document.getElementById('mode-'+mode).classList.add('active');
            document.querySelectorAll('.basis-tab').forEach(v=>v.classList.remove('active'));
            document.getElementById('basis-'+mode).classList.add('active');
            if(mode==='company') {
                document.getElementById('company-picker').value='';
                renderCompany('');
            }
            if(mode==='winner') {
                const search=document.getElementById('winner-search');
                const directory=document.getElementById('winner-directory');
                search.style.display='block';
                directory.style.display='grid';
                search.value='';
                document.getElementById('winner-result').innerHTML='';
                renderWinnerDirectory('');
            }
            if(mode==='audit') renderAuditLogs();
            window.scrollTo({top:0,behavior:'smooth'});
        }
        function renderStats() {
            const complete=winnerGroups.filter(g=>g.status==='complete').length;
            const attention=winnerGroups.length-complete;
            document.getElementById('stats').innerHTML=[['전체',winnerGroups.length+'명'],['확인 필요',attention+'명'],['등록 완료',complete+'명']].map(v=>'<div class="stat"><span>'+v[0]+'</span><strong>'+v[1]+'</strong></div>').join('');
        }
        function populateCompanies() {
            const list=[...new Set(soldItems.map(i=>String(i.company||'').trim()).filter(Boolean))].sort();
            document.getElementById('company-picker').innerHTML='<option value="">업체 선택</option>'+list.map(c=>'<option value="'+esc(c)+'">'+esc(c)+'</option>').join('');
        }
        function itemChips(items) {
            return '<div class="items">'+items.map(i=>'<span class="item-chip">'+esc((i.company?'['+i.company+'] ':'')+auctionItemLabel(i,{includeTeam:true}))+'</span>').join('')+'</div>';
        }
        function recordHtml(group, scopedItems) {
            const meta=statusMeta(group.status), ship=shippingInfo(group), items=scopedItems||group.items;
            return '<article class="record"><div class="record-top"><div class="record-person"><strong>'+esc(group.name)+'</strong><a href="tel:'+esc(group.phone)+'">'+esc(fmtPhone(group.phone))+'</a></div><span class="badge '+meta[1]+'">'+meta[0]+'</span></div><div class="record-grid"><div class="info-block"><span>배송 정보</span><strong>'+esc(ship.label)+(ship.memo?'<br>요청: '+esc(ship.memo):'')+'</strong></div><div class="info-block"><span>낙찰 내역</span><strong>'+esc(group.companies.join(', ')||'-')+' · '+group.items.length+'개체</strong></div></div>'+itemChips(items)+'</article>';
        }
        function itemShippingDetail(item) {
            if(!item.shipping_type) return {label:'배송 정보 미등록',cost:'-',status:'pending'};
            if(item.shipping_type==='직접수령') return {label:'현장 직접 수령',cost:'없음',status:'complete'};
            const parsed=parseRegion(item.shipping_region);
            return {label:(item.shipping_company||'배송')+' · '+(parsed.location||'상세 미입력'),cost:(Number(item.shipping_cost)||0).toLocaleString()+'원',status:'complete'};
        }
        function companyItemHtml(item) {
            const winner=winnerIdentity(item), shipping=itemShippingDetail(item), meta=statusMeta(shipping.status);
            return '<div class="company-item"><div class="company-item-top"><div class="company-item-main"><strong>'+esc(auctionItemLabel(item,{includeTeam:true}))+'</strong><span>'+esc(winner.name)+' · <a href="tel:'+esc(winner.phone)+'">'+esc(fmtPhone(winner.phone))+'</a></span></div><span class="badge '+meta[1]+'">'+meta[0]+'</span></div><div class="company-item-detail"><span>배송 정보<b>'+esc(shipping.label)+'</b></span><span>배송비<b>'+esc(shipping.cost)+'</b></span></div></div>';
        }
        function companyGroupHtml(company) {
            const items=soldItems.filter(i=>String(i.company||'').trim()===company).sort((a,b)=>(Number(a.num)||0)-(Number(b.num)||0));
            const winners=new Set(items.map(i=>winnerIdentity(i).key));
            const registered=items.filter(i=>i.shipping_type).length;
            return '<section class="company-group"><header class="company-group-head"><div class="company-group-title"><strong>'+esc(company)+'</strong><span>'+winners.size+'명 · '+items.length+'개체</span></div><span class="company-progress">'+registered+' / '+items.length+' 등록</span></header><div class="company-items">'+items.map(companyItemHtml).join('')+'</div></section>';
        }
        function renderCompany(company) {
            const box=document.getElementById('company-result');
            if (!company) { box.innerHTML='<div class="empty">확인할 업체를 선택해 주세요.</div>'; return; }
            const itemCount=soldItems.filter(i=>String(i.company||'').trim()===company).length;
            box.innerHTML='<div class="result-head"><strong>'+esc(company)+'</strong><span>'+itemCount+'개체</span></div><div class="company-directory">'+companyGroupHtml(company)+'</div>';
        }
        function renderWinnerDirectory(query) {
            const q=String(query||'').replace(/[^0-9가-힣a-zA-Z]/g,'').toLowerCase();
            const list=winnerGroups.filter(g=>!q||(g.name+g.phone).replace(/[^0-9가-힣a-zA-Z]/g,'').toLowerCase().includes(q));
            document.getElementById('winner-directory').innerHTML=list.length?list.map(g=>{const meta=statusMeta(g.status);return '<button class="directory-btn" type="button" onclick="renderWinner(\''+esc(g.key)+'\')"><span class="directory-main"><strong>'+esc(g.name)+'</strong><span class="directory-meta">'+esc(fmtPhone(g.phone))+' · '+esc(g.companies.join(', '))+'</span></span><span class="directory-side"><span class="badge '+meta[1]+'">'+meta[0]+'</span><em>'+g.items.length+'개체</em></span></button>';}).join(''):'<div class="empty">검색 결과가 없습니다.</div>';
        }
        function handleWinnerSearch(input) {
            const hasQuery=Boolean(input.value.trim());
            renderWinnerDirectory(input.value);
            if(MOBILE_STATUS_HISTORY&&hasQuery&&!winnerSearchActive){winnerSearchActive=true;history.pushState({creoShippingStatus:true,mode:'winner',winner:'',search:true},'',location.href)}
            if(MOBILE_STATUS_HISTORY&&!hasQuery&&winnerSearchActive){winnerSearchActive=false;if(history.state?.search)history.back()}
        }
        function renderWinner(key, fromHistory = false) {
            const group=winnerGroups.find(g=>g.key===key), box=document.getElementById('winner-result');
            if(!group){box.innerHTML='';return;}
            selectedWinnerKey = key;
            if (MOBILE_STATUS_HISTORY && !fromHistory) history.pushState({ creoShippingStatus:true, mode:'winner', winner:key }, '', location.href);
            document.getElementById('winner-search').style.display='none';
            document.getElementById('winner-directory').style.display='none';
            box.innerHTML='<div class="result-head"><div><strong>'+esc(group.name)+' 전체 내역</strong><span style="display:block;margin-top:3px">'+group.companies.length+'개 업체 · '+group.items.length+'개체</span></div><button class="view-back" type="button" onclick="resetWinnerSelection()">다른 낙찰자 선택</button></div><div class="record-list">'+recordHtml(group)+'</div>';
            box.scrollIntoView({behavior:'smooth',block:'start'});
        }
        function resetWinnerSelection() {
            if (MOBILE_STATUS_HISTORY && selectedWinnerKey) {
                history.back();
                return;
            }
            const search=document.getElementById('winner-search');
            const directory=document.getElementById('winner-directory');
            search.style.display='block';
            directory.style.display='grid';
            search.value='';
            document.getElementById('winner-result').innerHTML='';
            selectedWinnerKey = '';
            winnerSearchActive = false;
            renderWinnerDirectory('');
            search.focus();
            window.scrollTo({top:0,behavior:'smooth'});
        }
        function auditLogHtml(log) {
            const statusClass=log.status==='failed'?'mismatch':(log.status==='applied'?'complete':'partial');
            const statusText=log.status==='failed'?'실패':(log.status==='applied'?'적용 완료':'요청 기록');
            const changed=(log.changed_fields||[]).join(', ') || '-';
            const item=[log.item_company, log.item_num ? '#'+log.item_num : '', log.item_name].filter(Boolean).join(' · ');
            return '<article class="log-card"><div class="log-card-head"><div><strong>'+esc(item||'개체 정보 없음')+'</strong><span>'+esc(fmtTime(log.created_at))+' · '+esc(auditActorLabel(log))+'</span></div><span class="badge '+statusClass+'">'+statusText+'</span></div><div class="log-grid"><div class="log-box"><span>변경 전</span><b>'+esc(auditShippingLabel(log.before))+'</b></div><div class="log-box"><span>변경 후</span><b>'+esc(auditShippingLabel(log.after))+'</b></div><div class="log-box"><span>변경 필드</span><b>'+esc(changed)+'</b></div><div class="log-box"><span>대상 낙찰자</span><b>'+esc(((log.winner||{}).name_masked||'-')+(((log.winner||{}).phone_last4)?' · 끝 '+(log.winner||{}).phone_last4:''))+'</b></div></div></article>';
        }
        function renderAuditLogs() {
            const box=document.getElementById('audit-result');
            if(!box) return;
            box.innerHTML=auditLogs.length?'<div class="result-head"><strong>최근 변경 '+auditLogs.length+'건</strong><span>최신순</span></div><div class="log-list">'+auditLogs.map(auditLogHtml).join('')+'</div>':'<div class="empty">아직 기록된 배송 변경 이력이 없습니다.</div>';
        }
        function showToast(text){const t=document.getElementById('toast');t.textContent=text;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400);}
        async function loadData() {
            document.getElementById('loading').style.display='grid';
            try { const adapter=await ensureShippingAdapter();const [items, logs]=await Promise.all([adapter.loadShippingItems(shippingAdapterContext), adapter.id==='legacy-cdcup'&&typeof getShippingAuditLogs==='function'?getShippingAuditLogs(120):Promise.resolve([])]); auditLogs=logs||[]; soldItems=(items||[]).filter(i=>i.status&&i.status.includes('낙찰')); buildGroups(); renderStats(); populateCompanies(); renderCompany(''); renderWinnerDirectory(''); renderAuditLogs(); }
            catch(e){ console.error(e); document.getElementById('mode-winner').innerHTML='<div class="empty">데이터를 불러오지 못했습니다.</div>'; }
            finally { document.getElementById('loading').style.display='none'; }
        }
        async function reloadData(button){const text=button.textContent;button.disabled=true;button.textContent='갱신 중...';await loadData();button.disabled=false;button.textContent=text;showToast('최신 등록 내역으로 갱신했습니다.');}
        if (MOBILE_STATUS_HISTORY) window.addEventListener('popstate', event => {
            const state = event.state;
            if (state?.creoShippingExit) {
                location.replace('shipping.html?channel='+encodeURIComponent(SHIPPING_CHANNEL_ID));
                return;
            }
            if (!state?.creoShippingStatus) return;
            winnerSearchActive = false;
            openMode(state.mode || 'winner', true);
            if (state.winner) requestAnimationFrame(() => renderWinner(state.winner, true));
        });

        if (MOBILE_STATUS_HISTORY) {
            if (!document.referrer) {
                history.replaceState({ creoShippingExit:true }, '', location.href);
                history.pushState({ creoShippingStatus:true, mode:'winner', winner:'' }, '', location.href);
            } else {
                history.replaceState({ creoShippingStatus:true, mode:'winner', winner:'' }, '', location.href);
            }
        }
        syncAdminNavigation();
        loadData();
    </script>
</body>
</html>
