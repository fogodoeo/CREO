<body><div class="shell">
    <div class="loading" id="loading"><b>불러오는 중…</b></div>

    <div id="app" hidden>
        <header class="top"><div class="brand"><b>CREO</b><div class="brand-right"><span id="channel-name"></span><i class="sync" id="sync" role="status">실시간</i></div></div><div class="buyer-greeting"><span id="buyer-name"></span>님</div><div class="flow-steps" aria-label="진행 단계"><span id="step-shipping">1 수령지</span><span aria-hidden="true">›</span><span id="step-payment">2 결제</span></div><h1 id="flow-title">어디서 받으시나요?</h1><div class="status" id="status" hidden><span id="status-label"></span><small id="status-detail"></small></div><div class="saved" id="saved" role="status" aria-live="polite" hidden><b>저장 완료</b></div></header>

            <section class="section" id="payment-section" hidden><div class="head"><h2>업체별 결제</h2></div><div id="vendors"></div><div class="payable-summary" id="payment-summary"><span id="payable-title">이번 결제금액</span><b id="payable-amount"></b><small id="payable-note"></small></div></section>

</div><script>
(()=>{'use strict';
 const Checkout=window.CreoCheckoutClient,Rules=window.CreoCheckoutRules,params=new URLSearchParams(location.search),client=Checkout.createClient({location,endpoint:'/api/platform/buyer-shipping',shortPrefix:'s',apiOrigin:params.get('apiOrigin')||''});
 const $=Checkout.byId,esc=Checkout.escapeHtml,money=Checkout.money,uuid=Checkout.requestId,phone=Checkout.formatPhone;
const state={data:null,destinationId:'',pargeRegion:'',pargeShop:'',query:'',region:'전체',payments:{},saving:false,saved:false,dirty:false};
async function api(path='',body=null){return client.request(path,body)}
let editingDestination=false;
function needsShippingSave(){return (state.data.items||[]).some(item=>!item.paymentStatus)}
function pendingConfirmation(){return state.data.vendors.some(v=>['bank_transfer_reported','card_payment_reported'].includes(v.payment.status))}
function destinationReady(){const chosen=destination();return Boolean(chosen&&(chosen.type==='pickup'||(['parge','dodosi'].includes(chosen.type)&&selectedRate())))}
function renderFlow(){
 const ready=destinationReady(),showPayment=ready&&!editingDestination;
 const pending=pendingConfirmation(),paid=state.data.payment.status==='paid',saved=Boolean(state.data.submittedAt)&&!state.dirty&&!needsShippingSave();
 $('change-destination').disabled=pending;
 $('payment-section').hidden=!showPayment;
 $('destination-summary').hidden=!showPayment;
 $('destination-editor').hidden=showPayment;
 $('cancel-destination').hidden=!ready||!editingDestination;
 $('destination-value').textContent=ready?(destination().type==='pickup'?'직수령 · '+destination().label:[destination().label,state.pargeRegion,state.pargeShop].filter(Boolean).join(' · ')):'';
 $('flow-title').textContent=!showPayment?'어디서 받으시나요?':paid&&saved?'결제가 완료됐어요':pending&&saved?'업체에서 확인 중이에요':saved?'결제를 진행해 주세요':'결제 방식을 확인해 주세요';
 $('step-shipping').className=showPayment?'complete':'active';
 $('step-payment').className=showPayment?'active':'';
 $('status').hidden=true;
 $('saved').hidden=true;
 $('submit').parentElement && ($('submit').parentElement.hidden=saved||!showPayment);
 const paymentReady=state.data.vendors.every(v=>v.payment.status==='paid'||state.payments[v.key]);
 $('payment-summary').hidden=!showPayment||!paymentReady||state.data.vendors.length===1;
 $('submit').disabled=state.saving||pending||!showPayment||!paymentReady||saved;
 $('submit').textContent=state.saving?'저장 중…':!showPayment?(ready?'수령지를 선택해 주세요':destination()&&destination().type!=='pickup'?'수령 지점을 선택해 주세요':'수령지를 선택해 주세요'):!paymentReady?'결제 방식을 선택해 주세요':saved?'저장 완료':state.data.submittedAt?'변경 내용 저장':'선택 완료';
 if(pending)$('submit').textContent='업체 결제 확인 중';
 else if(needsShippingSave()&&state.data.submittedAt&&showPayment&&paymentReady)$('submit').textContent='추가 낙찰 내역 저장';
}
 const destination=()=>state.data?.destinations?.find(row=>row.id===state.destinationId),rates=()=>(state.data?.carriers?.[state.destinationId]||state.data?.parge)?.regions||[],selectedRate=()=>Rules.selectedRate(rates(),state.pargeRegion,state.pargeShop);
const CHO=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];function chosung(value){let out='';for(const ch of String(value||'')){const n=ch.charCodeAt(0);out+=n>=0xAC00&&n<=0xD7A3?CHO[Math.floor((n-0xAC00)/588)]:ch}return out}const norm=value=>String(value||'').replace(/\s+/g,' ').trim().toLowerCase();
 function paymentStatus(status){const meta=Checkout.paymentStatusMeta(status,'buyer');return[meta.label,meta.tone]}
function globalShipping(){return Rules.allocateShipping(state.data?.items||[],{destinationType:destination()?.type||'',pargeRegion:state.pargeRegion,pargeShop:state.pargeShop},{shippingDefaults:{dodosiAdditionalFee:state.data?.carriers?.dodosi?.additionalFee,pargeAdditionalFee:(state.data?.carriers?.[state.destinationId]||state.data?.parge)?.additionalFee,pargeJejuAdditionalFee:(state.data?.carriers?.[state.destinationId]||state.data?.parge)?.jejuAdditionalFee}},rates()).allocations}
function renderDestinations(){$('destinations').innerHTML=(state.data.destinations||[]).map(row=>`<button class="choice ${row.id===state.destinationId?'selected':''}" type="button" aria-pressed="${row.id===state.destinationId}" data-dest="${esc(row.id)}"><span><b>${esc(row.label)}${row.type==='pickup'?' · 직수령':''}</b></span><i></i></button>`).join('');$('destinations').querySelectorAll('[data-dest]').forEach(button=>button.onclick=()=>{editingDestination=false;state.destinationId=button.dataset.dest;state.pargeRegion='';state.pargeShop='';state.query='';state.region='전체';state.saved=false;state.dirty=true;if(!['parge','dodosi'].includes(destination()?.type)){state.pargeRegion='';state.pargeShop=''}render()})}
function allRates(){return rates().flatMap(group=>(group.shops||[]).map(shop=>({region:group.region,...shop})))}function renderParge(){const visible=['parge','dodosi'].includes(destination()?.type);$('parge').hidden=!visible;if(!visible)return;const regions=['전체',...rates().map(group=>group.region)];$('parge-search').value=state.query;$('parge-tabs').innerHTML=regions.map(region=>`<button class="tab ${region===state.region?'active':''}" type="button" data-region="${esc(region)}">${esc(region)}</button>`).join('');$('parge-tabs').querySelectorAll('[data-region]').forEach(button=>button.onclick=()=>{state.region=button.dataset.region;state.query='';renderParge()});let rows=allRates().filter(row=>state.region==='전체'||row.region===state.region),words=norm(state.query).split(/\s+/).filter(Boolean);if(words.length)rows=rows.filter(row=>words.every(word=>norm(`${row.region} ${row.name}`).includes(word)||chosung(`${row.region} ${row.name}`).includes(word)));rows=rows.slice(0,40);$('parge-results').innerHTML=rows.length?rows.map(row=>`<button class="result ${row.region===state.pargeRegion&&row.name===state.pargeShop?'selected':''}" type="button" data-shop="${esc(row.name)}" data-shop-region="${esc(row.region)}"><b>${esc(row.name)}</b><small>${esc(row.region)}</small><strong>${money(row.baseCost)}</strong></button>`).join(''):'<p class="note">검색 결과가 없습니다.</p>';$('parge-results').querySelectorAll('[data-shop]').forEach(button=>button.onclick=()=>{editingDestination=false;state.pargeRegion=button.dataset.shopRegion;state.pargeShop=button.dataset.shop;state.query=`${state.pargeRegion} ${state.pargeShop}`;state.saved=false;state.dirty=true;render()});const extra=state.pargeRegion.includes('제주')?(state.data.carriers?.[state.destinationId]||state.data.parge).jejuAdditionalFee:(state.data.carriers?.[state.destinationId]||state.data.parge).additionalFee;$('parge-note').textContent=`추가 개체당 +${money(extra)}`}
function vendorDue(vendor,shipping){const shippingAmount=!state.dirty&&state.data.submittedAt?Number(vendor.totals.shippingAmount||0):vendor.items.reduce((sum,item)=>sum+(shipping.get(item.id)||0),0),total=Number(vendor.totals.payableAuctionAmount||0)+shippingAmount,confirmed=Number(vendor.payment.confirmedAmount||0);return{shippingAmount,total,due:Math.max(0,total-confirmed),confirmed}}
function vendorAction(vendor,due){
 const p=vendor.payment,status=p.status;
 if(status==='paid')return '';
 if(state.dirty||needsShippingSave()||!state.data.submittedAt)return '';
 if(['bank_transfer_reported','card_payment_reported'].includes(status))return '<p class="waiting-note">확인이 끝나면 알림톡으로 알려드려요.</p>';
 if(p.method==='bank_transfer'){
  const a=p.account||{};
  if(!a.bankName||!a.accountNumber||!a.holder)return '<p class="waiting-note">입금 계좌 준비 중 · 업체 문의</p>';
  return `<div class="action-box"><small>입금 계좌</small><b>${esc(a.bankName)} ${esc(a.accountNumber)}</b><p>예금주 ${esc(a.holder)}</p><div class="buttons"><button class="minor" type="button" data-copy="${esc(a.accountNumber)}">계좌 복사</button><button class="primary" type="button" data-report="${esc(vendor.key)}">입금했어요</button></div></div>`;
 }
 if(p.method==='card'){
  if(!p.cardPaymentUrl)return '<div class="action-box"><b>결제 링크 준비 중</b><p>준비되면 알림톡으로 알려드려요.</p></div>';
  return `<div class="card-actions"><a class="card-link" href="${esc(p.cardPaymentUrl)}" target="_blank" rel="noopener noreferrer">카드로 결제하기</a><button class="report-link" type="button" data-report="${esc(vendor.key)}">이미 결제했어요</button></div>`;
 }
 return '';
}
function renderVendors(){
 const shipping=globalShipping();
 $('vendors').innerHTML=state.data.vendors.slice().sort((a,b)=>CreoCheckoutActions.priority(a.payment.status)-CreoCheckoutActions.priority(b.payment.status)).map(v=>{
  const [label,tone]=paymentStatus(v.payment.status),due=vendorDue(v,shipping),method=state.payments[v.key]||'',paid=v.payment.status==='paid',saved=Boolean(state.data.submittedAt)&&!state.dirty&&!needsShippingSave();
  const choices=`<div class="choices">${v.paymentMethods.map(value=>`<button class="choice ${method===value?'selected':''}" type="button" aria-pressed="${method===value}" data-payment-vendor="${esc(v.key)}" data-method="${value}" ${paid||pendingConfirmation()?'disabled':''}><span><b>${value==='bank_transfer'?'계좌이체':'카드결제'}</b></span><i></i></button>`).join('')}</div>`;
  const selector=paid?'':saved?`<details class="method-details"><summary>결제 방식 · ${method==='card'?'카드결제':'계좌이체'}<span>변경</span></summary>${choices}</details>`:choices;
  return `<article class="vendor"><div class="vendor-head"><div class="vendor-title"><b>${esc(v.name)}</b></div>${saved?`<span class="badge ${tone}">${label}</span>`:''}</div><div class="vendor-body"><div class="amount-focus"><small>${paid?'결제 완료':due.confirmed?'추가 결제금액':'결제금액'}</small><strong>${money(paid?v.payment.confirmedAmount:due.due)}</strong></div>${selector}${vendorAction(v,due)}<details class="amount-details"><summary>금액 상세<span>⌄</span></summary><div class="row"><span>낙찰금</span><strong>${money(v.totals.auctionAmount)}</strong></div>${v.totals.discountAmount?`<div class="row"><span>할인</span><strong>-${money(v.totals.discountAmount)}</strong></div>`:''}<div class="row"><span>배송비</span><strong>${money(due.shippingAmount)}</strong></div>${due.confirmed?`<div class="row"><span>결제 확인</span><strong>${money(due.confirmed)}</strong></div>`:''}</details>${v.contact?.phone?`<a class="vendor-contact" href="tel:${esc(String(v.contact.phone).replace(/\D/g,''))}">업체 문의</a>`:''}</div></article>`;
 }).join('');
 document.querySelectorAll('[data-payment-vendor]').forEach(b=>b.onclick=()=>{state.payments[b.dataset.paymentVendor]=b.dataset.method;state.saved=false;state.dirty=true;render()});
 document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{await CreoCheckoutActions.copyAccount(b.dataset.copy,b)});
 document.querySelectorAll('[data-report]').forEach(b=>b.onclick=()=>report(b.dataset.report,b));
}
function render(){const data=state.data;$('channel-name').textContent=data.channel.name;$('channel-name').dataset.testDelivery=String(data.testDeliveryEnabled===true);$('buyer-name').textContent=data.buyer.name;$('item-count').textContent=`${data.items.length}개체 · ${data.vendors.length}업체`;$('items').innerHTML=data.items.map(item=>`<div class="item"><small>${String(item.lotNumber).padStart(2,'0')}</small><b>${esc(item.vendorName)} · ${esc(item.name)}</b><strong>${money(item.soldAmount)}</strong></div>`).join('');const [label,tone]=paymentStatus(data.payment.status);$('status-label').textContent=label;$('status-detail').textContent=data.payment.status==='paid'?'':data.payment.status==='payment_reported'?'':'';$('status').dataset.tone=tone;$('saved').hidden=!state.saved;renderDestinations();renderParge();renderVendors();const allocation=globalShipping(),amount=data.vendors.reduce((sum,v)=>sum+vendorDue(v,allocation).due,0);$('payable-amount').textContent=money(data.payment.status==='paid'?data.vendors.reduce((sum,v)=>sum+(Number(v.payment.confirmedAmount)||0),0):amount);$('payable-title').textContent=data.payment.status==='paid'?'결제 확인 완료':'이번 결제금액';$('payable-note').textContent=state.dirty||!data.submittedAt?'저장 후 결제금액 확정':'업체별 결제 · 미결제 금액';const valid=destination()&&(!['parge','dodosi'].includes(destination().type)||selectedRate())&&data.vendors.every(v=>v.payment.status==='paid'||state.payments[v.key]);$('submit').disabled=state.saving||!valid;$('submit').textContent=state.saving?'저장 중…':data.submittedAt?'변경 내용 저장':'선택 완료';renderFlow();$('loading').hidden=true;$('error').hidden=true;$('app').hidden=false}
function hydrate(data,preserveDraft=false){const draft=preserveDraft&&state.dirty?{destinationId:state.destinationId,pargeRegion:state.pargeRegion,pargeShop:state.pargeShop,query:state.query,region:state.region,payments:{...state.payments}}:null;state.data=data;state.destinationId=draft?.destinationId||data.selection?.destinationId||'';state.pargeRegion=draft?.pargeRegion||data.selection?.pargeRegion||'';state.pargeShop=draft?.pargeShop||data.selection?.pargeShop||'';state.query=draft?.query??(state.pargeShop?`${state.pargeRegion} ${state.pargeShop}`:'');state.region=draft?.region||'전체';state.payments=Object.fromEntries(data.vendors.map(v=>[v.key,draft?.payments[v.key]||v.payment.method||(v.paymentMethods.includes('bank_transfer')?'bank_transfer':'')]));state.dirty=Boolean(draft);render()}
async function load(silent=false,preserveDraft=false){if(!client.valid)return showError('배송 링크 주소가 올바르지 않습니다.');if(!silent){$('loading').hidden=false;$('app').hidden=true}try{hydrate(await api(),preserveDraft);return true}catch(error){if(!silent)showError(error.message||'배송 정보를 불러오지 못했습니다.');return false}}function showError(message){$('loading').hidden=true;$('app').hidden=true;$('error').hidden=false;$('error-message').textContent=message}
async function save(){if($('submit').disabled)return;state.saving=true;render();try{const data=await api('',{requestId:uuid(),destinationId:state.destinationId,pargeRegion:state.pargeRegion,pargeShop:state.pargeShop,payments:state.data.vendors.map(v=>({vendorKey:v.key,method:state.payments[v.key]}))});state.dirty=false;state.saved=true;hydrate(data);state.saved=true;render();revisionSync.publish('방금 반영','live');$('flow-title').scrollIntoView({behavior:'smooth',block:'center'})}catch(error){alert(error.message||'저장하지 못했습니다.')}finally{state.saving=false;render()}}
async function report(vendorKey,button){if(state.saving||state.dirty||needsShippingSave())return;if(!confirm('결제를 마치셨나요?'))return;state.saving=true;button.disabled=true;try{const data=await api('/report-payment',{requestId:uuid(),vendorKey});hydrate(data);revisionSync.publish('방금 반영','live')}catch(error){alert(error.message||'결제 완료를 알리지 못했습니다.');button.disabled=false}finally{state.saving=false;render()}}
const revisionSync=Checkout.createRevisionSync({document,fetchRevision:()=>client.revision(state.data.channel.id),currentRevision:()=>state.data?.revision,isReady:()=>!!state.data,isBusy:()=>state.saving,hasDraft:()=>state.dirty,refresh:()=>load(true,true),onStatus:(text,stateName)=>{if($('sync')){$('sync').textContent=text;$('sync').dataset.state=stateName}}});
const poller=Checkout.createAdaptivePoller(revisionSync.poll,{document});window.addEventListener('pagehide',()=>{poller.stop();revisionSync.stop()},{once:true});$('parge-search').oninput=event=>{state.query=event.target.value;if(norm(state.query)!==norm(`${state.pargeRegion} ${state.pargeShop}`)){state.pargeRegion='';state.pargeShop=''}state.saved=false;state.dirty=true;render()};$('change-destination').onclick=()=>{editingDestination=true;render()};$('cancel-destination').onclick=()=>{editingDestination=false;render()};$('submit').onclick=save;$('retry').onclick=()=>load();load().finally(()=>poller.start(300));
})();</script></body></html>
