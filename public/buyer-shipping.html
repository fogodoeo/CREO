</div><script>
(()=>{'use strict';
 const Checkout=window.CreoCheckoutClient,Rules=window.CreoCheckoutRules,params=new URLSearchParams(location.search),client=Checkout.createClient({location,endpoint:'/api/platform/buyer-shipping',shortPrefix:'s',apiOrigin:params.get('apiOrigin')||''});
 const $=Checkout.byId,esc=Checkout.escapeHtml,money=Checkout.money,uuid=Checkout.requestId,phone=Checkout.formatPhone;
const state={data:null,destinationId:'',pargeRegion:'',pargeShop:'',query:'',region:'전체',payments:{},saving:false,saved:false,dirty:false};
const roundPicker=CreoCheckoutRounds.create({client,container:$('app'),load:()=>{state.dirty=false;return load()},canChange:()=>!state.saving&&!paymentReport.isOpen()&&(!state.dirty||confirm('입력 중인 내용을 버리고 다른 회차로 이동할까요?'))});
let loadSequence=0;
const experience=CreoBuyerNavigation.create({onNavigate:()=>render()});
function applyCarrierAccess(data){const changed=data.destinations&&JSON.stringify(state.data.destinations)!==JSON.stringify(data.destinations);state.data.carrierRequest=data.carrierRequest;if(data.destinations)state.data.destinations=data.destinations;if(data.carriers)state.data.carriers=data.carriers;if(changed)renderDestinations();}
const carrierAccess=CreoBuyerCarrierAccess.create({document,getState:()=>state,request:api,onUpdate:applyCarrierAccess,onChoose:()=>{state.destinationId='dodosi';state.pargeRegion='';state.pargeShop='';state.query='';state.region='전체';state.searchLimit=40;state.dirty=true;state.saved=false;render();$('parge-search').focus();}});
window.addEventListener('beforeunload',event=>{if(state.dirty||state.saving){event.preventDefault();event.returnValue='';}});
async function api(path='',body=null){return client.request(path,body)}
let editingDestination=false,destinationBeforeEdit=null;
function beginDestinationEdit(){
 if(state.saving)return;
 destinationBeforeEdit={destinationId:state.destinationId,pargeRegion:state.pargeRegion,pargeShop:state.pargeShop,query:state.query,region:state.region,dirty:state.dirty,saved:state.saved};
 editingDestination=true;state.saveError=null;render();
 if(['parge','dodosi'].includes(destination()?.type)){$('parge-search').focus();$('parge-search').select();}
 else document.querySelector('[data-dest]')?.focus();
}
function cancelDestinationEdit(){
 if(state.saving)return;
 if(destinationBeforeEdit)Object.assign(state,destinationBeforeEdit);
 destinationBeforeEdit=null;editingDestination=false;render();$('change-destination').focus();
}
function needsShippingSave(vendor){return (vendor?.items||state.data.items||[]).some(item=>!item.paymentStatus)}
function pendingConfirmation(vendor){return vendor?['bank_transfer_reported','card_payment_reported'].includes(vendor.payment.status):state.data.vendors.some(v=>pendingConfirmation(v))}
function vendorHasDraft(vendor){const s=state.data.selection;return Boolean(state.dirty&&(!s||s.destinationId!==state.destinationId||(s.pargeRegion||'')!==state.pargeRegion||(s.pargeShop||'')!==state.pargeShop||(vendor.payment.method||'')!==state.payments[vendor.key]))}
function vendorSaved(vendor){return Boolean(state.data.submittedAt)&&!vendorHasDraft(vendor)&&!needsShippingSave(vendor)}
function buyerPaymentPriority(vendor){
 const p=vendor.payment;
 if(p.status==='paid')return 2;
 if(pendingConfirmation(vendor))return 1;
 if(!vendorSaved(vendor))return 0;
 if(p.method==='card')return p.cardPaymentUrl||p.cardNoticeMethod==='external'?0:1;
 if(p.method==='bank_transfer'){const a=p.account||{};return a.bankName&&a.accountNumber&&a.holder?0:1;}
 return p.status==='card_link_pending'?1:0;
}
function changePending(){return state.data.changeRequest?.state==='pending'}
function requiresChange(){return Boolean(state.data.submittedAt)&&state.data.vendors.some(v=>v.payment.method&&v.payment.method!==state.payments[v.key])}
function destinationDraft(){const s=state.data.selection;return Boolean(state.data.submittedAt&&s)&&!requiresChange()&&(s.destinationId!==state.destinationId||(s.pargeRegion||'')!==state.pargeRegion||(s.pargeShop||'')!==state.pargeShop)}
function destinationReady(){const chosen=destination();return Boolean(chosen&&(chosen.type==='pickup'||(['parge','dodosi'].includes(chosen.type)&&selectedRate())))}
function renderFlow(){
 const ready=destinationReady(),showPayment=ready&&!editingDestination;
 const otherVendorWork=state.data.vendors.some(v=>!pendingConfirmation(v)&&(needsShippingSave(v)||vendorHasDraft(v)));
 const pending=((pendingConfirmation()&&!otherVendorWork)||changePending())&&!destinationDraft(),paid=state.data.payment.status==='paid',saved=Boolean(state.data.submittedAt)&&!state.dirty&&!needsShippingSave();
 const onlyConfirmation=state.data.vendors.every(v=>v.payment.status==='paid'||pendingConfirmation(v));
 const waitingForGuide=saved&&!paid&&state.data.vendors.every(v=>buyerPaymentPriority(v)>0);
 $('change-destination').disabled=state.saving||state.data.canEditDestination===false;
 $('destination-lock').hidden=!showPayment||state.data.canEditDestination!==false;
 $('destination-lock-message').textContent=changePending()?'변경 요청을 확인 중이에요. 확인이 끝나면 수령지를 바꿀 수 있어요.':'결제 확인 또는 발송이 진행되어 수령지를 직접 바꿀 수 없어요. 변경이 필요하면 업체나 운영자에게 문의해 주세요.';
 $('destination-contact').hidden=!state.data.vendors.some(v=>/^0\d{8,10}$/.test(String(v.contact?.phone||'').replace(/\D/g,'')));
 $('destination-contact').onclick=()=>{const contact=document.querySelector('#vendors .vendor-contact');contact?.focus();contact?.scrollIntoView({block:'center'});};
 $('payment-section').hidden=!showPayment;
 $('destination-summary').hidden=!showPayment;
 $('destination-editor').hidden=showPayment;
 $('cancel-destination').hidden=!editingDestination;
 $('cancel-destination').disabled=state.saving;
 $('destination-value').textContent=ready?(destination().type==='pickup'?'직수령 · '+destination().label:[destination().label,state.pargeRegion,state.pargeShop].filter(Boolean).join(' · ')):'';
 $('flow-title').textContent=!showPayment?'어디서 받으시나요?':paid&&saved?'결제가 완료됐어요':waitingForGuide?(onlyConfirmation?'결제 확인 중이에요':pending?'결제 안내·확인 중이에요':'결제 안내를 준비 중이에요'):pending?(onlyConfirmation?'결제 확인 중이에요':'결제를 진행해 주세요'):saved?'결제를 진행해 주세요':destinationDraft()?'배송지를 확인해 주세요':'결제 방법을 선택해 주세요';
 $('step-shipping').className=showPayment?'complete':'active';
 $('step-payment').className=showPayment?'active':'';
 $('status').hidden=true;
 $('flow-symbol').hidden=!(showPayment&&saved&&(paid||(pending&&onlyConfirmation)));
 $('flow-symbol').textContent=paid?'✓':'…';
 const change=state.data.changeRequest;
 $('change-banner').hidden=!change;
 $('change-banner').textContent=change?.state==='pending'?'요청한 정보 · '+[change.after?.address,...(change.after?.vendors||[]).map(v=>(change.after.vendors.length>1?v.name+' ':'')+(v.method==='card'?'카드결제':'계좌이체'))].filter(Boolean).join(' · '):change?.state==='rejected'?'변경 요청이 반려됐어요. '+(change.reason||''):change?.state==='approved'?'변경 완료':'';
 if(changePending()&&!destinationDraft())$('flow-title').textContent='변경 승인 대기';
 $('saved').hidden=true;
 $('submit').parentElement && ($('submit').parentElement.hidden=saved||!showPayment);
 const paymentReady=state.data.vendors.every(v=>v.payment.status==='paid'||state.payments[v.key]);
 $('payment-summary').hidden=!showPayment||!paymentReady||state.data.vendors.length===1;
 $('submit').disabled=state.saving||pending||!showPayment||!paymentReady||saved;
 $('submit').textContent=state.saving?'저장 중…':!showPayment?(ready?'수령지를 선택해 주세요':destination()&&destination().type!=='pickup'?'수령 지점을 선택해 주세요':'수령지를 선택해 주세요'):!paymentReady?'결제 방식을 선택해 주세요':saved?'저장 완료':state.data.submittedAt?'변경 내용 저장':'선택 완료';
 if(pending)$('submit').textContent='업체 결제 확인 중';
 else if(needsShippingSave()&&state.data.submittedAt&&showPayment&&paymentReady)$('submit').textContent='추가 낙찰 내역 저장';
 if(!pending&&showPayment&&paymentReady&&destinationDraft())$('submit').textContent='배송지 저장';
 if(!pending&&showPayment&&paymentReady&&requiresChange())$('submit').textContent='결제 방법 저장';
}
function renderSavedDestination(){
 const saved=state.data.savedDestination,box=$('saved-destination');
 const show=Boolean(saved&&!state.data.submittedAt&&!state.destinationId&&!state.savedDestinationDismissed);
 box.hidden=!show;$('destination-options').hidden=show;
 if(!show)return;
 box.innerHTML=`<small>이전에 등록한 수령지</small><b>${esc(saved.label)}</b><button class="primary" type="button" id="reuse-destination">이 수령지 사용</button><button class="secondary" type="button" id="new-destination">다른 수령지</button>`;
 $('reuse-destination').onclick=()=>{state.destinationId=saved.destinationId;state.pargeRegion=saved.pargeRegion||'';state.pargeShop=saved.pargeShop||'';state.query=state.pargeShop;state.dirty=true;state.saved=false;render()};
 $('new-destination').onclick=()=>{state.savedDestinationDismissed=true;state.dirty=true;render();document.querySelector('[data-dest]')?.focus()};
}
 const destination=()=>state.data?.destinations?.find(row=>row.id===state.destinationId),rates=()=>(state.data?.carriers?.[state.destinationId]||state.data?.parge)?.regions||[],selectedRate=()=>Rules.selectedRate(rates(),state.pargeRegion,state.pargeShop);
const CHO=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];function chosung(value){let out='';for(const ch of String(value||'')){const n=ch.charCodeAt(0);out+=n>=0xAC00&&n<=0xD7A3?CHO[Math.floor((n-0xAC00)/588)]:ch}return out}const norm=value=>String(value||'').replace(/\s+/g,' ').trim().toLowerCase();
 function paymentStatus(status){const meta=Checkout.paymentStatusMeta(status,'buyer');return[meta.label,meta.tone]}
function shippingQuote(){return Rules.allocateShipping(state.data?.items||[],{destinationType:destination()?.type||'',pargeRegion:state.pargeRegion,pargeShop:state.pargeShop},{shippingSupport:state.data?.shippingSupport,shippingDefaults:{dodosiAdditionalFee:state.data?.carriers?.dodosi?.additionalFee,pargeAdditionalFee:(state.data?.carriers?.[state.destinationId]||state.data?.parge)?.additionalFee,pargeJejuAdditionalFee:(state.data?.carriers?.[state.destinationId]||state.data?.parge)?.jejuAdditionalFee}},rates(),state.data?.selection&&state.destinationId===state.data.selection.destinationId&&state.pargeRegion===state.data.selection.pargeRegion&&state.pargeShop===state.data.selection.pargeShop?state.data.shippingQuotes||[]:[])} function globalShipping(){return shippingQuote().allocations}
function renderDestinations(){$('destinations').innerHTML=(state.data.destinations||[]).map(row=>`<button class="choice ${row.id===state.destinationId?'selected':''}" type="button" aria-pressed="${row.id===state.destinationId}" data-dest="${esc(row.id)}" ${state.saving?'disabled':''}><span><b>${esc(row.label)}${row.type==='pickup'?' · 직수령':''}</b></span><i aria-hidden="true"></i></button>`).join('');$('destinations').querySelectorAll('[data-dest]').forEach(button=>button.onclick=()=>{if(state.saving)return;state.destinationId=button.dataset.dest;state.pargeRegion='';state.pargeShop='';state.query='';state.region='전체';state.searchLimit=40;state.saved=false;state.dirty=true;state.saveError=null;editingDestination=Boolean(destinationBeforeEdit);if(!['parge','dodosi'].includes(destination()?.type)){editingDestination=false;destinationBeforeEdit=null}render();if(destination()?.type==='pickup')$('flow-title').focus();else $('parge-search').focus()})}
function allRates(){return rates().flatMap(group=>(group.shops||[]).map(shop=>({region:group.region,...shop})))}
function renderParge(){
 const visible=['parge','dodosi'].includes(destination()?.type);$('parge').hidden=!visible;if(!visible){carrierAccess.render({visible:false});return;}
 const regions=['전체',...rates().map(group=>group.region)];$('parge-search').value=state.query;
 $('parge-tabs').innerHTML=regions.map(region=>`<button class="tab ${region===state.region?'active':''}" type="button" aria-pressed="${region===state.region}" data-region="${esc(region)}">${esc(region)}</button>`).join('');
 $('parge-tabs').querySelectorAll('[data-region]').forEach(button=>button.onclick=()=>{state.region=button.dataset.region;state.query='';state.searchLimit=40;renderParge();[...$('parge-tabs').querySelectorAll('[data-region]')].find(row=>row.dataset.region===state.region)?.focus()});

 const visibleRows=rows.slice(0,state.searchLimit||40);
 $('parge-count').textContent=rows.length?`수령 지점 ${rows.length}곳${rows.length>visibleRows.length?' · '+visibleRows.length+'곳 표시':''}`:'찾은 지점이 없어요';
 $('parge-reset').hidden=!state.query&&state.region==='전체';
 $('parge-reset').onclick=()=>{state.query='';state.region='전체';state.searchLimit=40;renderParge();$('parge-search').focus()};
 $('parge-results').innerHTML=visibleRows.length?visibleRows.map(row=>`<button class="result ${row.region===state.pargeRegion&&row.name===state.pargeShop?'selected':''}" type="button" aria-pressed="${row.region===state.pargeRegion&&row.name===state.pargeShop}" data-shop="${esc(row.name)}" data-shop-region="${esc(row.region)}"><b>${esc(row.name)}</b><small>${esc(row.region)}</small><strong>${money(row.baseCost)}</strong></button>`).join(''):'<p class="note">'+(allRates().length?'지역명을 바꿔 검색하거나 전체 지점을 확인해 주세요.':'등록된 수령 지점이 없어요. 업체에 수령 방법을 문의해 주세요.')+'</p>';
 $('parge-results').querySelectorAll('[data-shop]').forEach(button=>button.onclick=()=>{editingDestination=false;destinationBeforeEdit=null;state.pargeRegion=button.dataset.shopRegion;state.pargeShop=button.dataset.shop;state.query=`${state.pargeRegion} ${state.pargeShop}`;state.saved=false;state.dirty=true;state.saveError=null;render();$('flow-title').focus()});
 $('parge-more').hidden=visibleRows.length>=rows.length;
 $('parge-more').onclick=()=>{const shown=visibleRows.length;state.searchLimit=shown+40;renderParge();$('parge-results').querySelectorAll('[data-shop]')[shown]?.focus()};
 const extra=state.pargeRegion.includes('제주')?(state.data.carriers?.[state.destinationId]||state.data.parge).jejuAdditionalFee:(state.data.carriers?.[state.destinationId]||state.data.parge).additionalFee;
 $('parge-note').textContent=`지점 기본 배송비 · 추가 개체당 +${money(extra)}`;
 $('parge').querySelectorAll('button,input').forEach(control=>control.disabled=state.saving);
 carrierAccess.render({visible:true,matches:rows.length,query:state.query,region:state.region});
}
function renderSaveFeedback(){
 const error=state.saveError,box=$('save-feedback');box.hidden=!error;if(!error)return;
 $('save-feedback-message').textContent=error.message;
 $('save-feedback-help').textContent=error.conflict?'선택한 내용은 그대로 있어요. 최신 정보를 불러온 뒤 다시 확인해 주세요.':'선택한 내용은 그대로 있어요. 아래에서 다시 저장해 주세요.';

function vendorDue(vendor,shipping){const shippingAmount=vendorSaved(vendor)?Number(vendor.totals.shippingAmount||0):vendor.items.reduce((sum,item)=>sum+(shipping.get(item.id)||0),0),total=Number(vendor.totals.payableAuctionAmount||0)+shippingAmount,confirmed=Number(vendor.payment.confirmedAmount||0);const shippingSupportAmount=vendorSaved(vendor)?Number(vendor.totals.shippingSupportAmount||0):vendor.items.reduce((sum,item)=>sum+(shippingQuote().supportAllocations?.get(item.id)||0),0);return{shippingAmount,shippingSupportAmount,total,due:Math.max(0,total-confirmed),confirmed}}

}

 }).join('');
 if(state.reportNotice&&state.reportNotice.version===state.data.editVersion&&state.reportNotice.channelId===state.data.channel.id&&state.reportNotice.roundKey===(state.data.round?.key||'')){const v=state.data.vendors.find(v=>v.key===state.reportNotice.vendorKey),index=state.data.vendors.slice().sort((a,b)=>buyerPaymentPriority(a)-buyerPaymentPriority(b)).indexOf(v),article=$('vendors').children[index];if(article){const note=document.createElement('p');note.className='report-feedback'+(state.reportNotice.warning?' warning':'');note.id='payment-report-feedback';note.setAttribute('role','status');note.setAttribute('tabindex','-1');note.textContent=state.reportNotice.text;article.append(note);}}

function renderPaymentSummary(){
 const data=state.data,shipping=globalShipping(),waiting=data.vendors.filter(pendingConfirmation).reduce((sum,v)=>sum+vendorDue(v,shipping).due,0),due=data.vendors.filter(v=>v.payment.status!=='paid'&&!pendingConfirmation(v)).reduce((sum,v)=>sum+vendorDue(v,shipping).due,0),confirmed=data.vendors.reduce((sum,v)=>sum+(Number(v.payment.confirmedAmount)||0),0),paid=data.payment.status==='paid';

async function load(silent=false,preserveDraft=false){const seq=++loadSequence;if(!client.valid)return showError('배송 링크 주소가 올바르지 않습니다.');if(!silent){$('loading').hidden=false;$('app').hidden=true}try{const next=await api();if(seq!==loadSequence)return false;hydrate(next,preserveDraft);return true}catch(error){if(seq!==loadSequence)return false;if(!silent)showError(error.message||'배송 정보를 불러오지 못했습니다.',error.status);return false}}function showError(message,status=0){$('loading').hidden=true;$('app').hidden=true;$('error').hidden=false;$('error-message').textContent=message;$('error-link-help').hidden=![401,403].includes(status);CreoCheckoutRounds.showRecovery($('error-round-recovery'),status)}
async function save(){if(state.saving||$('submit').disabled)return;state.saving=true;state.saveError=null;render();try{const signature=JSON.stringify([state.data.editVersion,state.destinationId,state.pargeRegion,state.pargeShop,state.payments]);if(state.saveSignature!==signature){state.saveSignature=signature;state.saveRequestId=uuid()}const data=await api('',{requestId:state.saveRequestId,expectedVersion:state.data.editVersion,destinationId:state.destinationId,pargeRegion:state.pargeRegion,pargeShop:state.pargeShop,payments:state.data.vendors.map(v=>({vendorKey:v.key,method:state.payments[v.key]}))});state.saveRequestId=null;state.dirty=false;state.saved=true;hydrate(data);state.saved=true;render();revisionSync.publish('방금 반영','live');$('flow-title').focus();$('flow-title').scrollIntoView({block:'center'})}catch(error){state.saveError={message:error.message||'연결을 확인한 뒤 다시 저장해 주세요.',conflict:error.status===409}}finally{state.saving=false;render();if(state.saveError){$('save-feedback').focus();$('save-feedback').scrollIntoView({block:'center'})}}}
const paymentReport=CreoBuyerPaymentReport.create({document,getCheckout:()=>state.data,

 onFinish:(data,vendorKey)=>{const feedback=CreoCheckoutActions.paymentReportFeedback(data.notification);state.reportNotice={vendorKey,version:data.editVersion,channelId:data.channel.id,roundKey:data.round?.key||'',text:feedback.text.replace('결제 신고 저장','결제 확인을 요청했어요'),warning:feedback.warning};render();revisionSync.publish('방금 반영','live');$('payment-report-feedback')?.focus();}

const revisionSync=Checkout.createRevisionSync({document,fetchRevision:()=>client.revision(state.data.channel.id),currentRevision:()=>state.data?.revision,isReady:()=>!!state.data&&!state.data.readOnly,isBusy:()=>state.saving||paymentReport.isOpen(),hasDraft:()=>state.dirty||experience.isOpen(),refresh:()=>load(true,true),onStatus:(text,stateName)=>{if($('sync')){$('sync').textContent=text;$('sync').dataset.state=stateName}}});
