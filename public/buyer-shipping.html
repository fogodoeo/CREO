<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="referrer" content="no-referrer">
    <title>CREO 배송·결제</title>
    <link rel="stylesheet" href="/checkout-ui.css?v=20260902-checkout-shell-v1">
    <script src="/checkout-client.js?v=20260902-checkout-shell-v1"></script>
    <style>
        :root{--checkout-width:680px;--item-index-width:44px;--item-font-size:13px}
        .status{display:flex;justify-content:space-between;gap:14px;margin-top:16px;padding:12px 14px;border-radius:11px;background:var(--soft);font-size:12px;font-weight:850}.status[data-tone=green]{background:#eaf6f0;color:var(--green)}.status[data-tone=red]{background:#fbefed;color:var(--red)}
        .saved{margin-top:10px;padding:13px 14px;border:1px solid #cfe4da;border-radius:11px;background:#f0f8f4;color:var(--green);font-size:12px;line-height:1.5}.saved b{display:block;font-size:14px}
        main{padding:20px 20px 120px}.section{margin-top:28px}.section:first-child{margin-top:0}.head{display:flex;align-items:end;justify-content:space-between;margin-bottom:11px}.head h2{margin:0;font-size:16px}.head span{color:var(--muted);font-size:11px}
        .item{padding:12px 2px}.item small{font-weight:800}
        .choices{display:grid;gap:8px}.choice{width:100%;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:left;cursor:pointer}.choice b{display:block;font-size:14px}.choice small{display:block;margin-top:3px;color:var(--muted);font-size:11px}.choice i{width:18px;height:18px;border:1.5px solid #b9bdc3;border-radius:50%}.choice.selected{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}.choice.selected i{border:5px solid var(--ink)}.choice:disabled{opacity:.45;cursor:not-allowed}
        .parge{display:grid;gap:9px;margin-top:9px;padding:13px;border-radius:12px;background:var(--soft)}.search{height:44px;padding:0 12px;border:1px solid #d7d9dc;border-radius:9px;background:#fff;outline:0}.tabs{display:flex;gap:5px;overflow:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{flex:0 0 auto;height:29px;padding:0 10px;border:1px solid #d9dbde;border-radius:99px;background:#fff;color:var(--muted);font-size:11px;font-weight:800}.tab.active{border-color:var(--ink);background:var(--ink);color:#fff}.results{display:grid;gap:6px;max-height:270px;overflow:auto}.result{display:grid;grid-template-columns:1fr auto;gap:3px 10px;width:100%;padding:10px 11px;border:1px solid #dddfe1;border-radius:9px;background:#fff;text-align:left}.result.selected{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}.result b{font-size:13px}.result small{color:var(--muted);font-size:10px}.result strong{grid-row:1/3;grid-column:2;align-self:center;font-size:13px}.note{margin:0 2px;color:var(--muted);font-size:10px;line-height:1.5}
        .vendor{margin-top:10px;border:1px solid var(--line);border-radius:14px;overflow:hidden}.vendor-head{display:flex;justify-content:space-between;gap:12px;padding:15px 15px 12px;background:#fafafa;border-bottom:1px solid var(--line)}.vendor-head b{font-size:15px}
        .vendor-body{padding:14px}.vendor .choice{padding:12px 13px}.totals{margin-top:13px;border-top:1px solid var(--ink)}.row{display:flex;justify-content:space-between;gap:12px;padding:8px 1px;border-bottom:1px solid var(--line);font-size:12px}.row span{color:var(--muted)}.row strong{font-variant-numeric:tabular-nums}.row.total{padding:12px 1px;font-size:15px}.row.total span{color:var(--ink);font-weight:850}.row.total strong{font-size:18px}.row.discount strong{color:var(--red)}
        .action-box{margin-top:13px;padding:14px;border-radius:11px;background:#f7f5ef}.action-box small{display:block;color:#7c6b4a;font-size:10px;font-weight:850}.action-box b{display:block;margin-top:6px;font-size:16px;letter-spacing:0}.action-box p{margin:5px 0 0;color:#6d665a;font-size:11px;line-height:1.5}.buttons{display:flex;gap:7px;margin-top:11px}.minor,.primary{height:41px;padding:0 13px;border:0;border-radius:9px;font-size:12px;font-weight:850;cursor:pointer}.minor{background:#e7e5df;color:#292822}.primary{flex:1;background:#202225;color:#fff}.primary:disabled{background:#c6c8cb}.card-link{display:block;margin-top:11px;padding:12px;border-radius:9px;background:#202225;color:#fff;text-align:center;text-decoration:none;font-size:12px;font-weight:850}
        .privacy{margin-top:22px;color:#898d94;font-size:10px;line-height:1.6}.footer{position:fixed;left:50%;bottom:0;z-index:10;width:min(680px,100%);padding:11px 20px calc(11px + env(safe-area-inset-bottom));transform:translateX(-50%);border-top:1px solid var(--line);background:rgba(255,255,255,.96);backdrop-filter:blur(10px)}.submit{width:100%;height:51px;border:0;border-radius:11px;background:#181a1e;color:#fff;font-size:14px;font-weight:900}.submit:disabled{background:#c8cacc}
        .error button{height:40px;margin-top:16px;padding:0 17px;border:0;border-radius:9px;background:#222;color:#fff;font-weight:800}
        @media(max-width:420px){.footer{padding-left:16px;padding-right:16px}.vendor-body{padding:12px}}
    </style>
</head>
<body><div class="shell">
    <div class="loading" id="loading"><b>낙찰 정보를 확인하고 있습니다</b><span>잠시만 기다려 주세요.</span></div>
    <div class="error" id="error" hidden><b>페이지를 열 수 없습니다</b><span id="error-message"></span><button id="retry" type="button">다시 시도</button></div>
    <div id="app" hidden>
        <header class="top"><div class="brand"><b>CREO</b><div class="brand-right"><span id="channel-name"></span><i class="sync" id="sync" role="status">실시간</i></div></div><h1><span id="buyer-name"></span>님 배송·결제</h1><p class="lead">배송지는 한 번, 결제 방식은 업체별로 확인해 주세요.</p><div class="status" id="status"><span id="status-label"></span><small id="status-detail"></small></div><div class="saved" id="saved" role="status" aria-live="polite" hidden><b>저장되었습니다.</b><span>선택 내용이 각 업체에 전달되었습니다.</span></div></header>
        <main>
            <section class="section"><div class="head"><h2>낙찰 내역</h2><span id="item-count"></span></div><div class="items" id="items"></div></section>
            <section class="section"><div class="head"><h2>1. 배송지</h2><span>전체 낙찰 공통</span></div><div class="choices" id="destinations"></div><div class="parge" id="parge" hidden><input class="search" id="parge-search" placeholder="지역 또는 파르게 수령 지점 검색" autocomplete="off"><div class="tabs" id="parge-tabs"></div><div class="results" id="parge-results"></div><p class="note" id="parge-note"></p></div></section>
            <section class="section"><div class="head"><h2>2. 업체별 결제</h2><span>업체마다 별도 확인</span></div><div id="vendors"></div></section>
            <p class="privacy">이 링크에는 개인 배송·결제 내역이 포함됩니다. 다른 사람에게 전달하지 마세요. 새 낙찰이 추가되면 같은 링크에 자동으로 반영됩니다.</p>
        </main>
        <footer class="footer"><button class="submit" id="submit" type="button" disabled>배송지와 결제방식 저장</button></footer>
    </div>
</div><script>
(()=>{'use strict';
const Checkout=window.CreoCheckoutClient,params=new URLSearchParams(location.search),client=Checkout.createClient({location,endpoint:'/api/platform/buyer-shipping',shortPrefix:'s',apiOrigin:params.get('apiOrigin')||''});
const $=Checkout.byId,esc=Checkout.escapeHtml,money=Checkout.money,uuid=Checkout.requestId;
const state={data:null,destinationId:'',pargeRegion:'',pargeShop:'',query:'',region:'전체',payments:{},saving:false,saved:false,dirty:false};let pulseBusy=false,syncTimer=null;
async function api(path='',body=null){return client.request(path,body)}async function pulse(){const response=await fetch(`${client.apiOrigin}/api/platform/channels/${encodeURIComponent(state.data.channel.id)}/broadcast-pulse`,{cache:'no-store'});if(!response.ok)throw new Error(`연결 오류 ${response.status}`);return response.json()}
const destination=()=>state.data?.destinations?.find(row=>row.id===state.destinationId),rates=()=>state.data?.parge?.regions||[],selectedRate=()=>rates().find(row=>row.region===state.pargeRegion)?.shops?.find(row=>row.name===state.pargeShop)||null;
const CHO=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];function chosung(value){let out='';for(const ch of String(value||'')){const n=ch.charCodeAt(0);out+=n>=0xAC00&&n<=0xD7A3?CHO[Math.floor((n-0xAC00)/588)]:ch}return out}const norm=value=>String(value||'').replace(/\s+/g,' ').trim().toLowerCase();
function paymentStatus(status){if(status==='paid')return['결제 완료','green'];if(status==='payment_reported'||['bank_transfer_reported','card_payment_reported'].includes(status))return['확인 대기','red'];if(status==='additional_payment')return['추가 결제','red'];if(status==='in_progress')return['결제 진행 중',''];if(status==='card_link_pending')return['링크 준비 중',''];if(status==='card_payment_pending')return['카드 결제 대기',''];if(status==='bank_transfer_pending')return['입금 대기',''];return['정보 입력 대기','']}
function globalShipping(){const allocations=new Map((state.data?.items||[]).map(item=>[item.id,0]));if(destination()?.type!=='parge'||!selectedRate())return allocations;const ordered=[...state.data.items].sort((a,b)=>a.lotNumber-b.lotNumber||a.id.localeCompare(b.id)),extra=state.pargeRegion.includes('제주')?state.data.parge.jejuAdditionalFee:state.data.parge.additionalFee;ordered.forEach((item,index)=>allocations.set(item.id,index?Number(extra||0):Number(selectedRate().baseCost||0)));return allocations}
function renderDestinations(){$('destinations').innerHTML=(state.data.destinations||[]).map(row=>`<button class="choice ${row.id===state.destinationId?'selected':''}" type="button" data-dest="${esc(row.id)}"><span><b>${esc(row.label)}</b><small>${row.type==='parge'?'파르게 수령 지점을 검색합니다.':'배송비 없이 직접 수령합니다.'}</small></span><i></i></button>`).join('');$('destinations').querySelectorAll('[data-dest]').forEach(button=>button.onclick=()=>{state.destinationId=button.dataset.dest;state.saved=false;state.dirty=true;if(destination()?.type!=='parge'){state.pargeRegion='';state.pargeShop=''}render()})}
function allRates(){return rates().flatMap(group=>(group.shops||[]).map(shop=>({region:group.region,...shop})))}function renderParge(){const visible=destination()?.type==='parge';$('parge').hidden=!visible;if(!visible)return;const regions=['전체',...rates().map(group=>group.region)];$('parge-search').value=state.query;$('parge-tabs').innerHTML=regions.map(region=>`<button class="tab ${region===state.region?'active':''}" type="button" data-region="${esc(region)}">${esc(region)}</button>`).join('');$('parge-tabs').querySelectorAll('[data-region]').forEach(button=>button.onclick=()=>{state.region=button.dataset.region;state.query='';renderParge()});let rows=allRates().filter(row=>state.region==='전체'||row.region===state.region),words=norm(state.query).split(/\s+/).filter(Boolean);if(words.length)rows=rows.filter(row=>words.every(word=>norm(`${row.region} ${row.name}`).includes(word)||chosung(`${row.region} ${row.name}`).includes(word)));rows=rows.slice(0,40);$('parge-results').innerHTML=rows.length?rows.map(row=>`<button class="result ${row.region===state.pargeRegion&&row.name===state.pargeShop?'selected':''}" type="button" data-shop="${esc(row.name)}" data-shop-region="${esc(row.region)}"><b>${esc(row.name)}</b><small>${esc(row.region)} · 기본 ${money(row.baseCost)}</small><strong>${money(row.baseCost)}</strong></button>`).join(''):'<p class="note">검색 결과가 없습니다.</p>';$('parge-results').querySelectorAll('[data-shop]').forEach(button=>button.onclick=()=>{state.pargeRegion=button.dataset.shopRegion;state.pargeShop=button.dataset.shop;state.query=`${state.pargeRegion} ${state.pargeShop}`;state.saved=false;state.dirty=true;render()});const extra=state.pargeRegion.includes('제주')?state.data.parge.jejuAdditionalFee:state.data.parge.additionalFee;$('parge-note').textContent=`첫 배송비 이후 추가 개체당 ${money(extra)}이 적용됩니다.`}
function vendorDue(vendor,shipping){const shippingAmount=vendor.items.reduce((sum,item)=>sum+(shipping.get(item.id)||0),0),total=Number(vendor.totals.payableAuctionAmount||0)+shippingAmount,confirmed=Number(vendor.payment.confirmedAmount||0);return{shippingAmount,total,due:Math.max(0,total-confirmed),confirmed}}
function vendorAction(vendor,due){const p=vendor.payment,status=p.status;if(status==='paid')return`<div class="action-box"><small>결제 완료</small><b>${money(p.confirmedAmount)}</b><p>업체에서 결제를 확인했습니다.</p></div>`;if(!state.data.submittedAt)return'';if(p.method==='bank_transfer'){const account=p.account||{};return`<div class="action-box"><small>입금 계좌</small><b>${esc(account.bankName)} ${esc(account.accountNumber)}</b><p>예금주 ${esc(account.holder)} · 입금액 ${money(due.due)}</p><div class="buttons"><button class="minor" type="button" data-copy="${esc(account.accountNumber)}">계좌 복사</button><button class="primary" type="button" data-report="${esc(vendor.key)}" ${status==='bank_transfer_reported'?'disabled':''}>${status==='bank_transfer_reported'?'입금 확인 중':'입금했습니다'}</button></div></div>`}if(p.method==='card'){if(!p.cardPaymentUrl)return`<div class="action-box"><small>카드결제</small><b>결제 링크 준비 중</b><p>업체에서 링크를 등록하면 카카오 알림으로 안내됩니다.</p></div>`;return`<div class="action-box"><small>카드결제</small><b>${money(due.due)}</b><a class="card-link" href="${esc(p.cardPaymentUrl)}" target="_blank" rel="noopener noreferrer">카드결제 페이지 열기</a><button class="primary" style="width:100%;margin-top:8px" type="button" data-report="${esc(vendor.key)}" ${status==='card_payment_reported'?'disabled':''}>${status==='card_payment_reported'?'결제 확인 중':'카드 결제했습니다'}</button></div>`}return''}
function renderVendors(){const shipping=globalShipping();$('vendors').innerHTML=state.data.vendors.map(vendor=>{const [label,tone]=paymentStatus(vendor.payment.status),due=vendorDue(vendor,shipping),method=state.payments[vendor.key]||'';return`<article class="vendor"><div class="vendor-head"><b>${esc(vendor.name)}</b><span class="badge ${tone}">${label}</span></div><div class="vendor-body"><div class="choices">${vendor.paymentMethods.map(value=>`<button class="choice ${method===value?'selected':''}" type="button" data-payment-vendor="${esc(vendor.key)}" data-method="${value}" ${vendor.payment.status==='paid'?'disabled':''}><span><b>${value==='bank_transfer'?'계좌이체':'카드결제'}</b><small>${value==='bank_transfer'?'입금 후 완료 사실을 알려주세요.':'업체가 결제 링크를 준비합니다.'}</small></span><i></i></button>`).join('')}</div><div class="totals"><div class="row"><span>낙찰금</span><strong>${money(vendor.totals.auctionAmount)}</strong></div>${vendor.totals.discountAmount?`<div class="row discount"><span>할인</span><strong>-${money(vendor.totals.discountAmount)}</strong></div>`:''}<div class="row"><span>배송비 배정</span><strong>${money(due.shippingAmount)}</strong></div>${due.confirmed?`<div class="row"><span>결제 확인 완료</span><strong>${money(due.confirmed)}</strong></div>`:''}<div class="row total"><span>${due.confirmed?'추가 결제 금액':'결제 금액'}</span><strong>${money(due.due)}</strong></div></div>${vendorAction(vendor,due)}</div></article>`}).join('');document.querySelectorAll('[data-payment-vendor]').forEach(button=>button.onclick=()=>{state.payments[button.dataset.paymentVendor]=button.dataset.method;state.saved=false;state.dirty=true;render()});document.querySelectorAll('[data-copy]').forEach(button=>button.onclick=async()=>{try{await navigator.clipboard.writeText(button.dataset.copy);button.textContent='복사 완료';setTimeout(()=>button.textContent='계좌 복사',1200)}catch{alert(button.dataset.copy)}});document.querySelectorAll('[data-report]').forEach(button=>button.onclick=()=>report(button.dataset.report,button))}
function render(){const data=state.data;$('channel-name').textContent=data.channel.name;$('buyer-name').textContent=data.buyer.name;$('item-count').textContent=`${data.items.length}개체 · ${data.vendors.length}업체`;$('items').innerHTML=data.items.map(item=>`<div class="item"><small>${String(item.lotNumber).padStart(2,'0')}</small><b>${esc(item.vendorName)} · ${esc(item.name)}</b><strong>${money(item.soldAmount)}</strong></div>`).join('');const [label,tone]=paymentStatus(data.payment.status);$('status-label').textContent=label;$('status-detail').textContent=data.payment.status==='paid'?'모든 업체 결제가 확인되었습니다.':data.payment.status==='payment_reported'?'업체 확인을 기다리고 있습니다.':'새 낙찰도 이 링크에 자동 반영됩니다.';$('status').dataset.tone=tone;$('saved').hidden=!state.saved;renderDestinations();renderParge();renderVendors();const valid=destination()&&(destination().type!=='parge'||selectedRate())&&data.vendors.every(v=>v.payment.status==='paid'||state.payments[v.key]);$('submit').disabled=state.saving||!valid;$('submit').textContent=state.saving?'저장 중…':data.submittedAt?'변경 내용 저장':'배송지와 결제방식 저장';$('loading').hidden=true;$('error').hidden=true;$('app').hidden=false}
function hydrate(data,preserveDraft=false){const draft=preserveDraft&&state.dirty?{destinationId:state.destinationId,pargeRegion:state.pargeRegion,pargeShop:state.pargeShop,query:state.query,region:state.region,payments:{...state.payments}}:null;state.data=data;state.destinationId=draft?.destinationId||data.selection?.destinationId||'';state.pargeRegion=draft?.pargeRegion||data.selection?.pargeRegion||'';state.pargeShop=draft?.pargeShop||data.selection?.pargeShop||'';state.query=draft?.query??(state.pargeShop?`${state.pargeRegion} ${state.pargeShop}`:'');state.region=draft?.region||'전체';state.payments=Object.fromEntries(data.vendors.map(v=>[v.key,draft?.payments[v.key]||v.payment.method||'']));state.dirty=Boolean(draft);render()}
async function load(silent=false,preserveDraft=false){if(!client.valid)return showError('배송 링크 주소가 올바르지 않습니다.');if(!silent){$('loading').hidden=false;$('app').hidden=true}try{hydrate(await api(),preserveDraft);return true}catch(error){if(!silent)showError(error.message||'배송 정보를 불러오지 못했습니다.');return false}}function showError(message){$('loading').hidden=true;$('app').hidden=true;$('error').hidden=false;$('error-message').textContent=message}
async function save(){if($('submit').disabled)return;state.saving=true;render();try{const data=await api('',{requestId:uuid(),destinationId:state.destinationId,pargeRegion:state.pargeRegion,pargeShop:state.pargeShop,payments:state.data.vendors.map(v=>({vendorKey:v.key,method:state.payments[v.key]}))});state.dirty=false;state.saved=true;hydrate(data);state.saved=true;render();setSync('방금 반영','live');$('saved').scrollIntoView({behavior:'smooth',block:'center'})}catch(error){alert(error.message||'저장하지 못했습니다.')}finally{state.saving=false;render()}}
async function report(vendorKey,button){button.disabled=true;try{const data=await api('/report-payment',{requestId:uuid(),vendorKey});hydrate(data);setSync('방금 반영','live')}catch(error){alert(error.message||'결제 완료를 알리지 못했습니다.');button.disabled=false}}
function setSync(text,stateName='live'){if(!$('sync'))return;$('sync').textContent=text;$('sync').dataset.state=stateName;clearTimeout(syncTimer);if(text==='방금 반영')syncTimer=setTimeout(()=>setSync('실시간','live'),1800)}async function pollPulse(){if(document.hidden||pulseBusy||state.saving||!state.data)return;pulseBusy=true;try{const next=await pulse();if(Number(next.checkoutRevision)!==Number(state.data.revision)){setSync('반영 중…','waiting');if(await load(true,true))setSync('방금 반영','live');else setSync('재연결 중','error')}else if($('sync').dataset.state==='error')setSync('실시간','live')}catch{setSync('재연결 중','error')}finally{pulseBusy=false}}
const poller=Checkout.createAdaptivePoller(pollPulse,{document});window.addEventListener('pagehide',poller.stop,{once:true});$('parge-search').oninput=event=>{state.query=event.target.value;if(norm(state.query)!==norm(`${state.pargeRegion} ${state.pargeShop}`)){state.pargeRegion='';state.pargeShop=''}state.saved=false;state.dirty=true;renderParge();renderVendors()};$('submit').onclick=save;$('retry').onclick=()=>load();load().finally(()=>poller.start(300));
})();</script></body></html>
