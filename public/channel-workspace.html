<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>채널 운영 · CREO</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <script src="platform-client.js?v=20260803-admin-session-v2"></script>
    <style>
        :root{color-scheme:light;--bg:#f5f6f8;--panel:#fff;--line:#e0e4ea;--text:#14181f;--muted:#737d8b;--accent:#254ac7;--danger:#c83e3e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard Variable,Pretendard,sans-serif;letter-spacing:-.018em}button,input,select,textarea{font:inherit}.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:18px;min-height:68px;padding:0 max(20px,calc((100% - 1220px)/2));border-bottom:1px solid var(--line);background:rgba(255,255,255,.92);backdrop-filter:blur(14px)}.brand{color:#111827;font-weight:900;letter-spacing:.13em;text-decoration:none}.channel-select{height:40px;min-width:220px;padding:0 34px 0 12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:750}.top-links{display:flex;gap:6px;margin-left:auto}.top-links a{padding:9px 11px;border-radius:9px;color:var(--muted);font-size:12px;font-weight:720;text-decoration:none}.top-links a:hover{background:#f0f2f5;color:var(--text)}.shell{width:min(1220px,calc(100% - 34px));margin:auto;padding:36px 0 70px}.heading{display:flex;align-items:end;justify-content:space-between;gap:18px}.heading h1{margin:0;font-size:34px;letter-spacing:-.045em}.heading p{margin:8px 0 0;color:var(--muted)}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:28px 0}.summary article{padding:18px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}.summary span{color:var(--muted);font-size:11px;font-weight:750}.summary b{display:block;margin-top:7px;font-size:25px}.tabs{display:flex;gap:5px;margin-top:18px;border-bottom:1px solid var(--line)}.tab{padding:13px 17px;border:0;border-bottom:2px solid transparent;background:none;color:var(--muted);font-weight:760;cursor:pointer}.tab.active{border-color:var(--accent);color:var(--accent)}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:20px 0 12px}.toolbar p{margin:0;color:var(--muted);font-size:12px}.btn{min-height:40px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--text);font-weight:740;cursor:pointer}.btn.primary{border-color:var(--accent);background:var(--accent);color:#fff}.btn.danger{color:var(--danger)}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:#fff}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{padding:14px 15px;border-bottom:1px solid #edf0f3;text-align:left;font-size:12px}th{background:#fafbfc;color:var(--muted);font-size:10px;letter-spacing:.04em}tbody tr:last-child td{border-bottom:0}.empty{padding:52px 20px;color:var(--muted);text-align:center}.row-actions{display:flex;gap:5px}.row-actions .btn{min-height:32px;padding:0 9px;font-size:11px}.modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:20px;background:rgba(9,13,20,.54);backdrop-filter:blur(6px)}.modal[hidden]{display:none}.dialog{width:min(680px,100%);max-height:calc(100vh - 40px);overflow:auto;padding:24px;border-radius:18px;background:#fff;box-shadow:0 28px 90px #0004}.dialog-head{display:flex;align-items:center;justify-content:space-between}.dialog h2{margin:0}.close{width:36px;height:36px;border:0;border-radius:50%;background:#f0f2f5;font-size:20px;cursor:pointer}.fields{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:22px}.field.full{grid-column:1/-1}.field label{display:block;margin-bottom:6px;color:var(--muted);font-size:11px;font-weight:720}.field input,.field select,.field textarea{width:100%;min-height:43px;padding:9px 11px;border:1px solid #d7dce3;border-radius:9px;background:#fff;color:var(--text)}.field textarea{min-height:82px;resize:vertical}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}.login{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px;background:#10141bdd}.login[hidden]{display:none}.login-box{width:min(410px,100%);padding:26px;border-radius:18px;background:#fff}.login-box h2{margin:0}.login-box p{color:var(--muted);font-size:13px}.login-box form{display:flex;gap:8px;margin-top:18px}.login-box input{flex:1;min-width:0;height:43px;padding:0 11px;border:1px solid var(--line);border-radius:9px}.toast{position:fixed;right:20px;bottom:20px;z-index:70;max-width:360px;padding:13px 16px;border-radius:10px;background:#151b24;color:#fff;opacity:0;transform:translateY(8px);transition:.2s}.toast.show{opacity:1;transform:none}.pill{display:inline-block;padding:4px 7px;border-radius:999px;background:#edf2ff;color:#3053bb;font-size:10px;font-weight:800}
        html.embedded-studio .top{display:none}html.embedded-studio .shell{padding-top:22px}html.embedded-studio .heading p{display:none}
        .live-panel{display:grid;grid-template-columns:auto minmax(220px,1fr) auto;align-items:center;gap:12px;margin:22px 0 10px;padding:14px;border:1px solid #d9dee6;border-radius:14px;background:#fff}.live-label{display:grid;gap:2px}.live-label span{color:#c43f48;font-size:9px;font-weight:900;letter-spacing:.12em}.live-label strong{font-size:13px}.live-item{height:42px;min-width:0;padding:0 11px;border:1px solid var(--line);border-radius:9px;background:#fff;font-weight:750}.live-modes{display:grid;grid-template-columns:repeat(3,72px);gap:5px}.live-mode{height:38px;border:1px solid var(--line);border-radius:8px;background:#f7f8fa;color:#697381;font-size:11px;font-weight:800;cursor:pointer}.live-mode.active{border-color:#254ac7;background:#edf2ff;color:#254ac7}.live-mode[data-mode="sold"].active{border-color:#14835c;background:#e9f7f1;color:#14835c}
        body{background:#f4f5f7}.top{min-height:58px;background:rgba(255,255,255,.95)}.shell{width:min(1180px,calc(100% - 28px));padding-top:28px}.heading h1{font-size:30px}.summary{margin:20px 0 14px}.summary article{box-shadow:0 1px 2px rgba(18,25,36,.06)}.tabs{position:sticky;top:58px;z-index:9;gap:4px;margin-top:14px;padding:8px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.95);backdrop-filter:blur(12px)}.tab{min-height:40px;flex:1;border:0;border-radius:8px}.tab.active{border:0;background:#edf2ff}.toolbar{margin-top:12px}.table-wrap{box-shadow:0 1px 2px rgba(18,25,36,.06)}tbody tr:hover td{background:#fafbfc}
        @media(max-width:720px){.top{padding:10px 14px;flex-wrap:wrap}.channel-select{order:3;width:100%}.top-links{width:100%;overflow-x:auto}.top-links a{white-space:nowrap}.shell{width:min(100% - 24px,620px);padding-top:26px}.heading{align-items:start}.live-panel{grid-template-columns:1fr}.live-modes{grid-template-columns:repeat(3,1fr)}.summary{grid-template-columns:1fr 1fr 1fr}.summary article{padding:14px}.summary b{font-size:21px}.fields{grid-template-columns:1fr}.field.full{grid-column:auto}.toolbar{align-items:end}}
    </style>
</head>
<body>
<script>if(new URLSearchParams(location.search).get('embedded')==='1')document.documentElement.classList.add('embedded-studio');</script>
<header class="top"><a class="brand" id="channel-home-link" href="/">CREO</a><select class="channel-select" id="channel-select" aria-label="채널"></select><nav class="top-links"><a id="print-link" href="#">인쇄</a><a id="settings-link" href="channel-manager.html">채널 설정</a><a id="shipping-link" href="#">배송</a><a id="archives-link" href="#">회차</a><a id="control-link" href="#">방송 관리</a><a id="live-link" href="#" target="_blank" rel="noopener">송출 화면</a></nav></header>
<main class="shell">
    <div class="heading"><div><h1 id="channel-name">현장 운영</h1><p id="channel-description"></p></div></div>
    <section class="live-panel" id="live-panel"><div class="live-label"><span>LIVE</span><strong>현재 송출</strong></div><select class="live-item" id="live-item" aria-label="송출할 개체"><option value="">개체 선택</option></select><div class="live-modes" id="live-modes"><button class="live-mode" data-mode="standby" type="button">대기 화면</button><button class="live-mode" data-mode="live" type="button">진행 화면</button><button class="live-mode" data-mode="sold" type="button">낙찰 화면</button></div></section>
    <section class="summary"><article><span>등록 업체</span><b id="vendor-count">0</b></article><article><span>등록 개체</span><b id="item-count">0</b></article><article><span>배송 등록</span><b id="shipment-count">0</b></article></section>
    <div class="tabs" role="tablist"><button class="tab active" data-tab="vendors">업체</button><button class="tab" data-tab="items">개체</button><button class="tab" data-tab="shipping">배송</button></div>
    <div class="toolbar"><p id="tab-help">이 경매에 참여하는 업체만 등록합니다.</p><button class="btn primary" id="add-record">＋ 업체 추가</button></div>
    <div class="table-wrap" id="table-wrap"></div>
</main>
<div class="modal" id="record-modal" hidden><form class="dialog" id="record-form"><div class="dialog-head"><h2 id="dialog-title">항목 추가</h2><button type="button" class="close" id="close-modal" aria-label="닫기">×</button></div><div class="fields" id="record-fields"></div><div class="dialog-actions"><button type="button" class="btn" id="cancel-modal">취소</button><button class="btn primary">저장</button></div></form></div>
<div class="login" id="login"><div class="login-box"><h2>운영자 확인</h2><p>기존 관리자 비밀번호를 입력해 주세요.</p><form id="login-form"><input type="password" id="password" autocomplete="current-password" required><button class="btn primary">확인</button></form></div></div>
<div class="toast" id="toast" role="status"></div>
<script>
const $=id=>document.getElementById(id),esc=v=>CreoPlatform.escapeHtml(v);let catalog={channels:[]},channelId='',data={vendors:[],items:[],shipments:[],broadcast:{}},tab='vendors',editing=null,workspaceLoadSequence=0;
function toast(m){const e=$('toast');e.textContent=m;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2500)}
function selectedChannel(){return catalog.channels.find(c=>c.id===channelId)}
function endpoint(type,id=''){return`channels/${encodeURIComponent(channelId)}/${type}${id?'/'+encodeURIComponent(id):''}`}
async function loadCatalog(){catalog=await CreoPlatform.api('channels');const requested=String(new URLSearchParams(location.search).get('channel')||'').toLowerCase().replace(/[^a-z0-9-]/g,'');if(!requested||!catalog.channels.some(channel=>channel.id===requested))throw new Error('등록 채널 주소가 올바르지 않습니다. 메인에서 채널을 다시 선택해 주세요.');channelId=requested;$('channel-select').innerHTML=catalog.channels.map(c=>`<option value="${esc(c.id)}" ${c.id===channelId?'selected':''}>${esc(c.name)}</option>`).join('')}
async function loadWorkspace(){const requestedChannelId=channelId,sequence=++workspaceLoadSequence,response=await CreoPlatform.api(`channels/${encodeURIComponent(requestedChannelId)}/workspace`);if(sequence!==workspaceLoadSequence||requestedChannelId!==channelId)return;if(response.channel?.id!==requestedChannelId)throw new Error('채널 자료 응답이 일치하지 않습니다. 새로고침해 주세요.');data=response;data.broadcast=data.broadcast||{id:'state',mode:'standby',activeItemId:''};const c=selectedChannel(),q=`channel=${encodeURIComponent(requestedChannelId)}`;$('channel-name').textContent=c?.name||requestedChannelId;$('channel-description').textContent=c?.description||'';$('channel-home-link').href=`/?${q}`;$('print-link').href=c?.links?.print||`print.html?${q}`;$('settings-link').href=c?.links?.settings||`channel-manager.html?${q}`;$('archives-link').href=c?.links?.archives||`channel-archives.html?${q}`;$('live-panel').hidden=c?.features?.broadcast===false;$('vendor-count').textContent=data.vendors.length;$('item-count').textContent=data.items.length;$('shipment-count').textContent=data.shipments.length;$('control-link').href=c?.links?.control||`broadcast-studio.html?${q}`;$('shipping-link').href=c?.links?.shipping||`shipping.html?${q}`;$('shipping-link').hidden=c?.features?.shipping===false;$('live-link').href=c?.links?.live||`broadcast-router.html?event=${encodeURIComponent(requestedChannelId)}&page=1&live=1`;$('live-link').hidden=c?.features?.broadcast===false;document.querySelector('[data-tab="vendors"]').hidden=c?.features?.vendors===false;document.querySelector('[data-tab="shipping"]').hidden=c?.features?.shipping===false;if((tab==='vendors'&&c?.features?.vendors===false)||(tab==='shipping'&&c?.features?.shipping===false))tab='items';syncLive();render()}
function syncLive(){$('live-item').innerHTML='<option value="">개체 선택</option>'+data.items.slice().sort((a,b)=>a.lotNumber-b.lotNumber).map(i=>`<option value="${esc(i.id)}" ${i.id===data.broadcast.activeItemId?'selected':''}>${String(i.lotNumber).padStart(3,'0')} · ${esc(i.name)}</option>`).join('');document.querySelectorAll('.live-mode').forEach(button=>button.classList.toggle('active',button.dataset.mode===(data.broadcast.mode||'standby')))}
async function setLive(mode=data.broadcast.mode||'standby'){const requestedChannelId=channelId;try{const itemId=$('live-item').value,next={...data.broadcast,activeItemId:itemId,mode};const status=itemId?(mode==='live'?'live':(mode==='sold'?'sold':'waiting')):'';const saved=await CreoPlatform.api(`channels/${encodeURIComponent(requestedChannelId)}/auction-transition`,{method:'PUT',body:JSON.stringify({itemId,mode,status,state:next})});if(requestedChannelId!==channelId)return;data.broadcast={...next,...saved.state};if(saved.item){const index=data.items.findIndex(item=>item.id===saved.item.id);if(index>=0)data.items[index]=saved.item}syncLive();render();toast(mode==='standby'?'방송을 대기 상태로 바꿨습니다.':mode==='live'?'현재 개체를 송출합니다.':'낙찰 화면을 송출합니다.')}catch(error){if(requestedChannelId===channelId)toast(error.message)}}
function term(key,fallback){return selectedChannel()?.terminology?.[key]||fallback}function groupName(id){return selectedChannel()?.groups?.find(group=>group.id===id)?.name||''}function groupOptions(current=''){const rows=selectedChannel()?.groups||[];return`<option value="">선택 안 함</option>`+rows.map(group=>`<option value="${esc(group.id)}" ${group.id===current?'selected':''}>${esc(group.name)}</option>`).join('')}function vendorName(id){return data.vendors.find(v=>v.id===id)?.name||'-'}function itemName(id){const i=data.items.find(v=>v.id===id);return i?`${String(i.lotNumber).padStart(3,'0')} · ${i.name}`:'-'}function statusName(value){return({waiting:'대기',live:'진행 중',sold:'낙찰',passed:'유찰'})[value]||value||'-'}
function actions(type,id){return`<div class="row-actions"><button class="btn" data-edit="${esc(type)}:${esc(id)}">수정</button><button class="btn danger" data-delete="${esc(type)}:${esc(id)}">삭제</button></div>`}
function render(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.querySelector('[data-tab="vendors"]').textContent=term('vendor','업체');document.querySelector('[data-tab="items"]').textContent=term('item','개체');const labels={vendors:`${term('vendor','업체')} 추가`,items:`${term('item','개체')} 추가`,shipping:'배송 추가'};$('tab-help').textContent='';$('add-record').textContent='＋ '+labels[tab];let html='';if(tab==='vendors'){html=data.vendors.length?`<table><thead><tr><th>${esc(term('vendor','업체'))}</th><th>코드</th><th>${esc(term('group','그룹'))}</th><th>담당자</th><th>연락처</th><th>주소</th><th></th></tr></thead><tbody>${data.vendors.map(v=>`<tr><td><b>${esc(v.name)}</b></td><td>${esc(v.code||'-')}</td><td>${esc(groupName(v.groupId))}</td><td>${esc(v.manager||'-')}</td><td>${esc(v.phone||'-')}</td><td>${esc(v.address||'-')}</td><td>${actions('vendors',v.id)}</td></tr>`).join('')}</tbody></table>`:`<div class="empty">등록된 ${esc(term('vendor','업체'))}가 없습니다.</div>`}else if(tab==='items'){html=data.items.length?`<table><thead><tr><th>번호</th><th>${esc(term('item','개체'))}</th><th>${esc(term('vendor','업체'))}</th><th>${esc(term('group','그룹'))}</th><th>카테고리</th><th>낙찰가</th><th>낙찰자</th><th>상태</th><th></th></tr></thead><tbody>${data.items.slice().sort((a,b)=>a.lotNumber-b.lotNumber).map(i=>`<tr><td><b>${String(i.lotNumber).padStart(3,'0')}</b></td><td>${esc(i.name)}</td><td>${esc(vendorName(i.vendorId))}</td><td>${esc(groupName(i.groupId)||i.teamName||'-')}</td><td>${esc(i.category||'-')}</td><td><b>${i.soldPrice?CreoPlatform.money(i.soldPrice):'-'}</b></td><td>${esc(i.winnerName||'-')}</td><td><span class="pill">${esc(statusName(i.status))}</span></td><td>${actions('items',i.id)}</td></tr>`).join('')}</tbody></table>`:`<div class="empty">등록된 ${esc(term('item','개체'))}가 없습니다.</div>`}else{html=data.shipments.length?`<table><thead><tr><th>${esc(term('item','개체'))}</th><th>수령인</th><th>연락처</th><th>방식</th><th>상태</th><th></th></tr></thead><tbody>${data.shipments.map(s=>`<tr><td>${esc(itemName(s.itemId))}</td><td>${esc(s.recipientName||'-')}</td><td>${esc(s.recipientPhone||'-')}</td><td>${esc(s.method==='pickup'?'직접수령':'배송')}</td><td><span class="pill">${esc(s.status)}</span></td><td>${actions('shipments',s.id)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">등록된 배송이 없습니다.</div>'}$('table-wrap').innerHTML=html;document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const[t,id]=b.dataset.edit.split(':');openModal(t,data[t].find(r=>r.id===id))});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{const[t,id]=b.dataset.delete.split(':');if(!confirm('이 항목을 삭제할까요?'))return;try{await CreoPlatform.api(endpoint(t,id),{method:'DELETE'});await loadWorkspace();toast('삭제했습니다.')}catch(e){toast(e.message)}})}
function field(name,label,value='',type='text',options=''){if(type==='select')return`<div class="field"><label>${label}</label><select name="${name}">${options}</select></div>`;if(type==='textarea')return`<div class="field full"><label>${label}</label><textarea name="${name}">${esc(value)}</textarea></div>`;return`<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}"></div>`}
function optionList(rows,current,label){return`<option value="">선택</option>`+rows.map(r=>`<option value="${esc(r.id)}" ${r.id===current?'selected':''}>${esc(label(r))}</option>`).join('')}
function openModal(type,record=null){editing={type,id:record?.id||'',channelId};let f='';if(type==='vendors'){f+=field('name',`${term('vendor','업체')}명`,record?.name);f+=field('code',`${term('vendor','업체')} 코드`,record?.code);if(selectedChannel()?.features?.groups)f+=field('groupId',term('group','그룹'),record?.groupId,'select',groupOptions(record?.groupId));f+=field('manager','담당자',record?.manager);f+=field('phone','연락처',record?.phone);f+=field('address','주소',record?.address,'textarea');f+=field('note','메모',record?.note,'textarea')}else if(type==='items'){f+=field('lotNumber','번호',record?.lotNumber,'number');f+=field('name',`${term('item','개체')}명`,record?.name);if(selectedChannel()?.features?.vendors)f+=field('vendorId',term('vendor','업체'),record?.vendorId,'select',optionList(data.vendors,record?.vendorId,v=>v.name));if(selectedChannel()?.features?.groups)f+=field('groupId',term('group','그룹'),record?.groupId,'select',groupOptions(record?.groupId));f+=field('category','카테고리',record?.category);f+=field('points','포인트',record?.points,'number');f+=field('startPrice','시작가',record?.startPrice,'number');f+=field('soldPrice','낙찰가',record?.soldPrice,'number');f+=field('winnerName','낙찰자',record?.winnerName);f+=field('winnerAlias','방송용 낙찰자명',record?.winnerAlias);f+=field('status','상태',record?.status,'select',`<option value="waiting" ${record?.status==='waiting'?'selected':''}>대기</option><option value="live" ${record?.status==='live'?'selected':''}>진행</option><option value="sold" ${record?.status==='sold'?'selected':''}>낙찰</option><option value="passed" ${record?.status==='passed'?'selected':''}>유찰</option>`);f+=field('photoUrl','이미지 주소',record?.photoUrl);f+=field('note','설명',record?.note,'textarea')}else{f+=field('itemId',term('item','개체'),record?.itemId,'select',optionList(data.items,record?.itemId,i=>`${String(i.lotNumber).padStart(3,'0')} · ${i.name}`));f+=field('vendorId',`발송 ${term('vendor','업체')}`,record?.vendorId,'select',optionList(data.vendors,record?.vendorId,v=>v.name));f+=field('recipientName','수령인',record?.recipientName);f+=field('recipientPhone','연락처',record?.recipientPhone);f+=field('method','수령 방식',record?.method,'select',`<option value="delivery" ${record?.method==='delivery'?'selected':''}>배송</option><option value="pickup" ${record?.method==='pickup'?'selected':''}>직접수령</option>`);f+=field('status','상태',record?.status,'select',`<option value="pending" ${record?.status==='pending'?'selected':''}>입력 대기</option><option value="ready" ${record?.status==='ready'?'selected':''}>발송 준비</option><option value="shipped" ${record?.status==='shipped'?'selected':''}>발송 완료</option><option value="complete" ${record?.status==='complete'?'selected':''}>수령 완료</option>`);f+=field('address','배송 주소',record?.address,'textarea');f+=field('carrier','배송 업체',record?.carrier);f+=field('trackingNumber','송장번호',record?.trackingNumber);f+=field('cost','배송비',record?.cost,'number');f+=field('note','메모',record?.note,'textarea')}$('record-fields').innerHTML=f;$('dialog-title').textContent=({vendors:term('vendor','업체'),items:term('item','개체'),shipments:'배송'}[type])+(record?' 수정':' 추가');$('record-modal').hidden=false}
function closeModal(){$('record-modal').hidden=true;editing=null}$('close-modal').onclick=$('cancel-modal').onclick=closeModal;$('add-record').onclick=()=>openModal(tab);document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;history.replaceState(null,'',`?channel=${encodeURIComponent(channelId)}&tab=${tab}`);render()});
$('record-form').onsubmit=async e=>{e.preventDefault();if(!editing||editing.channelId!==channelId)return toast('채널이 변경되었습니다. 항목을 다시 열어 주세요.');const requestedChannelId=channelId,form=Object.fromEntries(new FormData(e.currentTarget));['lotNumber','startPrice','soldPrice','points','cost'].forEach(k=>{if(k in form)form[k]=Number(form[k])||0});try{const path=`channels/${encodeURIComponent(requestedChannelId)}/${encodeURIComponent(editing.type)}${editing.id?'/'+encodeURIComponent(editing.id):''}`,method=editing.id?'PUT':'POST';await CreoPlatform.api(path,{method,body:JSON.stringify({record:form})});if(requestedChannelId!==channelId)return;closeModal();await loadWorkspace();toast('저장했습니다.')}catch(err){if(requestedChannelId===channelId)toast(err.message)}};
$('channel-select').onchange=async e=>{closeModal();channelId=e.target.value;history.replaceState(null,'',`?channel=${encodeURIComponent(channelId)}&tab=${tab}`);await loadWorkspace()};
$('live-item').onchange=()=>setLive();document.querySelectorAll('.live-mode').forEach(button=>button.onclick=()=>setLive(button.dataset.mode));
$('login-form').onsubmit=async e=>{e.preventDefault();try{CreoPlatform.setAdmin($('password').value);if(!await CreoPlatform.verifyAdmin())throw new Error('비밀번호가 맞지 않습니다.');$('login').hidden=true;await loadCatalog();tab=new URLSearchParams(location.search).get('tab')||'vendors';await loadWorkspace()}catch(err){toast(err.message)}};
(async()=>{if(CreoPlatform.getAdmin()){try{if(await CreoPlatform.verifyAdmin()){$('login').hidden=true;await loadCatalog();tab=new URLSearchParams(location.search).get('tab')||'vendors';await loadWorkspace();return}}catch(_){CreoPlatform.setAdmin('')}}$('login').hidden=false})();
</script></body></html>
