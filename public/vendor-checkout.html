<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>업체 낙찰·결제 확인</title>
<link rel="stylesheet" href="/checkout-ui.css?v=20260902-checkout-shell-v1"><script src="/checkout-client.js?v=20260906-vendor-directory"></script>
<style>
/* Keep internal channel/sync targets for live updates, without operator controls. */
.top > .brand,.top > label{display:none}
.top > h1{margin-top:0}
:root{--checkout-width:760px;--item-index-width:40px;--item-font-size:12px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:17px}.metric{padding:12px;border-radius:10px;background:var(--soft)}.metric small{display:block;color:var(--muted);font-size:10px}.metric b{display:block;margin-top:4px;font-size:18px}main{padding:20px 20px 60px}.buyer{margin-bottom:12px;border:1px solid var(--line);border-radius:14px;overflow:hidden}.buyer-head{display:flex;justify-content:space-between;gap:12px;padding:14px 15px;background:#fafafa;border-bottom:1px solid var(--line)}.identity b{font-size:15px}.identity span{display:block;margin-top:3px;color:var(--muted);font-size:11px}.body{padding:14px}.destination{padding:11px 12px;border-radius:9px;background:var(--soft);font-size:12px}.destination b{display:block}.destination span{display:block;margin-top:3px;color:var(--muted)}.items{margin-top:12px}.item{gap:8px;padding:9px 1px}.totals{margin-top:11px}.row{padding:5px 1px}.row.total{margin-top:4px;padding-top:10px;border-top:1px solid var(--line);font-size:15px}.row.total span{color:var(--ink);font-weight:850}.action{margin-top:13px;padding:13px;border-radius:10px;background:#f7f5ef}.action p{margin:0;color:#625e55;font-size:11px;line-height:1.5}.url-row{display:flex;gap:7px;margin-top:9px}.url-row input{min-width:0;flex:1;height:41px;padding:0 11px;border:1px solid #d8d5cd;border-radius:8px;background:#fff;outline:0}.btn{height:41px;padding:0 14px;border:0;border-radius:8px;background:#202225;color:#fff;font-size:12px;font-weight:850;cursor:pointer}.btn:disabled{background:#c7c9cc}.confirm{width:100%;margin-top:9px}.error button{margin-top:15px}@media(max-width:420px){.body{padding:12px}.summary{gap:5px}.metric{padding:10px}}
#vendor-event{display:block;width:100%;height:44px;margin:8px 0 18px;padding:0 12px;border:1px solid #ddd;border-radius:10px;background:#f6f6f4;font:inherit}#vendor-settings-form input:not([type=checkbox]){border:1px solid #d9dcdf;border-radius:9px;min-height:44px;font:inherit}#vendor-settings-form input[readonly]{background:#f4f5f5;color:#555}
</style><link rel="stylesheet" href="/checkout-accessible.css?v=20260906-1"><script src="/checkout-actions.js?v=20260907-vendor-flow"></script><link rel="stylesheet" href="/vendor-checkout.css?v=20260907-flow"></head><body><div class="shell"><div class="loading" id="loading"><b>불러오는 중…</b></div><div class="error" id="error" hidden><b>페이지를 열 수 없습니다</b><span id="error-message"></span><button class="btn" id="retry">다시 시도</button></div><div id="app" hidden><header class="top"><div class="brand"><b>CREO PARTNER</b><div class="brand-right"><span id="channel"></span><i class="sync" id="sync" role="status">실시간</i></div></div><label>경매 선택<select id="vendor-event"></select></label><h1 id="vendor"></h1><h2 class="work-title">확인할 결제 <strong id="action-count">0건</strong></h2><div class="summary"><div class="metric"><small>구매자</small><b id="buyer-count"></b></div><div class="metric"><small>낙찰 개체</small><b id="item-count"></b></div><div class="metric"><small>확인 필요</small><b id="open-count"></b></div></div></header><main><details id="vendor-settings" class="buyer" style="padding:18px;margin-bottom:16px"><summary style="cursor:pointer;font-weight:700">연락처·결제 설정</summary>
<form id="vendor-settings-form" style="display:grid;gap:12px;margin-top:16px">
<label>문의 연락처<input id="vendor-phone" type="tel" required style="display:block;width:100%;padding:10px"></label>
<label>은행<input id="vendor-bank" required maxlength="60" style="display:block;width:100%;padding:10px"></label>
<label>계좌번호<input id="vendor-account" required inputmode="numeric" maxlength="100" style="display:block;width:100%;padding:10px"></label>
<label>예금주<input id="vendor-holder" required maxlength="80" style="display:block;width:100%;padding:10px"></label>
<p id="bank-guidance" style="margin:0;font-size:13px;color:#666"></p>
<label><input id="vendor-card" type="checkbox"> 카드결제 사용</label>
<p style="margin:0;font-size:13px;color:#666">카드·피들 링크 등록 후 전송</p>
<button class="btn" id="save-vendor-settings" type="submit">업체 정보 저장</button><p id="settings-feedback" role="status"></p>
</form></details><nav class="work-filters" aria-label="결제 상태"><button class="work-filter" data-filter="action" type="button">확인 필요</button><button class="work-filter" data-filter="waiting" type="button">대기</button><button class="work-filter" data-filter="paid" type="button">완료</button><button class="work-filter" data-filter="all" type="button">전체</button></nav><div id="buyers"></div><div id="filter-empty" hidden>해당 내역이 없어요</div><div class="empty" id="empty" hidden><b>낙찰 내역이 없습니다</b></div></main></div></div>
<script>(()=>{'use strict';const Checkout=window.CreoCheckoutClient,client=Checkout.createClient({location,endpoint:'/api/platform/vendor-checkout',shortPrefix:'v'}),$=Checkout.byId,esc=Checkout.escapeHtml,money=Checkout.money,phone=Checkout.formatPhone,uuid=Checkout.requestId;let selectedEvent=new URLSearchParams(location.search).get("event")||"";let data=null,busy=false,settingsDirty=false,settingsLoaded=false;
function renderEvents(){
 selectedEvent=data.channel.id;
 const select=$('vendor-event');select.replaceChildren();
 for(const event of data.events||[data.channel]){const option=document.createElement('option');option.value=event.id;option.textContent=event.name+' · '+({active:'운영 중',draft:'준비 중',archived:'보관',paused:'일시정지'}[event.status]||'');option.selected=event.id===data.channel.id;select.append(option)}
}
$('vendor-event').onchange=async event=>{
 if(busy){event.target.value=data.channel.id;return}
 if(hasDraft()&&!confirm('입력 중인 내용을 버리고 다른 경매로 이동할까요?')){event.target.value=data.channel.id;return}
 const previous=selectedEvent;selectedEvent=event.target.value;settingsDirty=false;settingsLoaded=false;busy=true;
 try{if(!await load()){selectedEvent=previous;return}const url=new URL(location.href);url.searchParams.set('event',selectedEvent);history.replaceState(null,'',url)}
 finally{busy=false}
};
function renderSettings(){
 if(settingsDirty)return;const v=data.vendor;
 $('vendor-phone').value=v.phone||'';$('vendor-bank').value=v.bankName||'';$('vendor-account').value=v.bankAccount||'';$('vendor-holder').value=v.bankHolder||'';
 ['vendor-bank','vendor-account','vendor-holder'].forEach(id=>$(id).readOnly=!!v.bankRegistered);
 $('vendor-card').checked=v.paymentMethods.includes('card');
 $('bank-guidance').textContent=v.bankRegistered?'계좌 변경은 운영자에게 요청':'최초 등록 후 계좌 변경은 운영자에게 요청';
 if(!settingsLoaded){$('vendor-settings').open=!v.bankRegistered;settingsLoaded=true}
}
$('vendor-settings-form').oninput=()=>{settingsDirty=true;$('settings-feedback').textContent=''};
$('vendor-settings-form').onsubmit=async event=>{
 event.preventDefault();if(busy)return;busy=true;$('save-vendor-settings').disabled=true;
 try{data=await api('/settings',{directoryRevision:data.vendor.directoryRevision,phone:$('vendor-phone').value,bankName:$('vendor-bank').value,bankAccount:$('vendor-account').value,bankHolder:$('vendor-holder').value,cardEnabled:$('vendor-card').checked});settingsDirty=false;render();$('settings-feedback').textContent='저장 완료'}
 catch(error){$('settings-feedback').textContent=error.message}
 finally{busy=false;$('save-vendor-settings').disabled=false}
};
async function api(path='',body=null){return client.request(body ? path : path+'?event='+encodeURIComponent(selectedEvent),body ? {...body,event:selectedEvent} : null)}
function status(value){const meta=Checkout.paymentStatusMeta(value,'vendor');return[meta.label,meta.tone]}
let workFilter=null,filterEvent='';
function workStage(buyer){
 if(buyer.payment.status==='paid')return 'paid';
 if(data.channel.status&&data.channel.status!=='active')return 'waiting';
 if(!buyer.destination)return 'waiting';
 if(['bank_transfer_reported','card_payment_reported'].includes(buyer.payment.status)||(buyer.payment.method==='card'&&!buyer.payment.cardPaymentUrl))return 'action';
 return 'waiting';
}
function renderWorkFilters(){
 const counts={action:0,waiting:0,paid:0,all:data.buyers.length};
 data.buyers.forEach(b=>counts[workStage(b)]++);
 if(filterEvent!==data.channel.id){workFilter=null;filterEvent=data.channel.id}
 if(workFilter===null)workFilter=counts.action?'action':counts.waiting?'waiting':'all';
 $('action-count').textContent=counts.action+'건';
 document.querySelectorAll('[data-filter]').forEach(button=>{const key=button.dataset.filter;button.textContent=({action:'확인 필요',waiting:'대기',paid:'완료',all:'전체'})[key]+' '+counts[key];button.setAttribute('aria-pressed',String(key===workFilter));button.onclick=()=>{workFilter=key;renderWorkFilters()}});
 document.querySelectorAll('[data-stage]').forEach(card=>card.hidden=workFilter!=='all'&&card.dataset.stage!==workFilter);
 $('filter-empty').hidden=!data.buyers.length||counts[workFilter]>0;
}
function action(buyer){if(data.channel.status&&data.channel.status!=='active')return '<div class="action"><p>조회 전용</p></div>';const p=buyer.payment;if(p.status==='paid')return '';if(!buyer.destination)return '';if(p.method==='card'&&!p.cardPaymentUrl)return`<div class="action"><p>결제 링크 · 문자 전송</p><div class="url-row"><input data-card-input="${esc(buyer.id)}" inputmode="url" placeholder="https:// 결제 주소"><button class="btn" data-card-send="${esc(buyer.id)}">링크 전송</button></div></div>`;if(['bank_transfer_reported','card_payment_reported'].includes(p.status))return`<div class="action"><p>실제 입금·승인 내역 확인 후 눌러 주세요.</p><button class="btn confirm" data-confirm="${esc(buyer.id)}">${p.method==='bank_transfer'?'입금 확인 완료':'카드결제 확인 완료'}</button></div>`;return`<div class="action"><p>${p.method==='card'?'링크 전송 완료 · 결제 대기':'입금 대기'}</p></div>`}
function render(){if(!data)return;renderSettings();renderEvents();$('channel').textContent=data.channel.name;$('vendor').textContent=data.vendor.name;$('buyer-count').textContent=`${data.summary.buyerCount}명`;$('item-count').textContent=`${data.summary.itemCount}개`;$('open-count').textContent=`${data.summary.openCount}건`;$('empty').hidden=data.buyers.length>0;$('buyers').innerHTML=data.buyers.slice().sort((a,b)=>CreoCheckoutActions.priority(a.payment.status)-CreoCheckoutActions.priority(b.payment.status)).map(buyer=>{const [label,tone]=status(buyer.payment.status),destination=buyer.destination?.address||'수령지 입력 대기';return`<article class="buyer" data-stage="${workStage(buyer)}"><div class="buyer-head"><div class="identity"><b>${esc(buyer.name)}</b>${CreoCheckoutActions.phoneHref(buyer.phone)?`<a class="buyer-phone" href="${esc(CreoCheckoutActions.phoneHref(buyer.phone))}">전화 ${esc(phone(buyer.phone))}</a>`:'<span>연락처 확인 필요</span>'}</div><span class="badge ${tone}">${label}</span></div><div class="body"><div class="totals"><div class="row total"><span>${buyer.payment.status==='paid'?'결제 완료':buyer.payment.confirmedAmount?'추가 확인 금액':'확인 금액'}</span><strong>${money(buyer.payment.status==='paid'?buyer.payment.confirmedAmount:(buyer.payment.additionalDue??buyer.totals.totalAmount))}</strong></div></div>${action(buyer)}<details class="buyer-detail"><summary>낙찰 내역 · 수령지</summary><div class="destination"><b>수령 정보</b><span>${esc(destination)}</span></div><div class="items">${buyer.items.map(item=>`<div class="item"><small>${String(item.lotNumber).padStart(2,'0')}</small><b>${esc(item.name)}</b><strong>${money(item.soldAmount)}</strong></div>`).join('')}</div><div class="totals"><div class="row"><span>낙찰금</span><strong>${money(buyer.totals.auctionAmount)}</strong></div><div class="row"><span>배송비</span><strong>${money(buyer.totals.shippingAmount)}</strong></div>${buyer.payment.confirmedAmount?`<div class="row"><span>결제 확인 완료</span><strong>${money(buyer.payment.confirmedAmount)}</strong></div>`:''}</div></details></div></article>`}).join('');document.querySelectorAll('[data-card-send]').forEach(button=>button.onclick=()=>sendCard(button.dataset.cardSend));document.querySelectorAll('[data-confirm]').forEach(button=>button.onclick=()=>confirmPayment(button.dataset.confirm));renderWorkFilters();$('loading').hidden=true;$('error').hidden=true;$('app').hidden=false}
async function load(silent=false){if(!client.valid){showError('업체 확인 링크 주소가 올바르지 않습니다.');return false}if(!silent){$('loading').hidden=false;$('app').hidden=true}try{data=await api();render();return true}catch(error){if(!silent)showError(error.message);return false}}function showError(message){$('loading').hidden=true;$('app').hidden=true;$('error').hidden=false;$('error-message').textContent=message}
async function sendCard(buyerId){if(busy)return;const input=document.querySelector(`[data-card-input="${CSS.escape(buyerId)}"]`),cardPaymentUrl=input?.value.trim()||'';if(!cardPaymentUrl)return alert('카드결제 주소를 입력해 주세요.');busy=true;try{data=await api('/card-link',{buyerId,cardPaymentUrl,requestId:uuid()});render();revisionSync.publish('방금 반영','live');alert('카드결제 링크를 등록했습니다.')}catch(error){alert(error.message)}finally{busy=false}}
async function confirmPayment(buyerId){if(busy||!confirm('실제 결제 내역을 확인했습니까?'))return;busy=true;try{data=await api('/confirm-payment',{buyerId,requestId:uuid()});render();revisionSync.publish('방금 반영','live')}catch(error){alert(error.message)}finally{busy=false}}
function hasDraft(){return settingsDirty||[...document.querySelectorAll('[data-card-input]')].some(input=>input.value.trim())}
const revisionSync=Checkout.createRevisionSync({document,fetchRevision:async()=>({checkoutRevision:(await api('/revision')).revision}),currentRevision:()=>data?.revision,isReady:()=>!!data,isBusy:()=>busy,hasDraft,refresh:()=>load(true),onStatus:(text,stateName)=>{if($('sync')){$('sync').textContent=text;$('sync').dataset.state=stateName}}});
const poller=Checkout.createAdaptivePoller(revisionSync.poll,{document});window.addEventListener('pagehide',()=>{poller.stop();revisionSync.stop()},{once:true});$('retry').onclick=()=>load();load().finally(()=>poller.start(300));})();</script></body></html>
