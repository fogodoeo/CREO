<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>옹동2 · 업체 결제 확인</title>
<link rel="stylesheet" href="/checkout-ui.css?v=20260902-checkout-shell-v1"><script src="/checkout-client.js?v=20260908-approved-links"></script><link rel="stylesheet" href="/shipping-settlement.css?v=20260910"><script src="/shipping-confirm.js?v=20260910"></script>
<script src="/checkout-actions.js?v=20260908-layout"></script><link rel="stylesheet" href="/checkout-layout.css?v=20260908-mobile-focus"><link rel="stylesheet" href="/ongdong-brand.css?v=20260908-logo"><script src="/ongdong-brand.js?v=20260908-logo"></script><link rel="stylesheet" href="/checkout-mobile.css?v=20260910-shared-type"></head><body class="vendor-page"><div class="shell"><div class="loading" id="loading"><b>불러오는 중…</b></div><div class="error" id="error" hidden><b>페이지를 열 수 없습니다</b><span id="error-message"></span><button class="btn" id="retry">다시 시도</button></div><div id="app" hidden><header class="top"><div class="brand"><b data-ongdong-brand>옹동2</b><span class="page-context">업체 관리</span><div class="brand-right" hidden><span id="channel"></span><i class="sync" id="sync" role="status">실시간</i></div></div><label>경매 선택<select id="vendor-event"></select></label><h1 id="vendor"></h1><h2 class="work-title">지금 할 일 <strong id="action-count">0건</strong></h2><div class="summary"><div class="metric"><small>구매자</small><b id="buyer-count"></b></div><div class="metric"><small>낙찰 개체</small><b id="item-count"></b></div><div class="metric"><small>확인 필요</small><b id="open-count"></b></div></div></header><main><details id="vendor-settings" class="buyer" style="padding:18px;margin-bottom:16px"><summary style="cursor:pointer;font-weight:700">연락처·결제 설정</summary>
<form id="vendor-settings-form" style="display:grid;gap:12px;margin-top:16px">
<label>문의 연락처<input id="vendor-phone" type="tel" required style="display:block;width:100%;padding:10px"></label>
<label>은행<input id="vendor-bank" required maxlength="60" style="display:block;width:100%;padding:10px"></label>
<label>계좌번호<input id="vendor-account" required inputmode="numeric" maxlength="100" style="display:block;width:100%;padding:10px"></label>
<label>예금주<input id="vendor-holder" required maxlength="80" style="display:block;width:100%;padding:10px"></label>
<p id="bank-guidance" style="margin:0;font-size:13px;color:#666"></p>
<label><input id="vendor-card" type="checkbox"> 카드결제 사용</label>
<p style="margin:0;font-size:13px;color:#666">카드결제 안내 · 결제 확인</p>
<button class="btn" id="save-vendor-settings" type="submit">업체 정보 저장</button><p id="settings-feedback" role="status"></p>
</form></details><nav class="work-filters" aria-label="결제 상태"><button class="work-filter" data-filter="action" type="button">확인 필요</button><button class="work-filter" data-filter="waiting" type="button">대기</button><button class="work-filter" data-filter="paid" type="button">완료</button><button class="work-filter" data-filter="all" type="button">전체</button></nav><div id="buyers"></div><div id="filter-empty" hidden>해당 내역이 없어요</div><div class="empty" id="empty" hidden><b>낙찰 내역이 없습니다</b></div></main></div></div>
<script>(()=>{'use strict';const Checkout=window.CreoCheckoutClient,client=Checkout.createClient({location,endpoint:'/api/platform/vendor-checkout',shortPrefix:'v'}),$=Checkout.byId,esc=Checkout.escapeHtml,money=Checkout.money,phone=Checkout.formatPhone,uuid=Checkout.requestId;let selectedEvent=new URLSearchParams(location.search).get("event")||"";let data=null,busy=false,settingsDirty=false,settingsLoaded=false;
function renderEvents(){
 selectedEvent=data.channel.id;
 const select=$('vendor-event');select.replaceChildren();
 select.parentElement.hidden=(data.events||[data.channel]).length<2;
 for(const event of data.events||[data.channel]){const option=document.createElement('option');option.value=event.id;option.textContent=event.name+' · '+({active:'운영 중',draft:'준비 중',archived:'보관',paused:'일시정지'}[event.status]||'');option.selected=event.id===data.channel.id;select.append(option)}
}
$('vendor-event').onchange=async event=>{
 if(busy){event.target.value=data.channel.id;return}
 if(hasDraft()&&!confirm('입력 중인 내용을 버리고 다른 경매로 이동할까요?')){event.target.value=data.channel.id;return}
 const previous=selectedEvent;selectedEvent=event.target.value;settingsDirty=false;settingsLoaded=false;busy=true;
 try{if(!await load()){selectedEvent=previous;return}const url=new URL(location.href);url.searchParams.set('event',selectedEvent);history.replaceState(null,'',url)}
 finally{busy=false}
};
function renderSettings(){
 if(settingsDirty)return;const v=data.vendor;
 $('vendor-phone').value=v.phone||'';$('vendor-bank').value=v.bankName||'';$('vendor-account').value=v.bankAccount||'';$('vendor-holder').value=v.bankHolder||'';
 ['vendor-bank','vendor-account','vendor-holder'].forEach(id=>$(id).readOnly=!!v.bankRegistered);
 $('vendor-card').checked=v.paymentMethods.includes('card');
 $('bank-guidance').textContent=v.bankRegistered?'계좌 변경은 운영자에게 요청':'최초 등록 후 계좌 변경은 운영자에게 요청';
 if(!settingsLoaded){
  const settings=$('vendor-settings'),main=settings.parentElement;
  settings.open=!v.bankRegistered;
  if(v.bankRegistered)main.insertBefore(settings,main.querySelector('.site-footer'));
  else main.prepend(settings);
  settingsLoaded=true;
 }
}
$('vendor-settings-form').oninput=()=>{settingsDirty=true;$('settings-feedback').textContent=''};
$('vendor-settings-form').onsubmit=async event=>{
 event.preventDefault();if(busy)return;busy=true;$('save-vendor-settings').disabled=true;
 try{data=await api('/settings',{directoryRevision:data.vendor.directoryRevision,phone:$('vendor-phone').value,bankName:$('vendor-bank').value,bankAccount:$('vendor-account').value,bankHolder:$('vendor-holder').value,cardEnabled:$('vendor-card').checked});settingsDirty=false;render();$('settings-feedback').textContent='저장 완료'}
 catch(error){$('settings-feedback').textContent=error.message}
 finally{busy=false;$('save-vendor-settings').disabled=false}
};
async function api(path='',body=null){return client.request(body ? path : path+'?event='+encodeURIComponent(selectedEvent),body ? {...body,event:selectedEvent} : null)}
function status(value){const meta=Checkout.paymentStatusMeta(value,'vendor');return[meta.label,meta.tone]}
function cardLinkFeedback(notification){
 if(notification?.failed||notification?.configured===false)return '링크 저장 완료 · 알림톡 발송 실패. 운영자에게 확인해 주세요.';
 if(notification?.status==='configuration_pending')return '링크 저장 완료 · 알림톡 설정 확인 필요';
 if(notification?.status==='sent')return '링크 저장 · 알림톡 발송 접수 완료';
 return '링크 저장 완료 · 알림톡 발송 대기';
}
let workFilter=null,filterEvent='';
function workStage(buyer){
 if(buyer.changePending)return 'waiting';
 if(buyer.payment.status==='paid')return 'paid';
 if(data.channel.status&&data.channel.status!=='active')return 'waiting';
 if(!buyer.destination)return 'waiting';
 if(['bank_transfer_reported','card_payment_reported'].includes(buyer.payment.status)||(buyer.payment.method==='card'&&(!buyer.payment.cardPaymentUrl||buyer.payment.cardNoticeMethod==='external')))return 'action';
 return 'waiting';
}
function renderShippingSettlement(){
 const settlement=data.shippingSettlement;if(!settlement)return;
 let panel=$('shipping-settlement');if(!panel){panel=document.createElement('section');panel.id='shipping-settlement';panel.className='shipping-settlement';document.querySelector('main').prepend(panel)}
 const row=settlement.vendors.find(v=>v.vendorId===data.vendor.id)||{},bank=settlement.bank||{};
 const pending=row.pendingReport,ready=bank.bankAccount&&settlement.notificationReady,detailsOpen=panel.querySelector('details')?.open;
 panel.classList.toggle('settlement-complete',!pending&&!row.remainingAmount);
 panel.innerHTML=`<div class="settlement-pair"><b>주관사 배송비 정산</b>${pending?'<i class="settlement-status waiting">확인 대기</i>':row.remainingAmount===0&&row.receivedAmount?'<i class="settlement-status done">정산 완료</i>':''}</div><div class="settlement-muted">${pending?'입금 확인 중':'보낼 금액'}</div><div class="settlement-amount">${money(pending?pending.amount:row.remainingAmount)}</div>${pending?'<div class="settlement-muted">주관사 확인을 기다리고 있어요</div>':bank.bankAccount?`<div class="settlement-muted">${esc(bank.bankName)} · ${esc(bank.bankHolder)}</div><div class="settlement-bank">${esc(bank.bankAccount)}</div><button type="button" class="settlement-text" id="copy-organizer-bank">계좌 복사</button>`:'<div class="settlement-muted">주관사 계좌 등록 대기</div>'}<button type="button" class="settlement-primary" id="report-organizer-shipping" ${pending||!ready||!row.remainingAmount?'disabled':''}>${pending?'입금 확인 대기':!ready?'주관사 설정 대기':row.remainingAmount?'배송비 입금했어요':'정산할 금액 없음'}</button><div id="shipping-feedback" role="status" class="settlement-muted"></div><details ${detailsOpen?'open':''}><summary class="settlement-muted">정산 상세</summary><div class="settlement-pair"><span>전체 배송비</span><b>${money(row.totalAmount)}</b></div><div class="settlement-pair"><span>입금 확인</span><b>${money(row.receivedAmount)}</b></div><div class="settlement-pair"><span>남은 금액</span><b>${money(row.remainingAmount)}</b></div>${row.overpaidAmount?`<div class="settlement-pair"><span>초과 입금</span><b>${money(row.overpaidAmount)}</b></div>`:''}<hr class="settlement-divider"><div class="settlement-pair"><span>구매자 결제 완료분</span><span>${money(row.collectedAmount)}</span></div><div class="settlement-pair"><span>구매자 결제 대기분</span><span>${money(row.pendingAmount)}</span></div></details>`;
 const copy=$('copy-organizer-bank');if(copy)copy.onclick=async()=>{try{await navigator.clipboard.writeText(bank.bankAccount);copy.textContent='복사 완료'}catch(_){copy.textContent='위 계좌번호를 복사해 주세요'}};
 $('report-organizer-shipping').onclick=async()=>{if(busy||pending||!ready)return;busy=true;try{if(!await confirmShippingSettlement('주관사 계좌에 입금하셨나요?',money(row.remainingAmount),'입금했어요'))return;$('report-organizer-shipping').disabled=true;await api('/report-shipping',{requestId:uuid(),expectedAmount:row.remainingAmount,expectedBankUpdatedAt:bank.updatedAt});await load()}catch(e){$('shipping-feedback').textContent=e.message;$('report-organizer-shipping').disabled=false}finally{busy=false}};
}
function renderWorkFilters(){
 renderShippingSettlement();
 const counts={action:0,waiting:0,paid:0,all:data.buyers.length};
 data.buyers.forEach(b=>counts[workStage(b)]++);
 if(filterEvent!==data.channel.id){workFilter=null;filterEvent=data.channel.id}
 if(workFilter===null)workFilter=counts.action?'action':counts.waiting?'waiting':'all';
 $('action-count').textContent=counts.action+'건';
 document.querySelectorAll('[data-filter]').forEach(button=>{const key=button.dataset.filter;button.textContent=({action:'확인 필요',waiting:'대기',paid:'완료',all:'전체'})[key]+' '+counts[key];button.setAttribute('aria-pressed',String(key===workFilter));button.onclick=()=>{workFilter=key;renderWorkFilters()}});
 document.querySelectorAll('[data-stage]').forEach(card=>card.hidden=workFilter!=='all'&&card.dataset.stage!==workFilter);
 $('filter-empty').hidden=!data.buyers.length||counts[workFilter]>0;
}
function action(buyer){if(buyer.changePending)return '<div class="action"><p>운영자 승인 대기</p></div>';if(data.channel.status&&data.channel.status!=='active')return '<div class="action"><p>조회 전용</p></div>';const p=buyer.payment;if(p.status==='paid')return '';if(!buyer.destination)return '';if(p.method==='card'&&!p.cardPaymentUrl&&p.cardNoticeMethod!=='external')return`<div class="action"><p class="action-label">카드결제 안내</p><fieldset class="delivery-modes"><legend class="sr-only">결제 안내 방식</legend><label><input type="radio" name="card-mode-${esc(buyer.id)}" data-card-mode="${esc(buyer.id)}" value="link" checked><span>링크 등록</span></label><label><input type="radio" name="card-mode-${esc(buyer.id)}" data-card-mode="${esc(buyer.id)}" value="external"><span>외부에서 전송</span></label></fieldset><div data-external-info="${esc(buyer.id)}" hidden><p>${esc(buyer.phone)} · ${money(buyer.totals.totalAmount)}</p><p>발송 후 아래 버튼을 눌러 주세요</p></div>${p.cardLinkCancellationRequired?`<label class="review-check"><input type="checkbox" data-cancel-old="${esc(buyer.id)}"> 이전 카드 링크 취소·차단 확인</label>`:''}<div class="url-row"><input data-card-input="${esc(buyer.id)}" inputmode="url" aria-label="카드결제 링크" placeholder="https:// 결제 링크"><button class="btn" data-card-send="${esc(buyer.id)}">링크 보내기</button></div></div>`;if(['bank_transfer_reported','card_payment_reported'].includes(p.status)||p.cardNoticeMethod==='external')return`<div class="action">${p.shippingChangedAfterReport?`<p class="amount-change">배송비 변경 · ${money(p.reportedAmount)} → <strong>${money(p.requestedAmount)}</strong></p><label class="review-check"><input type="checkbox" data-shipping-review="${esc(buyer.id)}"> 변경 금액과 실제 결제금액 일치</label>`:'<p class="action-label">결제 내역 확인 후 완료해 주세요</p>'}<button class="btn confirm" data-confirm="${esc(buyer.id)}">${p.method==='bank_transfer'?'입금 확인 완료':'결제 확인 완료'}</button></div>`;return ''}
function render(){if(!data)return;renderSettings();renderEvents();$('channel').textContent=data.channel.name;$('channel').dataset.testDelivery=String(data.testDeliveryEnabled===true);$('vendor').textContent=data.vendor.name;$('buyer-count').textContent=`${data.summary.buyerCount}명`;$('item-count').textContent=`${data.summary.itemCount}개`;$('open-count').textContent=`${data.summary.openCount}건`;$('empty').hidden=data.buyers.length>0;$('buyers').innerHTML=data.buyers.slice().sort((a,b)=>CreoCheckoutActions.priority(a.payment.status)-CreoCheckoutActions.priority(b.payment.status)).map(buyer=>{const [label,tone]=status(buyer.payment.status),destination=buyer.destination?.address||'수령지 입력 대기';return`<article class="buyer" data-stage="${workStage(buyer)}"><div class="buyer-head"><div class="identity"><b>${esc(buyer.name)}</b>${CreoCheckoutActions.phoneHref(buyer.phone)?`<a class="buyer-phone" aria-label="${esc(buyer.name)}에 전화 문의" href="${esc(CreoCheckoutActions.phoneHref(buyer.phone))}">전화 문의</a>`:'<span>연락처 확인 필요</span>'}</div><span class="badge ${tone}">${label}</span></div><div class="body"><div class="totals"><div class="row total"><span>${buyer.payment.status==='paid'?'결제한 금액':buyer.payment.confirmedAmount?'추가 결제금액':'결제금액'}</span><strong>${money(buyer.payment.status==='paid'?buyer.payment.confirmedAmount:(buyer.payment.shippingChangedAfterReport?buyer.totals.totalAmount:(buyer.payment.confirmationDue??buyer.payment.additionalDue??buyer.totals.totalAmount)))}</strong></div></div>${action(buyer)}<details class="buyer-detail"><summary>수령지·낙찰 ${buyer.items.length}개체</summary><div class="destination"><b>수령 정보</b><span>${esc(destination)}</span></div><div class="items">${buyer.items.map(item=>`<div class="item"><small>${String(item.lotNumber).padStart(2,'0')}</small><b>${esc(item.name)}</b><strong>${money(item.soldAmount)}</strong></div>`).join('')}</div><div class="totals"><div class="row"><span>낙찰금</span><strong>${money(buyer.totals.auctionAmount)}</strong></div><div class="row"><span>배송비</span><strong>${money(buyer.totals.shippingAmount)}</strong></div>${buyer.payment.confirmedAmount?`<div class="row"><span>결제 확인 완료</span><strong>${money(buyer.payment.confirmedAmount)}</strong></div>`:''}</div></details></div></article>`}).join('');document.querySelectorAll('[data-card-mode]').forEach(select=>select.onchange=()=>{const id=CSS.escape(select.dataset.cardMode),external=select.value==='external';document.querySelector(`[data-card-input="${id}"]`).hidden=external;document.querySelector(`[data-external-info="${id}"]`).hidden=!external;document.querySelector(`[data-card-send="${id}"]`).textContent=external?'결제 안내 보냈어요':'링크 보내기'});document.querySelectorAll('[data-card-send]').forEach(button=>button.onclick=()=>sendCard(button.dataset.cardSend));document.querySelectorAll('[data-confirm]').forEach(button=>button.onclick=()=>confirmPayment(button.dataset.confirm));renderWorkFilters();$('loading').hidden=true;$('error').hidden=true;$('app').hidden=false}
async function load(silent=false){if(!client.valid){showError('업체 확인 링크 주소가 올바르지 않습니다.');return false}if(!silent){$('loading').hidden=false;$('app').hidden=true}try{data=await api();render();return true}catch(error){if(!silent)showError(error.message);return false}}function showError(message){$('loading').hidden=true;$('app').hidden=true;$('error').hidden=false;$('error-message').textContent=message}
async function sendCard(buyerId){if(busy)return;const input=document.querySelector(`[data-card-input="${CSS.escape(buyerId)}"]`),cardPaymentUrl=input?.value.trim()||'';const cardNoticeMethod=document.querySelector(`[data-card-mode="${CSS.escape(buyerId)}"]:checked`)?.value||'link';if(cardNoticeMethod!=='external'&&!cardPaymentUrl)return alert('카드결제 주소를 입력해 주세요.');busy=true;try{data=await api('/card-link',{buyerId,cardPaymentUrl,cardNoticeMethod,requestId:uuid(),expectedAmount:data.buyers.find(b=>b.id===buyerId)?.totals.totalAmount,confirmedOldCardLinkCancelled:!!document.querySelector(`[data-cancel-old="${CSS.escape(buyerId)}"]`)?.checked});render();revisionSync.publish('방금 반영','live');if(cardNoticeMethod!=='external')alert(cardLinkFeedback(data.notification))}catch(error){alert(error.message)}finally{busy=false}}
async function confirmPayment(buyerId){if(busy||!confirm('실제 결제 내역을 확인했습니까?'))return;busy=true;try{data=await api('/confirm-payment',{buyerId,requestId:uuid(),shippingAmountReviewed:!!document.querySelector(`[data-shipping-review="${CSS.escape(buyerId)}"]`)?.checked,expectedAmount:data.buyers.find(b=>b.id===buyerId)?.totals.totalAmount});render();revisionSync.publish('방금 반영','live')}catch(error){alert(error.message)}finally{busy=false}}
function hasDraft(){return settingsDirty||[...document.querySelectorAll('[data-card-mode]')].some(select=>select.checked&&select.value==='external')||[...document.querySelectorAll('[data-card-input]')].some(input=>input.value.trim())}
const revisionSync=Checkout.createRevisionSync({document,fetchRevision:async()=>({checkoutRevision:(await api('/revision')).revision}),currentRevision:()=>data?.revision,isReady:()=>!!data,isBusy:()=>busy,hasDraft,refresh:()=>load(true),onStatus:(text,stateName)=>{if($('sync')){$('sync').textContent=text;$('sync').dataset.state=stateName}}});
const poller=Checkout.createAdaptivePoller(revisionSync.poll,{document});window.addEventListener('pagehide',()=>{poller.stop();revisionSync.stop()},{once:true});$('retry').onclick=()=>load();load().finally(()=>poller.start(300));})();</script></body></html>
