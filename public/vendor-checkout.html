<script>(()=>{'use strict';const Checkout=window.CreoCheckoutClient,client=Checkout.createClient({location,endpoint:'/api/platform/vendor-checkout',shortPrefix:'v'}),$=Checkout.byId,esc=Checkout.escapeHtml,money=Checkout.money,phone=Checkout.formatPhone,uuid=Checkout.requestId;let selectedEvent=new URLSearchParams(location.search).get("event")||"";let data=null,busy=false,settingsDirty=false,settingsLoaded=false;
const roundPicker=CreoVendorSettlementPicker.create({client,container:$('app'),change:target=>switchSettlementRound(target),canChange:()=>!busy&&(!hasDraft()||confirm('입력 중인 내용을 버리고 다른 회차로 이동할까요?')),canAutoChange:()=>!busy&&!hasDraft()});
let loadSequence=0,initialEventResolved=false;
function renderEvents(){
 selectedEvent=data.channel.id;
 const select=$('vendor-event');
 select.replaceChildren();
 for(const event of data.events||[data.channel]){const option=document.createElement('option');option.value=event.id;option.textContent=event.name;select.append(option);}
 select.value=data.channel.id;select.parentElement.hidden=true;
}
async function switchSettlementRound(target){
 if(busy)return false;
 const previous=selectedEvent,previousRound=client.getRound();client.setRound(target.key);selectedEvent=target.channelId;settingsDirty=false;settingsLoaded=false;busy=true;
 try{if(!await load()){selectedEvent=previous;client.setRound(previousRound);await load();return false}return true}
 finally{busy=false}
}
function renderSettings(){
 window.CreoVendorNavigation?.updateStatus({bookingSummary:data.bookingSummary,profileRequired:window.CreoVendorNavigation.profileRequired(data.vendor),entriesRequired:data.entrySummary?.entriesOpen===true&&data.entrySummary.entryCount===0});
 if(new URLSearchParams(location.search).get('portal')){$('vendor-settings').hidden=true;return;}
 if(settingsDirty)return;const v=data.vendor;
 const contactFields=$('vendor-contact-fields'),contactKey=JSON.stringify([v.phone,v.inquiryPhone,v.inquiryPhoneMode,v.kakaoUrl]);
 if(contactFields.dataset.profile!==contactKey){contactFields.innerHTML=window.CreoVendorContactForm.markup(v,{prefix:'vendor'});window.CreoVendorContactForm.bind(contactFields.firstElementChild);contactFields.dataset.profile=contactKey;}
 $('vendor-bank').value=v.bankName||'';$('vendor-account').value=v.bankAccount||'';$('vendor-holder').value=v.bankHolder||'';
 ['vendor-bank','vendor-account','vendor-holder'].forEach(id=>$(id).readOnly=!!v.bankRegistered);
 $('vendor-card').checked=v.paymentMethods.includes('card');
 $('bank-guidance').textContent=v.bankRegistered?'계좌 변경은 운영자에게 요청':'최초 등록 후 계좌 변경은 운영자에게 요청';
 if(!settingsLoaded){
  const settings=$('vendor-settings'),main=settings.parentElement;
  settings.open=!v.bankRegistered;
  if(v.bankRegistered)main.insertBefore(settings,main.querySelector('.site-footer'));
  else main.prepend(settings);
  settingsLoaded=true;
 }
}
$('vendor-settings-form').oninput=()=>{settingsDirty=true;$('settings-feedback').textContent=''};
$('vendor-settings-form').onsubmit=async event=>{
 event.preventDefault();if(busy)return;busy=true;$('save-vendor-settings').disabled=true;
 try{data=await api('/settings',{directoryRevision:data.vendor.directoryRevision,...window.CreoVendorContactForm.read($('vendor-contact-fields').firstElementChild),bankName:$('vendor-bank').value,bankAccount:$('vendor-account').value,bankHolder:$('vendor-holder').value,cardEnabled:$('vendor-card').checked});settingsDirty=false;render();$('settings-feedback').textContent='저장 완료'}
 catch(error){$('settings-feedback').textContent=error.message}
 finally{busy=false;$('save-vendor-settings').disabled=false}
};
async function api(path='',body=null){return client.request(body ? path : path+'?event='+encodeURIComponent(selectedEvent),body ? {...body,event:selectedEvent} : null)}
function status(value){const meta=Checkout.paymentStatusMeta(value,'vendor');return[meta.label,meta.tone]}
function cardLinkFeedback(notification){
 if(notification?.status==='link_revoked')return '링크 저장 완료 · 구매자 접속 링크가 중지되어 알림을 보내지 못했어요. 운영자에게 문의해 주세요.';
 if(notification?.status==='delivery_unknown')return '링크 저장 완료 · 알림톡 발송 결과 확인 필요';
 if(notification?.failed||notification?.configured===false)return '링크 저장 완료 · 알림톡 발송 실패. 운영자에게 확인해 주세요.';
 if(notification?.status==='configuration_pending')return '링크 저장 완료 · 알림톡 설정 확인 필요';
 if(notification?.status==='sent')return '링크 저장 · 알림톡 발송 접수 완료';
 return '링크 저장 완료 · 알림톡 발송 대기';
}
let workFilter=null,filterEvent='';
function workStage(buyer){
 return CreoVendorTasks.settlementStage(buyer,data.channel);
}
window.addEventListener('vendor-before-navigation',event=>{if(busy||(hasDraft()&&!confirm('입력 중인 내용을 닫고 다른 메뉴로 이동할까요?')))event.preventDefault();});
function renderShippingSettlement(){
 const settlement=data.shippingSettlement,own=settlement?.vendors.find(v=>v.vendorId===data.vendor.id);
 const visible=!!own&&(!!own.feeItems?.length||!!own.pendingReport||!!own.unassignedReceiptCount||!!own.missingDestinationItems?.length||['totalAmount','receivedAmount','remainingAmount','overpaidAmount','collectedAmount','pendingAmount'].some(k=>Number(own[k])>0));
 if(!settlement||!visible){$('shipping-settlement')?.remove();return;}
 let panel=$('shipping-settlement');if(!panel){panel=document.createElement('section');panel.id='shipping-settlement';panel.className='shipping-settlement';document.querySelector('main').insertBefore(panel,data.vendor.bankRegistered?$('vendor-settings'):document.querySelector('.site-footer'))}
 const row=settlement.vendors.find(v=>v.vendorId===data.vendor.id)||{},bank=settlement.bank||{};
 const pending=row.pendingReport,preparing=row.remittance?.ready===false,ready=!preparing&&!settlement.unassignedReceiptCount&&bank.bankAccount&&settlement.notificationReady,detailsOpen=panel.querySelector('details')?.open;
 const needsReview=preparing||!!(row.overpaidAmount||row.missingDestinationItems?.length||settlement.unassignedReceiptCount||row.unassignedReceiptCount);
 panel.classList.toggle('settlement-complete',!pending&&!row.remainingAmount&&!needsReview);
  const bankMarkup=bank.bankAccount?`<div class="settlement-muted">${esc(bank.bankName)} · ${esc(bank.bankHolder)}</div><div class="settlement-bank">${esc(bank.bankAccount)}</div><button type="button" class="settlement-text" id="copy-organizer-bank">계좌 복사</button>`:'<div class="settlement-muted">주관사 계좌 등록 대기</div>';
  panel.innerHTML=`${settlement.unassignedReceiptCount?'<p role="status">기존 입금의 회차를 주관사에서 확인 중입니다. 확인 전에는 추가 입금하지 마세요.</p>':''}<div class="settlement-pair"><b>주관사 전체 정산</b>${pending?'<i class="settlement-status waiting">확인 대기</i>':row.remainingAmount===0&&row.receivedAmount?'<i class="settlement-status done">정산 완료</i>':''}</div><div class="settlement-muted">${pending?'입금 확인 중':preparing?'정산 준비 중 · 예상 금액':'이번 회차에 보낼 전체 금액'}</div><div class="settlement-amount">${settlement.unassignedReceiptCount?'확인 필요':money(pending?pending.amount:row.remainingAmount)}</div>${pending?'<div class="settlement-muted">주관사 확인을 기다리고 있어요</div>':preparing?`<p class="settlement-muted">${esc(row.remittance.reason)}</p>`:bankMarkup}<button type="button" class="settlement-primary" id="report-organizer-shipping" ${pending||!ready||!row.remainingAmount?'disabled':''}>${pending?'입금 확인 대기':preparing?'전체 정산 준비 중':!ready?'주관사 설정 대기':row.remainingAmount?'전체 금액 입금했어요':'정산할 금액 없음'}</button><div id="shipping-feedback" role="status" class="settlement-muted"></div><details ${detailsOpen?'open':''}><summary class="settlement-muted">${pending?'정산 상세·계좌':'정산 상세'}</summary>${pending?`<div class="settlement-muted">현재 정산 계좌</div>${bankMarkup}<hr class="settlement-divider">`:''}<div class="settlement-pair"><span>전체 배송비</span><b>${money(row.totalAmount)}</b></div><div class="settlement-pair"><span>입금 확인</span><b>${money(row.receivedAmount)}</b></div><div class="settlement-pair"><span>남은 금액</span><b>${money(row.remainingAmount)}</b></div>${row.overpaidAmount?`<div class="settlement-pair"><span>초과 입금</span><b>${money(row.overpaidAmount)}</b></div>`:''}<hr class="settlement-divider"><div class="settlement-pair"><span>배송비 · 구매자 결제 완료</span><span>${money(row.collectedAmount)}</span></div><div class="settlement-pair"><span>배송비 · 구매자 결제 대기</span><span>${money(row.pendingAmount)}</span></div></details>`;
 if(needsReview)panel.querySelector('.settlement-status.done')?.remove();
 if(row.overpaidAmount||row.missingDestinationItems?.length){const notice=document.createElement('p');notice.className='settlement-muted';notice.textContent=row.overpaidAmount?'초과 입금 '+money(row.overpaidAmount)+' · 주관사 확인이 필요해요.':'배송지 입력을 기다리고 있어요. 배송비가 추가될 수 있습니다.';panel.prepend(notice);}
 if(settlement.includesVendorFees){panel.querySelector('.settlement-pair>b').textContent='주관사 전체 정산';const detail=panel.querySelector('details');detail.querySelector('summary').insertAdjacentHTML('afterend',CreoSettlementDetail.fees(row));const total=detail.querySelectorAll('.settlement-pair');for(const node of total){if(node.querySelector('span')?.textContent==='전체 배송비')node.querySelector('span').textContent='전체 정산금';}if(!pending&&ready&&row.remainingAmount)$('report-organizer-shipping').textContent='전체 금액 입금했어요';} const copy=$('copy-organizer-bank');if(copy)copy.onclick=async()=>{try{await navigator.clipboard.writeText(bank.bankAccount);copy.textContent='복사 완료'}catch(_){copy.textContent='위 계좌번호를 복사해 주세요'}};
 $('report-organizer-shipping').onclick=async()=>{if(busy||pending||!ready)return;busy=true;try{if(!await confirmShippingSettlement('이번 회차 전체 금액을 입금하셨나요?',money(row.remainingAmount),'전체 금액 입금했어요'))return;$('report-organizer-shipping').disabled=true;await api('/report-shipping',{requestId:uuid(),expectedAmount:row.remainingAmount,expectedBankUpdatedAt:bank.updatedAt});await load()}catch(e){$('shipping-feedback').textContent=e.message;$('report-organizer-shipping').disabled=false}finally{busy=false}};
}
function renderWorkFilters(){
 if(new URLSearchParams(location.search).get('portal')){
  window.CreoVendorShell?.header(data.vendor.name);$('vendor').textContent='낙찰·정산';
  const contacts=$('vendor-contacts-open');if(contacts.parentElement!==document.querySelector('.top'))document.querySelector('.top').append(contacts);
 }
 document.querySelector('.work-filters').hidden=data.buyers.length===0;
 document.querySelector('.work-title').hidden=data.buyers.length===0;
 $('vendor-contacts-open').hidden=data.buyers.length===0;
 renderShippingSettlement();
 const counts={action:0,waiting:0,paid:0,all:data.buyers.length};
 data.buyers.forEach(b=>counts[workStage(b)]++);
 if(filterEvent!==data.channel.id+':'+(data.round?.key||'')){workFilter=null;filterEvent=data.channel.id+':'+(data.round?.key||'')}
 if(workFilter===null)workFilter=counts.action?'action':counts.waiting?'waiting':'all';
 $('action-count').textContent=counts.action+'건';
 document.querySelectorAll('[data-filter]').forEach(button=>{const key=button.dataset.filter;button.textContent=({action:'처리 필요',waiting:'진행 중',paid:'결제 완료',all:'전체'})[key]+' '+counts[key];button.setAttribute('aria-pressed',String(key===workFilter));button.onclick=()=>{workFilter=key;renderWorkFilters()}});
 document.querySelectorAll('[data-stage]').forEach(card=>card.hidden=workFilter!=='all'&&card.dataset.stage!==workFilter);
 $('filter-empty').hidden=!data.buyers.length||counts[workFilter]>0;
 window.CreoVendorFinance?.update(data,counts);
}
function renderVendorContacts(){
 $('vendor-contacts-event').textContent=data.channel.name;
 $('vendor-contacts-list').innerHTML=(data.vendorContacts||[]).map(v=>{const href=CreoCheckoutActions.phoneHref(v.phone);return `<div class="contact-row"><b>${esc(v.name)}</b>${href?`<a href="${esc(href)}" aria-label="${esc(v.name)}에 전화 ${esc(v.phone)}">${esc(Checkout.formatPhone(v.phone))}</a>`:'<span>연락처 미등록</span>'}</div>`}).join('')||'<p class="contact-empty">다른 참여 업체가 없어요</p>';

$('vendor-contacts-open').onclick=()=>{$('vendor-contacts').showModal()};
$('vendor-contacts-close').onclick=()=>{$('vendor-contacts').close()};
$('vendor-contacts').addEventListener('click',e=>{const r=e.currentTarget.getBoundingClientRect();if(e.target===e.currentTarget&&(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom))e.currentTarget.close()});
function cancellationAction(buyer){
 const p=buyer.payment,method=p.method==='card'?'카드결제':'계좌이체';
 return `<div class="action card-cancellation"><b>${p.methodChangedAt?`결제 방법 변경 · ${method}`:'결제금액 변경'}</b><p>이전 카드 안내를 취소해 주세요</p>${p.retiredCardNoticeMethod==='external'?'<small>외부 결제 앱에서 취소</small>':p.retiredCardPaymentUrl?`<details><summary>이전 카드 링크</summary><span class="retired-card-url">${esc(p.retiredCardPaymentUrl)}</span></details>`:''}<button class="btn" type="button" data-cancel-card="${esc(buyer.id)}">기존 카드 안내 취소 완료</button></div>`;
}
async function confirmCardCancellation(buyerId){
 paymentWork.open('cancel',buyerId,document.activeElement);
}
function action(buyer){
 if(buyer.changePending)return '<div class="action"><p>운영자 승인 대기</p></div>';
 if(data.channel.checkoutOpen!==true&&data.channel.status&&data.channel.status!=='active')return '<div class="action"><p>조회 전용</p></div>';
 const p=buyer.payment;if(p.status==='paid'||!buyer.destination)return '';if(p.cardLinkCancellationRequired)return cancellationAction(buyer);
 if(p.method==='card'&&!p.cardPaymentUrl&&p.cardNoticeMethod!=='external')return `<div class="action"><p class="action-label">구매자가 카드결제 안내를 기다리고 있어요</p><button type="button" class="btn" data-card-send="${esc(buyer.id)}">카드결제 안내 등록</button></div>`;
 const reported=['bank_transfer_reported','card_payment_reported'].includes(p.status)||p.cardNoticeMethod==='external';
 if(p.method==='bank_transfer'||p.method==='card'&&p.cardPaymentUrl||reported)return `<div class="action">${p.shippingChangedAfterReport?`<p class="amount-change">배송비 변경 · ${money(p.reportedAmount)} → <strong>${money(p.requestedAmount)}</strong></p>`:reported?'<p class="action-label">결제 내역을 확인해 주세요</p>':''}<button type="button" class="btn confirm" data-confirm="${esc(buyer.id)}">${p.method==='bank_transfer'?'입금':'결제'} ${reported?'확인':'직접 확인'}</button></div>`;
 return '';
}
function render(){if(!data)return;roundPicker.update(data);renderSettings();renderEvents();renderVendorContacts();$('channel').textContent=data.round?.name||data.channel.name;$('channel').dataset.testDelivery=String(data.testDeliveryEnabled===true);$('vendor').textContent=data.vendor.name;$('buyer-count').textContent=`${data.summary.buyerCount}명`;$('item-count').textContent=`${data.summary.itemCount}개`;$('open-count').textContent=`${data.summary.openCount}건`;$('empty').hidden=data.buyers.length>0;$('buyers').innerHTML=data.buyers.slice().sort((a,b)=>CreoCheckoutActions.priority(a.payment.status)-CreoCheckoutActions.priority(b.payment.status)).map(buyer=>{const [label,tone]=status(buyer.payment.status),destination=buyer.destination?.address||'수령지 입력 대기';return`<article class="buyer" data-stage="${workStage(buyer)}"><div class="buyer-head"><div class="identity"><b>${esc(buyer.name)}</b>${CreoCheckoutActions.phoneHref(buyer.phone)?`<a class="buyer-phone" aria-label="${esc(buyer.name)}에 전화 문의" href="${esc(CreoCheckoutActions.phoneHref(buyer.phone))}">전화 문의</a>`:'<span>연락처 확인 필요</span>'}</div><span class="badge ${tone}">${label}</span></div><div class="body"><div class="totals"><div class="row total"><span>${buyer.payment.status==='paid'?'결제한 금액':buyer.payment.confirmedAmount?'추가 결제금액':'결제금액'}</span><strong>${money(buyer.payment.status==='paid'?buyer.payment.confirmedAmount:(buyer.payment.shippingChangedAfterReport?buyer.totals.totalAmount:(buyer.payment.confirmationDue??buyer.payment.additionalDue??buyer.totals.totalAmount)))}</strong></div></div>${buyer.payment.methodChangedAt&&!buyer.payment.cardLinkCancellationRequired&&buyer.payment.status!=='paid'?`<p class="method-change-note">결제 방법 변경 · ${buyer.payment.method==='card'?'카드결제':'계좌이체'}</p>`:''}${action(buyer)}${CreoVendorCardReset.button(buyer,data.channel)}${CreoVendorShipping.summary(buyer,data.channel)}<details class="buyer-detail"><summary>낙찰 내역 <span>${buyer.items.length}개체</span></summary><div class="items" data-buyer-items="${esc(buyer.id)}"></div><div class="totals"><div class="row"><span>낙찰금</span><strong>${money(buyer.totals.auctionAmount)}</strong></div><div class="row"><span>배송비</span><strong>${money(buyer.totals.shippingAmount+(buyer.totals.shippingSupportAmount||0))}</strong></div>${buyer.totals.shippingSupportAmount?`<div class="row"><span>전크자 배송비 지원</span><strong>−${money(buyer.totals.shippingSupportAmount)}</strong></div>`:''}${buyer.payment.confirmedAmount?`<div class="row"><span>결제 확인 완료</span><strong>${money(buyer.payment.confirmedAmount)}</strong></div>`:''}</div></details></div></article>`}).join('');document.querySelectorAll('[data-card-mode]').forEach(select=>select.onchange=()=>{const id=CSS.escape(select.dataset.cardMode),external=select.value==='external';document.querySelector(`[data-card-input="${id}"]`).hidden=external;document.querySelector(`[data-external-info="${id}"]`).hidden=!external;document.querySelector(`[data-card-send="${id}"]`).textContent=external?'결제 안내 보냈어요':'링크 보내기'});document.querySelectorAll('[data-card-send]').forEach(button=>button.onclick=()=>sendCard(button.dataset.cardSend));document.querySelectorAll('[data-cancel-card]').forEach(button=>button.onclick=()=>confirmCardCancellation(button.dataset.cancelCard));document.querySelectorAll('[data-confirm]').forEach(button=>button.onclick=()=>confirmPayment(button.dataset.confirm));document.querySelectorAll('[data-reset-card]').forEach(button=>button.onclick=()=>resetCardGuide(button.dataset.resetCard));document.querySelectorAll('[data-edit-shipping]').forEach(button=>button.onclick=()=>editVendorShipping(button.dataset.editShipping));CreoVendorItemView.render($('buyers'),data.buyers);renderWorkFilters();$('loading').hidden=true;$('error').hidden=true;$('app').hidden=false}
async function load(silent=false){const seq=++loadSequence;if(!client.valid){showError('업체 확인 링크 주소가 올바르지 않습니다.');return false}if(!silent){$('loading').hidden=false;$('app').hidden=true}try{let next=await api();if(seq!==loadSequence)return false;if(!initialEventResolved){const target=CreoVendorEvents.initialTarget(next,location.search);if(target){const previous=selectedEvent;selectedEvent=target;try{next=await api();}catch(error){selectedEvent=previous;throw error;}if(seq!==loadSequence)return false;}initialEventResolved=true;}data=next;render();return true}catch(error){if(seq!==loadSequence)return false;if(!silent)showError(error.message,error.status);return false}}function showError(message,status=0){$('loading').hidden=true;$('app').hidden=true;$('error').hidden=false;$('error-message').textContent=message;CreoCheckoutRounds.showRecovery($('error-round-recovery'),status)}
const pendingShippingEdits=new Map();
async function editVendorShipping(buyerId){
 if(busy)return;busy=true;
 try{
  const editor=await client.request('/shipping-editor?event='+encodeURIComponent(selectedEvent)+'&buyerId='+encodeURIComponent(buyerId));
  const saved=await CreoVendorShipping.open(editor,async body=>{
   const fingerprint=JSON.stringify([selectedEvent,buyerId,body]),pending=pendingShippingEdits.get(buyerId);
   const request=pending?.fingerprint===fingerprint?pending:{fingerprint,body:{...body,buyerId,requestId:uuid()}};
   pendingShippingEdits.set(buyerId,request);
   try{data=await api('/shipping-editor',request.body);pendingShippingEdits.delete(buyerId);paymentWork.clear(buyerId)}
   catch(error){if(error.status&&error.status<500)pendingShippingEdits.delete(buyerId);throw error}
  });
  if(saved){render();revisionSync.publish('수령 정보 저장 완료','live');document.querySelector(`[data-edit-shipping="${CSS.escape(buyerId)}"]`)?.focus()}
 }catch(error){alert(error.message)}finally{busy=false}
}
const pendingCardResets=new Map();
async function resetCardGuide(buyerId){
 if(busy)return;
 const buyer=data.buyers.find(row=>row.id===buyerId);
 if(!buyer?.payment.canResetCardGuide)return;
 busy=true;
 try{
  if(!await CreoVendorCardReset.confirm(buyer))return;
  const body={buyerId,expectedVersion:buyer.payment.editVersion,expectedAmount:buyer.totals.totalAmount,confirmedOldCardLinkCancelled:true,confirmedUnpaid:true};
  const fingerprint=JSON.stringify([selectedEvent,body]),pending=pendingCardResets.get(buyerId);
  const request=pending?.fingerprint===fingerprint?pending:{fingerprint,body:{...body,requestId:uuid()}};
  pendingCardResets.set(buyerId,request);
  data=await api('/reset-card-guide',request.body);
  pendingCardResets.delete(buyerId);paymentWork.clear(buyerId);workFilter='action';render();
  revisionSync.publish('카드 안내 등록 대기','live');
  document.querySelector(`[data-card-send="${CSS.escape(buyerId)}"]`)?.focus();
 }catch(error){if(error.status&&error.status<500)pendingCardResets.delete(buyerId);alert(error.message)}
 finally{busy=false}
}

 paymentWork.open('card',buyerId,document.activeElement);
}

}
const paymentWork=CreoVendorPaymentWork.create({document,getData:()=>data,isBusy:()=>busy,setBusy:value=>{busy=value},request:api,requestId:uuid,apply:next=>{data=next},refresh:()=>load(true),onFinish:(next,buyerId,mode)=>{
 const buyer=next.buyers.find(b=>b.id===buyerId);workFilter=buyer?workStage(buyer):'all';render();revisionSync.publish('방금 반영','live');
 const anchor=document.querySelector(`[data-buyer-items="${CSS.escape(buyerId)}"]`)?.closest('article'),notice=document.createElement('p');notice.className='vendor-payment-notice';notice.setAttribute('role','status');notice.tabIndex=-1;
 notice.textContent=mode==='confirm'?CreoCheckoutActions.paymentConfirmationFeedback(next.notification).text:mode==='cancel'?'이전 카드 안내의 취소 확인을 기록했어요.':buyer?.payment.cardNoticeMethod==='external'?'외부 결제 앱에서 안내한 것으로 기록했어요.':cardLinkFeedback(next.notification);
 (anchor?.querySelector('.body')||$('buyers')).prepend(notice);notice.focus();
}});

const revisionSync=Checkout.createRevisionSync({document,fetchRevision:async()=>({checkoutRevision:(await api('/revision')).revision}),currentRevision:()=>data?.revision,isReady:()=>!!data,isBusy:()=>busy,hasDraft,refresh:()=>load(true),onStatus:(text,stateName)=>{if($('sync')){$('sync').textContent=text;$('sync').dataset.state=stateName}}});
