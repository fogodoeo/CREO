<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>업체 낙찰·결제 확인</title>
<link rel="stylesheet" href="/checkout-ui.css?v=20260902-checkout-shell-v1"><script src="/checkout-client.js?v=20260903-revision-sync-v1"></script>
<style>
:root{--checkout-width:760px;--item-index-width:40px;--item-font-size:12px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:17px}.metric{padding:12px;border-radius:10px;background:var(--soft)}.metric small{display:block;color:var(--muted);font-size:10px}.metric b{display:block;margin-top:4px;font-size:18px}main{padding:20px 20px 60px}.buyer{margin-bottom:12px;border:1px solid var(--line);border-radius:14px;overflow:hidden}.buyer-head{display:flex;justify-content:space-between;gap:12px;padding:14px 15px;background:#fafafa;border-bottom:1px solid var(--line)}.identity b{font-size:15px}.identity span{display:block;margin-top:3px;color:var(--muted);font-size:11px}.body{padding:14px}.destination{padding:11px 12px;border-radius:9px;background:var(--soft);font-size:12px}.destination b{display:block}.destination span{display:block;margin-top:3px;color:var(--muted)}.items{margin-top:12px}.item{gap:8px;padding:9px 1px}.totals{margin-top:11px}.row{padding:5px 1px}.row.total{margin-top:4px;padding-top:10px;border-top:1px solid var(--line);font-size:15px}.row.total span{color:var(--ink);font-weight:850}.action{margin-top:13px;padding:13px;border-radius:10px;background:#f7f5ef}.action p{margin:0;color:#625e55;font-size:11px;line-height:1.5}.url-row{display:flex;gap:7px;margin-top:9px}.url-row input{min-width:0;flex:1;height:41px;padding:0 11px;border:1px solid #d8d5cd;border-radius:8px;background:#fff;outline:0}.btn{height:41px;padding:0 14px;border:0;border-radius:8px;background:#202225;color:#fff;font-size:12px;font-weight:850;cursor:pointer}.btn:disabled{background:#c7c9cc}.confirm{width:100%;margin-top:9px}.error button{margin-top:15px}@media(max-width:420px){.body{padding:12px}.summary{gap:5px}.metric{padding:10px}}
</style></head><body><div class="shell"><div class="loading" id="loading"><b>결제 내역을 불러오고 있습니다</b><span>잠시만 기다려 주세요.</span></div><div class="error" id="error" hidden><b>페이지를 열 수 없습니다</b><span id="error-message"></span><button class="btn" id="retry">다시 시도</button></div><div id="app" hidden><header class="top"><div class="brand"><b>CREO PARTNER</b><div class="brand-right"><span id="channel"></span><i class="sync" id="sync" role="status">실시간</i></div></div><h1 id="vendor"></h1><p class="lead">구매자의 결제 요청을 확인하고 업체별로 완료 처리합니다.</p><div class="summary"><div class="metric"><small>구매자</small><b id="buyer-count"></b></div><div class="metric"><small>낙찰 개체</small><b id="item-count"></b></div><div class="metric"><small>확인 필요</small><b id="open-count"></b></div></div></header><main><div id="buyers"></div><div class="empty" id="empty" hidden><b>낙찰 내역이 없습니다</b><span>새 낙찰이 등록되면 이 페이지에 표시됩니다.</span></div></main></div></div>
<script>(()=>{'use strict';const Checkout=window.CreoCheckoutClient,client=Checkout.createClient({location,endpoint:'/api/platform/vendor-checkout',shortPrefix:'v'}),$=Checkout.byId,esc=Checkout.escapeHtml,money=Checkout.money,uuid=Checkout.requestId;let data=null,busy=false;
async function api(path='',body=null){return client.request(path,body)}
function status(value){if(value==='paid')return['결제 완료','green'];if(['bank_transfer_reported','card_payment_reported'].includes(value))return['확인 요청','red'];if(value==='additional_payment')return['추가 결제','red'];if(value==='card_link_pending')return['카드 링크 필요','red'];if(value==='card_payment_pending')return['카드 결제 대기',''];if(value==='bank_transfer_pending')return['입금 대기',''];return['정보 입력 대기','']}
function action(buyer){const p=buyer.payment;if(p.status==='paid')return'<div class="action"><p>결제 확인이 완료되었습니다.</p></div>';if(!buyer.destination)return'<div class="action"><p>구매자가 배송지와 결제방식을 입력하기 전입니다.</p></div>';if(p.method==='card'&&!p.cardPaymentUrl)return`<div class="action"><p>카드결제 URL을 등록하면 구매자에게 카카오 알림이 전송됩니다.</p><div class="url-row"><input data-card-input="${esc(buyer.id)}" inputmode="url" placeholder="https:// 결제 주소"><button class="btn" data-card-send="${esc(buyer.id)}">링크 전송</button></div></div>`;if(['bank_transfer_reported','card_payment_reported'].includes(p.status))return`<div class="action"><p>구매자가 결제를 완료했다고 알려왔습니다. 실제 입금·승인 내역을 확인한 뒤 완료해 주세요.</p><button class="btn confirm" data-confirm="${esc(buyer.id)}">결제 확인 완료</button></div>`;return`<div class="action"><p>${p.method==='card'?'카드결제 링크를 전송했습니다. 구매자 결제 완료 안내를 기다리고 있습니다.':'구매자의 입금 완료 안내를 기다리고 있습니다.'}</p></div>`}
function render(){if(!data)return;$('channel').textContent=data.channel.name;$('vendor').textContent=data.vendor.name;$('buyer-count').textContent=`${data.summary.buyerCount}명`;$('item-count').textContent=`${data.summary.itemCount}개`;$('open-count').textContent=`${data.summary.openCount}건`;$('empty').hidden=data.buyers.length>0;$('buyers').innerHTML=data.buyers.map(buyer=>{const [label,tone]=status(buyer.payment.status),destination=buyer.destination?.address||'배송·결제 정보 입력 대기';return`<article class="buyer"><div class="buyer-head"><div class="identity"><b>${esc(buyer.name)}</b><span>${esc(buyer.phone)}</span></div><span class="badge ${tone}">${label}</span></div><div class="body"><div class="destination"><b>수령 정보</b><span>${esc(destination)}</span></div><div class="items">${buyer.items.map(item=>`<div class="item"><small>${String(item.lotNumber).padStart(2,'0')}</small><b>${esc(item.name)}</b><strong>${money(item.soldAmount)}</strong></div>`).join('')}</div><div class="totals"><div class="row"><span>낙찰금</span><strong>${money(buyer.totals.auctionAmount)}</strong></div><div class="row"><span>배송비</span><strong>${money(buyer.totals.shippingAmount)}</strong></div>${buyer.payment.confirmedAmount?`<div class="row"><span>결제 확인 완료</span><strong>${money(buyer.payment.confirmedAmount)}</strong></div>`:''}<div class="row total"><span>${buyer.payment.confirmedAmount?'추가 확인 금액':'확인 금액'}</span><strong>${money(buyer.payment.additionalDue||buyer.totals.totalAmount)}</strong></div></div>${action(buyer)}</div></article>`}).join('');document.querySelectorAll('[data-card-send]').forEach(button=>button.onclick=()=>sendCard(button.dataset.cardSend));document.querySelectorAll('[data-confirm]').forEach(button=>button.onclick=()=>confirmPayment(button.dataset.confirm));$('loading').hidden=true;$('error').hidden=true;$('app').hidden=false}
async function load(silent=false){if(!client.valid){showError('업체 확인 링크 주소가 올바르지 않습니다.');return false}if(!silent){$('loading').hidden=false;$('app').hidden=true}try{data=await api();render();return true}catch(error){if(!silent)showError(error.message);return false}}function showError(message){$('loading').hidden=true;$('app').hidden=true;$('error').hidden=false;$('error-message').textContent=message}
async function sendCard(buyerId){if(busy)return;const input=document.querySelector(`[data-card-input="${CSS.escape(buyerId)}"]`),cardPaymentUrl=input?.value.trim()||'';if(!cardPaymentUrl)return alert('카드결제 주소를 입력해 주세요.');busy=true;try{data=await api('/card-link',{buyerId,cardPaymentUrl,requestId:uuid()});render();revisionSync.publish('방금 반영','live');alert('카드결제 링크를 등록했습니다.')}catch(error){alert(error.message)}finally{busy=false}}
async function confirmPayment(buyerId){if(busy||!confirm('실제 결제 내역을 확인했습니까?'))return;busy=true;try{data=await api('/confirm-payment',{buyerId,requestId:uuid()});render();revisionSync.publish('방금 반영','live')}catch(error){alert(error.message)}finally{busy=false}}
function hasDraft(){return [...document.querySelectorAll('[data-card-input]')].some(input=>input.value.trim())}
const revisionSync=Checkout.createRevisionSync({document,fetchRevision:()=>client.revision(data.channel.id),currentRevision:()=>data?.revision,isReady:()=>!!data,isBusy:()=>busy,hasDraft,refresh:()=>load(true),onStatus:(text,stateName)=>{if($('sync')){$('sync').textContent=text;$('sync').dataset.state=stateName}}});
const poller=Checkout.createAdaptivePoller(revisionSync.poll,{document});window.addEventListener('pagehide',()=>{poller.stop();revisionSync.stop()},{once:true});$('retry').onclick=()=>load();load().finally(()=>poller.start(300));})();</script></body></html>
