<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>배송·결제 테스트 연습</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#20232a;font:17px/1.6 system-ui,sans-serif}main{max-width:660px;margin:auto;padding:24px 18px}article{background:white;border:1px solid #ddd;border-radius:16px;padding:22px;margin:16px 0}h1{font-size:26px}h2{font-size:21px}button,select{font:inherit;min-height:48px;padding:10px 16px;border-radius:9px;border:1px solid #bbb;background:white;cursor:pointer}button.primary{background:#234cc7;color:white;border:0;width:100%}button[aria-pressed=true]{background:#20232a;color:white}label,select{display:block;width:100%;margin:10px 0}.warning{padding:14px;background:#fff0c2;border-radius:10px;font-weight:700}.amount{font-size:32px;font-weight:800}.muted{color:#58606e}nav{display:flex;gap:8px}nav button{flex:1}#message{white-space:pre-line}button:focus-visible,select:focus-visible{outline:3px solid #577ef5}</style><script src="/checkout-practice.js"></script></head><body><main>
<div class="warning">테스트 전용 · 실제 입금 금지</div><h1>배송·결제 연습</h1><p>가상 개체 1개로 연습합니다. 실제 낙찰·정산·문자에는 반영되지 않습니다. 다른 휴대폰과는 동기화되지 않습니다.</p>
<nav aria-label="연습 역할"><button id="buyer" aria-pressed="true">① 구매자 화면</button><button id="vendor" aria-pressed="false">② 업체 화면</button></nav>
<article><b id="name"></b><h2>TEST-01 · 테스트 구매자</h2><div class="amount">100,000원</div><p class="muted">연습용 금액입니다. 실제 계좌·연락처는 사용하지 않습니다.</p><strong id="status" role="status"></strong></article>
<article id="action"></article><p id="message" role="status"></p><button id="reset">처음부터 다시 연습</button>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),name=new URLSearchParams(location.search).get('vendor')||'테스트 업체';$('name').textContent=name;let state=CheckoutPractice.initial(),role='buyer';const key='creo:checkout-practice:v1:'+name;
try{const saved=JSON.parse(sessionStorage.getItem(key));if(saved&&['new','link_pending','ready','reported','paid'].includes(saved.stage)&&['bank','card'].includes(saved.method)&&['','pickup','delivery'].includes(saved.destination))state=saved}catch{}
function change(action,value){state=CheckoutPractice.transition(state,action,value);try{sessionStorage.setItem(key,JSON.stringify(state))}catch{}render()}
function render(){ $('buyer').setAttribute('aria-pressed',role==='buyer');$('vendor').setAttribute('aria-pressed',role==='vendor');$('status').textContent=({new:'배송·결제방법 입력 대기',link_pending:'업체의 카드결제 링크 등록 대기',ready:'구매자 결제 대기',reported:'업체 확인 대기',paid:'결제 확인 완료 (테스트)'})[state.stage];$('message').textContent='';const host=$('action');host.replaceChildren();const p=document.createElement('p');host.append(p);const button=(text,action)=>{const b=document.createElement('button');b.className='primary';b.textContent=text;b.onclick=action;host.append(b)};
if(role==='buyer'&&state.stage==='new'){p.textContent='수령방법과 결제방법을 선택해 주세요.';host.insertAdjacentHTML('beforeend','<label>수령방법<select id="destination"><option value="">선택해 주세요</option><option value="pickup">직접 수령 (연습)</option><option value="delivery">배송 (연습·배송비 0원)</option></select></label><label>결제방법<select id="method"><option value="bank">계좌이체</option><option value="card">카드결제</option></select></label>');button('선택내용 저장',()=>{if(!$('destination').value){$('message').textContent='수령방법을 선택해 주세요.';return}change('save',{destination:$('destination').value,method:$('method').value})})}
else if(role==='buyer'&&state.stage==='ready'){p.textContent=state.method==='bank'?'실제 화면에서는 업체 계좌가 안내됩니다. 여기서는 송금하지 않고 아래 버튼만 눌러 주세요.':'업체가 테스트 결제 링크를 준비했습니다. 실제 카드결제 없이 완료 신고를 연습합니다.';button('입금·결제했다고 신고 (테스트)',()=>change('report'))}
else if(role==='vendor'&&state.stage==='link_pending'){p.textContent='구매자가 카드결제를 요청했습니다. 실제 링크 대신 등록 과정을 연습합니다.';button('테스트 결제 링크 등록',()=>change('link'))}
else if(role==='vendor'&&state.stage==='reported'){p.textContent='구매자가 결제했다고 신고했습니다. 실제 운영에서는 입금·카드 승인 내역을 확인한 뒤 완료 처리하세요.';button('결제 확인 완료 (테스트)',()=>change('confirm'))}
else{p.textContent=state.stage==='paid'?'연습이 끝났습니다. 구매자·업체 모두 완료 상태를 확인할 수 있습니다.':role==='vendor'?'구매자 화면에서 입력·결제 신고를 먼저 진행해 주세요.':'업체 화면으로 바꿔 다음 단계를 진행해 주세요.'}
}
$('buyer').onclick=()=>{role='buyer';render()};$('vendor').onclick=()=>{role='vendor';render()};$('reset').onclick=()=>{if(confirm('이 브라우저의 연습 내역만 초기화할까요?')){role='buyer';change('reset')}};render();})();
</script></main></body></html>
