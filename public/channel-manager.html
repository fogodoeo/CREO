<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>채널 관리 · CREO</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <script src="platform-client.js?v=20260803-admin-session-v2"></script>
    <style>
        :root{color-scheme:dark;--bg:#0a0c10;--panel:#12161d;--panel2:#181d26;--line:#29303b;--text:#f5f7fa;--muted:#9099a7;--gold:#d7b66d;--blue:#668bff;--danger:#ef6c6c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard Variable,Pretendard,sans-serif;letter-spacing:-.018em}button,input,select,textarea{font:inherit}.shell{display:grid;grid-template-columns:310px minmax(0,1fr);min-height:100vh}.rail{position:sticky;top:0;height:100vh;padding:24px;border-right:1px solid var(--line);background:#0d1015}.brand{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none;font-weight:850;letter-spacing:.12em}.mark{display:grid;place-items:center;width:34px;height:34px;border:1px solid #4a402c;border-radius:10px;color:var(--gold);font-family:Georgia,serif;font-size:21px}.rail-head{display:flex;align-items:center;justify-content:space-between;margin:34px 0 12px}.rail-head h2{margin:0;font-size:13px}.new-btn{width:32px;height:32px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);color:var(--text);font-size:20px;cursor:pointer}.channel-list{display:grid;gap:7px}.channel-row{display:flex;width:100%;align-items:center;gap:10px;padding:12px;border:1px solid transparent;border-radius:12px;background:transparent;color:var(--muted);text-align:left;cursor:pointer}.channel-row:hover,.channel-row.active{border-color:var(--line);background:var(--panel);color:var(--text)}.swatch{width:10px;height:34px;border-radius:7px;background:var(--swatch)}.channel-row b{display:block;font-size:13px}.channel-row small{display:block;margin-top:3px;color:#6f7886;font-size:10px}.rail-foot{position:absolute;right:24px;bottom:22px;left:24px}.rail-foot a{color:var(--muted);font-size:12px;text-decoration:none}
        .main{padding:42px clamp(28px,5vw,74px) 80px}.main-head{display:flex;align-items:end;justify-content:space-between;gap:20px;max-width:920px}.eyebrow{color:var(--gold);font-size:11px;font-weight:850;letter-spacing:.12em}.main h1{margin:8px 0 0;font-size:clamp(30px,4vw,47px);letter-spacing:-.05em}.main-head p{margin:10px 0 0;color:var(--muted);line-height:1.6}.setup-summary{display:flex;flex-wrap:wrap;gap:7px;max-width:920px;margin-top:18px}.setup-chip{padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:#10141a;color:#8f99a7;font-size:10px;font-weight:800}.setup-chip.on{border-color:#665733;background:#1d1911;color:#e0bd72}.actions{display:flex;gap:8px}.btn{min-height:42px;padding:0 16px;border:1px solid var(--line);border-radius:11px;background:var(--panel2);color:var(--text);font-weight:760;cursor:pointer}.btn.primary{border-color:transparent;background:var(--gold);color:#181209}.btn.danger{color:#ff9a9a}.btn:disabled{opacity:.45;cursor:not-allowed}.form{display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:920px;margin-top:18px}.card{padding:24px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}.card[hidden]{display:none}.card.full{grid-column:1/-1}.card h2{margin:0 0 18px;font-size:16px}.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}.card-head h2{margin:0}.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field.full{grid-column:1/-1}.field label{display:block;margin:0 0 7px;color:#aab2bd;font-size:11px;font-weight:750}.field input,.field select,.field textarea{width:100%;min-height:44px;padding:10px 12px;border:1px solid #323a46;border-radius:10px;outline:none;background:#0c1015;color:var(--text)}.field textarea{min-height:86px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(102,139,255,.12)}.color-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.color-field input{height:48px;padding:4px}.checks{display:flex;flex-wrap:wrap;gap:8px}.check{display:flex;align-items:center;gap:8px;padding:11px 13px;border:1px solid var(--line);border-radius:10px;color:#c1c8d2;font-size:12px}.check input{accent-color:var(--gold)}.builder-list{display:grid;gap:8px}.builder-row{display:grid;grid-template-columns:1.25fr .8fr .8fr .55fr .62fr 38px;gap:7px}.builder-row.group{grid-template-columns:.7fr 1fr .55fr 1.2fr 38px}.builder-row input,.builder-row select{width:100%;height:40px;padding:0 9px;border:1px solid #323a46;border-radius:8px;background:#0c1015;color:var(--text)}.builder-remove{border:1px solid #493035;border-radius:8px;background:#211418;color:#ff9898;cursor:pointer}.mini-btn{height:34px;padding:0 11px;border:1px solid #3a4350;border-radius:8px;background:#1b212a;color:#d6dbe2;font-size:11px;font-weight:800;cursor:pointer}.hint{margin:9px 0 0;color:#747e8b;font-size:11px;line-height:1.55}.preview{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:128px;padding:24px;border-radius:15px;background:linear-gradient(135deg,var(--preview-primary),var(--preview-bg) 68%);color:var(--preview-text);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}.preview b{display:block;font-size:26px}.preview small{color:color-mix(in srgb,var(--preview-text) 68%,transparent)}.preview .seal{display:grid;place-items:center;width:64px;height:64px;border:2px solid var(--preview-secondary);border-radius:50%;color:var(--preview-secondary);font-family:Georgia,serif;font-size:28px}.notice{max-width:920px;margin-top:16px;color:var(--muted);font-size:12px}.toast{position:fixed;right:24px;bottom:24px;z-index:20;max-width:360px;padding:14px 17px;border:1px solid #3b4553;border-radius:12px;background:#1b222c;box-shadow:0 18px 50px #0008;opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:none}.login{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:rgba(5,7,10,.84);backdrop-filter:blur(14px)}.login[hidden]{display:none}.login-card{width:min(420px,100%);padding:28px;border:1px solid var(--line);border-radius:20px;background:var(--panel)}.login-card h2{margin:0}.login-card p{color:var(--muted);font-size:13px;line-height:1.6}.login-card form{display:flex;gap:8px;margin-top:20px}.login-card input{flex:1;min-width:0;height:46px;padding:0 13px;border:1px solid #343c49;border-radius:10px;background:#0b0e13;color:var(--text)}
        @media(max-width:820px){.shell{display:block}.rail{position:relative;height:auto;padding:16px;border-right:0;border-bottom:1px solid var(--line)}.rail-head{margin-top:18px}.channel-list{display:flex;overflow:auto;scrollbar-width:none;scroll-snap-type:x proximity}.channel-list::-webkit-scrollbar{display:none}.channel-row{min-width:180px;scroll-snap-align:start}.rail-foot{display:none}.main{padding:30px 16px 104px}.main-head{align-items:start}.form{grid-template-columns:1fr}.card.full{grid-column:auto}.fields{grid-template-columns:1fr}.field.full{grid-column:auto}.color-grid{grid-template-columns:1fr 1fr}.preview{align-items:start}.actions{position:fixed;right:12px;bottom:max(12px,env(safe-area-inset-bottom));left:12px;z-index:10;padding:8px;border:1px solid var(--line);border-radius:14px;background:rgba(15,18,24,.9);backdrop-filter:blur(14px)}.actions .btn{flex:1}}
    </style>
</head>
<body>
<div class="shell">
    <aside class="rail">
        <a class="brand" href="/"><span class="mark">C</span> CREO</a>
        <div class="rail-head"><h2>채널</h2><button class="new-btn" id="new-channel" aria-label="새 채널">＋</button></div>
        <div class="channel-list" id="channel-list"></div>
        <div class="rail-foot"><a href="/">← 운영 화면</a></div>
    </aside>
    <main class="main">
        <header class="main-head"><div><span class="eyebrow">CHANNEL</span><h1 id="page-title">채널 설정</h1></div><div class="actions"><button class="btn danger" id="remove" type="button">삭제</button><button class="btn" id="duplicate" type="button">복제</button><button class="btn primary" id="save" type="button">저장</button></div></header>
        <div class="setup-summary" id="setup-summary" aria-label="채널 구성 요약"></div>
        <form class="form" id="channel-form" autocomplete="off">
            <section class="card"><h2>기본 정보</h2><div class="fields">
                <div class="field"><label for="channel-id">채널 ID</label><input id="channel-id" maxlength="32" placeholder="new-auction" required></div>
                <div class="field"><label for="channel-status">운영 상태</label><select id="channel-status"><option value="draft">준비 중</option><option value="active">운영 중</option><option value="paused">일시정지</option><option value="archived">보관됨</option></select></div>
                <div class="field"><label for="channel-name">채널 이름</label><input id="channel-name" maxlength="48" required></div>
                <div class="field"><label for="channel-short">방송용 짧은 이름</label><input id="channel-short" maxlength="24"></div>
                <div class="field full"><label for="channel-description">설명</label><textarea id="channel-description" maxlength="140"></textarea></div>
                <div class="field full"><label for="channel-logo">방송 로고 URL</label><input id="channel-logo" maxlength="600" placeholder="https://... 또는 /assets/..."></div>
            </div></section>
            <section class="card"><h2>운영 방식</h2><div class="fields">
                <div class="field full"><label for="channel-template">시작 템플릿</label><select id="channel-template"><option value="standard">일반 경매</option><option value="team">업체·팀 대항전</option><option value="community">커뮤니티 그룹전</option><option value="minimal">최소 운영</option></select></div>
                <input id="broadcast-template" type="hidden" value="classic">
                <div class="field full"><label>사용 기능</label><div class="checks"><label class="check"><input type="checkbox" id="feature-vendors"> 업체</label><label class="check"><input type="checkbox" id="feature-auction"> 경매 진행</label><label class="check"><input type="checkbox" id="feature-shipping"> 배송</label><label class="check"><input type="checkbox" id="feature-broadcast"> 방송</label><label class="check"><input type="checkbox" id="feature-groups"> 그룹</label><label class="check"><input type="checkbox" id="feature-scoreboards"> 집계판</label><label class="check"><input type="checkbox" id="feature-quiz"> 퀴즈</label><label class="check"><input type="checkbox" id="feature-sponsors"> 배너·협찬</label><label class="check"><input type="checkbox" id="feature-tournament"> 대진표</label><label class="check"><input type="checkbox" id="feature-survey"> 설문</label></div></div>
            </div></section>
            <section class="card full"><h2>화면 용어</h2><div class="fields"><div class="field"><label for="term-item">경매 대상</label><input id="term-item" placeholder="개체"></div><div class="field"><label for="term-vendor">출품 주체</label><input id="term-vendor" placeholder="업체"></div><div class="field"><label for="term-group">집계 그룹</label><input id="term-group" placeholder="팀·기숙사·조"></div><div class="field"><label for="term-round">운영 단위</label><input id="term-round" placeholder="회차"></div><div class="field"><label for="term-scoreboard">집계 화면</label><input id="term-scoreboard" placeholder="점수판"></div></div><p class="hint">내부 데이터 구조는 그대로 두고 메뉴·등록 화면·방송에서 보이는 명칭만 채널에 맞게 바뀝니다.</p></section>
            <section class="card full" id="groups-card"><div class="card-head"><h2>집계 그룹</h2><button class="mini-btn" id="add-group" type="button">＋ 그룹</button></div><div class="builder-list" id="group-list"></div><p class="hint">업체와 그룹은 별개입니다. 여러 업체를 한 그룹으로 묶거나 개체·낙찰자를 직접 그룹에 배정할 수 있습니다.</p></section>
            <section class="card full" id="boards-card"><div class="card-head"><h2>집계판</h2><button class="mini-btn" id="add-board" type="button">＋ 집계판</button></div><div class="builder-list" id="board-list"></div><p class="hint">업체·그룹·카테고리·낙찰자를 기준으로 금액·건수·점수를 각각 집계할 수 있습니다.</p></section>
            <section class="card" id="broadcast-card"><h2>방송 조립</h2><div class="fields"><div class="field full"><label for="overlay-skin">디자인 스킨</label><select id="overlay-skin"><option value="clean">클린</option><option value="sport">스포츠 중계</option><option value="heritage">문장·헤리티지</option><option value="minimal">미니멀</option></select></div><div class="field full"><label for="overlay-layout">기본 배치</label><select id="overlay-layout"><option value="left">좌측 정보형</option><option value="right">우측 정보형</option><option value="balanced">양쪽 균형형</option></select></div></div></section>
            <section class="card full" id="theme-card"><h2>방송 디자인</h2><div class="color-grid">
                <div class="field color-field"><label for="theme-primary">주 색상</label><input type="color" id="theme-primary"></div>
                <div class="field color-field"><label for="theme-secondary">강조 색상</label><input type="color" id="theme-secondary"></div>
                <div class="field color-field"><label for="theme-background">배경</label><input type="color" id="theme-background"></div>
                <div class="field color-field"><label for="theme-surface">패널</label><input type="color" id="theme-surface"></div>
                <div class="field color-field"><label for="theme-text">글자</label><input type="color" id="theme-text"></div>
            </div><div class="preview" id="theme-preview"><div><small>LIVE AUCTION</small><b id="preview-name">새 경매</b></div><div class="seal">C</div></div></section>
        </form>
    </main>
</div>
<div class="login" id="login"><div class="login-card"><h2>운영자 확인</h2><p>관리자 비밀번호</p><form id="login-form"><input type="password" id="admin-password" autocomplete="current-password" placeholder="관리자 비밀번호" required><button class="btn primary">확인</button></form></div></div>
<div class="toast" id="toast" role="status"></div>
<script>
const $ = id => document.getElementById(id);
let catalog = { version: 0, channels: [] };
let selectedId = '';
let isNew = false;
let dirty = false;
let builderGroups = [];
let builderBoards = [];

function toast(message){const el=$('toast');el.textContent=message;el.classList.add('show');clearTimeout(el._timer);el._timer=setTimeout(()=>el.classList.remove('show'),2600)}
function blankChannel(){return{id:'',name:'',shortName:'',description:'',logoUrl:'',status:'draft',templateId:'standard',broadcastTemplate:'classic',theme:{primary:'#27364d',secondary:'#d7b66d',background:'#090d14',surface:'#151b25',text:'#f7f8fa'},features:{catalog:true,vendors:true,auction:true,shipping:true,broadcast:true,groups:false,scoreboards:true,quiz:true,sponsors:true,ranking:true,tournament:false,survey:false},terminology:{item:'개체',vendor:'업체',group:'그룹',round:'회차',scoreboard:'집계판'},groups:[],scoreboards:[{id:'vendors',name:'업체별 낙찰금액',dimension:'vendor',metric:'soldAmount',unit:'원',topN:8}],overlay:{skin:'clean',layout:'balanced'}}}
function nextChannelId(){const now=new Date(),stamp=`${String(now.getFullYear()).slice(-2)}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}`,base=`auction-${stamp}`;let id=base,index=2;while(catalog.channels.some(channel=>channel.id===id))id=`${base}-${index++}`;return id}
function setDirty(value){dirty=Boolean(value);$('save').textContent=dirty?'변경 저장':'저장'}
function canDiscard(){return !dirty||confirm('저장하지 않은 변경이 있습니다. 이동할까요?')}
function current(){return isNew?blankChannel():catalog.channels.find(c=>c.id===selectedId)||blankChannel()}
function readForm(){return{id:$('channel-id').value,name:$('channel-name').value,shortName:$('channel-short').value,description:$('channel-description').value,logoUrl:$('channel-logo').value,status:$('channel-status').value,templateId:$('channel-template').value,broadcastTemplate:$('broadcast-template').value,theme:{primary:$('theme-primary').value,secondary:$('theme-secondary').value,background:$('theme-background').value,surface:$('theme-surface').value,text:$('theme-text').value},features:{catalog:true,vendors:$('feature-vendors').checked,auction:$('feature-auction').checked,shipping:$('feature-shipping').checked,broadcast:$('feature-broadcast').checked,groups:$('feature-groups').checked,scoreboards:$('feature-scoreboards').checked,quiz:$('feature-quiz').checked,sponsors:$('feature-sponsors').checked,ranking:$('feature-scoreboards').checked,tournament:$('feature-tournament').checked,survey:$('feature-survey').checked},terminology:{item:$('term-item').value,vendor:$('term-vendor').value,group:$('term-group').value,round:$('term-round').value,scoreboard:$('term-scoreboard').value},groups:readGroupRows(),scoreboards:readBoardRows(),overlay:{skin:$('overlay-skin').value,layout:$('overlay-layout').value}}}
function fill(c){$('channel-id').value=c.id;$('channel-id').disabled=!isNew;$('channel-name').value=c.name;$('channel-short').value=c.shortName;$('channel-description').value=c.description;$('channel-logo').value=c.logoUrl||'';$('channel-status').value=c.status;$('channel-template').value=c.templateId||'standard';$('broadcast-template').value=c.broadcastTemplate||'classic';$('theme-primary').value=c.theme.primary;$('theme-secondary').value=c.theme.secondary;$('theme-background').value=c.theme.background;$('theme-surface').value=c.theme.surface;$('theme-text').value=c.theme.text;for(const key of ['vendors','auction','shipping','broadcast','groups','scoreboards','quiz','sponsors','tournament','survey']){const el=$('feature-'+key);if(el)el.checked=!!c.features?.[key]}$('term-item').value=c.terminology?.item||'개체';$('term-vendor').value=c.terminology?.vendor||'업체';$('term-group').value=c.terminology?.group||'그룹';$('term-round').value=c.terminology?.round||'회차';$('term-scoreboard').value=c.terminology?.scoreboard||'집계판';$('overlay-skin').value=c.overlay?.skin||'clean';$('overlay-layout').value=c.overlay?.layout||'balanced';builderGroups=structuredClone(c.groups||[]);builderBoards=structuredClone(c.scoreboards||[]);renderBuilders();syncFeatureUi(false);$('page-title').textContent=isNew?'새 경매 채널':c.name;$('remove').disabled=isNew;updatePreview();setDirty(false)}
function readGroupRows(){return[...document.querySelectorAll('#group-list .builder-row')].map((row,index)=>({id:row.querySelector('[data-key="id"]').value,name:row.querySelector('[data-key="name"]').value,shortName:row.querySelector('[data-key="name"]').value.slice(0,12),color:row.querySelector('[data-key="color"]').value,logoUrl:row.querySelector('[data-key="logoUrl"]').value,sortOrder:index+1})).filter(row=>row.name)}
function readBoardRows(){return[...document.querySelectorAll('#board-list .builder-row')].map((row,index)=>({id:row.dataset.id||`board-${index+1}`,name:row.querySelector('[data-key="name"]').value,dimension:row.querySelector('[data-key="dimension"]').value,metric:row.querySelector('[data-key="metric"]').value,unit:row.querySelector('[data-key="unit"]').value,topN:Number(row.querySelector('[data-key="topN"]').value)||8})).filter(row=>row.name)}
function renderBuilders(){const esc=CreoPlatform.escapeHtml;$('group-list').innerHTML=builderGroups.map((row,index)=>`<div class="builder-row group"><input data-key="id" value="${esc(row.id||'')}" placeholder="ID"><input data-key="name" value="${esc(row.name||'')}" placeholder="그룹명"><input data-key="color" type="color" value="${esc(row.color||'#4b5563')}"><input data-key="logoUrl" value="${esc(row.logoUrl||'')}" placeholder="로고 URL (선택)"><button class="builder-remove" data-remove-group="${index}" type="button">×</button></div>`).join('')||'<p class="hint">등록된 그룹이 없습니다.</p>';$('board-list').innerHTML=builderBoards.map((row,index)=>`<div class="builder-row" data-id="${esc(row.id||`board-${index+1}`)}"><input data-key="name" value="${esc(row.name||'')}" placeholder="집계판 이름"><select data-key="dimension" aria-label="집계 기준"><option value="vendor" ${row.dimension==='vendor'?'selected':''}>업체</option><option value="group" ${row.dimension==='group'?'selected':''}>그룹</option><option value="category" ${row.dimension==='category'?'selected':''}>카테고리</option><option value="winner" ${row.dimension==='winner'?'selected':''}>낙찰자</option></select><select data-key="metric" aria-label="계산 방식"><option value="soldAmount" ${row.metric==='soldAmount'?'selected':''}>낙찰금액</option><option value="soldCount" ${row.metric==='soldCount'?'selected':''}>낙찰건수</option><option value="points" ${row.metric==='points'?'selected':''}>포인트</option></select><input data-key="unit" value="${esc(row.unit||'')}" placeholder="단위"><select data-key="topN" aria-label="표시 개수"><option value="4" ${Number(row.topN)===4?'selected':''}>4개</option><option value="6" ${Number(row.topN)===6?'selected':''}>6개</option><option value="8" ${![4,6,12].includes(Number(row.topN))?'selected':''}>8개</option><option value="12" ${Number(row.topN)===12?'selected':''}>12개</option></select><button class="builder-remove" data-remove-board="${index}" type="button">×</button></div>`).join('')||'<p class="hint">등록된 집계판이 없습니다.</p>';document.querySelectorAll('[data-remove-group]').forEach(button=>button.onclick=()=>{builderGroups=readGroupRows();builderGroups.splice(Number(button.dataset.removeGroup),1);renderBuilders();syncFeatureUi();setDirty(true)});document.querySelectorAll('[data-remove-board]').forEach(button=>button.onclick=()=>{builderBoards=readBoardRows();builderBoards.splice(Number(button.dataset.removeBoard),1);renderBuilders();syncFeatureUi();setDirty(true)})}
function syncFeatureUi(markDirty=true){const vendors=$('feature-vendors'),shipping=$('feature-shipping'),broadcast=$('feature-broadcast'),groups=$('feature-groups'),scoreboards=$('feature-scoreboards'),quiz=$('feature-quiz'),sponsors=$('feature-sponsors'),tournament=$('feature-tournament');if(shipping.checked&&!vendors.checked)vendors.checked=true;if((quiz.checked||sponsors.checked||scoreboards.checked||tournament.checked)&&!broadcast.checked)broadcast.checked=true;if(tournament.checked){groups.checked=true;scoreboards.checked=true}shipping.disabled=!vendors.checked;quiz.disabled=!broadcast.checked;sponsors.disabled=!broadcast.checked;scoreboards.disabled=!broadcast.checked;tournament.disabled=!broadcast.checked;$('groups-card').hidden=!groups.checked;$('boards-card').hidden=!scoreboards.checked;$('broadcast-card').hidden=!broadcast.checked;$('theme-card').hidden=!broadcast.checked;const labels=[['경매',$('feature-auction').checked],['배송',shipping.checked],['방송',broadcast.checked],['그룹',groups.checked],['집계판',scoreboards.checked],['퀴즈',quiz.checked]];$('setup-summary').innerHTML=labels.map(([label,on])=>`<span class="setup-chip ${on?'on':''}">${label}</span>`).join('');if(markDirty)setDirty(true)}
function applyTemplate(id){const templates={standard:{features:{vendors:true,auction:true,shipping:true,broadcast:true,groups:false,scoreboards:true,quiz:true,sponsors:true,tournament:false,survey:false},terms:{item:'개체',vendor:'업체',group:'그룹',round:'회차',scoreboard:'집계판'},groups:[],boards:[{id:'vendors',name:'업체별 낙찰금액',dimension:'vendor',metric:'soldAmount',unit:'원',topN:8}],skin:'clean',legacy:'classic'},team:{features:{vendors:true,auction:true,shipping:true,broadcast:true,groups:true,scoreboards:true,quiz:true,sponsors:true,tournament:true,survey:false},terms:{item:'개체',vendor:'업체',group:'팀',round:'회차',scoreboard:'팀 순위'},groups:[],boards:[{id:'vendors',name:'업체별 낙찰금액',dimension:'vendor',metric:'soldAmount',unit:'원',topN:8},{id:'teams',name:'팀별 낙찰금액',dimension:'group',metric:'soldAmount',unit:'원',topN:8}],skin:'sport',legacy:'tournament'},community:{features:{vendors:true,auction:true,shipping:true,broadcast:true,groups:true,scoreboards:true,quiz:true,sponsors:true,tournament:false,survey:true},terms:{item:'개체',vendor:'업체',group:'기숙사',round:'회차',scoreboard:'기숙사 컵'},groups:[{id:'r',name:'R',color:'#8a2b31'},{id:'g',name:'G',color:'#285b3b'},{id:'b',name:'B',color:'#31558c'},{id:'y',name:'Y',color:'#b07d20'}],boards:[{id:'houses',name:'기숙사 컵',dimension:'group',metric:'points',unit:'점',topN:4}],skin:'heritage',legacy:'academy'},minimal:{features:{vendors:false,auction:true,shipping:false,broadcast:true,groups:false,scoreboards:false,quiz:false,sponsors:false,tournament:false,survey:false},terms:{item:'상품',vendor:'판매자',group:'그룹',round:'회차',scoreboard:'집계판'},groups:[],boards:[],skin:'minimal',legacy:'classic'}};const t=templates[id];if(!t)return;for(const[key,value]of Object.entries(t.features)){const el=$('feature-'+key);if(el)el.checked=value}for(const[key,value]of Object.entries(t.terms))$('term-'+key).value=value;builderGroups=structuredClone(t.groups);builderBoards=structuredClone(t.boards);$('overlay-skin').value=t.skin;$('broadcast-template').value=t.legacy;renderBuilders();syncFeatureUi();setDirty(true)}
function updatePreview(){const c=readForm(),p=$('theme-preview');p.style.setProperty('--preview-primary',c.theme.primary);p.style.setProperty('--preview-secondary',c.theme.secondary);p.style.setProperty('--preview-bg',c.theme.background);p.style.setProperty('--preview-text',c.theme.text);$('preview-name').textContent=c.shortName||c.name||'새 경매'}
function renderList(){const esc=CreoPlatform.escapeHtml;$('channel-list').innerHTML=catalog.channels.map(c=>`<button class="channel-row ${!isNew&&c.id===selectedId?'active':''}" data-id="${esc(c.id)}" style="--swatch:${esc(c.theme.primary)}"><span class="swatch"></span><span><b>${esc(c.name)}</b><small>${esc(c.status)} · ${esc(c.id)}</small></span></button>`).join('');document.querySelectorAll('.channel-row').forEach(b=>b.onclick=()=>{if(!canDiscard())return;isNew=false;selectedId=b.dataset.id;renderList();fill(current())})}
async function load(){catalog=await CreoPlatform.api('channels');if(!selectedId)selectedId=catalog.channels[0]?.id||'';renderList();fill(current())}
async function login(password){CreoPlatform.setAdmin(password);if(!await CreoPlatform.verifyAdmin(password))throw new Error('비밀번호가 맞지 않습니다.');$('login').hidden=true;await load()}
$('login-form').onsubmit=async e=>{e.preventDefault();try{await login($('admin-password').value)}catch(err){toast(err.message)}};
$('new-channel').onclick=()=>{if(!canDiscard())return;const draft=blankChannel();draft.id=nextChannelId();draft.name='새 경매';draft.shortName='새 경매';isNew=true;selectedId='';renderList();fill(draft);setDirty(true);$('channel-name').focus()};
$('channel-template').onchange=event=>applyTemplate(event.target.value);
$('add-group').onclick=()=>{builderGroups=readGroupRows();builderGroups.push({id:`group-${builderGroups.length+1}`,name:'',color:'#4b5563',logoUrl:''});renderBuilders();syncFeatureUi();setDirty(true)};
$('add-board').onclick=()=>{builderBoards=readBoardRows();builderBoards.push({id:`board-${builderBoards.length+1}`,name:'',dimension:'vendor',metric:'soldAmount',unit:'원',topN:8});renderBuilders();syncFeatureUi();setDirty(true)};
$('channel-form').addEventListener('input',()=>{updatePreview();setDirty(true)});
document.querySelectorAll('[id^="feature-"]').forEach(input=>input.addEventListener('change',()=>syncFeatureUi()));
$('save').onclick=async()=>{if(!$('channel-form').reportValidity())return;syncFeatureUi(false);const channel=readForm();if(channel.features.scoreboards&&!channel.scoreboards.length)return toast('집계판을 하나 이상 추가하거나 집계판 기능을 꺼주세요.');if(channel.scoreboards.some(board=>board.dimension==='group')&&!channel.features.groups)return toast('그룹 집계판을 쓰려면 그룹 기능을 켜주세요.');try{const path=isNew?'channels':`channels/${encodeURIComponent(selectedId)}`;const method=isNew?'POST':'PUT';await CreoPlatform.api(path,{method,body:JSON.stringify({channel,expectedVersion:catalog.version})});toast('채널 설정을 저장했습니다.');isNew=false;selectedId=channel.id;setDirty(false);await load()}catch(err){toast(err.message)}};
$('duplicate').onclick=()=>{if(isNew)return toast('먼저 새 채널을 저장해 주세요.');if(!canDiscard())return;const copy=structuredClone(current());copy.id=nextChannelId();copy.name=copy.name+' 복사본';copy.shortName=copy.shortName||copy.name;copy.status='draft';isNew=true;selectedId='';renderList();fill(copy);setDirty(true);$('channel-name').focus();toast('이름을 확인한 뒤 저장하세요. 운영 데이터는 복사되지 않습니다.')};
$('remove').onclick=async()=>{if(isNew)return;const channel=current();if(!confirm(`${channel.name} 채널을 삭제할까요?\n\n업체·개체·배송 자료가 하나라도 있거나 현재 송출 중이면 삭제되지 않습니다.`))return;try{await CreoPlatform.api(`channels/${encodeURIComponent(channel.id)}?expectedVersion=${catalog.version}`,{method:'DELETE'});toast('채널을 삭제했습니다.');selectedId='';await load()}catch(err){toast(err.message)}};
window.addEventListener('beforeunload',event=>{if(!dirty)return;event.preventDefault();event.returnValue='' });
(async()=>{const saved=CreoPlatform.getAdmin();if(saved){try{await login(saved);return}catch(_){CreoPlatform.setAdmin('')}}$('login').hidden=false})();
</script>
</body>
