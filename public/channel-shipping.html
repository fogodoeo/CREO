<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="robots" content="noindex">
    <title>배송·결제 관리로 이동 · CREO</title>
</head>
<body>
<p>통합 배송·결제 관리 화면으로 이동합니다.</p>
<script>
(function () {
    'use strict';
    const channel = String(new URLSearchParams(location.search).get('channel') || '')
        .toLowerCase().replace(/[^a-z0-9-]/g, '');
    const target = new URL('shipping.html', location.href);
    if (channel) target.searchParams.set('channel', channel);
    location.replace(target.pathname + target.search);
})();
</script>
</body>
</html>
