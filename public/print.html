        @media print {

            .tab-bar {

            body {
                padding: 0;

            .channel-chip,.workspace-link { flex:1;justify-content:center; }
            .label-item { grid-template-columns:24px 62px minmax(0,1fr) 82px; gap:8px; }
            .label-item .label-phone,.label-item .label-destination { grid-column:3 / -1; }
            .label-selection-summary { width:100%;margin-left:0; }
            .label-preview-stage { min-height:0;padding:14px 8px; }
            .label-paper { padding-left:16px;padding-right:16px; }
            .label-paper-destination { font-size:clamp(17px,5vw,29px); }
            .label-paper-buyer { font-size:clamp(16px,4.7vw,27px); }
            .label-paper-phone { font-size:clamp(14px,4vw,23px); }
            .settlement-stats { grid-template-columns:repeat(2,minmax(120px,1fr)); }
            .settlement-tools { align-items:stretch; flex-direction:column; }
            .settlement-tools input,.settlement-tools select,.sheets-export-btn { width:100%; min-width:0; }
        }
    </style>
</head>

<body>
    <div class="tab-bar">
        <span class="channel-chip" id="print-channel-name">채널 확인 중</span>
        <a class="workspace-link" id="workspace-link" href="#">등록 · 목록</a>
        <button class="tab-btn" onclick="showTab('list',this)">경매 리스트</button>

            글씨 <input type="range" id="ctrl-font" min="7" max="16" value="13" style="width:80px;"
                oninput="applySettings()"><span id="lbl-font">13</span>pt
            &nbsp;행높이 <input type="range" id="ctrl-pad" min="1" max="8" value="3" style="width:60px;"
                oninput="applySettings()"><span id="lbl-pad">3</span>px
        </span>
        <button class="orientation-btn" id="orientation-btn" type="button" onclick="toggleOrientation()">가로</button>
        <button class="print-btn" id="print-action-btn" type="button" onclick="printCurrentView()">인쇄</button>
    </div>

    <div class="tab-content" id="tab-list">
        <div class="header">
            <h1>경매 리스트</h1>
            <div class="meta"><span id="list-date"></span><span class="count" id="list-count"></span></div>
        </div>
        <div id="list-body">
            <div class="loading">불러오는 중...</div>
        </div>
    </div>

    <div class="tab-content active" id="tab-results">
        <div class="header">
            <h1>낙찰 · 배송 정산</h1>
            <div class="meta"><span id="result-date"></span><span class="count" id="result-count"></span></div>
        </div>
        <div class="settlement-dashboard" id="settlement-dashboard">
            <div class="settlement-stats" id="settlement-stats"></div>
            <div class="settlement-tools">
                <input id="settlement-search" type="search" placeholder="낙찰자 · 연락처 · 개체 · 업체 · 수령지 검색" oninput="renderSettlementRows()">
                <select id="settlement-filter" onchange="renderSettlementRows()">
                    <option value="all">전체 상태</option>
                    <option value="awaiting_information">배송 미입력</option>
                    <option value="awaiting_payment">결제 대기</option>

                    <option value="paid">결제 완료</option>
                </select>
                <button class="sheets-export-btn" type="button" onclick="openShippingSettlementInGoogleSheets(this)">구글시트 새로 만들기</button>

        <div id="result-body">
            <div class="loading">불러오는 중...</div>

    <div class="tab-content" id="tab-company">
        <div class="company-filter" id="company-filter" style="display:none;">
            <select id="company-select" onchange="onCompanyFilterChange()">
                <option value="">전체</option>
            </select>
            <span class="filter-info" id="filter-info"></span>
        </div>
        <div id="company-body">
            <div class="loading">불러오는 중...</div>
        </div>
    </div>

    <div class="tab-content" id="tab-labels">
        <div class="header">
            <h1>배송 라벨</h1>
            <div class="meta">15×50mm · 개체당 1장</div>
        </div>
        <div class="label-workspace">
            <div class="label-toolbar">
                <label><input id="label-select-all" type="checkbox" onchange="toggleAllShippingLabels(this.checked)"> 전체 선택</label>
                <span>결제 완료 건이 기본 선택됩니다.</span>
                <span class="label-printer-status" id="label-printer-status">D10 앱 연결 확인 중</span>
                <span class="label-selection-summary" id="label-selection-summary">0장 선택</span>
            </div>
            <div class="label-workspace-body">
                <section class="label-preview-panel" aria-label="배송 라벨 출력 미리보기">
                    <div class="label-preview-heading">
                        <strong>출력 미리보기</strong>
                        <span>실제 D10 15×50mm 비율</span>
                    </div>
                    <div class="label-preview-stage" id="label-preview-stage">
                        <div class="label-preview-empty">라벨 자료를 불러오는 중입니다.</div>
                    </div>
                    <div class="label-preview-nav">
                        <button id="label-preview-prev" type="button" onclick="moveShippingLabelPreview(-1)">이전</button>
                        <span class="label-preview-counter" id="label-preview-counter">0 / 0</span>
                        <button id="label-preview-next" type="button" onclick="moveShippingLabelPreview(1)">다음</button>
                    </div>
                    <div class="label-preview-note">회색 외곽선과 하단 점선은 용지·급지 여백 안내이며 실제로 인쇄되지 않습니다.</div>
                </section>
                <div class="label-item-list" id="label-item-list"><div class="loading">불러오는 중...</div></div>
            </div>

    <section class="login-gate" id="print-login" hidden>
        <div class="login-card"><h2>운영자 확인</h2><p id="print-login-description">인쇄 자료를 불러오려면 관리자 비밀번호를 입력해 주세요.</p><form id="print-login-form"><input id="print-password" type="password" autocomplete="current-password" required><button type="submit">확인</button></form><div class="login-error" id="print-login-error"></div></div>
    </section>

    <script>
        function showTab(name, button) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + name).classList.add('active');
            if (button) button.classList.add('active');
            document.body.dataset.printTab = name;
            var labelMode = name === 'labels';
            document.getElementById('table-print-controls').hidden = labelMode;
            document.getElementById('orientation-btn').hidden = labelMode;
            document.getElementById('print-action-btn').textContent = labelMode ? 'D10 선택 출력' : '인쇄';
            if (labelMode) refreshD10PrinterStatus();
            setTimeout(initResize, 50);
            if (name === 'company') {
                setTimeout(function () { drawConnectionLines(window._phoneRowMap, window._phoneColors); }, 100);
            }
        }

        function printCurrentView() {
            if (document.body.dataset.printTab === 'labels') return printSelectedShippingLabels();
            window.print();
        }

        function fmtPrice(v) {
            if (!v && v !== 0) return '';
            v = parseFloat(v);
            if (isNaN(v)) return String(v);
            return v === Math.floor(v) ? Math.floor(v) + '만' : v + '만';
        }

        function parseChecklist(str) {
            var cl = {};
            if (!str) return cl;
            str.split('|').forEach(function (pair) {
                var idx = pair.indexOf(':');
                if (idx > 0) cl[pair.substring(0, idx).trim()] = pair.substring(idx + 1).trim();
            });
            return cl;
        }
        function truncatePrintName(name, maxChars) {
            var chars = Array.from(String(name || ''));
            if (chars.length <= maxChars) return chars.join('');
            return chars.slice(0, Math.max(0, maxChars - 1)).join('') + '…';
        }

        function traitsStr(cl) {
            var gm = { M: '수컷', F: '암컷', U: '미구분' };
            var yn = { O: '있음', X: '없음' };
            var gr = { '1': '낮음', '2': '보통', '3': '양호', '4': '우수', '5': '최상' };
            var parts = [];
            if (cl.gender) parts.push(gm[cl.gender] || cl.gender);
            if (cl.weight) parts.push(cl.weight + 'g');
            if (cl.birth) parts.push(cl.birth);
            if (cl.spot) parts.push('점:' + (yn[cl.spot] || cl.spot));
            if (cl.pin) parts.push('풀핀:' + (yn[cl.pin] || cl.pin));
            ['도살:size', '월높이:wall', '색감:color', '활동성:activity', '먹이:feed', '체형:structure'].forEach(function (s) {
                var p = s.split(':');
                if (cl[p[1]]) parts.push(p[0] + ':' + (gr[cl[p[1]]] || cl[p[1]]));
            });
            if (cl.memo) parts.push(cl.memo);
            return parts.join(' / ');
        }

        function parseWinner(str) {
            if (!str) return { name: '', phone: '' };
            var identity = CreoPrintShippingSummary.winnerIdentity({ winner: str });
            return { name: identity.name === '이름 없음' ? '' : identity.name, phone: identity.phone };
        }

        function fmtPhone(raw) {
            var ph = (raw || '').replace(/[^0-9]/g, '');
            if (ph.length === 8) ph = '010' + ph;
            if (ph.length === 11) return ph.slice(0, 3) + '-' + ph.slice(3, 7) + '-' + ph.slice(7);
            if (ph.length === 10) return ph.slice(0, 3) + '-' + ph.slice(3, 6) + '-' + ph.slice(6);
            return ph;
        }

        function escapePrintHtml(value) {
            return String(value == null ? '' : value)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        
        function cleanItemName(name, lotNumber) {
            var s = String(name || '').trim();
            // Remove '일반경매 001', '[일반경매 001]', '경매 001', '경매001'
            s = s.replace(/\[?(?:일반|특별|메인|자율)?\s*경매\s*\d+\]?/gi, '');
            s = s.replace(/^\s*[-_/:·]\s*/, '');
            s = s.trim();
            // Unwrap outer parentheses if wrapped e.g. (A01) -> A01
            if (s.startsWith('(') && s.endsWith(')')) {
                s = s.slice(1, -1).trim();
            }
            if (!s) {
                var num = lotNumber || '';
                s = num ? ('A' + String(num).padStart(2, '0')) : '개체';
            }
            return s;
        }

        function formatItemCodeName(it) {
            var name = cleanItemName(it.name, it.num || it.lotNumber);
            return '<strong class="item-name">' + escapePrintHtml(name) + '</strong>';
        }

        var SHIPPING_DATA = {
            '파르게': { base: 10000, extra: 7000, jejuExtra: 4000 },
            '도도시': { base: 10000, extra: 0 },
            '랩팡': { base: 10000, extra: 7000 },
            '기타': { base: 10000, extra: 0 }
        };

        function parseSavedShippingRegion(value) {
            var raw = String(value || '').trim();
            var memoMatch = raw.match(/\[(?:메모|요청):\s*([^\]]*)\]/);
            var memo = memoMatch ? memoMatch[1].trim() : '';
            var location = raw.replace(/\s*\[(?:메모|요청):[^\]]*\]\s*$/, '').trim();
            var openIdx = location.indexOf('(');
            var closeIdx = location.lastIndexOf(')');

            if (openIdx >= 0) {
                return {
                    region: location.slice(0, openIdx).trim(),
                    hub: location.slice(openIdx + 1, closeIdx > openIdx ? closeIdx : location.length).trim(),
                    memo: memo
                };
            }
            return { region: location, hub: '', memo: memo };
        }

        function calculateShippingCost(company, type, region, hub, itemCount) {
            if (type !== '배송') return 0;
            var comp = company || '파르게';
            var compData = SHIPPING_DATA[comp] || SHIPPING_DATA['파르게'];
            var baseCost = compData.base || 10000;

            if (comp === '파르게') {
                var isJeju = (region || '').indexOf('제주') >= 0;
                return itemCount <= 1 ? baseCost : baseCost + (itemCount - 1) * (isJeju ? (compData.jejuExtra || 4000) : (compData.extra || 7000));
            } else if (comp === '랩팡') {
                return itemCount <= 1 ? baseCost :
                       itemCount <= 4 ? baseCost + (itemCount - 1) * (compData.extra || 7000) :
                       itemCount <= 20 ? baseCost + 28000 : baseCost + 35000;
            } else if (comp === '도도시') {
                return baseCost;
            }
            return baseCost;
        }

        function splitShippingCostByCompany(companies, totalShipping, winnerAllItems) {
            var validCompanies = (companies || []).filter(Boolean);
            var allocations = {};
            if (validCompanies.length === 0 || totalShipping <= 0) {
                validCompanies.forEach(function(co) { allocations[co] = 0; });
                return allocations;
            }

            var itemCounts = {};
            var totalItems = 0;
            validCompanies.forEach(function(co) {
                var count = (winnerAllItems || []).filter(function(it) { return (it.company || '').trim() === co; }).length;
                itemCounts[co] = Math.max(count, 1);
                totalItems += itemCounts[co];
            });

            var allocated = 0;
            var shares = [];
            validCompanies.forEach(function(co) {
                var share = Math.floor(totalShipping * itemCounts[co] / totalItems);
                allocations[co] = share;
                allocated += share;
                shares.push({ co: co, count: itemCounts[co] });
            });

            var remainder = totalShipping - allocated;
            shares.sort(function(a, b) { return b.count - a.count; });
            for (var i = 0; i < shares.length; i++) {
                if (remainder <= 0) break;
                allocations[shares[i].co] += 1;
                remainder -= 1;
            }
            return allocations;
        }

        function populateCalculatedShipping(items) {
            var winnerGroups = {};
            items.forEach(function(it) {
                var w = parseWinner(it.winner);
                var key = (w.phone || w.name || '').replace(/[^0-9a-zA-Z가-힣]/g, '');
                if (!key) return;
                if (!winnerGroups[key]) winnerGroups[key] = [];
                winnerGroups[key].push(it);
            });

            Object.keys(winnerGroups).forEach(function(winnerKey) {
                var groupItems = winnerGroups[winnerKey];
                // Check if any item has shipping info
                var withShip = groupItems.find(function(it) { 
                    return it.shipping_type || it.shipping_company || it.shipping_region || it.shipping_cost > 0; 
                }) || groupItems[0];

                var type = withShip.shipping_type || '';
                var company = withShip.shipping_company || '';
                var rawRegion = withShip.shipping_region || '';
                var parsed = parseSavedShippingRegion(rawRegion);

                // Sync shipping info across all items of this winner
                groupItems.forEach(function(it) {
                    if (!it.shipping_type && type) it.shipping_type = type;
                    if (!it.shipping_company && company) it.shipping_company = company;
                    if (!it.shipping_region && rawRegion) it.shipping_region = rawRegion;
                });

                if (type === '직접수령' || type === '픽업') {
                    groupItems.forEach(function(it) { 
                        it.shipping_cost = 0; 
                        it.shipping_display = '0원 (직수령)';
                    });
                    return;
                }

                if (type === '배송' || company || rawRegion) {
                    if (!type) type = '배송';
                    if (!company) company = '파르게';

                    var sellerCos = [];
                    groupItems.forEach(function(it) {
                        var c = (it.company || '').trim();
                        if (c && sellerCos.indexOf(c) < 0) sellerCos.push(c);
                    });
                    if (sellerCos.length === 0) sellerCos = ['기본'];

                    var totalShipping = 0;
                    var savedCost = 0;
                    groupItems.forEach(function(it) { savedCost += (Number(it.shipping_cost) || 0); });

                    if (savedCost > 0) {
                        totalShipping = savedCost;
                    } else {
                        totalShipping = calculateShippingCost(company, type, parsed.region, parsed.hub, groupItems.length);
                    }

                    var allocations = splitShippingCostByCompany(sellerCos, totalShipping, groupItems);

                    var vendorFirstAssigned = {};
                    groupItems.forEach(function(it) {
                        var c = (it.company || '').trim() || '기본';
                        if (!vendorFirstAssigned[c]) {
                            var share = allocations[c] || 0;
                            it.shipping_cost = share;
                            it.shipping_display = share > 0 ? share.toLocaleString() + '원' : '10,000원';
                            vendorFirstAssigned[c] = true;
                        } else {
                            it.shipping_cost = 0;
                            it.shipping_display = '<span style="color:#888;font-size:8.5pt;">(합배송)</span>';
                            it.is_combined_shipping_child = true;
                        }
                    });
                } else {
                    groupItems.forEach(function(it) {
                        it.shipping_display = '-';
                    });
                }
            });
        }

        function fmtShippingCost(it) {
            if (it.shipping_display) return it.shipping_display;
            if (it.shipping_type === '직접수령' || it.shipping_type === '픽업') return '0원 (직수령)';
            var num = Number(it.shipping_cost);
            if (!isNaN(num) && num > 0) return num.toLocaleString() + '원';
            if (it.shipping_type === '배송') return '10,000원';
            return '-';
        }

        function getStatusBadge(it) {
            var st = it.status || '';
            var payStatus = String(it.payment_status || it.paymentStatus || '').toLowerCase();
            
            if (CreoAuctionContract.isSoldStatus(st)) {
                if (payStatus === 'paid' || payStatus.indexOf('완료') >= 0 || payStatus.indexOf('입금완료') >= 0 || payStatus.indexOf('결제완료') >= 0) {
                    return '<span class="badge badge-paid">결제 완료</span>';
                }
                return '<span class="badge badge-waiting">결제 대기</span>';
            } else if (CreoAuctionContract.normalizeStatus(st) === CreoAuctionContract.STATUS.PASSED) {
                return '<span class="badge badge-unsold">유찰</span>';
            } else if (CreoAuctionContract.normalizeStatus(st) === CreoAuctionContract.STATUS.CANCELLED) {
                return '<span class="badge badge-cancelled">취소</span>';
            } else if (CreoAuctionContract.normalizeStatus(st) === CreoAuctionContract.STATUS.LIVE) {
                return '<span class="badge badge-live">진행중</span>';
            }
            return '<span class="badge badge-waiting">대기</span>';
        }

        function shippingText(it) {
            var method = String(it.shipping_type || '').trim();
            var carrier = String(it.shipping_company || '').trim();
            var location = String(it.shipping_region || '').replace(/\s*\[(?:메모|요청):[^\]]+\]\s*$/, '').trim();
            if (method === '직접수령') return location ? '직접수령 · ' + location : '직접수령';
            if (method !== '배송') return '-';
            return [carrier, location].filter(Boolean).join(' · ') || '배송';
        }

        function shippingLabelDestination(it) {
            var method = String(it.shipping_type || '').trim();
            var carrier = String(it.shipping_company || '').trim();
            var location = String(it.shipping_region || '').replace(/\s*\[(?:메모|요청):[^\]]+\]\s*$/, '').trim();
            if (method === '직접수령') return location;
            if (method !== '배송') return '';
            return [carrier, location].filter(Boolean).join(' · ');
        }

        function renderShippingLabels(items) {
            var eligible = (items || []).filter(function (it) {
                var winner = parseWinner(it.winner);
                return CreoAuctionContract.isSoldStatus(it.status)
                    && Boolean((winner.phone || '').replace(/[^0-9]/g, ''))
                    && Boolean(shippingLabelDestination(it));
            });
            window._shippingLabelItems = eligible;
            window._shippingLabelPreviewIndex = null;
            var list = document.getElementById('label-item-list');
            if (!eligible.length) {
                list.innerHTML = '<div class="label-empty">연락처와 수령 거점이 저장된 낙찰 건이 없습니다.</div>';
                updateShippingLabelSelection();
                return;
            }
            list.innerHTML = eligible.map(function (it, index) {
                var winner = parseWinner(it.winner);
                var paid = it.payment_status === 'paid';
                return '<label class="label-item" data-label-row-index="' + index + '" onclick="setShippingLabelPreview(' + index + ')">'
                    + '<input class="shipping-label-check" type="checkbox" data-label-index="' + index + '"'
                    + (paid ? ' checked' : '') + ' onchange="updateShippingLabelSelection(Number(this.dataset.labelIndex))">'
                    + '<strong>' + escapePrintHtml(it.name || auctionNumber(it)) + '</strong>'
                    + '<span class="label-buyer">' + escapePrintHtml(winner.name || '낙찰자') + '</span>'
                    + '<span class="label-phone">' + escapePrintHtml(fmtPhone(winner.phone)) + '</span>'
                    + '<span class="label-destination">' + escapePrintHtml(shippingLabelDestination(it)) + '</span>'
                    + '<span class="label-payment' + (paid ? ' is-paid' : '') + '">' + (paid ? '결제 완료' : '결제 대기') + '</span>'
                    + '</label>';
            }).join('');
            updateShippingLabelSelection();
        }

        function selectedShippingLabelItems() {
            var items = window._shippingLabelItems || [];
            return Array.from(document.querySelectorAll('.shipping-label-check:checked')).map(function (input) {
                return items[Number(input.dataset.labelIndex)];
            }).filter(Boolean);
        }

        function updateShippingLabelSelection(preferredIndex) {
            var checks = Array.from(document.querySelectorAll('.shipping-label-check'));
            var selected = checks.filter(function (input) { return input.checked; }).length;
            var selectAll = document.getElementById('label-select-all');
            selectAll.checked = Boolean(checks.length) && selected === checks.length;
            selectAll.indeterminate = selected > 0 && selected < checks.length;
            document.getElementById('label-selection-summary').textContent = selected + '장 선택 / 출력 가능 ' + checks.length + '장';
            if (Number.isInteger(preferredIndex)) window._shippingLabelPreviewIndex = preferredIndex;
            renderShippingLabelPreview();
        }

        function toggleAllShippingLabels(checked) {
            document.querySelectorAll('.shipping-label-check').forEach(function (input) { input.checked = checked; });
            updateShippingLabelSelection();
        }

        function shippingLabelPreviewIndexes() {
            var items = window._shippingLabelItems || [];

                return Number(input.dataset.labelIndex);
            }).filter(function (index) { return Number.isInteger(index) && Boolean(items[index]); });

            return items.map(function (_item, index) { return index; });

        function setShippingLabelPreview(index) {
            if (!Number.isInteger(index) || !(window._shippingLabelItems || [])[index]) return;
            window._shippingLabelPreviewIndex = index;
            renderShippingLabelPreview();
        }

        function moveShippingLabelPreview(direction) {
            var indexes = shippingLabelPreviewIndexes();
            if (!indexes.length) return;
            var current = indexes.indexOf(Number(window._shippingLabelPreviewIndex));
            var next = Math.max(0, Math.min(indexes.length - 1, current + Number(direction || 0)));
            if (current < 0) next = 0;
            window._shippingLabelPreviewIndex = indexes[next];
            renderShippingLabelPreview();
        }

        function renderShippingLabelPreview() {
            var stage = document.getElementById('label-preview-stage');
            var counter = document.getElementById('label-preview-counter');
            var prev = document.getElementById('label-preview-prev');
            var next = document.getElementById('label-preview-next');
            if (!stage || !counter || !prev || !next) return;

            var items = window._shippingLabelItems || [];
            var indexes = shippingLabelPreviewIndexes();
            var activeIndex = Number(window._shippingLabelPreviewIndex);
            if (indexes.indexOf(activeIndex) < 0) activeIndex = indexes.length ? indexes[0] : -1;
            window._shippingLabelPreviewIndex = activeIndex >= 0 ? activeIndex : null;

            document.querySelectorAll('[data-label-row-index]').forEach(function (row) {
                row.classList.toggle('is-previewing', Number(row.dataset.labelRowIndex) === activeIndex);
            });

            if (activeIndex < 0 || !items[activeIndex]) {
                stage.innerHTML = '<div class="label-preview-empty">미리볼 배송 라벨이 없습니다.</div>';
                counter.textContent = '0 / 0';
                prev.disabled = true;
                next.disabled = true;
                return;
            }

            var position = indexes.indexOf(activeIndex);
            var payload = d10ShippingLabelPayload(items[activeIndex]);
            var destinationLength = Array.from(String(payload.destination || '')).length;
            var buyerLength = Array.from(String(payload.winner_name || '')).length;
            var destinationClass = destinationLength > 38 ? ' is-long is-very-long' : destinationLength > 20 ? ' is-long' : '';
            var buyerClass = buyerLength > 18 ? ' is-long is-very-long' : buyerLength > 11 ? ' is-long' : '';
            stage.innerHTML = '<div class="label-paper" title="' + escapePrintHtml(payload.lot_number || '') + '">'
                + '<div class="label-paper-line label-paper-destination' + destinationClass + '">' + escapePrintHtml(payload.destination || '-') + '</div>'
                + '<div class="label-paper-line label-paper-buyer' + buyerClass + '">' + escapePrintHtml(payload.winner_name || '-') + '</div>'
                + '<div class="label-paper-line label-paper-phone">' + escapePrintHtml(fmtPhone(payload.winner_phone) || '-') + '</div>'
                + '<div class="label-paper-feed-margin" aria-hidden="true"></div>'
                + '</div>';
            counter.textContent = (position + 1) + ' / ' + indexes.length + (selectedShippingLabelItems().length ? ' · 선택 라벨' : ' · 출력 가능');
            prev.disabled = position <= 0;
            next.disabled = position >= indexes.length - 1;
        }

        async function fetchD10Bridge(path, options, timeoutMs) {
            var controller = new AbortController();
            var timer = setTimeout(function () { controller.abort(); }, timeoutMs || 3500);
            try {
                return await fetch(D10_LABEL_BRIDGE_BASE + path, Object.assign({}, options || {}, {
                    cache: 'no-store',
                    signal: controller.signal
                }));
            } finally {
                clearTimeout(timer);
            }
        }

        async function refreshD10PrinterStatus() {
            setD10PrinterStatus('D10 앱 연결 확인 중', 'checking');
            try {
                var response = await fetchD10Bridge('/v1/status', { method: 'GET' }, 2200);
                if (!response.ok) throw new Error('브리지 응답 오류');
                var payload = await response.json();
                var suffix = payload.printing ? ' · 인쇄 중' : payload.queued ? ' · 대기 ' + payload.queued + '장' : '';
                setD10PrinterStatus('D10 앱 연결됨' + suffix, 'ready');
                return true;
            } catch (_error) {
                setD10PrinterStatus('D10 앱 미연결', 'error');
                return false;
            }
        }

            return {
                lot_number: String(it.name || auctionNumber(it) || '').trim(),
                winner_name: winner.name || '낙찰자',
                winner_phone: winner.phone || '',

            };

        async function printSelectedShippingLabels() {
            var items = selectedShippingLabelItems();

                alert('출력할 배송 라벨을 선택해 주세요.');
                return;

            button.disabled = true;
            button.textContent = 'D10 전송 중...';
            setD10PrinterStatus('D10 대기열 전송 중', 'checking');
            try {
                var response = await fetchD10Bridge('/v1/labels', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        channel: PRINT_CHANNEL_ID,
                        labels: items.map(d10ShippingLabelPayload)
                    })
                }, 5000);
                var payload = await response.json().catch(function () { return {}; });
                if (!response.ok || !payload.ok) throw new Error(payload.error || 'D10 대기열에 전송하지 못했습니다.');
                setD10PrinterStatus('D10 ' + payload.accepted + '장 출력 대기', 'ready');

        function fmtWon(value) {

            var korean = CreoPrintShippingSummary.formatKoreanDateTime(value);
            if (!/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}$/.test(korean)) return korean;
            return Number(korean.slice(5, 7)) + '/' + Number(korean.slice(8, 10)) + korean.slice(10);
        }

        function renderSettlementStats(rows) {

            var waitingPayment = rows.filter(function (row) { return ['awaiting_payment', 'additional_payment', 'on_site'].includes(row.paymentState); }).length;
            var paid = rows.filter(function (row) { return row.paymentState === 'paid'; }).length;
            var combined = rows.filter(function (row) { return row.combined; }).length;
            var shippingTotal = rows.reduce(function (sum, row) { return sum + row.shippingCost; }, 0);
            document.getElementById('settlement-stats').innerHTML = [
                ['낙찰자 묶음', rows.length + '명', ''],
                ['배송 미입력', waitingInput + '명', waitingInput ? 'is-warn' : ''],
                ['결제 확인 필요', waitingPayment + '명', waitingPayment ? 'is-warn' : ''],
                ['결제 완료', paid + '명', paid ? 'is-done' : ''],
                ['합배송', combined + '건', ''],
                ['배송비 합계', fmtWon(shippingTotal), '']

        function buildShippingSettlement(items) {
            var summaryItems = (items || []).filter(function (it) { return CreoAuctionContract.isSoldStatus(it.status); }).map(function (it) {
                var parsed = parseWinner(it.winner);
                return Object.assign({}, it, {

                    }

        function copySettlementRowsForSheets(rows) {
            var tsv = rows.map(function (row) {
                return row.map(function (value) {
                    var cell = String(value == null ? '' : value).replace(/[\t\r\n]+/g, ' ');
                    return /^[=+\-@]/.test(cell) ? "'" + cell : cell;
                }).join('\t');
            }).join('\n');
            function fallbackCopy() {
                var textarea = document.createElement('textarea');
                textarea.value = tsv;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.select();
                var copied = document.execCommand('copy');
                textarea.remove();
                if (!copied) return Promise.reject(new Error('clipboard unavailable'));
                return Promise.resolve();
            }
            if (navigator.clipboard && navigator.clipboard.writeText) {
                return navigator.clipboard.writeText(tsv).catch(fallbackCopy);
            }
            return fallbackCopy();
        }

        var googleSheetsConfig = { loaded: false, configured: false, clientId: '' };
        var googleSheetsTokenClient = null;
        var googleSheetsAccessToken = '';
        var googleSheetsAccessTokenExpiresAt = 0;
        var pendingGoogleSheetExport = null;

        function loadGoogleSheetsConfig() {
            return fetch('/api/google-sheets/config', { cache: 'no-store', credentials: 'same-origin' })
                .then(function (response) { return response.ok ? response.json() : {}; })
                .then(function (config) {
                    googleSheetsConfig = {
                        loaded: true,
                        configured: Boolean(config.configured && config.clientId),
                        clientId: String(config.clientId || '')
                    };
                    var button = document.querySelector('.sheets-export-btn');
                    if (button && !googleSheetsConfig.configured) {
                        button.title = 'Google OAuth 설정 전에는 새 시트를 열고 표를 복사합니다.';
                    }
                    return googleSheetsConfig;
                }).catch(function () {
                    googleSheetsConfig = { loaded: true, configured: false, clientId: '' };
                    return googleSheetsConfig;
                });
        }

        function googleSheetTitle() {
            var channelName = String(document.getElementById('print-channel-name').textContent || PRINT_CHANNEL_ID).trim();
            var now = new Date();
            var stamp = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0')
                + ' ' + String(now.getHours()).padStart(2, '0') + '-' + String(now.getMinutes()).padStart(2, '0');
            return channelName + ' 낙찰 배송 정산 ' + stamp;

        function writeGoogleSheetProgress(target, title, message) {
            if (!target || target.closed) return;
            target.document.open();
            target.document.write('<!doctype html><meta charset="utf-8"><title>' + escapePrintHtml(title) + '</title><div style="font-family:Pretendard,sans-serif;display:grid;place-items:center;height:100vh;margin:0;color:#334155;background:#f8fafc"><div style="text-align:center"><b style="font-size:20px">' + escapePrintHtml(title) + '</b><p>' + escapePrintHtml(message) + '</p></div></div>');
            target.document.close();
        }

        function finishGoogleSheetExport(error) {
            var pending = pendingGoogleSheetExport;
            pendingGoogleSheetExport = null;
            if (pending && pending.button) pending.button.disabled = false;
            if (!error) return;
            if (pending && pending.target && !pending.target.closed) pending.target.close();
            alert(error.message || '새 구글시트를 만들지 못했습니다.');
        }

        async function createPendingGoogleSheet(accessToken) {
            var pending = pendingGoogleSheetExport;
            if (!pending) return;
            try {
                writeGoogleSheetProgress(pending.target, '새 구글시트 생성 중', '정산표와 서식을 적용하고 있습니다.');
                var result = await CreoGoogleSheetsExport.createSpreadsheet(accessToken, pending.rows, pending.title);
                if (!pending.target || pending.target.closed) window.open(result.spreadsheetUrl, '_blank', 'noopener');
                else pending.target.location.replace(result.spreadsheetUrl);
                finishGoogleSheetExport();
            } catch (error) {
                if (error && /invalid authentication|invalid credentials|unauthenticated/i.test(error.message || '')) {
                    googleSheetsAccessToken = '';
                    googleSheetsAccessTokenExpiresAt = 0;
                }
                finishGoogleSheetExport(error);
            }
        }

        function ensureGoogleSheetsTokenClient() {
            if (googleSheetsTokenClient) return googleSheetsTokenClient;
            if (!window.google || !google.accounts || !google.accounts.oauth2) return null;
            googleSheetsTokenClient = google.accounts.oauth2.initTokenClient({
                client_id: googleSheetsConfig.clientId,
                scope: 'https://www.googleapis.com/auth/drive.file',
                include_granted_scopes: true,
                callback: function (response) {
                    if (!response || response.error || !response.access_token) {
                        finishGoogleSheetExport(new Error(response && response.error_description || 'Google 계정 승인이 완료되지 않았습니다.'));
                        return;
                    }
                    googleSheetsAccessToken = response.access_token;
                    googleSheetsAccessTokenExpiresAt = Date.now() + Math.max(60, Number(response.expires_in) || 3600) * 1000 - 60000;
                    createPendingGoogleSheet(googleSheetsAccessToken);
                },
                error_callback: function () {
                    finishGoogleSheetExport(new Error('Google 계정 선택 창이 닫혔습니다.'));
                }
            });
            return googleSheetsTokenClient;
        }

            sheet.opener = null;
            button.disabled = true;
            copySettlementRowsForSheets(rows).then(function () {

                sheet.close();
                alert('표 복사에 실패했습니다. 브라우저의 클립보드 권한을 확인해 주세요.');

            var rows = CreoPrintShippingSummary.sheetRows(window._shippingBundleRows || []);
            if (rows.length <= 1) { alert('보낼 낙찰·배송 정보가 없습니다.'); return; }
            if (!googleSheetsConfig.loaded) {

                return;
            }
            if (!googleSheetsConfig.configured) {
                openCopiedRowsInNewGoogleSheet(button, rows);
                return;
            }
            var tokenClient = ensureGoogleSheetsTokenClient();
            if (!tokenClient) {
                alert('Google 연결 기능을 불러오는 중입니다. 잠시 후 다시 눌러 주세요.');
                return;
            }
            var sheet = window.open('about:blank', '_blank');

            button.disabled = true;
            pendingGoogleSheetExport = { button: button, target: sheet, rows: rows, title: googleSheetTitle() };
            if (googleSheetsAccessToken && Date.now() < googleSheetsAccessTokenExpiresAt) {

                return;
            }
            tokenClient.requestAccessToken({ prompt: '' });
        }

                sel.innerHTML += '<option value="' + c + '">' + c + '</option>';
            });
            document.getElementById('company-filter').style.display = 'flex';
            renderCompanyView('');
            renderShippingLabels(items);
            setTimeout(initResize, 100);
        }

        var PRINT_CHANNEL_ID = CreoChannelRuntime.normalizeChannelId(new URLSearchParams(location.search).get('channel'));
        var printChannel = null;

        async function resolvePrintChannelId() {
            if (PRINT_CHANNEL_ID) return PRINT_CHANNEL_ID;
            throw new Error('인쇄할 채널 주소가 없습니다. 메인에서 채널을 다시 선택해 주세요.');
        }

        function syncPrintChannel(channel) {
            printChannel = channel;
            var label = String(channel.name || channel.shortName || PRINT_CHANNEL_ID).trim();
            document.getElementById('print-channel-name').textContent = label;
            document.title = label + ' 인쇄 · CREO';
            var workspace = channel.legacy && channel.legacy.managementUrl
                ? channel.legacy.managementUrl
                : (channel.links && channel.links.workspace || '/channel-workspace.html');
            var url = new URL(workspace, location.href);
            url.searchParams.set('channel', PRINT_CHANNEL_ID);
            document.getElementById('workspace-link').href = url.pathname + url.search;
            document.getElementById('print-login-description').textContent = label + ' 인쇄 자료를 불러오려면 관리자 비밀번호를 입력해 주세요.';
        }

        function renderPrintError(error) {
            var message = String(error && error.message || '인쇄 자료를 불러오지 못했습니다.');
            ['list-body', 'result-body', 'company-body', 'label-item-list'].forEach(function (id) {
                document.getElementById(id).innerHTML = '<div class="loading" style="color:#dc2626"></div>';
                document.getElementById(id).firstElementChild.textContent = '오류: ' + message;
            });
        }

        async function loadPrintData() {
            await resolvePrintChannelId();
            var payload = await CreoPlatform.api('channels/' + encodeURIComponent(PRINT_CHANNEL_ID));
            var channel = payload.channel;
            if (!channel) throw new Error('인쇄 채널을 찾을 수 없습니다.');
            syncPrintChannel(channel);

            if (channel.dataAdapter === 'legacy-cdcup') {
                return typeof getItems === 'function' ? getItems() : [];
            }

            var adapter = typeof CreoChannelAdapters !== 'undefined' ? CreoChannelAdapters.resolve(channel) : null;
            if (!adapter || typeof adapter.loadShippingItems !== 'function') {
                throw new Error('이 채널의 인쇄 데이터 연결 방식이 설정되지 않았습니다.');
            }
            return adapter.loadShippingItems({ channel: channel });
        }

        async function initializePrint() {
            try {
                var items = await loadPrintData();
                document.getElementById('print-login').hidden = true;
                renderAll(items || []);
                applySettings();
            } catch (error) {
                if (error && error.status === 401) {
                    document.getElementById('print-login').hidden = false;
                    requestAnimationFrame(function () { document.getElementById('print-password').focus(); });
                    return;
                }
                renderPrintError(error);
            }
        }

        document.getElementById('print-login-form').addEventListener('submit', async function (event) {
            event.preventDefault();
            var input = document.getElementById('print-password');
            var error = document.getElementById('print-login-error');
            error.textContent = '';
            try {
                CreoPlatform.setAdmin(input.value);
                if (!await CreoPlatform.verifyAdmin(input.value)) throw new Error('비밀번호가 맞지 않습니다.');
                input.value = '';
                await initializePrint();
            } catch (failure) {
                CreoPlatform.setAdmin('');
                error.textContent = failure.message || '로그인하지 못했습니다.';
            }
        });

        loadGoogleSheetsConfig();
        initializePrint();

        function applySettings() {
            var fs = document.getElementById('ctrl-font').value;
            var pd = document.getElementById('ctrl-pad').value;
            document.getElementById('lbl-font').textContent = fs;
            document.getElementById('lbl-pad').textContent = pd;
            document.querySelectorAll('table').forEach(function (t) { t.style.fontSize = fs + 'pt'; });
            document.querySelectorAll('td').forEach(function (d) { d.style.padding = pd + 'px 4px'; });
        }

        var printLandscape = false;
        function toggleOrientation() {
            printLandscape = !printLandscape;
            var style = document.getElementById('print-page-orientation');
            if (!style) {
                style = document.createElement('style');
                style.id = 'print-page-orientation';
                document.head.appendChild(style);
            }
            style.textContent = '@media print{@page{size:' + (printLandscape ? 'landscape' : 'portrait') + ';margin:8mm 5mm}}';
            document.getElementById('orientation-btn').textContent = printLandscape ? '세로' : '가로';
        }

        // ── 컬럼 리사이즈 ──
        function initResize() {
            document.querySelectorAll('.tab-content.active table').forEach(function (tbl) {
                Array.from(tbl.querySelectorAll('thead th')).forEach(function (th) {
                    if (th.querySelector('.resize-handle')) return;
                    var handle = document.createElement('div');
                    handle.className = 'resize-handle';
                    th.appendChild(handle);
                    handle.addEventListener('mousedown', function (e) {
                        e.preventDefault(); e.stopPropagation();
                        var colIdx = Array.from(th.parentNode.children).indexOf(th);
                        lockTable(tbl);
                        var startX = e.pageX, startW = th.offsetWidth;
                        function onMove(ev) { th.style.width = Math.max(10, startW + ev.pageX - startX) + 'px'; }
                        function onUp() { document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); }
                        document.addEventListener('mousemove', onMove);
                        document.addEventListener('mouseup', onUp);
                    });
                    handle.addEventListener('dblclick', function (e) {
                        e.preventDefault();
                        var colIdx = Array.from(th.parentNode.children).indexOf(th);
                        lockTable(tbl);
                        th.style.width = measureColumnWidth(tbl, colIdx) + 'px';
                    });
                });
            });
        }

        function lockTable(tbl) {
            if (tbl.dataset.locked) return;
            var allTh = Array.from(tbl.querySelectorAll('thead th'));
            var widths = allTh.map(function (h) { return h.offsetWidth; });
            tbl.style.width = tbl.offsetWidth + 'px';
            tbl.style.tableLayout = 'fixed';
            allTh.forEach(function (h, i) { h.style.width = widths[i] + 'px'; });
            tbl.dataset.locked = '1';
        }

        function measureColumnWidth(tbl, colIdx) {
            var span = document.createElement('span');
            span.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap;font:inherit;padding:0 8px;';
            document.body.appendChild(span);
            var maxW = 0;
            var th = tbl.querySelectorAll('thead th')[colIdx];
            if (th) { span.textContent = th.textContent; maxW = Math.max(maxW, span.offsetWidth); }
            tbl.querySelectorAll('tbody tr').forEach(function (tr) {
                var td = tr.children[colIdx];
                if (td) { span.textContent = td.textContent; maxW = Math.max(maxW, span.offsetWidth); }
            });
            document.body.removeChild(span);
            return Math.max(maxW + 4, 20);
        }

        // ── 업체 필터 ──
        function onCompanyFilterChange() {
            renderCompanyView(document.getElementById('company-select').value);
            setTimeout(initResize, 100);
        }

        // ── 업체별 뷰 ──
        var MULTI_COLORS = ['#2563EB', '#DC2626', '#059669', '#D97706', '#7C3AED', '#DB2777', '#0891B2', '#4F46E5'];

        function renderCompanyView(selectedCompany) {
            var items = window._allItems || [];
            var dateStr = window._dateStr || '';
            var totalSales = window._totalSales || 0;
            var companyOrder = window._companyOrder || [];

            // 전화번호 기준 구매자 그룹핑
            var soldItems = items.filter(function (it) { return CreoAuctionContract.isSoldStatus(it.status); });
            var buyerMap = {};
            soldItems.forEach(function (it) {
                var w = parseWinner(it.winner);
                var phone = (w.phone || '').replace(/[^0-9]/g, '');
                if (!phone) return;
                if (!buyerMap[phone]) buyerMap[phone] = [];
                buyerMap[phone].push(it);
            });

            // 2개 이상 업체에서 구매한 사람
            var multiPhones = {};
            Object.keys(buyerMap).forEach(function (phone) {
                var companies = {};
                buyerMap[phone].forEach(function (it) {
                    companies[(it.company || '').trim() || '(업체 미입력)'] = true;
                });
                if (Object.keys(companies).length >= 2) multiPhones[phone] = true;
            });

            var multiCount = Object.keys(multiPhones).length;
            document.getElementById('filter-info').innerHTML = multiCount > 0
                ? '<span class="multi-badge">⚠ 다중구매 ' + multiCount + '명</span>' : '';

            // 색상 매핑
            var phoneColors = {};
            var ci = 0;
            Object.keys(multiPhones).forEach(function (ph) {
                phoneColors[ph] = MULTI_COLORS[ci % MULTI_COLORS.length]; ci++;
            });

            // 업체별 그룹핑
            var companyMap = {};
            items.forEach(function (it) {
                var c = (it.company || '').trim() || '(업체 미입력)';
                if (!companyMap[c]) companyMap[c] = [];
                companyMap[c].push(it);
            });

            // ── 단일 테이블 렌더링 (전체 & 필터 공통) ──
            var chtml = '<div style="font-size:10pt;color:#666;margin-bottom:8px;">'
                + dateStr + ' · ' + companyOrder.length + '개 업체 / 전체 ' + items.length + '건 · 총매출 ' + fmtPrice(totalSales)
                + '</div>';

            chtml += '<div class="company-view-wrapper" id="company-wrapper">';
            chtml += '<table id="company-filtered-table">';
            chtml += '<thead><tr><th>업체</th><th>개체명</th><th>이름</th><th>전화번호</th><th>낙찰가</th><th>배송</th><th>배송비</th><th>상태</th></tr></thead>';
            chtml += '<tbody>';

            var rowIndex = 0;
            var phoneRowMap = {};

            // 표시할 업체 목록 결정
            var displayCompanies = selectedCompany ? [selectedCompany] : companyOrder;
            // 선택 업체가 있으면, 관련 다른 업체도 추가
            var relatedCompanies = [];
            if (selectedCompany) {
                var selItems = companyMap[selectedCompany] || [];
                selItems.forEach(function (it) {
                    var w = parseWinner(it.winner);
                    var phone = (w.phone || '').replace(/[^0-9]/g, '');
                    if (phone && multiPhones[phone]) {
                        buyerMap[phone].forEach(function (bi) {
                            var bc = (bi.company || '').trim() || '(업체 미입력)';
                            if (bc !== selectedCompany && relatedCompanies.indexOf(bc) < 0) {
                                relatedCompanies.push(bc);
                            }
                        });
                    }
                });
                displayCompanies = displayCompanies.concat(relatedCompanies);
            }

            displayCompanies.forEach(function (company) {
                var list = companyMap[company] || [];
                if (list.length === 0) return;

                var companySold = list.filter(function (it) { return CreoAuctionContract.isSoldStatus(it.status); });
                var companySales = 0;
                companySold.forEach(function (it) { companySales += parseFloat(it.soldPrice || 0) || 0; });

                var isOther = selectedCompany && company !== selectedCompany;

                list.forEach(function (it, idx) {
                    var w = parseWinner(it.winner);
                    var phone = (w.phone || '').replace(/[^0-9]/g, '');
                    var isMulti = phone && multiPhones[phone];

                    if (isMulti) {
                        if (!phoneRowMap[phone]) phoneRowMap[phone] = [];
                        phoneRowMap[phone].push(rowIndex);
                    }

                    var clsList = [];
                    if (isMulti) clsList.push('multi-buyer-row');
                    if (isOther) clsList.push('other-company-row');
                    else if (selectedCompany) clsList.push('selected-company-row');

                    var st = it.status || '';
                    var statusCls = '', statusText = '';
                    if (CreoAuctionContract.isSoldStatus(st)) { statusCls = 'status-sold'; statusText = '낙찰'; }
                    else if (CreoAuctionContract.normalizeStatus(st) === CreoAuctionContract.STATUS.PASSED) { statusCls = 'status-unsold'; statusText = '유찰'; }
                    else if (CreoAuctionContract.normalizeStatus(st) === CreoAuctionContract.STATUS.CANCELLED) { statusCls = 'status-unsold'; statusText = '취소'; }

                    chtml += '<tr' + (clsList.length ? ' class="' + clsList.join(' ') + '"' : '') + ' data-phone="' + phone + '">';
                    if (idx === 0) {
                        var compStyle = isOther
                            ? 'vertical-align:top;border-right:2px solid #eee;color:#999;'
                            : 'font-weight:900;vertical-align:top;border-right:2px solid #ddd;';
                        chtml += '<td class="col-company" rowspan="' + list.length + '" style="' + compStyle + '">'
                            + company + '<br><span style="font-size:9pt;font-weight:500;color:#888;">' + fmtPrice(companySales) + '</span></td>';
                    }
                    chtml += '<td class="col-item-name">' + formatItemCodeName(it) + '</td>';
                    chtml += '<td class="col-winner">' + (w.name || '-') + '</td>';
                    chtml += '<td class="col-phone">' + (fmtPhone(w.phone) || '-') + '</td>';
                    chtml += '<td class="col-result-price">' + (it.soldPrice ? fmtPrice(it.soldPrice) : '-') + '</td>';
                    chtml += '<td class="col-ship">' + shippingText(it) + '</td>';
                    chtml += '<td class="col-ship-cost">' + fmtShippingCost(it) + '</td>';
                    chtml += '<td class="col-status">' + getStatusBadge(it) + '</td>';
                    chtml += '</tr>';
                    rowIndex++;
                });
            });

            chtml += '</tbody></table></div>';
            document.getElementById('company-body').innerHTML = chtml;

            // 연결선 데이터 저장 (탭 전환 시 다시 그리기용)
            window._phoneRowMap = phoneRowMap;
            window._phoneColors = phoneColors;

            // 탭이 보일 때만 연결선 그리기
            var companyTab = document.getElementById('tab-company');
            if (companyTab && companyTab.classList.contains('active')) {
                setTimeout(function () { drawConnectionLines(phoneRowMap, phoneColors); }, 150);
            }
        }

        // ── div 기반 연결선 ──
        function drawConnectionLines(phoneRowMap, phoneColors) {
            var wrapper = document.getElementById('company-wrapper');
            var table = document.getElementById('company-filtered-table');
            if (!wrapper || !table) return;

            wrapper.querySelectorAll('.conn-line').forEach(function (el) { el.remove(); });

            var wrapperRect = wrapper.getBoundingClientRect();
            var trs = table.querySelectorAll('tbody tr');
            var phoneKeys = Object.keys(phoneRowMap);

            // 낙찰자 컬럼(th[4])의 왼쪽 X
            var winnerX = 0;
            var ths = table.querySelectorAll('thead th');
            if (ths[4]) {
                winnerX = ths[4].getBoundingClientRect().left - wrapperRect.left - 6;
            }

            var xStep = Math.min(10, Math.max(4, 30 / Math.max(phoneKeys.length, 1)));

            phoneKeys.forEach(function (phone, pIdx) {
                var rows = phoneRowMap[phone];
                if (rows.length < 2) return;

                var color = phoneColors[phone] || '#2563EB';
                var x = winnerX - (phoneKeys.length - pIdx) * xStep;

                var positions = [];
                rows.forEach(function (rIdx) {
                    if (rIdx < trs.length) {
                        var trRect = trs[rIdx].getBoundingClientRect();
                        positions.push(trRect.top - wrapperRect.top + trRect.height / 2);
                    }
                });
                if (positions.length < 2) return;

                var topY = positions[0], bottomY = positions[positions.length - 1];

                // 세로선
                var vLine = document.createElement('div');
                vLine.className = 'conn-line conn-v';
                vLine.style.cssText = 'left:' + x + 'px;top:' + topY + 'px;height:' + (bottomY - topY) + 'px;background:' + color + ';';
                wrapper.appendChild(vLine);

                // 가로 눈금
                positions.forEach(function (y) {
                    var hLine = document.createElement('div');
                    hLine.className = 'conn-line conn-h';
                    hLine.style.cssText = 'left:' + x + 'px;top:' + (y - 1) + 'px;width:8px;background:' + color + ';';
                    wrapper.appendChild(hLine);
                });
            });
        }
    </script>
