<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>방송 예약 관리 · 전국크레자랑</title>
<link rel="stylesheet" href="/checkout-pages.css?v=20260918-design"><link rel="stylesheet" href="/broadcast-booking.css?v=20260922-booking"><script defer src="/platform-client.js"></script><script defer src="/organizer-bookings.js?v=20261006-entry-range"></script></head>
<body class="organizer-page booking-page booking-admin"><a class="booking-skip" href="#booking-main">본문으로 이동</a><div class="booking-shell"><header class="booking-header"><a id="organizer-home" href="/channel-workspace.html?channel=national-cre">← 운영 페이지</a><span>전국크레자랑</span></header>
<main id="booking-main" tabindex="-1"><div class="booking-heading"><p class="booking-eyebrow">월·수요일 오후 8시</p><h1>방송 예약 관리</h1><p class="booking-muted">회차별 부족 물량과 변경 요청을 확인하세요.</p></div>
<p id="admin-status" class="booking-status" role="status">예약을 불러오는 중…</p><p id="admin-error" class="booking-error" role="alert" hidden></p><button id="admin-retry" type="button" class="booking-secondary" hidden>다시 불러오기</button>
<section id="admin-login" class="booking-login" hidden><h2>운영자 확인</h2><form id="login-form"><label for="admin-password">운영자 비밀번호</label><input id="admin-password" type="password" autocomplete="current-password" required><button class="booking-primary" type="submit">로그인</button></form></section>
<div id="admin-content" hidden><div class="booking-toolbar"><label for="session-filter">방송 보기<select id="session-filter"><option value="all">예정된 방송 전체</option><option value="short">32마리 미달</option><option value="pending">변경 응답 대기</option><option value="past">지난 방송 기록</option></select></label><button id="open-regions" class="booking-secondary" type="button">업체 지역 관리</button><button id="open-defaults" class="booking-secondary" type="button">기본 운영 설정</button><button id="admin-refresh" class="booking-text" type="button">새로고침</button></div>
<p><a href="/national-vendors.html" class="booking-text">업체 관리</a></p><p id="admin-summary" class="booking-muted booking-intro"></p><div id="session-list" class="booking-admin-grid"></div></div></main><footer class="booking-footer">확정 예약만 최소 물량에 포함합니다. 모집 가능 지역은 확보된 물량이 아닙니다.</footer></div>
<dialog id="admin-dialog" class="booking-dialog" aria-labelledby="admin-dialog-heading"><header><h2 id="admin-dialog-heading"></h2><button id="admin-close" type="button" class="booking-icon" aria-label="설정 닫기">×</button></header><div id="admin-dialog-body"></div><p id="admin-dialog-error" class="booking-error" role="alert" hidden></p><div id="admin-dialog-actions" class="booking-actions"></div></dialog>
</body></html>
