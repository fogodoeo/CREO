<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="referrer" content="no-referrer">
    <title>낙찰·배송 확인</title>
    <link rel="stylesheet" href="/checkout-ui.css?v=20260902-checkout-shell-v1">
    <script src="/checkout-client.js?v=20260904-shared-v1"></script>
    <style>
        :root{--checkout-width:680px;--item-index-width:44px;--item-font-size:13px}
        main{padding:20px 20px 112px}.section{margin-top:28px}.section:first-child{margin-top:0}.head{display:flex;align-items:end;justify-content:space-between;margin-bottom:11px}.head h2{margin:0;font-size:16px}.head span{color:var(--muted);font-size:11px}.item{padding:12px 2px}.item small{font-weight:800}
        .saved{margin-top:15px;padding:13px 14px;border:1px solid #cfe4da;border-radius:11px;background:#f0f8f4;color:var(--green);font-size:12px;line-height:1.5}.saved b{display:block;font-size:14px}.choices{display:grid;gap:8px}.choice{width:100%;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:left;cursor:pointer}.choice b{display:block;font-size:14px}.choice small{display:block;margin-top:3px;color:var(--muted);font-size:11px}.choice i{width:18px;height:18px;border:1.5px solid #b9bdc3;border-radius:50%}.choice.selected{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}.choice.selected i{border:5px solid var(--ink)}
        .parge{display:grid;gap:9px;margin-top:9px;padding:13px;border-radius:12px;background:var(--soft)}.search{height:44px;padding:0 12px;border:1px solid #d7d9dc;border-radius:9px;background:#fff;outline:0}.tabs{display:flex;gap:5px;overflow:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{flex:0 0 auto;height:29px;padding:0 10px;border:1px solid #d9dbde;border-radius:99px;background:#fff;color:var(--muted);font-size:11px;font-weight:800}.tab.active{border-color:var(--ink);background:var(--ink);color:#fff}.results{display:grid;gap:6px;max-height:270px;overflow:auto}.result{display:grid;grid-template-columns:1fr auto;gap:3px 10px;width:100%;padding:10px 11px;border:1px solid #dddfe1;border-radius:9px;background:#fff;text-align:left}.result.selected{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}.result b{font-size:13px}.result small{color:var(--muted);font-size:10px}.result strong{grid-row:1/3;grid-column:2;align-self:center;font-size:13px}.note{margin:0 2px;color:var(--muted);font-size:10px;line-height:1.5}.privacy{margin-top:22px;color:#898d94;font-size:10px;line-height:1.6}
        .footer{position:fixed;left:50%;bottom:0;z-index:10;width:min(680px,100%);padding:11px 20px calc(11px + env(safe-area-inset-bottom));transform:translateX(-50%);border-top:1px solid var(--line);background:rgba(255,255,255,.96);backdrop-filter:blur(10px)}.submit{width:100%;height:51px;border:0;border-radius:11px;background:#181a1e;color:#fff;font-size:14px;font-weight:900}.submit:disabled{background:#c8cacc}.error button{height:40px;margin-top:16px;padding:0 17px;border:0;border-radius:9px;background:#222;color:#fff;font-weight:800}@media(max-width:420px){.footer{padding-left:16px;padding-right:16px}}
    </style>
</head>
<body><div class="shell">
    <div class="loading" id="loading"><b>낙찰 정보를 확인하고 있습니다</b><span>잠시만 기다려 주세요.</span></div>
    <div class="error" id="error" hidden><b>페이지를 열 수 없습니다</b><span id="error-message"></span><button id="retry" type="button">다시 시도</button></div>
    <div id="app" hidden>
        <header class="top"><div class="brand"><b>CREO DELIVERY</b><div class="brand-right"><span id="channel-name"></span><i class="sync" id="sync" role="status">실시간</i></div></div><h1><span id="buyer-name"></span>님 낙찰·배송</h1><p class="lead">낙찰 내역을 확인하고 수령지를 선택해 주세요.</p><div class="saved" id="saved" role="status" aria-live="polite" hidden><b>수령 정보가 저장되었습니다.</b><span>선택한 내용은 판매 업체에 전달됩니다.</span></div></header>
        <main>
            <section class="section"><div class="head"><h2>낙찰 내역</h2><span id="item-count"></span></div><div class="items" id="items"></div></section>
            <section class="section"><div class="head"><h2>수령지 선택</h2><span>전체 낙찰 공통</span></div><div class="choices" id="destinations"></div><div class="parge" id="parge" hidden><input class="search" id="parge-search" placeholder="지역 또는 파르게 수령 지점 검색" autocomplete="off"><div class="tabs" id="parge-tabs"></div><div class="results" id="parge-results"></div><p class="note" id="parge-note"></p></div></section>
            <p class="privacy">이 링크에는 개인 낙찰 내역이 포함됩니다. 다른 사람에게 전달하지 마세요. 새 낙찰은 같은 링크에 자동으로 반영됩니다.</p>
        </main>
        <footer class="footer"><button class="submit" id="submit" type="button" disabled>수령 정보 저장</button></footer>
    </div>
</div><script>
(()=>{'use strict';
const Checkout=window.CreoCheckoutClient,params=new URLSearchParams(location.search),client=Checkout.createClient({location,endpoint:'/api/platform/buyer-delivery',shortPrefix:'d',apiOrigin:params.get('apiOrigin')||''});
const $=Checkout.byId,esc=Checkout.escapeHtml,money=Checkout.money,uuid=Checkout.requestId;
const state={data:null,destinationId:'',pargeRegion:'',pargeShop:'',query:'',region:'전체',saving:false,saved:false,dirty:false};
const CHO=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function chosung(value){let out='';for(const ch of String(value||'')){const n=ch.charCodeAt(0);out+=n>=0xAC00&&n<=0xD7A3?CHO[Math.floor((n-0xAC00)/588)]:ch}return out}
const norm=value=>String(value||'').replace(/\s+/g,' ').trim().toLowerCase(),destination=()=>state.data?.destinations?.find(row=>row.id===state.destinationId),rates=()=>state.data?.parge?.regions||[],selectedRate=()=>rates().find(row=>row.region===state.pargeRegion)?.shops?.find(row=>row.name===state.pargeShop)||null;
async function api(body=null){return client.request('',body)}
function renderDestinations(){$('destinations').innerHTML=(state.data.destinations||[]).map(row=>`<button class="choice ${row.id===state.destinationId?'selected':''}" type="button" data-dest="${esc(row.id)}"><span><b>${esc(row.label)}</b><small>${row.type==='parge'?'파르게 수령 지점을 검색합니다.':'직접 수령하는 장소입니다.'}</small></span><i></i></button>`).join('');$('destinations').querySelectorAll('[data-dest]').forEach(button=>button.onclick=()=>{state.destinationId=button.dataset.dest;state.saved=false;state.dirty=true;if(destination()?.type!=='parge'){state.pargeRegion='';state.pargeShop=''}render()})}
function allRates(){return rates().flatMap(group=>(group.shops||[]).map(shop=>({region:group.region,...shop})))}
function renderParge(){const visible=destination()?.type==='parge';$('parge').hidden=!visible;if(!visible)return;const regions=['전체',...rates().map(group=>group.region)];$('parge-search').value=state.query;$('parge-tabs').innerHTML=regions.map(region=>`<button class="tab ${region===state.region?'active':''}" type="button" data-region="${esc(region)}">${esc(region)}</button>`).join('');$('parge-tabs').querySelectorAll('[data-region]').forEach(button=>button.onclick=()=>{state.region=button.dataset.region;state.query='';renderParge()});let rows=allRates().filter(row=>state.region==='전체'||row.region===state.region),words=norm(state.query).split(/\s+/).filter(Boolean);if(words.length)rows=rows.filter(row=>words.every(word=>norm(`${row.region} ${row.name}`).includes(word)||chosung(`${row.region} ${row.name}`).includes(word)));rows=rows.slice(0,40);$('parge-results').innerHTML=rows.length?rows.map(row=>`<button class="result ${row.region===state.pargeRegion&&row.name===state.pargeShop?'selected':''}" type="button" data-shop="${esc(row.name)}" data-shop-region="${esc(row.region)}"><b>${esc(row.name)}</b><small>${esc(row.region)} · 기본 ${money(row.baseCost)}</small><strong>${money(row.baseCost)}</strong></button>`).join(''):'<p class="note">검색 결과가 없습니다.</p>';$('parge-results').querySelectorAll('[data-shop]').forEach(button=>button.onclick=()=>{state.pargeRegion=button.dataset.shopRegion;state.pargeShop=button.dataset.shop;state.query=`${state.pargeRegion} ${state.pargeShop}`;state.saved=false;state.dirty=true;render()});const extra=state.pargeRegion.includes('제주')?state.data.parge.jejuAdditionalFee:state.data.parge.additionalFee;$('parge-note').textContent=`첫 배송비 이후 추가 개체당 ${money(extra)}이 적용됩니다.`}
function render(){const data=state.data;$('channel-name').textContent=data.channel.name;$('buyer-name').textContent=data.buyer.name;$('item-count').textContent=`${data.items.length}개체`;$('items').innerHTML=data.items.map(item=>`<div class="item"><small>${String(item.lotNumber).padStart(2,'0')}</small><b>${esc(item.vendorName)} · ${esc(item.name)}</b><strong>${money(item.soldAmount)}</strong></div>`).join('');$('saved').hidden=!state.saved;renderDestinations();renderParge();const valid=destination()&&(destination().type!=='parge'||selectedRate());$('submit').disabled=state.saving||!valid;$('submit').textContent=state.saving?'저장 중…':data.submittedAt?'수령 정보 변경':'수령 정보 저장';$('loading').hidden=true;$('error').hidden=true;$('app').hidden=false}
function hydrate(data,preserveDraft=false){const draft=preserveDraft&&state.dirty?{destinationId:state.destinationId,pargeRegion:state.pargeRegion,pargeShop:state.pargeShop,query:state.query,region:state.region}:null;state.data=data;state.destinationId=draft?.destinationId||data.selection?.destinationId||'';state.pargeRegion=draft?.pargeRegion||data.selection?.pargeRegion||'';state.pargeShop=draft?.pargeShop||data.selection?.pargeShop||'';state.query=draft?.query??(state.pargeShop?`${state.pargeRegion} ${state.pargeShop}`:'');state.region=draft?.region||'전체';state.dirty=Boolean(draft);render()}
async function load(silent=false,preserveDraft=false){if(!client.valid)return showError('배송 링크 주소가 올바르지 않습니다.');if(!silent){$('loading').hidden=false;$('app').hidden=true}try{hydrate(await api(),preserveDraft);return true}catch(error){if(!silent)showError(error.message||'배송 정보를 불러오지 못했습니다.');return false}}
function showError(message){$('loading').hidden=true;$('app').hidden=true;$('error').hidden=false;$('error-message').textContent=message}
async function save(){if($('submit').disabled)return;state.saving=true;render();try{const data=await api({requestId:uuid(),destinationId:state.destinationId,pargeRegion:state.pargeRegion,pargeShop:state.pargeShop});state.dirty=false;state.saved=true;hydrate(data);state.saved=true;render();revisionSync.publish('방금 반영','live');$('saved').scrollIntoView({behavior:'smooth',block:'center'})}catch(error){alert(error.message||'저장하지 못했습니다.')}finally{state.saving=false;render()}}
const revisionSync=Checkout.createRevisionSync({document,fetchRevision:()=>client.revision(state.data.channel.id),currentRevision:()=>state.data?.revision,isReady:()=>!!state.data,isBusy:()=>state.saving,hasDraft:()=>state.dirty,refresh:()=>load(true,true),onStatus:(text,stateName)=>{if($('sync')){$('sync').textContent=text;$('sync').dataset.state=stateName}}});
const poller=Checkout.createAdaptivePoller(revisionSync.poll,{document});window.addEventListener('pagehide',()=>{poller.stop();revisionSync.stop()},{once:true});$('parge-search').oninput=event=>{state.query=event.target.value;if(norm(state.query)!==norm(`${state.pargeRegion} ${state.pargeShop}`)){state.pargeRegion='';state.pargeShop=''}state.saved=false;state.dirty=true;renderParge()};$('submit').onclick=save;$('retry').onclick=()=>load();load().finally(()=>poller.start(300));
})();</script></body></html>
