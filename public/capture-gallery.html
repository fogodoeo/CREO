<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#0b0d10">
    <title>본체 캡처 · CREO</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <script src="platform-client.js?v=20260803-admin-session-v2" defer></script>
    <style>
        :root{color-scheme:dark;--bg:#0b0d10;--panel:#12151a;--panel2:#181c22;--line:#2b3139;--text:#f4f5f7;--muted:#8e97a4;--accent:#d9ae59;--danger:#ff8f8f}*{box-sizing:border-box}html,body{min-height:100%;margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,sans-serif}button,input,select,a{font:inherit}[hidden]{display:none!important}.shell{width:min(1180px,calc(100% - 28px));margin:auto;padding:16px 0 52px}.topbar{display:flex;min-height:52px;align-items:center;gap:12px;border-bottom:1px solid #20252c}.brand{color:#fff;font-size:13px;font-weight:950;letter-spacing:.14em;text-decoration:none}.topbar nav{display:flex;gap:5px;margin-left:auto}.topbar nav a{height:34px;padding:0 11px;border-radius:8px;color:var(--muted);font-size:10px;font-weight:800;line-height:34px;text-decoration:none}.topbar nav a:hover{background:var(--panel2);color:#fff}.head{display:flex;align-items:end;justify-content:space-between;gap:18px;margin:34px 0 16px}.head h1{margin:0;font-size:27px;letter-spacing:-.045em}.head p{margin:6px 0 0;color:var(--muted);font-size:11px}.filters{display:flex;gap:8px}.filters select,.filters button{height:42px;border:1px solid #343b45;border-radius:9px;background:#11151a;color:#fff;font-size:11px;font-weight:800}.filters select{min-width:210px;padding:0 36px 0 12px}.filters button{padding:0 15px;cursor:pointer}.summary{margin:0 0 12px;color:#737d89;font-size:10px;font-weight:750}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{overflow:hidden;border:1px solid var(--line);border-radius:14px;background:var(--panel)}.thumb{position:relative;aspect-ratio:16/9;background:#080a0d}.thumb img{display:block;width:100%;height:100%;object-fit:contain}.thumb .state{position:absolute;top:9px;right:9px;padding:5px 7px;border:1px solid #ffffff1c;border-radius:7px;background:#000c;color:#ddd;font-size:8px;font-weight:900;letter-spacing:.08em}.body{padding:13px}.body small{color:#7f8996;font-size:9px;font-weight:850}.body h2{overflow:hidden;margin:5px 0 3px;font-size:15px;text-overflow:ellipsis;white-space:nowrap}.body p{margin:0;color:#8e97a4;font-size:10px}.actions{display:flex;gap:6px;margin-top:12px}.actions a,.actions button{display:flex;height:34px;align-items:center;justify-content:center;padding:0 10px;border:1px solid #343b45;border-radius:8px;background:#171b20;color:#d8dde4;font-size:9px;font-weight:850;text-decoration:none;cursor:pointer}.actions a{flex:1;border-color:#725f38;background:#d9ae59;color:#191207}.actions button:hover{border-color:#596271}.empty{grid-column:1/-1;padding:70px 20px;border:1px dashed #303640;border-radius:14px;color:#69727e;text-align:center}.login{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#090b0e}.login form{width:min(380px,calc(100% - 30px));padding:26px;border:1px solid var(--line);border-radius:16px;background:var(--panel)}.login h1{margin:0 0 18px;font-size:18px}.login input,.login button{width:100%;height:44px;border-radius:9px}.login input{padding:0 12px;border:1px solid #353c46;background:#090c10;color:#fff}.login button{margin-top:8px;border:0;background:var(--accent);color:#171106;font-weight:900}.error{min-height:18px;margin:8px 0 0;color:var(--danger);font-size:10px}@media(max-width:880px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:620px){.head{align-items:stretch;flex-direction:column}.filters{display:grid;grid-template-columns:1fr auto}.filters select{min-width:0}.grid{grid-template-columns:1fr}}
    </style>
</head>
<body>
<section class="login" id="login-gate">
    <form id="login-form"><h1>본체 캡처 관리</h1><input id="admin-password" type="password" autocomplete="current-password" placeholder="관리자 비밀번호" required><button type="submit">입장</button><p class="error" id="login-error"></p></form>
</section>
<main class="shell" id="app" hidden>
    <header class="topbar"><a class="brand" href="/">CREO CAPTURE</a><nav><a id="studio-link" href="broadcast-studio.html">방송 관리</a><a href="capture-setup.html">본체 설정</a><a href="/">메인</a></nav></header>
    <section class="head"><div><h1>본체 캡처</h1><p>모든 경매 채널의 캡처 사진을 한곳에서 조회하고 내려받습니다.</p></div><div class="filters"><select id="channel-select" aria-label="캡처 채널"></select><button id="refresh" type="button">새로고침</button></div></section>
    <p class="summary" id="summary">불러오는 중</p><section class="grid" id="grid"></section>
</main>
<script>
document.addEventListener('DOMContentLoaded',()=>{
    const $=id=>document.getElementById(id),gate=$('login-gate'),app=$('app'),form=$('login-form'),password=$('admin-password'),error=$('login-error'),select=$('channel-select'),grid=$('grid'),summary=$('summary');
    const requested=String(new URLSearchParams(location.search).get('channel')||'all').toLowerCase().replace(/[^a-z0-9-]/g,'')||'all';let channels=[];
    const esc=value=>CreoPlatform.escapeHtml(value);const channelName=id=>channels.find(channel=>channel.id===id)?.name||id;
    async function captureRequest(path,options={}){const response=await fetch(`/api/capture/${path}`,{credentials:'same-origin',cache:'no-store',...options,headers:{...(options.body?{'Content-Type':'application/json'}:{}),...(options.headers||{})}});const payload=await response.json().catch(()=>({}));if(!response.ok)throw new Error(payload.error||`캡처 연결 오류 ${response.status}`);return payload}
    function downloadUrl(row){const url=new URL(row.imageUrl,location.href);url.searchParams.set('download','1');return `${url.pathname}${url.search}`}
    function render(rows){summary.textContent=`${select.value==='all'?'전체 채널':channelName(select.value)} · ${rows.length}개`;if(!rows.length){grid.innerHTML='<div class="empty">저장된 캡처가 없습니다.</div>';return}grid.innerHTML=rows.map(row=>`<article class="card"><div class="thumb">${row.imageUrl?`<img src="${esc(row.imageUrl)}" alt="${esc(row.itemName)} 캡처">`:''}<span class="state">${esc(row.status)}</span></div><div class="body"><small>${esc(channelName(row.channelId))} · #${Number(row.itemNumber)||0}</small><h2>${esc(row.itemName||'개체')}</h2><p>${esc(row.vendorName||'업체 미지정')} · ${esc(row.capturedAt||row.requestedAt||'')}</p><div class="actions">${row.imageUrl?`<a href="${esc(downloadUrl(row))}" download>다운로드</a>`:''}<button type="button" data-delete="${esc(row.channelId)}|${esc(row.id)}">삭제</button></div></div></article>`).join('');grid.querySelectorAll('[data-delete]').forEach(button=>button.onclick=()=>removeCapture(button))}
    async function loadCaptures(){summary.textContent='불러오는 중';grid.innerHTML='';try{const ids=select.value==='all'?channels.map(channel=>channel.id):[select.value];const payloads=await Promise.all(ids.map(id=>captureRequest(`channel/${encodeURIComponent(id)}`)));const rows=payloads.flatMap(payload=>payload.captures||[]).sort((a,b)=>String(b.capturedAt||b.requestedAt||'').localeCompare(String(a.capturedAt||a.requestedAt||'')));render(rows);const query=select.value==='all'?'':`?channel=${encodeURIComponent(select.value)}`;history.replaceState(null,'',`capture-gallery.html${query}`);$('studio-link').href=select.value==='all'?'broadcast-studio.html':`broadcast-studio.html?channel=${encodeURIComponent(select.value)}`}catch(failure){summary.textContent=failure.message||'캡처를 불러오지 못했습니다.';grid.innerHTML='<div class="empty">캡처 연결을 확인해 주세요.</div>'}}
    async function removeCapture(button){if(!confirm('이 캡처 사진을 삭제할까요?'))return;const [channel,id]=button.dataset.delete.split('|');button.disabled=true;try{await captureRequest(`channel/${encodeURIComponent(channel)}/${encodeURIComponent(id)}`,{method:'DELETE'});await loadCaptures()}catch(failure){alert(failure.message);button.disabled=false}}
    async function boot(){const data=await CreoPlatform.api('channels');channels=data.channels||[];select.innerHTML=`<option value="all">전체 채널</option>`+channels.map(channel=>`<option value="${esc(channel.id)}">${esc(channel.name)}</option>`).join('');select.value=channels.some(channel=>channel.id===requested)?requested:'all';gate.hidden=true;app.hidden=false;await loadCaptures()}
    select.onchange=loadCaptures;$('refresh').onclick=loadCaptures;form.onsubmit=async event=>{event.preventDefault();error.textContent='';try{CreoPlatform.setAdmin(password.value);if(!await CreoPlatform.verifyAdmin(password.value))throw new Error('비밀번호가 맞지 않습니다.');password.value='';await boot()}catch(failure){CreoPlatform.setAdmin('');error.textContent=failure.message||'로그인하지 못했습니다.'}};(async()=>{try{if(await CreoPlatform.verifyAdmin())return boot()}catch(_){}gate.hidden=false})();
});
</script>
</body>
</html>
