<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>순위표 이동</title></head>
<body>
  <p>채널별 종합 순위표로 이동합니다.</p>
  <script>
    const params=new URLSearchParams(location.search);const channel=String(params.get('channel')||'').replace(/[^a-z0-9-]/g,'');location.replace(`ranking.html${channel?`?channel=${encodeURIComponent(channel)}`:''}`);
  </script>
</body>
</html>
