<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>종합순위표 · CREO</title>
  <script src="platform-client.js?v=20260803-admin-session-v2"></script>
  <style>
    :root{color-scheme:light;--bg:#f5f6f8;--panel:#fff;--line:#e0e4ea;--text:#15191f;--muted:#737d89;--accent:#254ac7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard Variable",Pretendard,sans-serif;letter-spacing:-.018em}.shell{width:min(1100px,calc(100% - 30px));margin:auto;padding:30px 0 70px}.head{display:flex;align-items:end;justify-content:space-between;gap:20px}.eyebrow{color:var(--accent);font-size:10px;font-weight:900;letter-spacing:.12em}.head h1{margin:6px 0 0;font-size:30px}.head p{margin:7px 0 0;color:var(--muted);font-size:11px}.boards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:24px}.board{overflow:hidden;border:1px solid var(--line);border-radius:14px;background:var(--panel)}.board-head{display:flex;justify-content:space-between;gap:10px;padding:16px;background:#fafbfc}.board-head h2{margin:0;font-size:15px}.board-head span{color:var(--muted);font-size:10px}.board table{width:100%;border-collapse:collapse}.board th,.board td{padding:12px 14px;border-top:1px solid #edf0f3;text-align:left;font-size:12px}.board th{color:var(--muted);font-size:9px}.num{text-align:right;font-variant-numeric:tabular-nums}.rank{width:48px;color:var(--muted);text-align:center!important}.empty{padding:60px 18px;border:1px dashed #cfd5dd;border-radius:12px;color:var(--muted);text-align:center}.error{margin-top:20px;padding:14px;border-radius:10px;background:#fff0f0;color:#a3313c;font-size:12px}@media(max-width:720px){.shell{width:calc(100% - 22px);padding-top:20px}.head{display:block}.boards{grid-template-columns:1fr}.board th,.board td{padding:10px 11px}}
  </style>
</head>
<body>
  <main class="shell"><header class="head"><div><div class="eyebrow">CHANNEL RANKING</div><h1 id="title">종합순위표</h1><p>현재 채널 운영 데이터에서 실시간으로 집계합니다.</p></div><div id="updated" class="eyebrow"></div></header><div id="content"><div class="empty">불러오는 중…</div></div></main>
  <script>
    const $=id=>document.getElementById(id),esc=CreoPlatform.escapeHtml;
    const channelId=String(new URLSearchParams(location.search).get('channel')||'').toLowerCase().replace(/[^a-z0-9-]/g,'');
    const money=value=>Number(value||0).toLocaleString('ko-KR');
    const metricLabel=board=>board.metric==='soldCount'?'판매 수량':board.metric==='points'?'점수':'판매 금액';
    const metricValue=(board,row)=>board.metric==='soldCount'?`${Number(row.total)||0}${board.unit||'건'}`:board.metric==='points'?`${money(row.total)}${board.unit||'점'}`:`${money(row.total)}${board.unit||'원'}`;
    function boardMarkup(board){const rows=Array.isArray(board.rows)?board.rows:[];return `<section class="board"><header class="board-head"><h2>${esc(board.name||'종합순위표')}</h2><span>${esc(metricLabel(board))}</span></header><table><thead><tr><th class="rank">순위</th><th>대상</th><th class="num">${esc(metricLabel(board))}</th><th class="num">건수</th></tr></thead><tbody>${rows.length?rows.map((row,index)=>`<tr><td class="rank">${index+1}</td><td>${esc(row.name||row.key||'-')}</td><td class="num">${esc(metricValue(board,row))}</td><td class="num">${Number(row.count)||0}</td></tr>`).join(''):`<tr><td colspan="4" class="empty">집계된 데이터가 없습니다.</td></tr>`}</tbody></table></section>`}
    async function load(){try{if(!channelId)throw new Error('채널 주소가 올바르지 않습니다.');const data=await CreoPlatform.api(`channels/${encodeURIComponent(channelId)}/rankings`);$('title').textContent=`${data.channel.name} · 종합순위표`;$('content').innerHTML=data.scoreboards?.length?`<div class="boards">${data.scoreboards.map(boardMarkup).join('')}</div>`:'<div class="empty">등록된 순위표가 없습니다.</div>';$('updated').textContent='LIVE'}catch(error){$('content').innerHTML=`<div class="error">${esc(error.message)}</div>`}}
    load();setInterval(load,15000);
  </script>
</body>
</html>
