<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#0b0d10">
    <title>CREO 운영</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <script src="platform-client.js?v=20260803-admin-session-v2" defer></script>
    <style>
        :root{color-scheme:dark;--bg:#0b0d10;--panel:#12151a;--panel2:#181c22;--line:#292f38;--text:#f4f5f7;--muted:#8d96a2;--accent:#dfb55f;--accent-ink:#171106;--danger:#ff9292}
        *{box-sizing:border-box}html,body{min-height:100%;margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:-.018em}button,input,select,a{font:inherit}[hidden]{display:none!important}
        .shell{width:min(1120px,calc(100% - 32px));margin:auto;padding:16px 0 46px}.topbar{display:flex;min-height:52px;align-items:center;gap:20px;border-bottom:1px solid #20252c}.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none}.mark{display:grid;width:32px;height:32px;place-items:center;border:1px solid #403823;border-radius:9px;background:#17150f;color:var(--accent);font-size:13px;font-weight:950}.brand strong{font-size:13px;font-weight:900;letter-spacing:.15em}.nav{display:flex;align-items:center;gap:4px;margin-left:auto}.nav a,.logout{height:34px;padding:0 10px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:10px;font-weight:800;text-decoration:none;line-height:34px;cursor:pointer}.nav a:hover,.logout:hover{background:var(--panel2);color:#fff}
        .page-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin:36px 0 14px}.page-head h1{margin:0;font-size:26px;letter-spacing:-.045em}.page-head p{margin:5px 0 0;color:var(--muted);font-size:11px}.connection{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:9px;font-weight:750}.connection:before{content:"";width:6px;height:6px;border-radius:50%;background:#54d18a;box-shadow:0 0 0 4px #54d18a15}
        .launcher{display:grid;grid-template-columns:minmax(190px,.8fr) 2fr;align-items:end;gap:12px;padding:16px;border:1px solid var(--line);border-radius:13px;background:var(--panel)}.field label{display:block;margin-bottom:6px;color:var(--muted);font-size:9px;font-weight:850;letter-spacing:.08em}.field select{width:100%;height:46px;padding:0 12px;border:1px solid #343b45;border-radius:9px;outline:0;background:#0b0e12;color:#fff;font-weight:800}.field select:focus{border-color:#796537}.launcher-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.btn{display:flex;height:46px;align-items:center;justify-content:center;border:1px solid #303640;border-radius:9px;background:var(--panel2);color:#d5dae0;font-size:11px;font-weight:850;text-decoration:none}.btn:hover{border-color:#454d59;color:#fff}.btn.primary{border-color:#806936;background:var(--accent);color:var(--accent-ink)}
        .list-head{display:flex;align-items:center;justify-content:space-between;margin:30px 2px 9px}.list-head h2{margin:0;font-size:13px}.list-head a{color:var(--muted);font-size:10px;font-weight:800;text-decoration:none}.channels{display:grid;gap:6px}.channel{display:grid;grid-template-columns:minmax(180px,1fr) auto;align-items:center;gap:18px;padding:13px 14px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}.channel-name{display:flex;min-width:0;align-items:center;gap:11px}.channel-bar{width:4px;height:34px;flex:0 0 auto;border-radius:3px;background:var(--channel-color)}.channel h3{overflow:hidden;margin:0;font-size:14px;text-overflow:ellipsis;white-space:nowrap}.channel p{margin:4px 0 0;color:#737d89;font-size:9px;font-weight:700}.channel-actions{display:grid;grid-template-columns:repeat(3,minmax(82px,1fr));gap:5px}.channel-actions .btn{height:36px;padding:0 10px;font-size:9px}.empty{padding:42px 18px;border:1px dashed #333a44;border-radius:11px;color:var(--muted);font-size:11px;text-align:center}.skeleton{height:64px;border-radius:11px;background:linear-gradient(90deg,#12151a,#1a1e25,#12151a);background-size:220% 100%;animation:pulse 1.4s infinite}@keyframes pulse{to{background-position:-220% 0}}
        .utilities{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px;padding-top:14px;border-top:1px solid #1d2229}.utilities a{color:#747e8a;font-size:9px;font-weight:750;text-decoration:none}.utilities a+a:before{content:"·";margin-right:8px;color:#3f4650}.status{margin-top:14px;color:#555e69;font-size:9px}
        .login{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:18px;background:#090b0e}.login-card{width:min(370px,100%);padding:26px;border:1px solid var(--line);border-radius:17px;background:var(--panel)}.login-brand{display:flex;align-items:center;gap:10px;margin-bottom:26px}.login-brand strong{font-size:13px;letter-spacing:.15em}.login h1{margin:0;font-size:20px}.login p{margin:7px 0 19px;color:var(--muted);font-size:11px}.login label{display:block;margin-bottom:6px;color:#aab1bb;font-size:10px;font-weight:750}.login input{width:100%;height:46px;padding:0 12px;border:1px solid #353c46;border-radius:9px;outline:0;background:#090c10;color:#fff}.login input:focus{border-color:#806b3e}.login button{width:100%;height:44px;margin-top:8px;border:0;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:900}.login button:disabled{opacity:.5}.error{min-height:16px!important;margin:7px 1px 0!important;color:var(--danger)!important;font-size:9px!important}
        @media(max-width:700px){.shell{width:calc(100% - 22px);padding-top:10px}.nav a{display:none}.page-head{align-items:start;margin-top:28px}.page-head h1{font-size:22px}.launcher{grid-template-columns:1fr}.launcher-actions{grid-template-columns:1fr 1fr}.launcher-actions .btn:last-child{grid-column:1/-1}.channel{grid-template-columns:1fr;gap:11px}.channel-actions{grid-template-columns:repeat(3,1fr)}}
    </style>
</head>
<body>
<section class="login" id="login-gate">
    <form class="login-card" id="login-form">
        <div class="login-brand"><span class="mark">C</span><strong>CREO</strong></div>
        <h1>관리자 로그인</h1><p>관리자 비밀번호를 입력하세요.</p>
        <label for="admin-password">비밀번호</label><input id="admin-password" type="password" autocomplete="current-password" maxlength="128" required>
        <button id="login-submit" type="submit">로그인</button><p class="error" id="login-error" role="alert"></p>
    </form>
</section>
<main class="shell" id="dashboard" hidden>
    <header class="topbar"><a class="brand" href="/"><span class="mark">C</span><strong>CREO</strong></a><nav class="nav"><a href="broadcast-studio.html?channel=cdcup">방송 스튜디오</a><a href="channel-manager.html">채널 설정</a><a href="crewart-survey.html">크레와트</a><button class="logout" id="logout-button" type="button">로그아웃</button></nav></header>
    <section class="page-head"><h1>운영 채널</h1><span class="connection">연결됨</span></section>
    <section class="launcher"><div class="field"><label for="quick-channel">CHANNEL</label><select id="quick-channel"><option>불러오는 중…</option></select></div><div class="launcher-actions"><a class="btn primary" id="quick-workspace" href="#">현장 운영</a><a class="btn" id="quick-control" href="#">방송 설정</a><a class="btn" id="quick-live" href="#" target="_blank" rel="noopener">송출 열기</a></div></section>
    <div class="list-head"><h2>채널 목록</h2><a href="channel-manager.html">추가·수정</a></div>
    <section class="channels" id="channel-grid"><div class="skeleton"></div><div class="skeleton"></div></section>
    <nav class="utilities"><a href="channel-manager.html">채널 설정</a><a href="banner_maker.html">배너 제작</a><a href="crewart-survey.html">크레와트 성향 테스트</a></nav>
    <footer class="status" id="platform-status">연결 중</footer>
</main>
<script>
document.addEventListener('DOMContentLoaded',()=>{
    const $=id=>document.getElementById(id),gate=$('login-gate'),dashboard=$('dashboard'),form=$('login-form'),input=$('admin-password'),submit=$('login-submit'),error=$('login-error'),grid=$('channel-grid'),select=$('quick-channel'),workspace=$('quick-workspace'),control=$('quick-control'),live=$('quick-live'),status=$('platform-status'),esc=CreoPlatform.escapeHtml;let changeHandler=null;
    function busy(value){submit.disabled=value;input.disabled=value;submit.textContent=value?'확인 중…':'로그인'}
    function showLogin(message=''){dashboard.hidden=true;gate.hidden=false;error.textContent=message;busy(false);requestAnimationFrame(()=>input.focus({preventScroll:true}))}
    function studio(id,view){return`broadcast-studio.html?channel=${encodeURIComponent(id)}&view=${view}`}
    async function load(){grid.innerHTML='<div class="skeleton"></div><div class="skeleton"></div>';try{const data=await CreoPlatform.api('channels'),channels=data.channels||[];select.innerHTML=channels.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');grid.innerHTML=channels.length?channels.map(c=>`<article class="channel" style="--channel-color:${esc(c.theme.primary)}"><div class="channel-name"><span class="channel-bar"></span><div><h3>${esc(c.name)}</h3><p>${esc(c.id)} · ${esc(c.status)}</p></div></div><div class="channel-actions"><a class="btn primary" href="${studio(c.id,'operations')}">현장 운영</a><a class="btn" href="${studio(c.id,'control')}">방송 설정</a><a class="btn" href="${esc(c.links.live)}" target="_blank" rel="noopener">송출</a></div></article>`).join(''):'<div class="empty">등록된 채널이 없습니다.</div>';if(changeHandler)select.removeEventListener('change',changeHandler);changeHandler=()=>{const c=channels.find(row=>row.id===select.value)||channels[0];if(!c)return;workspace.href=studio(c.id,'operations');control.href=studio(c.id,'control');live.href=c.links.live};select.addEventListener('change',changeHandler);changeHandler();status.textContent=`${channels.length}개 채널 · 설정 ${data.version}`}catch(failure){if(failure.status===401)return showLogin('다시 로그인해 주세요.');grid.innerHTML='<div class="empty">채널을 불러오지 못했습니다.</div>';status.textContent='연결 확인 필요'}}
    async function showDashboard(){gate.hidden=true;dashboard.hidden=false;await load()}
    form.addEventListener('submit',async event=>{event.preventDefault();if(!input.value)return;error.textContent='';busy(true);try{CreoPlatform.setAdmin(input.value);if(!await CreoPlatform.verifyAdmin(input.value))throw new Error('비밀번호가 맞지 않습니다.');input.value='';await showDashboard()}catch(failure){CreoPlatform.setAdmin('');showLogin(failure.message||'로그인하지 못했습니다.')}});
    $('logout-button').addEventListener('click',async()=>{await CreoPlatform.logout();showLogin()});
    (async()=>{try{if(await CreoPlatform.verifyAdmin())return showDashboard()}catch(_){}showLogin()})();
});
</script>
</body>
</html>
