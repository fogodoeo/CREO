<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>업체별 조회 · CREO</title>
  <script src="platform-client.js?v=20260803-admin-session-v2"></script><script src="supabase-bridge.js?v=20260717-egress-hotfix-v1"></script><script src="channel-adapters.js?v=20260813-modular-v1"></script>
  <style>
    :root{color-scheme:light;--bg:#f4f7fb;--panel:#fff;--line:#e2e8f0;--text:#172033;--muted:#6b7280;--blue:#2563eb;--green:#15803d;--orange:#c2410c}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f8fafc,#eef3f8);color:var(--text);font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:-.018em}button,input{font:inherit}.shell{width:min(980px,calc(100% - 30px));margin:auto;padding:28px 0 70px}.head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px}.eyebrow{color:var(--blue);font-size:10px;font-weight:900;letter-spacing:.12em}.head h1{margin:5px 0 0;font-size:29px}.head p{margin:7px 0 0;color:var(--muted);font-size:12px}.links{display:flex;gap:6px}.links a{padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;color:#475569;font-size:10px;font-weight:800;text-decoration:none}.toolbar{display:flex;gap:8px;margin-top:22px}.search{width:100%;height:44px;padding:0 13px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:0}.search:focus{border-color:#8bb0f5;box-shadow:0 0 0 3px #2563eb12}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.stat{padding:14px;border:1px solid var(--line);border-radius:11px;background:#fff}.stat span{display:block;color:var(--muted);font-size:9px}.stat strong{display:block;margin-top:4px;font-size:19px}.list{display:grid;gap:10px;margin-top:12px}.company{overflow:hidden;border:1px solid var(--line);border-radius:13px;background:#fff}.company-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 16px;background:#fafbfc}.company-head h2{margin:0;font-size:15px}.company-head span{color:var(--muted);font-size:10px}.progress{color:var(--green)!important;font-weight:850}.items{display:grid}.item{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid #edf0f4}.item strong{display:block;font-size:12px}.item small{display:block;margin-top:3px;color:var(--muted);font-size:9px}.shipping{font-size:10px;color:#475569}.shipping b{display:block;margin-top:3px}.badge{padding:5px 8px;border-radius:999px;background:#fff7ed;color:var(--orange);font-size:9px;font-weight:850}.badge.complete{background:#f0fdf4;color:var(--green)}.empty{margin-top:12px;padding:55px 18px;border:1px dashed #cad3df;border-radius:12px;color:var(--muted);text-align:center}.loading{position:fixed;inset:0;display:grid;place-items:center;background:#f4f7fbe8;color:#475569;font-size:12px;font-weight:800}@media(max-width:680px){.shell{width:calc(100% - 22px);padding-top:20px}.head{display:block}.links{margin-top:13px}.stats{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:1/-1}.item{grid-template-columns:1fr auto}.item .winner,.item .shipping{grid-column:1/-1}}
  </style>
</head>
<body><main class="shell"><header class="head"><div><div class="eyebrow">CHANNEL COMPANY VIEW</div><h1 id="title">업체별 조회</h1><p>선택한 채널의 업체별 낙찰 및 배송 현황만 표시합니다.</p></div><nav class="links"><a id="home" href="/">메인 홈</a><a id="shipping" href="#">배송 관리</a><a id="status" href="#">낙찰자 조회</a></nav></header><input class="search" id="search" type="search" placeholder="업체명 검색"><section class="stats" id="stats"></section><section class="list" id="list"></section></main><div class="loading" id="loading">업체 정보를 불러오는 중…</div>
<script>
  const $=id=>document.getElementById(id),esc=CreoPlatform.escapeHtml;
  const channelId=String(new URLSearchParams(location.search).get('channel')||'').toLowerCase().replace(/[^a-z0-9-]/g,'');if(!channelId)location.replace('/');
  let channel=null,items=[],companies=[];
  const sold=item=>String(item.status||'').includes('낙찰')||item.status==='sold'||Number(item.soldPrice||item.sold_price)>0;
  const winner=item=>String(item.winner||item.winnerName||'-').replace(/[\[\]]/g,'').trim()||'-';
  const phone=item=>String(item.winner_phone||item.winnerPhone||'').replace(/[^0-9]/g,'');
  const itemName=item=>[item.num||item.lotNumber?`#${item.num||item.lotNumber}`:'',item.name].filter(Boolean).join(' · ');
  const shippingInfo=item=>{if(!item.shipping_type&&!item.method)return {label:'배송 정보 미등록',cost:'-',complete:false};if(item.shipping_type==='직접수령'||item.method==='pickup')return {label:'직접 수령',cost:'배송비 없음',complete:true};return {label:[item.shipping_company||item.carrier||'배송',item.shipping_region||item.address||''].filter(Boolean).join(' · '),cost:`${Number(item.shipping_cost||item.cost||0).toLocaleString('ko-KR')}원`,complete:true}};
  function group(){const map=new Map();items.filter(sold).forEach(item=>{const name=String(item.company||item.vendorName||'미지정 업체').trim();if(!map.has(name))map.set(name,{name,items:[]});map.get(name).items.push(item)});companies=[...map.values()].sort((a,b)=>a.name.localeCompare(b.name,'ko'))}
  function render(){const query=$('search').value.trim().toLocaleLowerCase();const rows=companies.filter(company=>!query||company.name.toLocaleLowerCase().includes(query));const registered=items.filter(sold).filter(item=>shippingInfo(item).complete).length;$('stats').innerHTML=`<article class="stat"><span>업체</span><strong>${companies.length}</strong></article><article class="stat"><span>낙찰 항목</span><strong>${items.filter(sold).length}</strong></article><article class="stat"><span>배송 등록</span><strong>${registered}</strong></article>`;$('list').innerHTML=rows.length?rows.map(company=>{const done=company.items.filter(item=>shippingInfo(item).complete).length;return `<article class="company"><header class="company-head"><div><h2>${esc(company.name)}</h2><span>${company.items.length}개 항목</span></div><span class="progress">${done} / ${company.items.length} 배송 등록</span></header><div class="items">${company.items.slice().sort((a,b)=>Number(a.num||a.lotNumber)-Number(b.num||b.lotNumber)).map(item=>{const shipping=shippingInfo(item);return `<div class="item"><div><strong>${esc(itemName(item)||'이름 없음')}</strong><small>낙찰가 ${Number(item.sold_price||item.soldPrice||0).toLocaleString('ko-KR')}</small></div><div class="winner"><strong>${esc(winner(item))}</strong><small>${esc(phone(item)||'연락처 없음')}</small></div><div class="shipping">배송 정보<b>${esc(shipping.label||'-')} · ${esc(shipping.cost)}</b></div><span class="badge ${shipping.complete?'complete':''}">${shipping.complete?'등록 완료':'확인 필요'}</span></div>`}).join('')}</div></article>`}).join(''):'<div class="empty">조건에 맞는 업체가 없습니다.</div>'}
  async function load(){channel=(await CreoPlatform.api(`channels/${encodeURIComponent(channelId)}`)).channel;const adapter=CreoChannelAdapters.resolve(channel);items=await adapter.loadShippingItems({channel});group();$('title').textContent=`${channel.name} · 업체별 조회`;$('home').href=`/?channel=${encodeURIComponent(channelId)}`;$('shipping').href=`shipping.html?channel=${encodeURIComponent(channelId)}`;$('status').href=`shipping-status.html?channel=${encodeURIComponent(channelId)}`;render();$('loading').style.display='none'}
  $('search').oninput=render;load().catch(error=>{$('loading').textContent=error.message||'업체 정보를 불러오지 못했습니다.'});
</script></body></html>
