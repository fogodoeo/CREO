<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
  <title>업체별 조회 이동 · CREO</title>
  <script>
    (() => {
      const channel=String(new URLSearchParams(location.search).get('channel')||'').toLowerCase().replace(/[^a-z0-9-]/g,'');
      location.replace(channel?`shipping-status.html?channel=${encodeURIComponent(channel)}&view=company`:'/');
    })();
  </script>
</head>
<body></body>
</html>
