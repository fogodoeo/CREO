<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#0b0d10">
    <title>방송 관리 · CREO</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <script src="platform-client.js?v=20260803-admin-session-v2" defer></script>
    <script src="channel-runtime.js?v=20260901-operator-routing-v1" defer></script>
    <script src="operator-pipeline.js?v=20260903-v1" defer></script>
    <script src="broadcast-profiles.js?v=20260827-basic-dice-v1" defer></script>
    <style>
        :root{color-scheme:dark;--bg:#0b0d10;--panel:#111419;--panel-2:#171b21;--line:#292f38;--line-strong:#3b4350;--text:#f4f5f7;--muted:#8e97a4;--accent:#e3b75d;--accent-ink:#171106;--danger:#ff9090}
        *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,sans-serif}button,input,select,a{font:inherit}.studio[hidden],.login[hidden],[hidden]{display:none!important}
        .studio{display:grid;height:100dvh;grid-template-rows:62px auto 58px minmax(0,1fr);background:var(--bg)}
        .topbar{display:grid;grid-template-columns:auto minmax(310px,430px) 1fr auto;align-items:center;gap:18px;padding:0 20px;border-bottom:1px solid var(--line);background:#0d1014}
        .brand{display:flex;align-items:center;gap:11px;color:#fff;text-decoration:none}.brand-mark{display:grid;width:32px;height:32px;place-items:center;border:1px solid #373d46;border-radius:9px;background:#171b20;font-size:13px;font-weight:950;letter-spacing:-.02em}.brand-copy{display:grid;gap:1px}.brand-copy strong{font-size:13px;font-weight:900;letter-spacing:.14em}.brand-copy small{color:#6f7885;font-size:8px;font-weight:850;letter-spacing:.13em}
        .channel-switch{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px}.channel-wrap{position:relative}.channel-label{position:absolute;z-index:1;top:7px;left:13px;color:#737d89;font-size:8px;font-weight:900;letter-spacing:.12em;pointer-events:none}.channel{width:100%;height:44px;padding:16px 36px 3px 12px;border:1px solid #323944;border-radius:10px;outline:0;background:#15191f;color:#fff;font-size:12px;font-weight:800}.channel:focus{border-color:#7c6840;box-shadow:0 0 0 3px #d4ad6018}.switch-channel{height:44px;padding:0 12px;border:1px solid #735f3b;border-radius:10px;background:#211b12;color:#e8c77e;font-size:10px;font-weight:900;cursor:pointer;white-space:nowrap}.switch-channel:hover:not(:disabled){border-color:#c49a4e;background:#302515;color:#fff}.switch-channel:disabled{border-color:#2d333b;background:#15191f;color:#555f6b;cursor:not-allowed}
        .status{display:flex;min-width:0;align-items:center;gap:9px;color:var(--muted);font-size:10px;font-weight:750}.status-dot{width:7px;height:7px;flex:0 0 auto;border-radius:50%;background:#55d18a;box-shadow:0 0 0 4px #55d18a16}.status strong{overflow:hidden;color:#bec5ce;font-weight:850;text-overflow:ellipsis;white-space:nowrap}
        .top-actions{display:flex;align-items:center;gap:7px}.top-actions a{display:flex;height:36px;align-items:center;justify-content:center;padding:0 12px;border:1px solid var(--line);border-radius:9px;color:#b2bac5;font-size:10px;font-weight:850;text-decoration:none;white-space:nowrap}.top-actions a:hover{border-color:var(--line-strong);background:#171b21;color:#fff}.top-actions a.primary{border-color:#755f35;background:#d9ae59;color:var(--accent-ink)}
        .commandbar{display:flex;align-items:center;gap:12px;padding:8px 20px;border-bottom:1px solid var(--line);background:#111419}.workspace-tools{display:flex;align-items:center;gap:5px}.workspace-tools button{height:36px;padding:0 13px;border:1px solid #303640;border-radius:8px;background:#15191f;color:#8f98a4;font-size:10px;font-weight:850;cursor:pointer;white-space:nowrap}.workspace-tools button:hover{border-color:#46505e;color:#fff}.workspace-tools button.active{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,#15191f);color:var(--accent)}
        .live-tools{display:flex;align-items:center;gap:5px;margin-left:auto}.live-tools a{display:flex;height:34px;align-items:center;justify-content:center;gap:6px;padding:0 11px;border:1px solid #303640;border-radius:8px;color:#aab3be;font-size:10px;font-weight:850;text-decoration:none;white-space:nowrap}.live-tools a:before{content:"";width:5px;height:5px;border-radius:50%;background:#ef6666}.live-tools a:hover{border-color:#6b4c4c;background:#201617;color:#fff}
        .frame-shell{position:relative;min-height:0;background:#0a0c0f}.frame-shell:before{content:"관리 화면을 불러오는 중입니다";position:absolute;top:50%;left:50%;color:#4d5662;font-size:11px;font-weight:800;transform:translate(-50%,-50%)}.frame-meta{position:absolute;z-index:1;top:12px;right:17px;display:none;padding:6px 9px;border:1px solid #2b3139;border-radius:7px;background:#101319dd;color:#7f8995;font-size:9px;font-weight:800;pointer-events:none}iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#0b0d10}
        .login{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 25%,#202631 0,#0b0d10 48%)}.login-card{width:min(400px,100%);padding:30px;border:1px solid #2b3139;border-radius:20px;background:#111419;box-shadow:0 32px 100px #000b}.login-brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}.login-brand .brand-mark{width:39px;height:39px}.login-card h1{margin:0;font-size:17px;font-weight:900;letter-spacing:.06em}.login-card h1 small{display:block;margin-top:3px;color:#76808c;font-size:9px;letter-spacing:.13em}.login-card label{display:block;margin:0 0 7px;color:#9aa3af;font-size:10px;font-weight:800}.login-row{display:flex;gap:7px}.login input{min-width:0;flex:1;height:46px;padding:0 12px;border:1px solid #343b46;border-radius:10px;outline:0;background:#090c10;color:#fff}.login input:focus{border-color:#806b43}.login button{height:46px;padding:0 18px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:900}.login button:disabled{opacity:.5}.login-note{margin:12px 0 0;color:#68727e;font-size:10px;line-height:1.5}.error{min-height:18px;margin:8px 1px 0;color:var(--danger);font-size:10px;font-weight:750}
        @media(max-width:980px){.studio{grid-template-rows:62px auto 98px minmax(0,1fr)}.topbar{grid-template-columns:auto minmax(220px,1fr) auto;gap:9px;padding:0 11px}.brand-copy,.status{display:none}.brand-mark{width:34px;height:34px}.channel,.switch-channel{height:42px}.top-actions a{height:38px;padding:0 10px}.commandbar{display:grid;gap:6px;padding:7px 10px}.workspace-tools,.live-tools{width:100%}.workspace-tools button,.live-tools a{height:36px;flex:1;padding:0 6px}.live-tools{margin:0}}
        @media(max-width:540px){.studio{grid-template-rows:58px auto 94px minmax(0,1fr)}.topbar{padding:0 8px}.brand-mark{width:32px;height:32px}.channel-label{left:10px}.channel{padding-left:9px;font-size:11px}.top-actions a{padding:0 9px;font-size:9px}.workspace-tools button{font-size:9px}.live-tools a{font-size:9px}.workspace-tools button span{display:none}}
    </style>
</head>
<body>
<section class="login" id="login-gate">
    <form class="login-card" id="login-form">
        <div class="login-brand"><span class="brand-mark">C</span><h1>CREO BROADCAST<small>CONTROL STUDIO</small></h1></div>
        <label for="admin-password">관리자 비밀번호</label>
        <div class="login-row"><input id="admin-password" type="password" autocomplete="current-password" placeholder="비밀번호 입력" required><button id="login-submit" type="submit">입장</button></div>
        <p class="login-note">관리자 전용</p>
        <p class="error" id="login-error" role="alert"></p>
    </form>
</section>
<main class="studio" id="studio" hidden>
    <header class="topbar">
        <a class="brand" href="/"><span class="brand-mark">C</span><span class="brand-copy"><strong>CREO</strong><small>BROADCAST STUDIO</small></span></a>
        <div class="channel-switch"><div class="channel-wrap"><label class="channel-label" for="channel-select">CHANNEL</label><select class="channel" id="channel-select" aria-label="방송 채널"></select></div><button class="switch-channel" id="channel-switch-button" type="button" disabled>운영 전환</button></div>
        <div class="status"><span class="status-dot"></span><strong id="engine-label">방송 제어 연결됨</strong></div>
        <div class="top-actions"><a id="capture-library" href="capture-gallery.html">캡처</a><a href="/">메인</a></div>
    </header>
    <creo-operator-pipeline current="broadcast" tone="dark"></creo-operator-pipeline>
    <section class="commandbar" aria-label="방송 화면 구성">
        <nav class="workspace-tools" aria-label="배치 및 설정">
            <button type="button" data-view="layout-1">1P <span>진행 배치</span></button>
            <button type="button" data-view="layout-2">2P <span>개체 배치</span></button>
            <button id="layout-3-button" type="button" data-view="layout-3">3P <span>집계 배치</span></button>
            <button type="button" data-view="settings">방송 설정</button>
        </nav>
        <nav class="live-tools" aria-label="송출 화면 열기"><a id="live-1" target="_blank" rel="noopener">진행 · 1P</a><a id="live-2" target="_blank" rel="noopener">경매 · 2P</a><a id="live-3" target="_blank" rel="noopener">집계 · 3P</a></nav>
    </section>
    <section class="frame-shell"><iframe id="control-frame" title="방송 화면 구성"></iframe></section>
</main>
<script>
document.addEventListener('DOMContentLoaded',()=>{
    const $=id=>document.getElementById(id),gate=$('login-gate'),studio=$('studio'),form=$('login-form'),password=$('admin-password'),submit=$('login-submit'),error=$('login-error'),select=$('channel-select'),switchButton=$('channel-switch-button'),frame=$('control-frame');
    let channels=[],activeChannel=null,activationSequence=0,reauthRequired=false;
    const initialParams=new URLSearchParams(location.search),requested=String(initialParams.get('channel')||'').toLowerCase().replace(/[^a-z0-9-]/g,''),requestedView=String(initialParams.get('view')||'layout-1');
    let activeView=/^(layout-[123]|settings)$/.test(requestedView)?requestedView:'layout-1';
    const esc=value=>CreoPlatform.escapeHtml(value);
    function frameUrl(channel,view){return CreoBroadcastProfiles.studioFrame(channel,view)}
    function liveUrl(channel,page){return `broadcast-router.html?page=${page}&live=1`}
    function showView(view){activeView=/^(layout-[123]|settings)$/.test(view)?view:'layout-1';document.querySelectorAll('[data-view]').forEach(button=>button.classList.toggle('active',button.dataset.view===activeView));if(!activeChannel)return;const src=frameUrl(activeChannel,activeView);if(frame.getAttribute('src')!==src)frame.src=src;const label=activeView==='settings'?'방송 설정':activeView.replace('layout-','')+'P 배치';frame.title=`${activeChannel.name} ${label}`;history.replaceState(null,'',`broadcast-studio.html?channel=${encodeURIComponent(activeChannel.id)}&view=${encodeURIComponent(activeView)}`)}
    function renderActive(next){activeChannel=next;const profile=CreoBroadcastProfiles.resolve(activeChannel),page3Label=profile.page3Label||'집계';select.value=activeChannel.id;switchButton.disabled=true;studio.dataset.channel=activeChannel.id;studio.dataset.broadcastProfile=profile.id;studio.style.setProperty('--accent',profile.studioAccent||activeChannel.theme?.secondary||'#e3b75d');studio.style.setProperty('--accent-ink',profile.studioAccentInk||activeChannel.theme?.background||'#171106');$('engine-label').textContent=`운영 잠금 · ${activeChannel.name}`;studio.querySelector('.brand-mark').textContent=profile.brandMark||'C';$('layout-3-button').querySelector('span').textContent=`${page3Label} 배치`;for(let page=1;page<=3;page++)$('live-'+page).href=liveUrl(activeChannel,page);$('live-3').textContent=`${page3Label} · 3P`;$('capture-library').href=`capture-gallery.html?channel=${encodeURIComponent(activeChannel.id)}`;CreoOperatorPipeline.sync(activeChannel.id,activeChannel.name);showView(activeView)}
    function markPending(){const next=channels.find(row=>row.id===select.value);const pending=Boolean(next&&activeChannel&&next.id!==activeChannel.id);switchButton.disabled=!pending;$('engine-label').textContent=pending?`전환 대기 · 현재 ${activeChannel.name}`:`운영 잠금 · ${activeChannel?.name||'-'}`}
    async function activate(id){const next=channels.find(row=>row.id===id);if(!next||!activeChannel||next.id===activeChannel.id){if(activeChannel)select.value=activeChannel.id;markPending();return}if(!confirm(`운영 채널을 ${activeChannel.name}에서 ${next.name}(으)로 전환할까요?\n\n송출 화면과 밴드 모니터 기준 채널이 함께 변경됩니다. 진행 중인 경매가 있으면 전환은 차단됩니다.`)){select.value=activeChannel.id;markPending();return}const sequence=++activationSequence;let failureMessage='';select.disabled=true;switchButton.disabled=true;$('engine-label').textContent=`${next.name} 운영 채널 전환 중`;try{await CreoPlatform.api('active-channel',{method:'PUT',body:JSON.stringify({channelId:next.id,expectedCurrentChannelId:activeChannel.id,confirmChannelId:next.id})});if(sequence!==activationSequence)return;renderActive(next)}catch(failure){failureMessage=failure.message||'운영 채널 전환 실패';if(sequence===activationSequence)select.value=activeChannel.id;throw failure}finally{if(sequence===activationSequence){select.disabled=false;if(failureMessage){switchButton.disabled=true;$('engine-label').textContent=failureMessage}else markPending()}}}
    async function load(){let [data,current]=await Promise.all([CreoPlatform.api('channels'),CreoPlatform.api('active-channel')]);if(Number(data.version)!==Number(current.catalogVersion))data=await CreoPlatform.api('channels');channels=(data.channels||[]).filter(channel=>channel.status==='active'&&channel.features?.broadcast!==false);select.innerHTML=channels.map(channel=>`<option value="${esc(channel.id)}">${esc(channel.name)}</option>`).join('');if(!channels.length)throw new Error('사용 가능한 방송 채널이 없습니다.');const currentChannel=channels.find(channel=>channel.id===current.channelId);if(!currentChannel)throw new Error('운영 채널 정보가 변경되었습니다. 새로고침해 주세요.');gate.hidden=true;studio.hidden=false;renderActive(currentChannel);if(requested&&!channels.some(channel=>channel.id===requested))throw new Error('요청한 방송 채널을 찾을 수 없습니다.');const requestedChannel=channels.find(channel=>channel.id===requested);if(requestedChannel&&requestedChannel.id!==currentChannel.id){select.value=requestedChannel.id;markPending()}}
    function showLogin(message=''){studio.hidden=true;gate.hidden=false;error.textContent=message;submit.disabled=false;password.disabled=false;requestAnimationFrame(()=>password.focus({preventScroll:true}))}
    select.addEventListener('change',markPending);
    switchButton.addEventListener('click',()=>activate(select.value).catch(()=>{}));
    document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>showView(button.dataset.view)));
    window.addEventListener('message',event=>{if(event.origin!==location.origin||event.source!==frame.contentWindow)return;if(event.data?.type==='creo-open-studio-view'&&event.data.view==='settings'){showView('settings');return}if(event.data?.type==='creo-admin-required'){reauthRequired=true;showLogin('관리자 인증이 만료되었습니다. 다시 로그인해 주세요.')}});
    form.addEventListener('submit',async event=>{event.preventDefault();const value=password.value;if(!value)return;submit.disabled=true;password.disabled=true;error.textContent='';try{CreoPlatform.setAdmin(value);if(!await CreoPlatform.verifyAdmin(value))throw new Error('비밀번호가 맞지 않습니다.');password.value='';await load();if(reauthRequired){reauthRequired=false;frame.contentWindow?.location.reload()}}catch(failure){CreoPlatform.setAdmin('');showLogin(failure.message||'로그인하지 못했습니다.')}});
    (async()=>{try{if(await CreoPlatform.verifyAdmin())return await load()}catch(_){}showLogin()})();
});
</script>
</body>
</html>
