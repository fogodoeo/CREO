<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#0b0d10">
    <title>CREO 방송 스튜디오</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <script src="platform-client.js?v=20260803-admin-session-v2" defer></script>
    <style>
        :root{color-scheme:dark;--bg:#0b0d10;--panel:#111419;--panel-2:#171b21;--line:#292f38;--line-strong:#3b4350;--text:#f4f5f7;--muted:#8e97a4;--accent:#e3b75d;--accent-ink:#171106;--danger:#ff9090}
        *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,sans-serif}button,input,select,a{font:inherit}.studio[hidden],.login[hidden],[hidden]{display:none!important}
        .studio{display:grid;height:100dvh;grid-template-rows:62px 58px minmax(0,1fr);background:var(--bg)}
        .topbar{display:grid;grid-template-columns:auto minmax(220px,330px) 1fr auto;align-items:center;gap:18px;padding:0 20px;border-bottom:1px solid var(--line);background:#0d1014}
        .brand{display:flex;align-items:center;gap:11px;color:#fff;text-decoration:none}.brand-mark{display:grid;width:32px;height:32px;place-items:center;border:1px solid #373d46;border-radius:9px;background:#171b20;font-size:13px;font-weight:950;letter-spacing:-.02em}.brand-copy{display:grid;gap:1px}.brand-copy strong{font-size:13px;font-weight:900;letter-spacing:.14em}.brand-copy small{color:#6f7885;font-size:8px;font-weight:850;letter-spacing:.13em}
        .channel-wrap{position:relative}.channel-label{position:absolute;z-index:1;top:7px;left:13px;color:#737d89;font-size:8px;font-weight:900;letter-spacing:.12em;pointer-events:none}.channel{width:100%;height:44px;padding:16px 36px 3px 12px;border:1px solid #323944;border-radius:10px;outline:0;background:#15191f;color:#fff;font-size:12px;font-weight:800}.channel:focus{border-color:#7c6840;box-shadow:0 0 0 3px #d4ad6018}
        .status{display:flex;min-width:0;align-items:center;gap:9px;color:var(--muted);font-size:10px;font-weight:750}.status-dot{width:7px;height:7px;flex:0 0 auto;border-radius:50%;background:#55d18a;box-shadow:0 0 0 4px #55d18a16}.status strong{overflow:hidden;color:#bec5ce;font-weight:850;text-overflow:ellipsis;white-space:nowrap}
        .top-actions{display:flex;align-items:center;gap:7px}.top-actions a{display:flex;height:36px;align-items:center;justify-content:center;padding:0 12px;border:1px solid var(--line);border-radius:9px;color:#b2bac5;font-size:10px;font-weight:850;text-decoration:none;white-space:nowrap}.top-actions a:hover{border-color:var(--line-strong);background:#171b21;color:#fff}.top-actions a.primary{border-color:#755f35;background:#d9ae59;color:var(--accent-ink)}
        .commandbar{display:flex;align-items:center;gap:16px;padding:8px 20px;border-bottom:1px solid var(--line);background:#111419}.command-group{display:flex;min-width:0;align-items:center;gap:8px}.command-label{margin-right:2px;color:#68717d;font-size:8px;font-weight:900;letter-spacing:.13em;white-space:nowrap}.mode-tabs{display:flex;gap:4px;padding:3px;border:1px solid #282e37;border-radius:11px;background:#0c0f13}.mode-tab{height:34px;min-width:88px;padding:0 15px;border:0;border-radius:8px;background:transparent;color:#858f9c;font-size:11px;font-weight:850;cursor:pointer;white-space:nowrap}.mode-tab:hover{color:#fff}.mode-tab.is-active{background:#252b33;color:#fff;box-shadow:0 1px 4px #0006}.mode-tab.layout{min-width:72px}.mode-tab.layout.is-active{background:#332b1b;color:#f0c978}
        .live-tools{display:flex;align-items:center;gap:5px;margin-left:auto}.live-tools a{display:flex;height:34px;align-items:center;justify-content:center;gap:6px;padding:0 11px;border:1px solid #303640;border-radius:8px;color:#aab3be;font-size:10px;font-weight:850;text-decoration:none;white-space:nowrap}.live-tools a:before{content:"";width:5px;height:5px;border-radius:50%;background:#ef6666}.live-tools a:hover{border-color:#6b4c4c;background:#201617;color:#fff}
        .frame-shell{position:relative;min-height:0;background:#0a0c0f}.frame-shell:before{content:"관리 화면을 불러오는 중입니다";position:absolute;top:50%;left:50%;color:#4d5662;font-size:11px;font-weight:800;transform:translate(-50%,-50%)}.frame-meta{position:absolute;z-index:1;top:12px;right:17px;display:none;padding:6px 9px;border:1px solid #2b3139;border-radius:7px;background:#101319dd;color:#7f8995;font-size:9px;font-weight:800;pointer-events:none}iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#0b0d10}
        .login{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 25%,#202631 0,#0b0d10 48%)}.login-card{width:min(400px,100%);padding:30px;border:1px solid #2b3139;border-radius:20px;background:#111419;box-shadow:0 32px 100px #000b}.login-brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}.login-brand .brand-mark{width:39px;height:39px}.login-card h1{margin:0;font-size:17px;font-weight:900;letter-spacing:.06em}.login-card h1 small{display:block;margin-top:3px;color:#76808c;font-size:9px;letter-spacing:.13em}.login-card label{display:block;margin:0 0 7px;color:#9aa3af;font-size:10px;font-weight:800}.login-row{display:flex;gap:7px}.login input{min-width:0;flex:1;height:46px;padding:0 12px;border:1px solid #343b46;border-radius:10px;outline:0;background:#090c10;color:#fff}.login input:focus{border-color:#806b43}.login button{height:46px;padding:0 18px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:900}.login button:disabled{opacity:.5}.login-note{margin:12px 0 0;color:#68727e;font-size:10px;line-height:1.5}.error{min-height:18px;margin:8px 1px 0;color:var(--danger);font-size:10px;font-weight:750}
        @media(max-width:820px){.studio{grid-template-rows:62px 104px minmax(0,1fr)}.topbar{grid-template-columns:auto minmax(150px,1fr) auto;gap:9px;padding:0 11px}.brand-copy,.status,.top-actions a:not(.primary){display:none}.brand-mark{width:34px;height:34px}.channel{height:42px}.top-actions a.primary{height:38px;padding:0 10px}.commandbar{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;padding:7px 10px}.command-group{width:100%}.command-label{display:none}.mode-tabs{width:100%;overflow-x:auto;scrollbar-width:none}.mode-tabs::-webkit-scrollbar{display:none}.mode-tab{min-width:0;flex:1;padding:0 9px}.live-tools{width:100%;margin:0}.live-tools:before{content:"송출";margin-right:2px;color:#68717d;font-size:8px;font-weight:900;letter-spacing:.12em}.live-tools a{height:31px;flex:1;padding:0 6px}}
        @media(max-width:430px){.studio{grid-template-rows:58px 102px minmax(0,1fr)}.topbar{padding:0 8px}.brand-mark{width:32px;height:32px}.channel-label{left:10px}.channel{padding-left:9px;font-size:11px}.top-actions a.primary{padding:0 9px;font-size:9px}.mode-tab{height:33px;font-size:10px}.live-tools a{font-size:9px}}
    </style>
</head>
<body>
<section class="login" id="login-gate">
    <form class="login-card" id="login-form">
        <div class="login-brand"><span class="brand-mark">C</span><h1>CREO BROADCAST<small>CONTROL STUDIO</small></h1></div>
        <label for="admin-password">관리자 비밀번호</label>
        <div class="login-row"><input id="admin-password" type="password" autocomplete="current-password" placeholder="비밀번호 입력" required><button id="login-submit" type="submit">입장</button></div>
        <p class="login-note">관리자 전용</p>
        <p class="error" id="login-error" role="alert"></p>
    </form>
</section>
<main class="studio" id="studio" hidden>
    <header class="topbar">
        <a class="brand" href="/"><span class="brand-mark">C</span><span class="brand-copy"><strong>CREO</strong><small>BROADCAST STUDIO</small></span></a>
        <div class="channel-wrap"><label class="channel-label" for="channel-select">CHANNEL</label><select class="channel" id="channel-select" aria-label="방송 채널"></select></div>
        <div class="status"><span class="status-dot"></span><strong id="engine-label">방송 제어 연결됨</strong></div>
        <div class="top-actions"><a id="result-link">낙찰 집계</a><a id="shipping-link">배송 관리</a><a class="primary" id="live-main" target="_blank" rel="noopener">방송 열기</a></div>
    </header>
    <section class="commandbar" aria-label="방송 작업 선택">
        <div class="command-group"><span class="command-label">WORK</span><div class="mode-tabs" role="tablist" aria-label="작업 화면"><button class="mode-tab is-active" id="mode-operations" data-mode="operations" type="button" role="tab" aria-selected="true">현장 운영</button><button class="mode-tab" id="mode-archives" data-mode="archives" type="button" role="tab" aria-selected="false">회차 기록</button><button class="mode-tab" id="mode-control" data-mode="control" type="button" role="tab" aria-selected="false">송출 설정</button><button class="mode-tab layout" id="layout-1" data-mode="layout" data-page="1" type="button" role="tab" aria-selected="false">배치 1</button><button class="mode-tab layout" id="layout-2" data-mode="layout" data-page="2" type="button" role="tab" aria-selected="false">배치 2</button><button class="mode-tab layout" id="layout-3" data-mode="layout" data-page="3" type="button" role="tab" aria-selected="false">배치 3</button></div></div>
        <nav class="live-tools" aria-label="방송 화면 열기"><a id="live-1" target="_blank" rel="noopener">송출 1</a><a id="live-2" target="_blank" rel="noopener">송출 2</a><a id="live-3" target="_blank" rel="noopener">송출 3</a></nav>
    </section>
    <section class="frame-shell"><span class="frame-meta" id="frame-meta">화면 설정</span><iframe id="control-frame" title="채널 운영"></iframe></section>
</main>
<script>
document.addEventListener('DOMContentLoaded',()=>{
    const $=id=>document.getElementById(id),gate=$('login-gate'),studio=$('studio'),form=$('login-form'),password=$('admin-password'),submit=$('login-submit'),error=$('login-error'),select=$('channel-select'),frame=$('control-frame');
    let channels=[],activeChannel=null,activeMode='operations',activePage=1;
    const initialParams=new URLSearchParams(location.search),requested=String(initialParams.get('channel')||'cdcup').toLowerCase().replace(/[^a-z0-9-]/g,''),requestedView=String(initialParams.get('view')||'operations');
    const viewMatch=requestedView.match(/^layout-([123])$/);if(viewMatch){activeMode='layout';activePage=Number(viewMatch[1])}else if(['operations','archives','control'].includes(requestedView)){activeMode=requestedView}
    const esc=value=>CreoPlatform.escapeHtml(value);
    function controlKind(channel){if(channel?.id==='cdcup')return'cdcup';if(channel?.id==='crewart')return'crewart';return'platform'}
    function workspaceUrl(channel){return controlKind(channel)==='cdcup'?(channel?.legacy?.managementUrl||'cdcup-index.html'):`channel-workspace.html?channel=${encodeURIComponent(channel.id)}`}
    function operationsUrl(channel){const url=new URL(workspaceUrl(channel),location.href);url.searchParams.set('embedded','1');if(controlKind(channel)!=='cdcup')url.searchParams.set('tab','items');return url.pathname.replace(/^\//,'')+url.search}
    function archivesUrl(channel){return controlKind(channel)==='cdcup'?'cdcup-index.html?embedded=1&tab=archive':`channel-archives.html?channel=${encodeURIComponent(channel.id)}&embedded=1`}
    function controlUrl(channel){const kind=controlKind(channel);return kind==='platform'?`auction-control.html?channel=${encodeURIComponent(channel.id)}&embedded=1`:`settings.html?module=${encodeURIComponent(kind)}&channel=${encodeURIComponent(channel.id)}&embedded=1`}
    function layoutUrl(channel,page){return`preview.html?module=${encodeURIComponent(controlKind(channel))}&page=${page}&embedded=1`}
    function liveUrl(channel,page){return`broadcast-router.html?event=${encodeURIComponent(channel.id)}&page=${page}`}
    function syncMode(){if(!activeChannel)return;const hasLayouts=controlKind(activeChannel)!=='platform';if(!hasLayouts&&activeMode==='layout')activeMode='control';document.querySelectorAll('.mode-tab.layout').forEach(button=>button.hidden=!hasLayouts);document.querySelectorAll('.mode-tab').forEach(button=>{const selected=button.dataset.mode===activeMode&&(activeMode!=='layout'||Number(button.dataset.page)===activePage);button.classList.toggle('is-active',selected);button.setAttribute('aria-selected',String(selected))});const src=activeMode==='operations'?operationsUrl(activeChannel):activeMode==='archives'?archivesUrl(activeChannel):activeMode==='layout'?layoutUrl(activeChannel,activePage):controlUrl(activeChannel);const label=activeMode==='operations'?'현장 운영':activeMode==='archives'?'회차 기록':activeMode==='layout'?`배치 ${activePage}`:'송출 설정';$('frame-meta').textContent=label;frame.title=`${activeChannel.name} ${label}`;if(frame.getAttribute('src')!==src)frame.src=src;const view=activeMode==='layout'?`layout-${activePage}`:activeMode;history.replaceState(null,'',`broadcast-studio.html?channel=${encodeURIComponent(activeChannel.id)}&view=${view}`)}
    function activate(id){activeChannel=channels.find(row=>row.id===id)||channels[0];if(!activeChannel)return;const kind=controlKind(activeChannel);select.value=activeChannel.id;$('engine-label').textContent=`${activeChannel.name} 준비됨`;$('result-link').hidden=kind==='platform';$('result-link').href=kind==='crewart'?'crewart-ranking.html':'summary.html';$('shipping-link').href=`channel-shipping.html?channel=${encodeURIComponent(activeChannel.id)}`;for(let page=1;page<=3;page++)$('live-'+page).href=liveUrl(activeChannel,page);$('live-main').href=liveUrl(activeChannel,1);syncMode()}
    async function load(){const data=await CreoPlatform.api('channels');channels=data.channels||[];select.innerHTML=channels.map(channel=>`<option value="${esc(channel.id)}">${esc(channel.name)}</option>`).join('');if(!channels.length)throw new Error('사용 가능한 채널이 없습니다.');gate.hidden=true;studio.hidden=false;activate(requested)}
    function showLogin(message=''){studio.hidden=true;gate.hidden=false;error.textContent=message;submit.disabled=false;password.disabled=false;requestAnimationFrame(()=>password.focus({preventScroll:true}))}
    select.addEventListener('change',()=>{activeMode='operations';activePage=1;activate(select.value)});
    document.querySelector('.mode-tabs').addEventListener('click',event=>{const button=event.target.closest('[data-mode]');if(!button||button.hidden)return;activeMode=button.dataset.mode;activePage=Number(button.dataset.page||1);syncMode()});
    form.addEventListener('submit',async event=>{event.preventDefault();const value=password.value;if(!value)return;submit.disabled=true;password.disabled=true;error.textContent='';try{CreoPlatform.setAdmin(value);if(!await CreoPlatform.verifyAdmin(value))throw new Error('비밀번호가 맞지 않습니다.');password.value='';await load()}catch(failure){CreoPlatform.setAdmin('');showLogin(failure.message||'로그인하지 못했습니다.')}});
    (async()=>{try{if(await CreoPlatform.verifyAdmin())return await load()}catch(_){}showLogin()})();
});
</script>
</body>
</html>
