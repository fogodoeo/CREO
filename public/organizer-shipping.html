<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>주관사 배송비 정산 · 옹동2</title>
<script src="/platform-client.js"></script>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#191f28;font:16px system-ui,sans-serif}main{max-width:680px;margin:auto;padding:28px 18px}h1{font-size:27px;margin:12px 0 24px}h2{font-size:18px}section{background:white;border-radius:20px;padding:22px;margin:16px 0}label{display:block;font-size:14px;margin:14px 0}input,button{font:inherit;width:100%;padding:15px;border-radius:12px;border:1px solid #dce1e7}input{margin-top:7px}button{background:#2563eb;color:white;border:0;font-weight:700;cursor:pointer}small,p{color:#69717e;line-height:1.6}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:14px 4px;border-bottom:1px solid #edf0f3;text-align:right}td:first-child,th:first-child{text-align:left}.amount{font-size:32px;font-weight:800}#message{color:#b45309}[hidden]{display:none!important}a{color:#4b5563}</style>
<main><b>옹동2 · 주관사</b><h1>배송비 정산</h1><p id="channel"></p><p id="message" role="status"></p>
<section id="login" hidden><form id="login-form"><label>운영자 비밀번호<input type="password" id="password" required autocomplete="current-password"></label><button>확인</button></form></section>
<div id="content" hidden><section><small>전체 배송비 · 결제 대기 포함</small><div class="amount" id="total"></div><p>업체가 주관사에 정산할 누적 금액입니다.<br>이미 송금한 금액은 자동 차감되지 않습니다.</p><table><thead><tr><th>업체</th><th>정산 합계</th><th>결제 완료분</th><th>결제 대기분</th></tr></thead><tbody id="vendors"></tbody></table></section>
<section><h2>배송비 받을 계좌</h2><form id="bank-form"><label>은행<input id="bankName" required maxlength="40"></label><label>계좌번호<input id="bankAccount" required inputmode="numeric" maxlength="80"></label><label>예금주<input id="bankHolder" required maxlength="60"></label><button id="save">계좌 저장</button></form><small>등록하면 해당 채널 업체 페이지에 표시됩니다.</small></section><a id="back">운영 페이지로 돌아가기</a></div></main>
<script>
const $=id=>document.getElementById(id), channelId=new URLSearchParams(location.search).get('channel')||'', esc=CreoPlatform.escapeHtml;
let state, saving=false;
const money=n=>Number(n||0).toLocaleString('ko-KR')+'원';
async function load(){try{if(!channelId)throw Error('채널 주소가 필요합니다.');state=await CreoPlatform.api('channels/'+encodeURIComponent(channelId)+'/organizer-shipping');$('login').hidden=true;$('content').hidden=false;$('channel').textContent=state.channel.name;$('total').textContent=money(state.vendors.reduce((n,v)=>n+(v.totalAmount ?? v.collectedAmount+v.pendingAmount),0));$('vendors').innerHTML=state.vendors.map(v=>'<tr><td>'+esc(v.vendorName)+'</td><td><b>'+money(v.totalAmount ?? v.collectedAmount+v.pendingAmount)+'</b></td><td>'+money(v.collectedAmount)+'</td><td>'+money(v.pendingAmount)+'</td></tr>').join('');for(const k of ['bankName','bankAccount','bankHolder'])$(k).value=state.bank[k]||'';$('back').href='/channel-workspace.html?channel='+encodeURIComponent(channelId)}catch(e){if(e.status===401){$('login').hidden=false;$('content').hidden=true}else $('message').textContent=e.message}}
$('login-form').onsubmit=async e=>{e.preventDefault();try{if(!await CreoPlatform.verifyAdmin($('password').value))throw Error('비밀번호를 확인해 주세요.');$('password').value='';$('message').textContent='';await load()}catch(err){$('message').textContent=err.message}};
$('bank-form').onsubmit=async e=>{e.preventDefault();if(saving)return;saving=true;$('save').disabled=true;try{const body={expectedUpdatedAt:state.bank.updatedAt||''};for(const k of ['bankName','bankAccount','bankHolder'])body[k]=$(k).value.trim();await CreoPlatform.api('channels/'+encodeURIComponent(channelId)+'/organizer-shipping',{method:'PUT',body:JSON.stringify(body)});await load();$('message').textContent='계좌를 저장했습니다.'}catch(err){$('message').textContent=err.message}finally{saving=false;$('save').disabled=false}};
load();
</script></html>
