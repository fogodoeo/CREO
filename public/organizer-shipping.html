<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>배송비 정산 · 옹동2</title>
<script src="/platform-client.js"></script><link rel="stylesheet" href="/ongdong-brand.css"><script src="/ongdong-brand.js"></script><link rel="stylesheet" href="/shipping-settlement.css?v=20260910-fee-details">
</head><body class="organizer-page"><main>
<header class="settlement-top"><b data-ongdong-brand>옹동2</b></header>
<p id="channel" class="settlement-muted"></p><h1>배송비 정산</h1><p id="message" role="status"></p>
<section id="login" class="settlement-card" hidden><form id="login-form"><label>운영자 비밀번호<input type="password" id="password" required autocomplete="current-password"></label><button class="settlement-primary">확인</button></form></section>
<div id="content" hidden>
<section class="settlement-card settlement-bank-card" id="bank-settings" aria-labelledby="bank-title"><div class="settlement-pair"><h2 id="bank-title">배송비 받을 계좌 등록</h2><button id="edit-bank" class="settlement-text" type="button" hidden>수정</button></div><p id="bank-intro" class="settlement-muted">업체에 표시할 계좌를 입력해 주세요.</p>
<div id="bank-saved" hidden><p id="bank-saved-owner" class="settlement-muted"></p><b id="bank-saved-account" class="settlement-saved-account"></b><div class="settlement-pair"><span>입금 알림 번호</span><span id="bank-saved-phone"></span></div></div>
<form id="bank-form"><label>은행<input id="bankName" required maxlength="40" autocomplete="off" placeholder="예: 국민은행"></label><label>계좌번호<input id="bankAccount" required inputmode="numeric" maxlength="80" autocomplete="off" placeholder="계좌번호 입력"></label><label>예금주<input id="bankHolder" required maxlength="60" autocomplete="off" placeholder="예금주명 입력"></label><label>입금 알림 받을 번호<input id="notificationPhone" type="tel" required maxlength="13" autocomplete="tel" placeholder="010-0000-0000"></label><button id="save" class="settlement-primary">계좌 등록하기</button><button id="cancel-bank" class="settlement-secondary" type="button" hidden>취소</button></form></section>
<section class="settlement-card"><span class="settlement-muted">업체에서 더 받아야 할 배송비</span><div class="settlement-amount" id="total"></div><div class="settlement-overview"><div><span>이미 받은 금액</span><b id="received"></b></div><div><span>받을 총액</span><b id="all-total"></b></div></div><p id="missing-total" class="settlement-muted" hidden></p></section>
<section id="pending-section"><h2>입금 확인 대기 <span id="pending-count"></span></h2><div id="pending"></div></section>
<div class="settlement-section-head"><h2>업체별 수금 현황</h2><button id="refresh" class="settlement-text">새로고침</button></div><div id="vendors"></div>
<h2>배송업체별 배송비</h2><p class="settlement-muted">등록 배송비 기준 · 실제 송금 내역은 별도</p><div id="carriers"></div>
</div></main><script src="/shipping-confirm.js?v=20260910"></script><script src="/organizer-shipping.js?v=20260910-fee-details"></script></body></html>
