<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><meta name="referrer" content="no-referrer"><title>주관사 · 옹동2</title>
<script src="/platform-client.js"></script><link rel="stylesheet" href="/ongdong-brand.css"><script src="/ongdong-brand.js"></script><link rel="stylesheet" href="/shipping-settlement.css?v=20260910-organizer-role"><link rel="stylesheet" href="/organizer-page.css?v=20260910-receipts">
</head><body class="organizer-page"><main>
<header class="settlement-top"><b data-ongdong-brand>옹동2</b><span class="settlement-muted">주관사</span></header>
<p id="channel" class="settlement-muted"></p><h1>배송비 정산</h1><p id="message" role="status"></p>
<section id="login" class="settlement-card" hidden><form id="login-form"><label>운영자 비밀번호<input type="password" id="password" required autocomplete="current-password"></label><button class="settlement-primary">확인</button></form></section>
<div id="content" hidden>
<section class="settlement-card settlement-bank-card" id="bank-settings" aria-labelledby="bank-title"><div class="settlement-pair"><h2 id="bank-title">배송비 받을 계좌 등록</h2><button id="edit-bank" class="settlement-text" type="button" hidden>수정</button></div><p id="bank-intro" class="settlement-muted">업체에 표시할 계좌를 입력해 주세요.</p>
<div id="bank-saved" hidden><p id="bank-saved-owner" class="settlement-muted"></p><b id="bank-saved-account" class="settlement-saved-account"></b><div class="settlement-pair"><span>입금 알림 번호</span><span id="bank-saved-phone"></span></div></div>
<form id="bank-form"><label>은행<input id="bankName" required maxlength="40" autocomplete="off" placeholder="예: 국민은행"></label><label>계좌번호<input id="bankAccount" required inputmode="numeric" maxlength="80" autocomplete="off" placeholder="계좌번호 입력"></label><label>예금주<input id="bankHolder" required maxlength="60" autocomplete="off" placeholder="예금주명 입력"></label><label>입금 알림 받을 번호<input id="notificationPhone" type="tel" required maxlength="13" autocomplete="tel" placeholder="010-0000-0000"></label><button id="save" class="settlement-primary">계좌 등록하기</button><button id="cancel-bank" class="settlement-secondary" type="button" hidden>취소</button></form></section>
<section class="organizer-overview"><span class="settlement-muted">미입금 배송비</span><div class="settlement-amount" id="total"></div><div class="organizer-totals"><span>총액 <b id="all-total"></b></span><span>입금 <b id="received"></b></span></div><p id="missing-total" class="settlement-muted" hidden></p></section>
<section class="organizer-vendors"><div class="settlement-section-head"><h2>업체별 내역</h2><button id="refresh" class="settlement-text" type="button">새로고침</button></div><div id="vendors"></div></section>
<details class="organizer-carriers"><summary>배송업체별 배송비 <span aria-hidden="true">⌄</span></summary><p class="settlement-muted">배송비 배정 기준 · 송금 내역 별도</p><div id="carriers"></div></details>
</div></main>
<dialog id="receipt-dialog" class="organizer-sheet" aria-labelledby="receipt-title">
<header class="organizer-sheet-head"><h2 id="receipt-title">입금 확인</h2><button id="close-receipt" type="button" class="settlement-text" aria-label="닫기">×</button></header>
<form id="receipt-form">
<label class="receipt-label" for="receipt-amount">입금액</label><div class="receipt-money"><input id="receipt-amount" inputmode="numeric" autocomplete="off" aria-describedby="receipt-balance" required><span>원</span></div><p id="receipt-balance" class="settlement-muted"></p>
<div class="receipt-date-row"><label for="receipt-date">입금일</label><input id="receipt-date" type="date" required></div>
<button id="add-receipt-memo" class="settlement-text receipt-memo-toggle" type="button">메모 추가 · 선택</button><input id="receipt-memo" maxlength="200" aria-label="메모 (선택)" placeholder="메모 (선택)" hidden>
<details id="receipt-details"><summary>상세 내역 <span aria-hidden="true">⌄</span></summary><div id="receipt-detail-content"></div></details>
<p id="receipt-error" class="receipt-error" role="alert" hidden></p>
<button id="receipt-reload" class="settlement-text" type="button" hidden>최신 내역 불러오기</button>
<footer class="receipt-footer"><button id="confirm-receipt" class="settlement-primary" type="submit">입금 확인 완료</button></footer>
</form></dialog>
<script src="/organizer-shipping.js?v=20260910-receipts"></script></body></html>
