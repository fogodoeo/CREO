<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>송출 배치 · 옹동2</title>
  <link rel="stylesheet" href="studio-layout-editor.css?v=20260915-retro-console">
  <script defer src="platform-client.js?v=20260803-admin-session-v2"></script>
  <script defer src="studio-layout-draft.js?v=20260915-studio"></script>
  <script defer src="studio-layout-editor.js?v=20260915-retro-console"></script>
</head>
<body>
<main class="editor">
  <header class="editor-head">
    <div class="editor-title"><span class="page-chip" id="page-chip">P1</span><div><h1 id="editor-title">진행 화면 배치</h1><p>화면에서 요소를 선택해 조절하세요</p></div></div>
    <div class="head-actions"><span class="save-status" id="save-status" role="status">불러오는 중…</span><button class="action primary" id="save" type="button" disabled>배치 저장</button></div>
  </header>
  <p class="save-error" id="save-error" role="alert" hidden></p>
  <section class="workspace" aria-label="송출 배치 편집">
    <section class="canvas" aria-label="송출 미리보기">
      <div class="canvas-top"><strong>송출 미리보기</strong><label id="example-option" hidden><input id="example-preview" type="checkbox" checked> 예시 데이터</label><span>1920 × 1080 · <span id="preview-scale">맞춤</span></span></div>
      <div class="canvas-surface" id="canvas-surface">
        <div class="preview" id="preview"><iframe id="frame" title="송출 배치 미리보기"></iframe></div>
        <div class="retry-preview" id="preview-error" hidden><p>화면을 불러오지 못했어요.<br>연결을 확인하고 다시 시도해 주세요.</p><button class="action" id="retry-preview" type="button">다시 불러오기</button></div>
      </div>
      <div class="canvas-caption"><span>끌어서 이동 · 모서리로 크기 조절</span><span><kbd>← ↑ ↓ →</kbd> 미세 이동</span></div>
    </section>
    <aside class="inspector" aria-label="선택 요소 속성">
      <h2>요소 조절</h2>
      <div class="field"><label for="slot">배치 요소</label><select id="slot"><option value="">화면을 불러오는 중…</option></select></div>
      <fieldset><legend>위치 <span>(%)</span></legend><div class="paired">
        <div class="field"><label for="x">가로 X</label><input id="x" type="number" min="0" max="96" step="0.1" disabled></div>
        <div class="field"><label for="y">세로 Y</label><input id="y" type="number" min="0" max="96" step="0.1" disabled></div>
      </div></fieldset>
      <fieldset><legend>크기 <span>(%)</span></legend><div class="paired">
        <div class="field"><label for="width">가로</label><input id="width" type="number" min="4" max="100" step="0.1" disabled></div>
        <div class="field"><label for="height">세로</label><input id="height" type="number" min="4" max="100" step="0.1" disabled></div>
      </div></fieldset>
      <div class="range-field"><div class="range-heading"><label for="font" id="font-label">글자 크기</label><output for="font" id="font-value">100%</output></div><input id="font" type="range" min="0.5" max="2.5" step="0.05" value="1" disabled></div>
      <p class="fit-note" id="fit-note" role="status" hidden>내용이 길어요 · 문구 또는 폭 조절</p>
      <div class="range-field"><div class="range-heading"><label for="opacity" id="opacity-label">불투명도</label><output for="opacity" id="opacity-value">100%</output></div><input id="opacity" type="range" min="0" max="100" step="1" value="100" disabled></div>
      <label class="toggle" for="visible">송출에 표시<input id="visible" type="checkbox" checked disabled></label>
      <div class="reset-row"><button class="action quiet" id="reset" type="button" disabled>이 요소를 기본 배치로</button></div>
      <div class="inspector-links"><button class="action" id="content" type="button">문구·표시 설정 <span aria-hidden="true">↓</span></button><button class="action" id="banners" type="button">배너 관리 <span aria-hidden="true">↓</span></button></div>
    </aside>
  </section>
  <section class="settings-dock" id="settings-dock"><div class="settings-head"><h2><span id="settings-page">P1</span> 문구·표시 설정</h2><span>배치와 내용은 각각 저장돼요</span></div><iframe class="settings-frame" id="settings-frame" title="페이지별 송출 설정"></iframe></section>
</main>
<div class="toast" id="toast" role="status"></div>
</body>
</html>
