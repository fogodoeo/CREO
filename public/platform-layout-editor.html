<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>송출 배치 · CREO</title>
    <script src="platform-client.js?v=20260803-admin-session-v2"></script>
    <style>
        :root{color-scheme:dark;--bg:#0b0d10;--panel:#14181e;--line:#303741;--text:#f4f5f7;--muted:#8e98a5;--accent:#e3b75d}*{box-sizing:border-box}html,body{min-height:100%;margin:0;background:var(--bg);color:var(--text);font-family:Pretendard,"Malgun Gothic",sans-serif}button,input,select{font:inherit}.editor{display:grid;min-height:100vh;grid-template-rows:auto minmax(540px,calc(100vh - 58px)) auto}.toolbar{position:sticky;top:0;z-index:10;display:grid;grid-template-columns:minmax(150px,240px) repeat(3,minmax(84px,110px)) minmax(60px,1fr) auto auto auto;align-items:end;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);background:#111419}.field{display:grid;gap:4px}.field label{color:var(--muted);font-size:9px;font-weight:800}.field input,.field select{width:100%;height:34px;padding:0 9px;border:1px solid var(--line);border-radius:7px;background:#0b0e12;color:#fff}.range{display:grid;grid-template-columns:1fr 42px;align-items:center;gap:6px}.range input[type=range]{padding:0}.action{height:34px;padding:0 12px;border:1px solid var(--line);border-radius:7px;background:#1a1f26;color:#d8dde4;font-size:10px;font-weight:850;cursor:pointer;white-space:nowrap}.action.primary{border-color:var(--accent);background:var(--accent);color:#1b1509}.action:disabled{opacity:.45}.canvas{position:relative;display:grid;min-height:0;place-items:center;padding:12px;overflow:hidden;background:repeating-linear-gradient(45deg,#0c0f13,#0c0f13 14px,#0f1217 14px,#0f1217 28px)}.preview{position:relative;width:min(100%,calc((100vh - 92px)*16/9));aspect-ratio:16/9;border:1px solid #343b45;background:#05070a;box-shadow:0 22px 70px #0009}.preview iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#05070a}.hint{position:absolute;right:16px;bottom:14px;padding:7px 10px;border-radius:7px;background:#080b0fd9;color:#9099a5;font-size:10px;pointer-events:none}.settings-dock{border-top:1px solid var(--line);background:#0e1115}.settings-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 10px}.settings-head h2{margin:0;font-size:16px}.settings-head span{color:var(--muted);font-size:10px}.settings-frame{display:block;width:100%;height:620px;border:0;background:#0e1115}.toast{position:fixed;right:16px;bottom:16px;z-index:20;padding:11px 14px;border-radius:8px;background:var(--accent);color:#181207;font-size:11px;font-weight:850;opacity:0;transform:translateY(7px);transition:.2s}.toast.show{opacity:1;transform:none}@media(max-width:900px){.toolbar{grid-template-columns:1fr 1fr 1fr}.field:first-child{grid-column:1/-1}.preview{width:100%}.settings-frame{height:760px}}
    </style>
</head>
<body>
<main class="editor">
    <section class="toolbar">
        <div class="field"><label>배치 요소</label><select id="slot"><option value="">화면에서 요소를 선택하세요</option></select></div>
        <div class="field"><label>가로 크기 (%)</label><input id="width" type="number" min="4" max="100" step="0.1"></div>
        <div class="field"><label>세로 크기 (%)</label><input id="height" type="number" min="4" max="100" step="0.1"></div>
        <div class="field"><label>글자 크기</label><div class="range"><input id="font" type="range" min="0.5" max="2.5" step="0.05" value="1"><output id="font-value">100%</output></div></div>
        <div></div><button class="action" id="content" type="button">아래 설정</button><button class="action" id="reset" type="button">선택 초기화</button><button class="action primary" id="save" type="button">배치 저장</button>
    </section>
    <section class="canvas"><div class="preview"><iframe id="frame" title="송출 배치 미리보기"></iframe></div><div class="hint">요소를 끌어 이동 · 우측 아래 손잡이로 크기 조절</div></section>
    <section class="settings-dock" id="settings-dock"><div class="settings-head"><h2><span id="settings-page"></span> 송출 설정</h2><span>표시 여부 · 문구 · 배너 · 연출을 이 화면에서 바로 저장</span></div><iframe class="settings-frame" id="settings-frame" title="페이지별 송출 설정"></iframe></section>
</main>
<div class="toast" id="toast"></div>
<script>
const params=new URLSearchParams(location.search),channelId=String(params.get('channel')||'').replace(/[^a-z0-9-]/g,''),page=Math.max(1,Math.min(3,Number(params.get('page'))||1));
const $=id=>document.getElementById(id),frame=$('frame'),settingsFrame=$('settings-frame'),slotSelect=$('slot'),labels={'p1-brand':'채널 로고','p1-page-label':'1P 표시','p1-hosts':'진행자','p1-notice':'공지','p1-banner':'배너','p1-ticker':'하단 자막','p2-brand':'채널 로고','p2-page-label':'2P 표시','p2-progress':'현재 / 전체 진행률','p2-header':'상단 개체명','p2-info':'개체 정보','p2-bidders':'실시간 입찰자','p2-photo':'개체 사진','p2-price':'가격','p2-sold':'낙찰 알림','p2-banner':'배너','p2-ticker':'하단 자막','p3-board':'집계판','p3-effect':'주사위·결과 연출','p3-banner':'배너'};
let placements={},selectedSlot='',drag=null,layoutDirty=false;
function toast(message){const el=$('toast');el.textContent=message;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2200)}
function clamp(value,min,max){return Math.max(min,Math.min(max,Number(value)||0))}
function previewDocument(){return frame.contentDocument}
function target(slot=selectedSlot){return previewDocument()?.querySelector(`[data-layout-slot="${slot}"]`)||null}
function currentBox(element){const rect=element.getBoundingClientRect(),view=previewDocument().documentElement;return{x:rect.left/view.clientWidth*100,y:rect.top/view.clientHeight*100,width:rect.width/view.clientWidth*100,height:rect.height/view.clientHeight*100,fontScale:Number(element.style.getPropertyValue('--layout-font-scale'))||1}}
function normalizedBox(slot){const element=target(slot);return placements[slot]||currentBox(element)}
function apply(slot,box){const element=target(slot);if(!element)return;placements[slot]={x:clamp(box.x,0,96),y:clamp(box.y,0,96),width:clamp(box.width,4,100),height:clamp(box.height,4,100),fontScale:clamp(box.fontScale,.5,2.5)};layoutDirty=true;const value=placements[slot];element.dataset.layoutCustom='1';element.style.setProperty('--layout-x',value.x+'%');element.style.setProperty('--layout-y',value.y+'%');element.style.setProperty('--layout-width',value.width+'%');element.style.setProperty('--layout-height',value.height+'%');element.style.setProperty('--layout-font-scale',value.fontScale);syncFields()}
function syncFields(){const value=selectedSlot&&target()?normalizedBox(selectedSlot):null;$('width').value=value?value.width.toFixed(1):'';$('height').value=value?value.height.toFixed(1):'';$('font').value=value?.fontScale||1;$('font-value').textContent=Math.round((value?.fontScale||1)*100)+'%';$('reset').disabled=!selectedSlot||!placements[selectedSlot]}
function select(slot){selectedSlot=slot||'';slotSelect.value=selectedSlot;previewDocument()?.querySelectorAll('[data-layout-slot]').forEach(element=>element.classList.toggle('layout-selected',element.dataset.layoutSlot===selectedSlot));syncFields()}
function install(){const doc=previewDocument(),elements=[...doc.querySelectorAll('[data-layout-slot]')];slotSelect.innerHTML='<option value="">요소 선택</option>'+elements.map(element=>`<option value="${element.dataset.layoutSlot}">${labels[element.dataset.layoutSlot]||element.dataset.layoutSlot}</option>`).join('');let style=doc.getElementById('creo-layout-editor-style');if(!style){style=doc.createElement('style');style.id='creo-layout-editor-style';style.textContent='.creo-layout-handle{position:absolute!important;right:-8px!important;bottom:-8px!important;width:18px!important;height:18px!important;border:2px solid #161009!important;border-radius:50%!important;background:#f4b544!important;cursor:nwse-resize!important;z-index:9999!important;zoom:1!important}.layout-selected>.creo-layout-handle{display:block!important}[data-layout-slot]:not(.layout-selected)>.creo-layout-handle{display:none!important}';doc.head.appendChild(style)}elements.forEach(element=>{let handle=element.querySelector(':scope > .creo-layout-handle');if(!handle){handle=doc.createElement('span');handle.className='creo-layout-handle';element.appendChild(handle)}element.onpointerdown=event=>{if(event.target===handle)return;event.preventDefault();select(element.dataset.layoutSlot);const box=normalizedBox(selectedSlot);drag={type:'move',pointer:event.pointerId,startX:event.clientX,startY:event.clientY,box};element.setPointerCapture(event.pointerId)};handle.onpointerdown=event=>{event.preventDefault();event.stopPropagation();select(element.dataset.layoutSlot);const box=normalizedBox(selectedSlot);drag={type:'resize',pointer:event.pointerId,startX:event.clientX,startY:event.clientY,box};handle.setPointerCapture(event.pointerId)}});doc.onpointermove=event=>{if(!drag)return;const view=doc.documentElement,dx=(event.clientX-drag.startX)/view.clientWidth*100,dy=(event.clientY-drag.startY)/view.clientHeight*100;if(drag.type==='move')apply(selectedSlot,{...drag.box,x:drag.box.x+dx,y:drag.box.y+dy});else apply(selectedSlot,{...drag.box,width:drag.box.width+dx,height:drag.box.height+dy})};doc.onpointerup=()=>{drag=null};if(elements[0])select(elements[0].dataset.layoutSlot)}
window.addEventListener('message',async event=>{if(event.origin!==location.origin)return;if(event.source===frame.contentWindow&&event.data?.type==='creo-layout-ready'){placements={...(event.data.placements||{})};layoutDirty=false;requestAnimationFrame(install);return}if(event.source===settingsFrame.contentWindow&&event.data?.type==='creo-broadcast-settings-saved'){if(layoutDirty)await savePlacements(false);frame.src=`auction-live.html?channel=${encodeURIComponent(channelId)}&page=${page}&editor=1&refresh=${Date.now()}`;toast(`${page}P 설정을 반영했습니다.`)}});
slotSelect.onchange=()=>select(slotSelect.value);$('width').oninput=()=>selectedSlot&&apply(selectedSlot,{...normalizedBox(selectedSlot),width:$('width').value});$('height').oninput=()=>selectedSlot&&apply(selectedSlot,{...normalizedBox(selectedSlot),height:$('height').value});$('font').oninput=()=>selectedSlot&&apply(selectedSlot,{...normalizedBox(selectedSlot),fontScale:$('font').value});
$('reset').onclick=()=>{if(!selectedSlot)return;delete placements[selectedSlot];layoutDirty=true;const element=target();if(element){delete element.dataset.layoutCustom;for(const name of ['--layout-x','--layout-y','--layout-width','--layout-height','--layout-font-scale'])element.style.removeProperty(name)}syncFields();toast('저장하면 기본 위치로 되돌아갑니다.')};
$('content').onclick=()=>$('settings-dock').scrollIntoView({behavior:'smooth',block:'start'});
async function savePlacements(showToast=true){try{const response=await CreoPlatform.api(`channels/${encodeURIComponent(channelId)}/broadcast-state`,{method:'PUT',body:JSON.stringify({layoutPlacements:placements})});placements={...(response.state?.layoutPlacements||placements)};layoutDirty=false;if(showToast)toast(`${page}P 배치를 저장했습니다.`);return true}catch(error){if(error.status===401)window.parent.postMessage({type:'creo-admin-required'},location.origin);toast(error.message||'저장하지 못했습니다.');return false}}
$('save').onclick=()=>savePlacements(true);
$('settings-page').textContent=`${page}P`;
frame.src=`auction-live.html?channel=${encodeURIComponent(channelId)}&page=${page}&editor=1`;
settingsFrame.src=`auction-control.html?channel=${encodeURIComponent(channelId)}&page=${page}&embedded=1&compact=1`;
</script>
</body>
</html>
