<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CREOK CAM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;900&family=Pretendard:wght@600;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  
  <style>
    :root {
      --bg: #06080c;
      --card: rgba(16, 21, 32, 0.9);
      --border: rgba(255, 255, 255, 0.1);
      --green: #00e676;
      --cyan: #00d2ff;
      --purple: #a855f7;
      --gold: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Pretendard', sans-serif;
    }

    body {
      background: var(--bg);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .wrap {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 4px;
    }

    .logo {
      font-family: 'Outfit', sans-serif;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #fff, var(--cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .channel-wrap {
      display: flex;
      align-items: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 6px 12px;
      gap: 4px;
    }

    .channel-wrap span {
      color: #64748b;
      font-weight: 800;
    }

    .channel-input {
      background: transparent;
      border: none;
      color: #fff;
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      font-weight: 800;
      width: 90px;
      outline: none;
    }

    /* 4 Giant Action Buttons */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 18px;
      padding: 20px 14px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 10px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn .icon {
      font-size: 32px;
      line-height: 1;
    }

    .btn .title {
      font-size: 17px;
      font-weight: 900;
      letter-spacing: -0.3px;
    }

    .btn.green { border-color: rgba(0, 230, 118, 0.35); }
    .btn.green:hover, .btn.green:active { border-color: var(--green); background: rgba(0, 230, 118, 0.08); }
    .btn.green .title { color: var(--green); }

    .btn.cyan { border-color: rgba(0, 210, 255, 0.35); }
    .btn.cyan:hover, .btn.cyan:active { border-color: var(--cyan); background: rgba(0, 210, 255, 0.08); }
    .btn.cyan .title { color: var(--cyan); }

    .btn.purple { border-color: rgba(168, 85, 247, 0.35); }
    .btn.purple:hover, .btn.purple:active { border-color: var(--purple); background: rgba(168, 85, 247, 0.08); }
    .btn.purple .title { color: var(--purple); }

    .btn.gold { border-color: rgba(245, 158, 11, 0.35); }
    .btn.gold:hover, .btn.gold:active { border-color: var(--gold); background: rgba(245, 158, 11, 0.08); }
    .btn.gold .title { color: var(--gold); }

    /* Compact QR Grid */
    .qr-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .qr-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .qr-img {
      background: #fff;
      padding: 4px;
      border-radius: 8px;
      width: 58px;
      height: 58px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qr-img canvas {
      width: 100% !important;
      height: 100% !important;
    }

    .qr-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .qr-text h4 {
      font-size: 13px;
      font-weight: 800;
      color: #fff;
    }

    .qr-text span {
      font-size: 11px;
      color: #64748b;
      font-weight: 600;
    }

    /* Fullscreen View Container */
    .fullscreen-box {
      display: none;
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      z-index: 9999;
    }

    .fullscreen-box iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .close-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(0,0,0,0.8);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      z-index: 10000;
    }
  </style>
</head>
<body>

  <!-- Fullscreen Player for Tablet/OBS -->
  <div id="fullView" class="fullscreen-box">
    <button class="close-btn" onclick="closeFullView()">✕ 닫기</button>
    <iframe id="streamIframe" allow="camera; microphone; display-capture; autoplay" allowfullscreen></iframe>
  </div>

  <div class="wrap" id="mainWrap">
    
    <!-- Top Bar -->
    <div class="top-bar">
      <div class="logo">CREOK CAM</div>
      <div class="channel-wrap">
        <span>#</span>
        <input type="text" id="channelInput" class="channel-input" value="ongdong" placeholder="채널">
      </div>
    </div>

    <!-- 4 Clean Giant Buttons -->
    <div class="grid">
      
      <!-- 1. Phone Camera (720p / 30fps / Back Cam / No Overheat) -->
      <div class="btn green" onclick="launchPhoneCam()">
        <div class="icon">📱</div>
        <div class="title">폰 카메라 송출</div>
      </div>

      <!-- 2. Tablet Monitor (0s Delay) -->
      <div class="btn cyan" onclick="launchTabletView()">
        <div class="icon">📲</div>
        <div class="title">태블릿 모니터</div>
      </div>

      <!-- 3. PC Virtual Cam Push -->
      <div class="btn purple" onclick="launchPcPush()">
        <div class="icon">🖥️</div>
        <div class="title">PC 화면 송출</div>
      </div>

      <!-- 4. OBS Link Copy -->
      <div class="btn gold" onclick="copyObsCamUrl()">
        <div class="icon">📋</div>
        <div class="title">OBS 링크 복사</div>
      </div>

    </div>

    <!-- Compact Dual QR Grid -->
    <div class="qr-grid">
      <div class="qr-box" onclick="launchPhoneCam()">
        <div class="qr-img"><canvas id="qrPhone"></canvas></div>
        <div class="qr-text">
          <h4>폰 카메라 QR</h4>
          <span>스캔 시 송출</span>
        </div>
      </div>

      <div class="qr-box" onclick="launchTabletView()">
        <div class="qr-img"><canvas id="qrTablet"></canvas></div>
        <div class="qr-text">
          <h4>태블릿 QR</h4>
          <span>스캔 시 수신</span>
        </div>
      </div>
    </div>

  </div>

  <script>
    const chInput = document.getElementById('channelInput');
    const qrPhone = document.getElementById('qrPhone');
    const qrTablet = document.getElementById('qrTablet');
    const mainWrap = document.getElementById('mainWrap');
    const fullView = document.getElementById('fullView');
    const streamIframe = document.getElementById('streamIframe');

    function getCh() {
      return (chInput.value.trim() || 'ongdong').toLowerCase();
    }

    // 720p Stable & Universal (No Camera Overconstrained Error)
    function getPhoneCamUrl() {
      return `https://vdo.ninja/?push=${getCh()}_cam&facing=back&quality=2&fps=30&codec=h264&buffer=0&autostart`;
    }

    function getTabletViewUrl() {
      return `https://vdo.ninja/?view=${getCh()}_monitor&cleanoutput&buffer=0&cover`;
    }

    function getPcPushUrl() {
      return `https://vdo.ninja/?push=${getCh()}_monitor&quality=2&fps=30&codec=h264&buffer=0&autostart`;
    }

    function getObsCamUrl() {
      return `https://vdo.ninja/?view=${getCh()}_cam&cleanoutput&buffer=0&cover`;
    }

    // Render Clean QRs
    function updateQrs() {
      QRCode.toCanvas(qrPhone, getPhoneCamUrl(), { width: 58, margin: 0, color: { dark: '#06080c', light: '#ffffff' } });
      QRCode.toCanvas(qrTablet, getTabletViewUrl(), { width: 58, margin: 0, color: { dark: '#06080c', light: '#ffffff' } });
    }

    chInput.addEventListener('input', updateQrs);

    // Actions
    function launchPhoneCam() {
      window.location.href = getPhoneCamUrl();
    }

    function launchTabletView() {
      mainWrap.style.display = 'none';
      fullView.style.display = 'block';
      streamIframe.src = getTabletViewUrl();
    }

    function launchPcPush() {
      window.location.href = getPcPushUrl();
    }

    function copyObsCamUrl() {
      navigator.clipboard.writeText(getObsCamUrl()).then(() => {
        alert('OBS 브라우저 소스 링크 복사 완료!');
      });
    }

    function closeFullView() {
      streamIframe.src = '';
      fullView.style.display = 'none';
      mainWrap.style.display = 'flex';
    }

    // Auto routing (?action=phone / ?action=tablet)
    window.addEventListener('DOMContentLoaded', () => {
      const p = new URLSearchParams(window.location.search);
      const action = p.get('action');
      const ch = p.get('ch') || p.get('channel');
      if (ch) chInput.value = ch;
      updateQrs();

      if (action === 'phone' || action === 'cam') launchPhoneCam();
      else if (action === 'tablet' || action === 'monitor') launchTabletView();
      else if (action === 'pc') launchPcPush();
    });
  </script>
</body>
</html>
