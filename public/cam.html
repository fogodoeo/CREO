<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CREOK CAM — 무선 방송 &amp; 모니터링 엔진</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;900&family=Pretendard:wght@600;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  
  <style>
    :root {
      --bg: #06080c;
      --card: rgba(16, 21, 32, 0.94);
      --border: rgba(255, 255, 255, 0.12);
      --green: #00e676;
      --cyan: #00d2ff;
      --purple: #a855f7;
      --gold: #f59e0b;
      --pink: #ff3366;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Pretendard', sans-serif;
    }

    body {
      background: var(--bg);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow: hidden;
    }

    /* Main Dashboard */
    .wrap {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      z-index: 10;
      transition: opacity 0.2s;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 2px;
    }

    .logo {
      font-family: 'Outfit', sans-serif;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #fff, var(--cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .channel-wrap {
      display: flex;
      align-items: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 6px 12px;
      gap: 4px;
    }

    .channel-wrap span { color: #64748b; font-weight: 800; }
    .channel-input {
      background: transparent;
      border: none;
      color: #fff;
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      font-weight: 800;
      width: 90px;
      outline: none;
    }

    /* 4 Action Buttons */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 18px;
      padding: 22px 14px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 10px;
      transition: all 0.18s ease;
      user-select: none;
    }

    .btn:active { transform: scale(0.95); }
    .btn .icon { font-size: 34px; line-height: 1; }
    .btn .title { font-size: 17px; font-weight: 900; letter-spacing: -0.3px; }

    .btn.green { border-color: rgba(0, 230, 118, 0.4); }
    .btn.green:hover, .btn.green:active { border-color: var(--green); background: rgba(0, 230, 118, 0.12); }
    .btn.green .title { color: var(--green); }

    .btn.cyan { border-color: rgba(0, 210, 255, 0.4); }
    .btn.cyan:hover, .btn.cyan:active { border-color: var(--cyan); background: rgba(0, 210, 255, 0.12); }
    .btn.cyan .title { color: var(--cyan); }

    .btn.purple { border-color: rgba(168, 85, 247, 0.4); }
    .btn.purple:hover, .btn.purple:active { border-color: var(--purple); background: rgba(168, 85, 247, 0.12); }
    .btn.purple .title { color: var(--purple); }

    .btn.gold { border-color: rgba(245, 158, 11, 0.4); }
    .btn.gold:hover, .btn.gold:active { border-color: var(--gold); background: rgba(245, 158, 11, 0.12); }
    .btn.gold .title { color: var(--gold); }

    /* Compact QR Grid */
    .qr-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .qr-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .qr-box:active { transform: scale(0.97); }
    .qr-img {
      background: #fff;
      padding: 4px;
      border-radius: 8px;
      width: 58px;
      height: 58px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qr-img canvas { width: 100% !important; height: 100% !important; }
    .qr-text { display: flex; flex-direction: column; gap: 2px; }
    .qr-text h4 { font-size: 13px; font-weight: 800; color: #fff; }
    .qr-text span { font-size: 11px; color: #64748b; font-weight: 600; }

    /* ─────────────────────────────────────────────────────────────
       100% IN-PAGE DEDICATED STREAM CONTAINER (STAYS ON creok.onrender.com!)
       ───────────────────────────────────────────────────────────── */
    .stream-viewport {
      display: none;
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      z-index: 99999;
    }

    .stream-viewport.active {
      display: block;
    }

    .stream-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #000;
    }

    /* Floating Studio HUD */
    .hud-bar {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 100000;
      pointer-events: none;
    }

    .hud-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(6, 8, 12, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 800;
      backdrop-filter: blur(14px);
    }

    .hud-dot {
      width: 8px;
      height: 8px;
      background: var(--pink);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--pink);
      animation: blink 1.2s infinite;
    }

    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    .hud-exit-btn {
      pointer-events: auto;
      background: rgba(16, 21, 32, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      backdrop-filter: blur(14px);
      transition: all 0.2s;
    }

    .hud-exit-btn:hover, .hud-exit-btn:active {
      background: var(--pink);
      border-color: var(--pink);
    }
  </style>
</head>
<body>

  <!-- 100% IN-PAGE STREAM VIEWPORT (Stays permanently on creok.onrender.com/cam!) -->
  <div id="streamViewport" class="stream-viewport">
    <div class="hud-bar" id="hudBar">
      <div class="hud-tag">
        <span class="hud-dot" id="hudDot"></span>
        <span id="hudTitle">CREOK LIVE 720p</span>
      </div>
      <button class="hud-exit-btn" onclick="exitInpageStream()">✕ 메인으로</button>
    </div>
    <iframe id="streamFrame" class="stream-frame" allow="camera; microphone; display-capture; autoplay; fullscreen" allowfullscreen></iframe>
  </div>

  <!-- Main Dashboard -->
  <div class="wrap" id="mainWrap">
    
    <div class="top-bar">
      <div class="logo">CREOK CAM</div>
      <div class="channel-wrap">
        <span>#</span>
        <input type="text" id="channelInput" class="channel-input" value="ongdong" placeholder="채널">
      </div>
    </div>

    <!-- 4 Clean Giant Buttons -->
    <div class="grid">
      
      <!-- 1. Phone Cam (In-page 720p 30fps Instant Launch) -->
      <div class="btn green" onclick="launchInpagePhoneCam()">
        <div class="icon">📱</div>
        <div class="title">폰 카메라 송출</div>
      </div>

      <!-- 2. Tablet Monitor (In-page 0s Monitor) -->
      <div class="btn cyan" onclick="launchInpageTabletMonitor()">
        <div class="icon">📲</div>
        <div class="title">태블릿 모니터</div>
      </div>

      <!-- 3. PC Virtual Cam Push -->
      <div class="btn purple" onclick="launchInpagePcPush()">
        <div class="icon">🖥️</div>
        <div class="title">PC 화면 송출</div>
      </div>

      <!-- 4. OBS Link Copy -->
      <div class="btn gold" onclick="copyObsUrl()">
        <div class="icon">📋</div>
        <div class="title">OBS 링크 복사</div>
      </div>

    </div>

    <!-- Compact Dual QR Grid -->
    <div class="qr-grid">
      <div class="qr-box" onclick="launchInpagePhoneCam()">
        <div class="qr-img"><canvas id="qrPhone"></canvas></div>
        <div class="qr-text">
          <h4>폰 카메라 QR</h4>
          <span>스캔 시 송출</span>
        </div>
      </div>

      <div class="qr-box" onclick="launchInpageTabletMonitor()">
        <div class="qr-img"><canvas id="qrTablet"></canvas></div>
        <div class="qr-text">
          <h4>태블릿 QR</h4>
          <span>스캔 시 수신</span>
        </div>
      </div>
    </div>

  </div>

  <script>
    const chInput = document.getElementById('channelInput');
    const qrPhone = document.getElementById('qrPhone');
    const qrTablet = document.getElementById('qrTablet');
    const mainWrap = document.getElementById('mainWrap');
    const streamViewport = document.getElementById('streamViewport');
    const streamFrame = document.getElementById('streamFrame');
    const hudTitle = document.getElementById('hudTitle');
    const hudDot = document.getElementById('hudDot');
    const hudBar = document.getElementById('hudBar');

    function getCh() {
      return (chInput.value.trim() || 'ongdong').toLowerCase();
    }

    function getDomainBase() {
      return window.location.origin + window.location.pathname;
    }

    // Direct QR Codes (Pointing to our own URL with ?mode=...)
    function updateQrs() {
      QRCode.toCanvas(qrPhone, `${getDomainBase()}?mode=cam&ch=${getCh()}`, { width: 58, margin: 0, color: { dark: '#06080c', light: '#ffffff' } });
      QRCode.toCanvas(qrTablet, `${getDomainBase()}?mode=tablet&ch=${getCh()}`, { width: 58, margin: 0, color: { dark: '#06080c', light: '#ffffff' } });
    }

    chInput.addEventListener('input', updateQrs);

    // ─────────────────────────────────────────────────────────────
    // ROCK-SOLID IN-PAGE ENGINE LAUNCHERS (ZERO REDIRECTS, ZERO DROPS!)
    // ─────────────────────────────────────────────────────────────
    function launchInpagePhoneCam() {
      hudTitle.textContent = `🔴 송출 중 (720p 30fps) #${getCh()}`;
      hudDot.style.background = 'var(--green)';
      hudBar.style.display = 'flex';
      
      // Zero-step instant camera autostart engine
      streamFrame.src = `https://vdo.ninja/?push=${getCh()}_cam&webcam&facing=back&quality=2&fps=30&codec=h264&buffer=0&autostart&cleanoutput`;
      
      mainWrap.style.display = 'none';
      streamViewport.classList.add('active');
    }

    function launchInpageTabletMonitor(isObsMode = false) {
      if (isObsMode) {
        hudBar.style.display = 'none'; // Clean pure output for OBS
      } else {
        hudTitle.textContent = `📲 실시간 모니터링 중 #${getCh()}`;
        hudDot.style.background = 'var(--cyan)';
        hudBar.style.display = 'flex';
      }

      // Zero-step instant monitor playback engine
      streamFrame.src = `https://vdo.ninja/?view=${getCh()}_monitor&autoplay&cleanoutput&buffer=0&cover`;
      
      mainWrap.style.display = 'none';
      streamViewport.classList.add('active');
    }

    function launchInpagePcPush() {
      hudTitle.textContent = `🖥️ PC 화면 송출 중 #${getCh()}`;
      hudDot.style.background = 'var(--purple)';
      hudBar.style.display = 'flex';

      streamFrame.src = `https://vdo.ninja/?push=${getCh()}_monitor&webcam&quality=2&fps=30&codec=h264&buffer=0&autostart&cleanoutput`;
      
      mainWrap.style.display = 'none';
      streamViewport.classList.add('active');
    }

    function exitInpageStream() {
      streamFrame.src = '';
      streamViewport.classList.remove('active');
      mainWrap.style.display = 'flex';
    }

    function copyObsUrl() {
      const url = `https://vdo.ninja/?view=${getCh()}_cam&cleanoutput&buffer=0&cover`;
      navigator.clipboard.writeText(url).then(() => {
        alert(`[OBS 브라우저 소스 링크 복사 완료]\n${url}`);
      }).catch(() => alert(`OBS URL:\n${url}`));
    }

    // Auto-Routing: ?mode=cam / ?mode=tablet / ?mode=obs
    window.addEventListener('DOMContentLoaded', () => {
      const p = new URLSearchParams(window.location.search);
      const mode = p.get('mode') || p.get('action');
      const ch = p.get('ch') || p.get('channel');
      if (ch) chInput.value = ch;
      updateQrs();

      if (mode === 'cam' || mode === 'phone') {
        launchInpagePhoneCam();
      } else if (mode === 'tablet' || mode === 'monitor') {
        launchInpageTabletMonitor(false);
      } else if (mode === 'obs') {
        launchInpageTabletMonitor(true);
      } else if (mode === 'pc') {
        launchInpagePcPush();
      }
    });
  </script>
</body>
</html>
