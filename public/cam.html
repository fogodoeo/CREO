<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CREOK CAM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;900&family=Pretendard:wght@600;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  
  <style>
    :root {
      --bg: #06080c;
      --card: rgba(16, 21, 32, 0.94);
      --border: rgba(255, 255, 255, 0.12);
      --green: #00e676;
      --cyan: #00d2ff;
      --purple: #a855f7;
      --gold: #f59e0b;
      --pink: #ff3366;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Pretendard', sans-serif;
    }

    body {
      background: var(--bg);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .wrap {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      z-index: 10;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 2px;
    }

    .logo {
      font-family: 'Outfit', sans-serif;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #fff, var(--cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .channel-wrap {
      display: flex;
      align-items: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 6px 12px;
      gap: 4px;
    }

    .channel-wrap span { color: #64748b; font-weight: 800; }
    .channel-input {
      background: transparent;
      border: none;
      color: #fff;
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      font-weight: 800;
      width: 90px;
      outline: none;
    }

    /* 4 Action Buttons */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 18px;
      padding: 22px 14px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 10px;
      transition: all 0.18s ease;
      user-select: none;
      text-decoration: none;
      color: #fff;
    }

    .btn:active { transform: scale(0.95); }
    .btn .icon { font-size: 34px; line-height: 1; }
    .btn .title { font-size: 17px; font-weight: 900; letter-spacing: -0.3px; }

    .btn.green { border-color: rgba(0, 230, 118, 0.4); }
    .btn.green:hover, .btn.green:active { border-color: var(--green); background: rgba(0, 230, 118, 0.12); }
    .btn.green .title { color: var(--green); }

    .btn.cyan { border-color: rgba(0, 210, 255, 0.4); }
    .btn.cyan:hover, .btn.cyan:active { border-color: var(--cyan); background: rgba(0, 210, 255, 0.12); }
    .btn.cyan .title { color: var(--cyan); }

    .btn.purple { border-color: rgba(168, 85, 247, 0.4); }
    .btn.purple:hover, .btn.purple:active { border-color: var(--purple); background: rgba(168, 85, 247, 0.12); }
    .btn.purple .title { color: var(--purple); }

    .btn.gold { border-color: rgba(245, 158, 11, 0.4); }
    .btn.gold:hover, .btn.gold:active { border-color: var(--gold); background: rgba(245, 158, 11, 0.12); }
    .btn.gold .title { color: var(--gold); }

    /* Compact QR Grid */
    .qr-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .qr-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .qr-box:active { transform: scale(0.97); }
    .qr-img {
      background: #fff;
      padding: 4px;
      border-radius: 8px;
      width: 58px;
      height: 58px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qr-img canvas { width: 100% !important; height: 100% !important; }
    .qr-text { display: flex; flex-direction: column; gap: 2px; }
    .qr-text h4 { font-size: 13px; font-weight: 800; color: #fff; }
    .qr-text span { font-size: 11px; color: #64748b; font-weight: 600; }
  </style>
</head>
<body>

  <!-- Main Dashboard -->
  <div class="wrap" id="mainWrap">
    
    <div class="top-bar">
      <div class="logo">CREOK CAM</div>
      <div class="channel-wrap">
        <span>#</span>
        <input type="text" id="channelInput" class="channel-input" value="ongdong" placeholder="채널">
      </div>
    </div>

    <!-- 4 Clean Giant Buttons -->
    <div class="grid">
      
      <!-- 1. Phone Camera (Direct Top-Level Hardware Access - 100% Camera Detected!) -->
      <div class="btn green" onclick="launchPhoneCam()">
        <div class="icon">📱</div>
        <div class="title">폰 카메라 송출</div>
      </div>

      <!-- 2. Tablet Monitor (0s Delay Realtime Monitor) -->
      <div class="btn cyan" onclick="launchTabletView()">
        <div class="icon">📲</div>
        <div class="title">태블릿 모니터</div>
      </div>

      <!-- 3. PC Virtual Cam Push -->
      <div class="btn purple" onclick="launchPcPush()">
        <div class="icon">🖥️</div>
        <div class="title">PC 화면 송출</div>
      </div>

      <!-- 4. OBS Link Copy -->
      <div class="btn gold" onclick="copyObsUrl()">
        <div class="icon">📋</div>
        <div class="title">OBS 링크 복사</div>
      </div>

    </div>

    <!-- Compact Dual QR Grid -->
    <div class="qr-grid">
      <div class="qr-box" onclick="launchPhoneCam()">
        <div class="qr-img"><canvas id="qrPhone"></canvas></div>
        <div class="qr-text">
          <h4>폰 카메라 QR</h4>
          <span>스캔 즉시 송출</span>
        </div>
      </div>

      <div class="qr-box" onclick="launchTabletView()">
        <div class="qr-img"><canvas id="qrTablet"></canvas></div>
        <div class="qr-text">
          <h4>태블릿 QR</h4>
          <span>스캔 즉시 수신</span>
        </div>
      </div>
    </div>

  </div>

  <script>
    const chInput = document.getElementById('channelInput');
    const qrPhone = document.getElementById('qrPhone');
    const qrTablet = document.getElementById('qrTablet');

    function getCh() {
      return (chInput.value.trim() || 'ongdong').toLowerCase();
    }

    // 100% Reliable Top-Level Direct URLs (Zero Iframe Sandbox Blocking!)
    // &webcam: Directly opens camera
    // &facing=back: Automatically selects rear camera
    // &quality=2 &fps=30: 720p 30fps stable
    // &autostart &cleanoutput: 0 clicks, clean fullscreen
    function getPhoneCamUrl() {
      return `https://vdo.ninja/?push=${getCh()}_cam&webcam&facing=back&quality=2&fps=30&codec=h264&buffer=0&autostart&cleanoutput`;
    }

    function getTabletViewUrl() {
      return `https://vdo.ninja/?view=${getCh()}_monitor&autoplay&cleanoutput&buffer=0&cover`;
    }

    function getPcPushUrl() {
      return `https://vdo.ninja/?push=${getCh()}_monitor&webcam&quality=2&fps=30&codec=h264&buffer=0&autostart&cleanoutput`;
    }

    function getObsCamUrl() {
      return `https://vdo.ninja/?view=${getCh()}_cam&cleanoutput&buffer=0&cover`;
    }

    // Update Direct QRs
    function updateQrs() {
      QRCode.toCanvas(qrPhone, getPhoneCamUrl(), { width: 58, margin: 0, color: { dark: '#06080c', light: '#ffffff' } });
      QRCode.toCanvas(qrTablet, getTabletViewUrl(), { width: 58, margin: 0, color: { dark: '#06080c', light: '#ffffff' } });
    }

    chInput.addEventListener('input', updateQrs);

    // Direct Instant Launchers (Bypasses all iframe security sandboxes)
    function launchPhoneCam() {
      window.location.href = getPhoneCamUrl();
    }

    function launchTabletView() {
      window.location.href = getTabletViewUrl();
    }

    function launchPcPush() {
      window.location.href = getPcPushUrl();
    }

    function copyObsUrl() {
      const url = getObsCamUrl();
      navigator.clipboard.writeText(url).then(() => {
        alert(`[OBS 브라우저 소스 링크 복사 완료]\n${url}`);
      }).catch(() => alert(`OBS URL:\n${url}`));
    }

    // Auto-Routing: ?mode=cam / ?mode=tablet
    window.addEventListener('DOMContentLoaded', () => {
      const p = new URLSearchParams(window.location.search);
      const mode = p.get('mode') || p.get('action');
      const ch = p.get('ch') || p.get('channel');
      if (ch) chInput.value = ch;
      updateQrs();

      if (mode === 'cam' || mode === 'phone') launchPhoneCam();
      else if (mode === 'tablet' || mode === 'monitor') launchTabletView();
      else if (mode === 'pc') launchPcPush();
    });
  </script>
</body>
</html>
