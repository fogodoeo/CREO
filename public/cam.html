<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CREOK CAM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;900&family=Pretendard:wght@600;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  
  <style>
    :root {
      --bg: #06080c;
      --card: rgba(16, 21, 32, 0.94);
      --border: rgba(255, 255, 255, 0.12);
      --green: #00e676;
      --cyan: #00d2ff;
      --purple: #a855f7;
      --gold: #f59e0b;
      --pink: #ff3366;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Pretendard', sans-serif;
    }

    body {
      background: var(--bg);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow: hidden;
    }

    .wrap {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      z-index: 10;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 2px;
    }

    .logo {
      font-family: 'Outfit', sans-serif;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #fff, var(--cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .channel-wrap {
      display: flex;
      align-items: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 6px 12px;
      gap: 4px;
    }

    .channel-wrap span { color: #64748b; font-weight: 800; }
    .channel-input {
      background: transparent;
      border: none;
      color: #fff;
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      font-weight: 800;
      width: 90px;
      outline: none;
    }

    /* 4 Action Buttons */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 18px;
      padding: 22px 14px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 10px;
      transition: all 0.18s ease;
      user-select: none;
    }

    .btn:active { transform: scale(0.95); }
    .btn .icon { font-size: 34px; line-height: 1; }
    .btn .title { font-size: 17px; font-weight: 900; letter-spacing: -0.3px; }

    .btn.green { border-color: rgba(0, 230, 118, 0.4); }
    .btn.green:hover, .btn.green:active { border-color: var(--green); background: rgba(0, 230, 118, 0.12); }
    .btn.green .title { color: var(--green); }

    .btn.cyan { border-color: rgba(0, 210, 255, 0.4); }
    .btn.cyan:hover, .btn.cyan:active { border-color: var(--cyan); background: rgba(0, 210, 255, 0.12); }
    .btn.cyan .title { color: var(--cyan); }

    .btn.purple { border-color: rgba(168, 85, 247, 0.4); }
    .btn.purple:hover, .btn.purple:active { border-color: var(--purple); background: rgba(168, 85, 247, 0.12); }
    .btn.purple .title { color: var(--purple); }

    .btn.gold { border-color: rgba(245, 158, 11, 0.4); }
    .btn.gold:hover, .btn.gold:active { border-color: var(--gold); background: rgba(245, 158, 11, 0.12); }
    .btn.gold .title { color: var(--gold); }

    /* Compact QR Grid */
    .qr-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .qr-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .qr-box:active { transform: scale(0.97); }
    .qr-img {
      background: #fff;
      padding: 4px;
      border-radius: 8px;
      width: 58px;
      height: 58px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qr-img canvas { width: 100% !important; height: 100% !important; }
    .qr-text { display: flex; flex-direction: column; gap: 2px; }
    .qr-text h4 { font-size: 13px; font-weight: 800; color: #fff; }
    .qr-text span { font-size: 11px; color: #64748b; font-weight: 600; }

    /* Viewport */
    .viewport-box {
      display: none;
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      z-index: 99999;
    }

    .viewport-box.active { display: block; }
    .native-video { width: 100%; height: 100%; object-fit: cover; display: block; background: #000; }

    .hud-top {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 100000;
    }

    .hud-status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(6, 8, 12, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 800;
      backdrop-filter: blur(12px);
    }

    .hud-dot {
      width: 8px;
      height: 8px;
      background: var(--pink);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--pink);
      animation: blink 1.2s infinite;
    }

    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    .hud-controls {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 100000;
    }

    .hud-btn {
      background: rgba(16, 21, 32, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      padding: 10px 18px;
      border-radius: 24px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      backdrop-filter: blur(14px);
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .hud-btn:active { transform: scale(0.94); }
    .hud-btn.danger { background: rgba(255, 51, 102, 0.85); border-color: var(--pink); }

    .loading-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: rgba(0, 0, 0, 0.88);
      z-index: 9999;
    }

    .spinner {
      width: 42px;
      height: 42px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: var(--cyan);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- Native Video Viewport -->
  <div id="viewportBox" class="viewport-box">
    
    <div class="hud-top" id="hudTop">
      <div class="hud-status">
        <span class="hud-dot" id="hudDot"></span>
        <span id="hudStatus">연결 중...</span>
      </div>
      <button class="hud-btn danger" onclick="stopNativeSession()">✕ 종료</button>
    </div>

    <div id="loadingOverlay" class="loading-overlay">
      <div class="spinner"></div>
      <p id="loadingText" style="font-size: 14px; font-weight: 700; color: #cbd5e1;">카메라 연결 중...</p>
    </div>

    <video id="nativeVideo" class="native-video" autoplay playsinline muted></video>

    <div class="hud-controls" id="cameraControls" style="display: none;">
      <button class="hud-btn" onclick="flipCamera()">🔄 카메라 전환</button>
      <button class="hud-btn" onclick="toggleAudio()" id="audioBtn">🎤 마이크 ON</button>
    </div>

  </div>

  <!-- Main Dashboard -->
  <div class="wrap" id="mainWrap">
    
    <div class="top-bar">
      <div class="logo">CREOK CAM</div>
      <div class="channel-wrap">
        <span>#</span>
        <input type="text" id="channelInput" class="channel-input" value="ongdong" placeholder="채널">
      </div>
    </div>

    <!-- 4 Action Buttons -->
    <div class="grid">
      <div class="btn green" onclick="startNativePhoneCam()">
        <div class="icon">📱</div>
        <div class="title">폰 카메라 송출</div>
      </div>

      <div class="btn cyan" onclick="startNativeTabletMonitor()">
        <div class="icon">📲</div>
        <div class="title">태블릿 모니터</div>
      </div>

      <div class="btn purple" onclick="startNativePcPush()">
        <div class="icon">🖥️</div>
        <div class="title">PC 화면 송출</div>
      </div>

      <div class="btn gold" onclick="copyObsUrl()">
        <div class="icon">📋</div>
        <div class="title">OBS 링크 복사</div>
      </div>
    </div>

    <!-- Dual QRs -->
    <div class="qr-grid">
      <div class="qr-box" onclick="startNativePhoneCam()">
        <div class="qr-img"><canvas id="qrPhone"></canvas></div>
        <div class="qr-text">
          <h4>폰 카메라 QR</h4>
          <span>스캔 시 송출</span>
        </div>
      </div>

      <div class="qr-box" onclick="startNativeTabletMonitor()">
        <div class="qr-img"><canvas id="qrTablet"></canvas></div>
        <div class="qr-text">
          <h4>태블릿 QR</h4>
          <span>스캔 시 수신</span>
        </div>
      </div>
    </div>

  </div>

  <script>
    const chInput = document.getElementById('channelInput');
    const qrPhone = document.getElementById('qrPhone');
    const qrTablet = document.getElementById('qrTablet');
    const mainWrap = document.getElementById('mainWrap');
    const viewportBox = document.getElementById('viewportBox');
    const nativeVideo = document.getElementById('nativeVideo');
    const hudStatus = document.getElementById('hudStatus');
    const hudDot = document.getElementById('hudDot');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const loadingText = document.getElementById('loadingText');
    const cameraControls = document.getElementById('cameraControls');
    const audioBtn = document.getElementById('audioBtn');
    const hudTop = document.getElementById('hudTop');

    let currentPeer = null;
    let localStream = null;
    let currentFacingMode = 'environment';
    let isAudioEnabled = true;

    function getCh() {
      return (chInput.value.trim() || 'ongdong').toLowerCase();
    }

    function getDomainBase() {
      return window.location.origin + window.location.pathname;
    }

    function updateQrs() {
      QRCode.toCanvas(qrPhone, `${getDomainBase()}?mode=cam&ch=${getCh()}`, { width: 58, margin: 0, color: { dark: '#06080c', light: '#ffffff' } });
      QRCode.toCanvas(qrTablet, `${getDomainBase()}?mode=tablet&ch=${getCh()}`, { width: 58, margin: 0, color: { dark: '#06080c', light: '#ffffff' } });
    }

    chInput.addEventListener('input', updateQrs);

    // ─────────────────────────────────────────────────────────────
    // BULLETPROOF CAMERA ACQUISITION WITH 3-TIER FALLBACK
    // ─────────────────────────────────────────────────────────────
    async function acquireCameraStream(facing) {
      // Tier 1: Back camera + Audio + 720p
      try {
        return await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: facing }, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: true
        });
      } catch (e1) {
        console.warn('Tier 1 failed (Audio/Resolution constraint), trying without audio...', e1);
      }

      // Tier 2: Back camera ONLY without audio (fixes mic permission conflict)
      try {
        return await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: facing } },
          audio: false
        });
      } catch (e2) {
        console.warn('Tier 2 failed (Facing mode constraint), trying universal video...', e2);
      }

      // Tier 3: Universal fallback (Any available camera on device)
      return await navigator.mediaDevices.getUserMedia({
        video: true,
        audio: false
      });
    }

    // ─────────────────────────────────────────────────────────────
    // 1. PURE NATIVE CAMERA PUSH (PHONE)
    // ─────────────────────────────────────────────────────────────
    async function startNativePhoneCam() {
      // Check HTTPS Security Context
      if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
        alert('카메라 실행은 HTTPS 보안 연결에서만 작동합니다.\nhttps:// 로 접속해 주세요!');
        return;
      }

      showViewport('카메라 켜는 중...');
      cameraControls.style.display = 'flex';
      nativeVideo.muted = true;

      try {
        localStream = await acquireCameraStream(currentFacingMode);
        nativeVideo.srcObject = localStream;
        await nativeVideo.play();
        
        hideLoading();
        hudStatus.textContent = '🔴 라이브 송출 중 (720p 30fps)';
        hudDot.style.background = 'var(--green)';

        // PeerJS Streamer Initialization
        const peerId = `creok_${getCh()}_cam`;
        if (currentPeer) currentPeer.destroy();

        currentPeer = new Peer(peerId, {
          config: {
            iceServers: [
              { urls: 'stun:stun.l.google.com:19302' },
              { urls: 'stun:stun1.l.google.com:19302' }
            ]
          }
        });

        currentPeer.on('open', (id) => {
          hudStatus.textContent = `🔴 송출 중 (#${getCh()})`;
        });

        currentPeer.on('call', (call) => {
          call.answer(localStream);
        });

        currentPeer.on('error', (err) => {
          console.warn('Peer:', err);
        });

      } catch (err) {
        alert(`카메라 실행 실패: ${err.name || err.message}\n브라우저 설정에서 카메라 권한을 [허용]해 주세요!`);
        stopNativeSession();
      }
    }

    // ─────────────────────────────────────────────────────────────
    // 2. PURE NATIVE MONITOR RECEIVER (TABLET / OBS)
    // ─────────────────────────────────────────────────────────────
    function startNativeTabletMonitor(isObsMode = false) {
      showViewport('방송 스트림 찾는 중...');
      cameraControls.style.display = 'none';
      nativeVideo.muted = false;

      if (isObsMode) {
        hudTop.style.display = 'none';
      } else {
        hudTop.style.display = 'flex';
      }

      if (currentPeer) currentPeer.destroy();
      currentPeer = new Peer({
        config: {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' }
          ]
        }
      });

      currentPeer.on('open', () => {
        connectToStreamer(`creok_${getCh()}_monitor`, `creok_${getCh()}_cam`);
      });
    }

    function connectToStreamer(targetIdMonitor, targetIdCam) {
      loadingText.textContent = `신호 찾는 중... (#${getCh()})`;
      
      const emptyStream = createEmptyStream();
      let call = currentPeer.call(targetIdMonitor, emptyStream);
      
      call.on('stream', (remoteStream) => {
        hideLoading();
        nativeVideo.srcObject = remoteStream;
        nativeVideo.play().catch(() => {});
        hudStatus.textContent = '📲 실시간 모니터링 중 (0초 지연)';
        hudDot.style.background = 'var(--cyan)';
      });

      call.on('error', () => {
        call = currentPeer.call(targetIdCam, emptyStream);
        call.on('stream', (remoteStream) => {
          hideLoading();
          nativeVideo.srcObject = remoteStream;
          nativeVideo.play().catch(() => {});
          hudStatus.textContent = '📲 게코 카메라 수신 중';
          hudDot.style.background = 'var(--cyan)';
        });
      });

      setTimeout(() => {
        if (!nativeVideo.srcObject) {
          loadingText.textContent = '송출 대기 중... (카메라 켜지면 자동 재생)';
          setTimeout(() => connectToStreamer(targetIdMonitor, targetIdCam), 3000);
        }
      }, 4000);
    }

    function createEmptyStream() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const dst = ctx.createMediaStreamDestination();
        osc.connect(dst);
        osc.start();
        return new MediaStream([dst.stream.getAudioTracks()[0]]);
      } catch (e) {
        return new MediaStream();
      }
    }

    // ─────────────────────────────────────────────────────────────
    // 3. PC SCREEN PUSH
    // ─────────────────────────────────────────────────────────────
    async function startNativePcPush() {
      showViewport('PC 화면 선택 중...');
      cameraControls.style.display = 'none';

      try {
        localStream = await navigator.mediaDevices.getDisplayMedia({
          video: { width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 } },
          audio: true
        });

        nativeVideo.srcObject = localStream;
        await nativeVideo.play();
        hideLoading();
        hudStatus.textContent = '🖥️ PC 방송 화면 송출 중';

        const peerId = `creok_${getCh()}_monitor`;
        if (currentPeer) currentPeer.destroy();
        currentPeer = new Peer(peerId, {
          config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }
        });

        currentPeer.on('call', (call) => call.answer(localStream));

      } catch (err) {
        stopNativeSession();
      }
    }

    // ─────────────────────────────────────────────────────────────
    // CONTROLS & UTILS
    // ─────────────────────────────────────────────────────────────
    async function flipCamera() {
      currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
      if (localStream) {
        localStream.getTracks().forEach(t => t.stop());
      }
      startNativePhoneCam();
    }

    function toggleAudio() {
      if (!localStream) return;
      isAudioEnabled = !isAudioEnabled;
      localStream.getAudioTracks().forEach(t => t.enabled = isAudioEnabled);
      audioBtn.textContent = isAudioEnabled ? '🎤 마이크 ON' : '🔇 마이크 OFF';
      audioBtn.style.color = isAudioEnabled ? '#fff' : 'var(--pink)';
    }

    function showViewport(msg) {
      loadingText.textContent = msg;
      loadingOverlay.style.display = 'flex';
      mainWrap.style.display = 'none';
      viewportBox.classList.add('active');
    }

    function hideLoading() {
      loadingOverlay.style.display = 'none';
    }

    function stopNativeSession() {
      if (localStream) {
        localStream.getTracks().forEach(t => t.stop());
        localStream = null;
      }
      if (currentPeer) {
        currentPeer.destroy();
        currentPeer = null;
      }
      nativeVideo.srcObject = null;
      viewportBox.classList.remove('active');
      mainWrap.style.display = 'flex';
      hudTop.style.display = 'flex';
    }

    function copyObsUrl() {
      const url = `${getDomainBase()}?mode=obs&ch=${getCh()}`;
      navigator.clipboard.writeText(url).then(() => {
        alert(`[OBS 브라우저 소스 링크 복사 완료]\n${url}`);
      }).catch(() => alert(`OBS URL: ${url}`));
    }

    window.addEventListener('DOMContentLoaded', () => {
      const p = new URLSearchParams(window.location.search);
      const mode = p.get('mode') || p.get('action');
      const ch = p.get('ch') || p.get('channel');
      if (ch) chInput.value = ch;
      updateQrs();

      if (mode === 'cam' || mode === 'phone') {
        startNativePhoneCam();
      } else if (mode === 'tablet' || mode === 'monitor') {
        startNativeTabletMonitor(false);
      } else if (mode === 'obs') {
        startNativeTabletMonitor(true);
      } else if (mode === 'pc') {
        startNativePcPush();
      }
    });
  </script>
</body>
</html>
