<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>배너 선택 · CREO</title>
<link rel="stylesheet" href="banner-library.css?v=20261023-workflow">
<script src="platform-client.js?v=20260803-admin-session-v2"></script></head><body>
<header class="page-head"><div><h1>배너 선택</h1><p id="channel-label">방송 정보를 불러오는 중…</p></div><button id="close" type="button">닫기</button></header>
<form id="login" class="login" hidden><h2>관리자 로그인</h2><label for="password">관리자 비밀번호</label><input id="password" type="password" autocomplete="current-password" required><p id="login-error" class="error-text" role="alert" hidden></p><button class="primary">로그인</button></form>
<main id="main" hidden>
  <p id="status" class="status" role="status"></p>
  <div id="error-box" class="error-box" hidden><p id="error" role="alert" tabindex="-1"></p><button id="retry" type="button" hidden>다시 시도</button></div>
  <section id="library" aria-labelledby="library-title" hidden>
    <div class="section-head"><div><h2 id="library-title">보관된 배너</h2><p>체크하면 이 회차의 1P·2P에 바로 표시됩니다.</p></div><button id="add-banner" type="button">새 배너 추가</button></div>
    <div class="filters"><label>배너 검색<input id="search" type="search" placeholder="배너 이름"></label><label>표시 상태<select id="filter"><option value="all">전체 배너</option><option value="selected">이 회차에 표시 중</option></select></label></div>
    <p id="count" class="count" role="status"></p>
    <div id="grid" class="grid"></div>
  </section>
  <details id="upload-panel" class="upload-panel" hidden><summary>새 배너 추가</summary>
    <p>한 번 등록하면 다른 회차에서도 선택할 수 있습니다.</p>
    <form id="upload" novalidate><fieldset id="upload-fields" disabled>
      <label for="banner-file">이미지·영상 파일</label><input id="banner-file" name="file" type="file" accept="image/png,image/jpeg,image/gif,image/webp,video/mp4,video/quicktime,.png,.jpg,.jpeg,.gif,.webp,.mp4,.mov" aria-describedby="file-hint" required>
      <p id="file-hint" class="hint">PNG, JPG, GIF, WEBP, MP4, MOV · 최대 8MB</p>
      <div id="preview" class="preview" hidden></div>
      <label for="banner-name">배너 이름</label><input id="banner-name" name="name" maxlength="80" placeholder="예: 배송 안내" required>
      <div class="upload-actions"><button class="primary" id="save" type="submit">배너 등록</button><button id="reset-upload" type="button">입력 지우기</button></div>
    </fieldset><p id="upload-status" class="status" role="status">등록 후 표시할 배너를 체크해 주세요.</p></form>
  </details>
</main>
<dialog id="discard-dialog" aria-labelledby="discard-title"><h2 id="discard-title">등록 중인 배너를 지울까요?</h2><p>선택한 파일과 입력한 이름이 지워집니다.</p><div class="dialog-actions"><button id="keep-editing" type="button" autofocus>계속 작성</button><button id="discard-upload" class="danger" type="button">입력 지우기</button></div></dialog>
<script src="banner-library.js?v=20261023-workflow"></script></body></html>
