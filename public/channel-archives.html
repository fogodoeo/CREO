<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>회차 · CREO</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"><script src="platform-client.js?v=20260803-admin-session-v2"></script>
    <style>
        :root{color-scheme:light;--bg:#f5f6f8;--panel:#fff;--line:#e0e4ea;--text:#15191f;--muted:#737d89;--accent:#254ac7;--danger:#bd3f46}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard Variable",Pretendard,sans-serif;letter-spacing:-.018em}button,input{font:inherit}.shell{width:min(1080px,calc(100% - 30px));margin:auto;padding:28px 0 70px}.head{display:flex;align-items:end;justify-content:space-between;gap:18px}.head h1{margin:0;font-size:28px}.head p{margin:6px 0 0;color:var(--muted);font-size:11px}.create{display:flex;gap:7px}.create input{width:280px;height:42px;padding:0 11px;border:1px solid var(--line);border-radius:9px;background:#fff}.btn{height:42px;padding:0 14px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:11px;font-weight:800;cursor:pointer}.btn.primary{border-color:var(--accent);background:var(--accent);color:#fff}.btn.danger{color:var(--danger)}.list{display:grid;gap:7px;margin-top:22px}.card{display:grid;grid-template-columns:1fr auto;align-items:center;gap:15px;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}.card h2{margin:0;font-size:14px}.meta{display:flex;flex-wrap:wrap;gap:6px 13px;margin-top:6px;color:var(--muted);font-size:10px}.actions{display:flex;gap:5px}.empty{padding:55px 18px;border:1px dashed #cfd5dd;border-radius:12px;color:var(--muted);text-align:center}.modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:18px;background:#0b0e1288}.modal[hidden]{display:none}.dialog{width:min(920px,100%);max-height:calc(100vh - 36px);overflow:auto;padding:20px;border-radius:14px;background:#fff}.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.dialog h2{margin:0}.table{overflow:auto;margin-top:16px;border:1px solid var(--line);border-radius:10px}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{padding:11px;border-bottom:1px solid #edf0f3;text-align:left;font-size:11px}th{background:#fafbfc;color:var(--muted);font-size:9px}.login{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:#111722cc}.login[hidden]{display:none}.login form{display:flex;gap:7px;width:min(390px,calc(100% - 28px));padding:18px;border-radius:12px;background:#fff}.login input{min-width:0;flex:1;height:42px;padding:0 10px;border:1px solid var(--line);border-radius:8px}.toast{position:fixed;right:16px;bottom:16px;padding:11px 14px;border-radius:8px;background:#17202c;color:#fff;font-size:11px;opacity:0}.toast.show{opacity:1}@media(max-width:680px){.shell{width:calc(100% - 22px);padding-top:20px}.head{display:block}.create{margin-top:14px}.create input{min-width:0;flex:1}.card{grid-template-columns:1fr}.actions .btn{flex:1}}
    </style>
</head>
<body>
<main class="shell"><header class="head"><div><h1 id="title">회차 기록</h1></div><div class="create"><input id="archive-title" maxlength="80" placeholder="예: 8월 6일 1회"><button class="btn primary" id="save">현재 회차 저장</button></div></header><section class="list" id="list"><div class="empty">불러오는 중</div></section></main>
<div class="modal" id="modal" hidden><section class="dialog"><header class="dialog-head"><h2 id="detail-title">회차 상세</h2><button class="btn" id="close">닫기</button></header><div id="detail"></div></section></div>
<div class="login" id="login"><form id="login-form"><input id="password" type="password" autocomplete="current-password" placeholder="관리자 비밀번호" required><button class="btn primary">확인</button></form></div><div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id),esc=CreoPlatform.escapeHtml,channelId=String(new URLSearchParams(location.search).get('channel')||'').toLowerCase().replace(/[^a-z0-9-]/g,'');let channel=null,archives=[];
function toast(message){const el=$('toast');el.textContent=message;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2400)}function money(value){return CreoPlatform.money(Number(value)||0)}function date(value){const d=new Date(value);return Number.isNaN(d.getTime())?'-':d.toLocaleString('ko-KR')}
async function load(){if(!channelId)throw new Error('채널 주소가 올바르지 않습니다.');channel=(await CreoPlatform.api(`channels/${encodeURIComponent(channelId)}`)).channel;$('title').textContent=`${channel.name} 회차 기록`;archives=(await CreoPlatform.api(`channels/${encodeURIComponent(channelId)}/archives`)).archives||[];render()}
function render(){$('list').innerHTML=archives.length?archives.map(a=>`<article class="card"><div><h2>${esc(a.title||'제목 없는 회차')}</h2><div class="meta"><span>${date(a.createdAt)}</span><span>개체 ${Number(a.itemCount)||0}</span><span>낙찰 ${Number(a.soldCount)||0}</span><span>합계 ${money(a.totalSoldAmount)}</span><span>배송 ${Number(a.shipmentCount)||0}</span></div></div><div class="actions"><button class="btn" data-open="${esc(a.id)}">상세</button><button class="btn danger" data-delete="${esc(a.id)}">삭제</button></div></article>`).join(''):'<div class="empty">저장된 회차가 없습니다.</div>';document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openArchive(b.dataset.open));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>removeArchive(b.dataset.delete))}
async function openArchive(id){try{const a=(await CreoPlatform.api(`channels/${encodeURIComponent(channelId)}/archives/${encodeURIComponent(id)}`)).archive;$('detail-title').textContent=a.title||'회차 내역';const vendors=new Map((a.vendors||[]).map(v=>[v.id,v.name])),items=new Map((a.items||[]).map(i=>[i.id,i]));const itemRows=(a.items||[]).sort((x,y)=>x.lotNumber-y.lotNumber).map(i=>`<tr><td>${String(i.lotNumber||0).padStart(3,'0')}</td><td>${esc(i.name)}</td><td>${esc(vendors.get(i.vendorId)||i.vendorName||'-')}</td><td>${esc(i.teamName||'-')}</td><td>${esc(i.status||'-')}</td><td>${esc(i.winnerName||'-')}</td><td>${money(i.soldPrice)}</td></tr>`).join('');const shipmentRows=(a.shipments||[]).map(s=>{const i=items.get(s.itemId);return`<tr><td>${esc(i?.name||s.itemName||'-')}</td><td>${esc(vendors.get(s.vendorId||i?.vendorId)||s.itemVendorName||'-')}</td><td>${esc(s.recipientName||i?.winnerName||'-')}</td><td>${esc(s.recipientPhone||i?.winnerPhone||'-')}</td><td>${esc(s.method==='pickup'?'직접수령':'배송')}</td><td>${esc(s.status||'-')}</td><td>${esc([s.carrier,s.trackingNumber].filter(Boolean).join(' · ')||'-')}</td></tr>`}).join('');$('detail').innerHTML=`<div class="meta"><span>${date(a.createdAt)}</span><span>낙찰 합계 ${money(a.totalSoldAmount)}</span><span>배송 ${Number(a.shipmentCount)||0}</span></div><div class="table"><table><thead><tr><th>번호</th><th>개체</th><th>업체</th><th>팀</th><th>상태</th><th>낙찰자</th><th>낙찰가</th></tr></thead><tbody>${itemRows||'<tr><td colspan="7">저장된 개체가 없습니다.</td></tr>'}</tbody></table></div><div class="table"><table><thead><tr><th>개체</th><th>업체</th><th>수령인</th><th>연락처</th><th>방식</th><th>상태</th><th>배송·송장</th></tr></thead><tbody>${shipmentRows||'<tr><td colspan="7">저장된 배송 정보가 없습니다.</td></tr>'}</tbody></table></div>`;$('modal').hidden=false}catch(e){toast(e.message)}}
async function removeArchive(id){if(!confirm('이 회차 기록을 삭제할까요?'))return;try{await CreoPlatform.api(`channels/${encodeURIComponent(channelId)}/archives/${encodeURIComponent(id)}`,{method:'DELETE'});await load();toast('삭제했습니다.')}catch(e){toast(e.message)}}
$('save').onclick=async()=>{const title=$('archive-title').value.trim();if(!title)return toast('회차 이름을 입력해 주세요.');$('save').disabled=true;try{await CreoPlatform.api(`channels/${encodeURIComponent(channelId)}/archives`,{method:'POST',body:JSON.stringify({title})});$('archive-title').value='';await load();toast('회차를 저장했습니다.')}catch(e){toast(e.message)}finally{$('save').disabled=false}};$('close').onclick=()=>{$('modal').hidden=true};
async function boot(){await load()}$('login-form').onsubmit=async e=>{e.preventDefault();try{CreoPlatform.setAdmin($('password').value);if(!await CreoPlatform.verifyAdmin())throw new Error('비밀번호가 맞지 않습니다.');$('login').hidden=true;await boot()}catch(error){toast(error.message)}};(async()=>{try{if(await CreoPlatform.verifyAdmin()){$('login').hidden=true;return boot()}}catch(_){}$('login').hidden=false})();
</script>
</body></html>
