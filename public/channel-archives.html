<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>회차 관리 · CREO</title>
  <script src="auction-contract.js?v=20260819-contract-v1"></script>
  <script src="platform-client.js?v=20260803-admin-session-v2"></script>
  <script src="supabase-bridge.js?v=20260717-egress-hotfix-v1"></script>
  <script src="channel-adapters.js?v=20260813-ranking-v2"></script>
  <script src="ranking-engine.js?v=20260813-ranking-v2"></script>
  <script src="cdcup-tournament-data.js?v=20260817-round3-grid-v1"></script>
  <style>
    :root{color-scheme:light;--bg:#f4f6f8;--panel:#fff;--line:#dfe4ea;--text:#15191f;--muted:#737d89;--accent:#254ac7;--danger:#b83e48}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:-.018em}button,input,a{font:inherit}.shell{width:min(1120px,calc(100% - 30px));margin:auto;padding:30px 0 70px}.head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px}.head h1{margin:0;font-size:29px}.head p{margin:7px 0 0;color:var(--muted);font-size:12px}.head-actions{display:flex;align-items:center;gap:9px}.back{display:flex;height:42px;align-items:center;padding:0 13px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--text);font-size:11px;font-weight:800;text-decoration:none}.create{display:flex;gap:7px}.create input{width:270px;height:42px;padding:0 11px;border:1px solid var(--line);border-radius:9px;background:#fff}.btn{height:42px;padding:0 14px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:11px;font-weight:800;cursor:pointer}.btn.primary{border-color:var(--accent);background:var(--accent);color:#fff}.btn.danger{color:var(--danger)}.section-title{margin:28px 0 10px;font-size:12px;color:var(--muted);letter-spacing:.08em}.current,.card{border:1px solid var(--line);border-radius:14px;background:var(--panel);box-shadow:0 8px 24px rgba(20,30,45,.035)}.current-head,.card-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:17px}.current-head h2,.card-head h2{margin:0;font-size:15px}.meta{display:flex;flex-wrap:wrap;gap:6px 13px;margin-top:6px;color:var(--muted);font-size:10px}.list{display:grid;gap:9px}.detail{display:none;padding:0 17px 18px;border-top:1px solid var(--line)}.card.open .detail,.current.open .detail{display:block}.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:16px}.stat{padding:12px;border:1px solid var(--line);border-radius:10px;background:#fafbfc}.stat small{display:block;color:var(--muted);font-size:9px}.stat strong{display:block;margin-top:4px;font-size:16px}.subhead{margin:20px 0 9px;font-size:12px}.boards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.board,.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:11px}.board header{display:flex;justify-content:space-between;padding:12px 13px;background:#fafbfc}.board h3{margin:0;font-size:12px}.board header span{color:var(--muted);font-size:9px}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{padding:9px 11px;border-top:1px solid #edf0f3;text-align:left;font-size:10px}th{color:var(--muted);font-size:9px}.num{text-align:right!important;font-variant-numeric:tabular-nums}.rounds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.round{overflow:auto;border:1px solid var(--line);border-radius:10px}.round h4{margin:0;padding:11px;background:#fafbfc;font-size:11px}.empty{padding:45px 15px;border:1px dashed #cfd5dd;border-radius:12px;color:var(--muted);text-align:center}.loading{padding:30px;color:var(--muted);text-align:center}.login{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:#111722cc}.login[hidden]{display:none}.login form{display:flex;gap:7px;width:min(390px,calc(100% - 28px));padding:18px;border-radius:12px;background:#fff}.login input{min-width:0;flex:1;height:42px;padding:0 10px;border:1px solid var(--line);border-radius:8px}.toast{position:fixed;right:16px;bottom:16px;padding:11px 14px;border-radius:8px;background:#17202c;color:#fff;font-size:11px;opacity:0}.toast.show{opacity:1}@media(max-width:720px){.shell{width:calc(100% - 22px);padding-top:20px}.head{display:block}.head-actions{align-items:stretch;flex-direction:column-reverse;margin-top:14px}.back{justify-content:center}.create{margin-top:0}.create input{min-width:0;flex:1}.summary{grid-template-columns:repeat(2,minmax(0,1fr))}.boards,.rounds{grid-template-columns:1fr}.current-head,.card-head{align-items:flex-start}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="head"><div><h1 id="title">회차 관리</h1><p>현재 회차의 라운드 기록과 종합 순위를 한 화면에서 확인합니다.</p></div><div class="head-actions"><a class="back" id="channel-home" href="/">채널홈</a><div class="create"><input id="archive-title" maxlength="80" placeholder="예: 1회차 본방송"><button class="btn primary" id="save">현재 회차 저장</button></div></div></header>
    <h2 class="section-title">CURRENT EPISODE</h2><section class="current open" id="current"><header class="current-head"><div><h2>현재 회차 · 실시간 정보</h2><div class="meta"><span>현재 운영 데이터 기준</span></div></div><button class="btn" id="current-toggle">접기</button></header><div class="detail" id="current-detail"></div></section>
    <h2 class="section-title">SAVED EPISODES</h2><section class="list" id="list"><div class="empty">불러오는 중…</div></section>
  </main>
  <div class="login" id="login"><form id="login-form"><input id="password" type="password" autocomplete="current-password" placeholder="관리자 비밀번호" required><button class="btn primary">확인</button></form></div><div class="toast" id="toast"></div>
  <script>
    const $=id=>document.getElementById(id),esc=CreoPlatform.escapeHtml;
    const channelId=String(new URLSearchParams(location.search).get('channel')||'').toLowerCase().replace(/[^a-z0-9-]/g,'');
    let channel=null,archives=[],currentData=null,legacyPassword='';
    const isLegacy=()=>channel?.dataAdapter==='legacy-cdcup';
    const toast=message=>{const el=$('toast');el.textContent=message;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2400)};
    const date=value=>{const d=new Date(value);return Number.isNaN(d.getTime())?'-':d.toLocaleString('ko-KR')};
    const number=value=>Number(value||0).toLocaleString('ko-KR');
    const sold=item=>CreoAuctionContract.isSoldStatus(item.status)||Number(item.soldPrice)>0;
    const legacyRows=(rows,configs={})=>(rows||[]).map(row=>{const meta=typeof getItemAuctionMeta==='function'?getItemAuctionMeta(row):{};const group=CdcupTournamentData.parseStageGroups(configs,8)?.groups?.find(entry=>entry.code===meta.teamCode);return {...row,row:row.row||row.id,soldPrice:Number(row.soldPrice??row.sold_price)||0,vendorName:row.company||row.vendorName||'',teamName:group?.name||meta.teamCode||'',groupId:meta.teamCode||'',status:CreoAuctionContract.isSoldStatus(row.status)?'sold':row.status}});
    function boardMarkup(board){const rows=board.rows||[];return `<section class="board"><header><h3>${esc(board.name||'종합 순위표')}</h3><span>${esc(board.metric==='points'?'점수':board.metric==='soldCount'?'수량':'낙찰 금액')}</span></header><table><tbody>${rows.length?rows.map((row,index)=>`<tr><td>${index+1}</td><td><b>${esc(row.name||row.key||'-')}</b></td><td class="num">${number(row.total)}${esc(board.unit||'')}</td><td class="num">${Number(row.count)||0}건</td></tr>`).join(''):'<tr><td>집계 데이터 없음</td></tr>'}</tbody></table></section>`}
    function roundMarkup(configs,items){if(!isLegacy())return '';const amounts=CdcupTournamentData.buildRoundAmounts(configs||{},items||[]);const labels={16:'1라운드',8:'2라운드',4:'3라운드'};const cards=[16,8,4].map(stage=>{const rows=Object.entries(amounts[stage]||{}).sort((a,b)=>Number(b[1])-Number(a[1]));return `<section class="round"><h4>${labels[stage]}</h4><table><tbody>${rows.length?rows.map(([name,amount],index)=>`<tr><td>${index+1}</td><td>${esc(name)}</td><td class="num"><b>${number(amount)}만원</b></td></tr>`).join(''):'<tr><td>아직 입력된 결과가 없습니다.</td></tr>'}</tbody></table></section>`}).join('');return `<h3 class="subhead">라운드 정보</h3><div class="rounds">${cards}</div>`}
    function itemsMarkup(items){if(!items?.length)return '';return `<h3 class="subhead">회차 내역</h3><div class="table-wrap"><table><thead><tr><th>번호</th><th>업체</th><th>항목</th><th>상태</th><th class="num">낙찰가</th></tr></thead><tbody>${items.map(item=>`<tr><td>${Number(item.lotNumber??item.num)||'-'}</td><td>${esc(item.vendorName||item.company||'-')}</td><td>${esc(item.name||'-')}</td><td>${esc(item.status||'-')}</td><td class="num">${number(item.soldPrice??item.sold_price)}</td></tr>`).join('')}</tbody></table></div>`}
    function detailMarkup(data){const items=data.items||[],soldItems=items.filter(sold),boards=data.scoreboards||[];return `<section class="summary"><div class="stat"><small>전체 항목</small><strong>${Number(data.itemCount??items.length)||0}</strong></div><div class="stat"><small>낙찰 항목</small><strong>${Number(data.soldCount??soldItems.length)||0}</strong></div><div class="stat"><small>낙찰 합계</small><strong>${number(data.totalSoldAmount??soldItems.reduce((sum,item)=>sum+Number(item.soldPrice||0),0))}</strong></div><div class="stat"><small>순위표</small><strong>${boards.length}</strong></div></section>${roundMarkup(data.configs,items)}<h3 class="subhead">종합 순위표</h3><div class="boards">${boards.map(boardMarkup).join('')||'<div class="empty">설정된 순위표가 없습니다.</div>'}</div>${itemsMarkup(items)}`}
    async function currentEpisode(){if(isLegacy()){const [rows,configs]=await Promise.all([getItems(),getConfigMap()]);const items=legacyRows(rows,configs);return {items,configs,itemCount:items.length,soldCount:items.filter(sold).length,totalSoldAmount:items.filter(sold).reduce((sum,item)=>sum+Number(item.soldPrice||0),0),scoreboards:CreoRankingEngine.rankingsForChannel(channel,items)}}const workspace=await CreoPlatform.api(`channels/${encodeURIComponent(channelId)}/workspace`);return {...workspace,itemCount:workspace.items.length,soldCount:workspace.items.filter(sold).length,totalSoldAmount:workspace.items.filter(sold).reduce((sum,item)=>sum+Number(item.soldPrice||0),0),scoreboards:CreoRankingEngine.rankingsForChannel(channel,workspace.items)} }
    async function load(){if(!channelId)throw new Error('채널 주소가 올바르지 않습니다.');channel=(await CreoPlatform.api(`channels/${encodeURIComponent(channelId)}`)).channel;document.documentElement.style.setProperty('--accent',channel.theme?.primary||'#254ac7');$('title').textContent=`${channel.name} · 회차 관리`;$('channel-home').href=`/?channel=${encodeURIComponent(channelId)}`;currentData=await currentEpisode();archives=isLegacy()?await listAuctionArchives():(await CreoPlatform.api(`channels/${encodeURIComponent(channelId)}/archives`)).archives||[];render()}
    function render(){$('current-detail').innerHTML=detailMarkup(currentData);$('list').innerHTML=archives.length?archives.map(a=>`<article class="card" data-card="${esc(a.id)}"><header class="card-head"><div><h2>${esc(a.title||'제목 없는 회차')}</h2><div class="meta"><span>${date(a.createdAt)}</span><span>전체 ${Number(a.itemCount)||0}건</span><span>낙찰 ${Number(a.soldCount)||0}건</span><span>합계 ${number(a.totalSoldAmount)}</span></div></div><div><button class="btn" data-open="${esc(a.id)}">정보 펼치기</button>${isLegacy()?'':` <button class="btn danger" data-delete="${esc(a.id)}">삭제</button>`}</div></header><div class="detail" data-detail="${esc(a.id)}"></div></article>`).join(''):'<div class="empty">저장된 회차가 없습니다.</div>';document.querySelectorAll('[data-open]').forEach(button=>button.onclick=()=>openArchive(button.dataset.open));document.querySelectorAll('[data-delete]').forEach(button=>button.onclick=()=>removeArchive(button.dataset.delete))}
    async function openArchive(id){const card=document.querySelector(`[data-card="${CSS.escape(id)}"]`);if(card.classList.contains('open')){card.classList.remove('open');return}const target=card.querySelector('[data-detail]');target.innerHTML='<div class="loading">회차 정보를 불러오는 중…</div>';card.classList.add('open');try{let data;if(isLegacy()){const snapshot=await getAuctionArchive(id);if(!snapshot)throw new Error('회차 기록을 찾을 수 없습니다.');const items=legacyRows(snapshot.items,snapshot.configs);data={...snapshot,items,scoreboards:CreoRankingEngine.rankingsForChannel(channel,items)}}else data=(await CreoPlatform.api(`channels/${encodeURIComponent(channelId)}/archives/${encodeURIComponent(id)}`)).archive;target.innerHTML=detailMarkup(data)}catch(error){target.innerHTML=`<div class="empty">${esc(error.message)}</div>`}}
    async function removeArchive(id){if(!confirm('이 회차 기록을 삭제할까요?'))return;try{await CreoPlatform.api(`channels/${encodeURIComponent(channelId)}/archives/${encodeURIComponent(id)}`,{method:'DELETE'});await load();toast('삭제했습니다.')}catch(error){toast(error.message)}}
    $('current-toggle').onclick=()=>{const open=$('current').classList.toggle('open');$('current-toggle').textContent=open?'접기':'정보 펼치기'};
    $('save').onclick=async()=>{const title=$('archive-title').value.trim();if(!title)return toast('회차 이름을 입력해 주세요.');$('save').disabled=true;try{if(isLegacy()){const password=legacyPassword||prompt('기존 CDCUP 관리자 비밀번호를 입력해 주세요.')||'';const result=await createAuctionArchive(title,password);if(result?.success===false)throw new Error(result.error||'저장하지 못했습니다.');legacyPassword=password}else await CreoPlatform.api(`channels/${encodeURIComponent(channelId)}/archives`,{method:'POST',body:JSON.stringify({title})});$('archive-title').value='';await load();toast('현재 정보와 순위표를 함께 저장했습니다.')}catch(error){toast(error.message)}finally{$('save').disabled=false}};
    $('login-form').onsubmit=async event=>{event.preventDefault();try{legacyPassword=$('password').value;CreoPlatform.setAdmin(legacyPassword);if(!await CreoPlatform.verifyAdmin())throw new Error('비밀번호가 맞지 않습니다.');$('login').hidden=true;await load()}catch(error){toast(error.message)}};
    (async()=>{try{if(await CreoPlatform.verifyAdmin()){$('login').hidden=true;await load();return}}catch(_){}$('login').hidden=false})();
  </script>
</body>
</html>
