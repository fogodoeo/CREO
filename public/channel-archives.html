<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>회차 기록 · CREO</title>
  <script src="platform-client.js?v=20260803-admin-session-v2"></script>
  <style>
    :root{color-scheme:light;--bg:#f5f6f8;--panel:#fff;--line:#e0e4ea;--text:#15191f;--muted:#737d89;--accent:#254ac7;--danger:#bd3f46}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard Variable",Pretendard,sans-serif;letter-spacing:-.018em}button,input{font:inherit}
    .shell{width:min(900px,calc(100% - 30px));margin:auto;padding:30px 0 70px}.head{display:flex;align-items:end;justify-content:space-between;gap:18px}.head h1{margin:0;font-size:28px}.head p{margin:7px 0 0;color:var(--muted);font-size:11px}.create{display:flex;gap:7px}.create input{width:280px;height:42px;padding:0 11px;border:1px solid var(--line);border-radius:9px;background:#fff}.btn{height:42px;padding:0 14px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:11px;font-weight:800;cursor:pointer}.btn.primary{border-color:var(--accent);background:var(--accent);color:#fff}.btn.danger{color:var(--danger)}
    .list{display:grid;gap:8px;margin-top:24px}.card{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:17px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}.card h2{margin:0;font-size:14px}.date{margin-top:6px;color:var(--muted);font-size:10px}.actions{display:flex;gap:6px}.empty{padding:58px 18px;border:1px dashed #cfd5dd;border-radius:12px;color:var(--muted);text-align:center}.login{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:#111722cc}.login[hidden]{display:none}.login form{display:flex;gap:7px;width:min(390px,calc(100% - 28px));padding:18px;border-radius:12px;background:#fff}.login input{min-width:0;flex:1;height:42px;padding:0 10px;border:1px solid var(--line);border-radius:8px}.toast{position:fixed;right:16px;bottom:16px;padding:11px 14px;border-radius:8px;background:#17202c;color:#fff;font-size:11px;opacity:0}.toast.show{opacity:1}
    @media(max-width:680px){.shell{width:calc(100% - 22px);padding-top:20px}.head{display:block}.create{margin-top:14px}.create input{min-width:0;flex:1}.card{align-items:flex-start}.actions .btn{flex:1}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="head"><div><h1 id="title">회차 기록</h1><p>방송이 끝난 회차의 이름과 저장 시각만 관리합니다.</p></div><div class="create"><input id="archive-title" maxlength="80" placeholder="예: 8월 6일 본방송"><button class="btn primary" id="save">회차 저장</button></div></header>
    <section class="list" id="list"><div class="empty">불러오는 중…</div></section>
  </main>
  <div class="login" id="login"><form id="login-form"><input id="password" type="password" autocomplete="current-password" placeholder="관리자 비밀번호" required><button class="btn primary">확인</button></form></div>
  <div class="toast" id="toast"></div>
  <script>
    const $=id=>document.getElementById(id),esc=CreoPlatform.escapeHtml;
    const channelId=String(new URLSearchParams(location.search).get('channel')||'').toLowerCase().replace(/[^a-z0-9-]/g,'');
    let archives=[];
    const toast=message=>{const el=$('toast');el.textContent=message;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2400)};
    const date=value=>{const d=new Date(value);return Number.isNaN(d.getTime())?'-':d.toLocaleString('ko-KR')};
    async function load(){
      if(!channelId)throw new Error('채널 주소가 올바르지 않습니다.');
      const channel=(await CreoPlatform.api(`channels/${encodeURIComponent(channelId)}`)).channel;
      $('title').textContent=`${channel.name} · 회차 기록`;
      archives=(await CreoPlatform.api(`channels/${encodeURIComponent(channelId)}/archives`)).archives||[];
      render();
    }
    function render(){
      $('list').innerHTML=archives.length?archives.map(a=>`<article class="card"><div><h2>${esc(a.title||'제목 없는 회차')}</h2><div class="date">${date(a.createdAt)}</div></div><div class="actions"><button class="btn danger" data-delete="${esc(a.id)}">삭제</button></div></article>`).join(''):'<div class="empty">저장된 회차가 없습니다.</div>';
      document.querySelectorAll('[data-delete]').forEach(button=>button.onclick=()=>removeArchive(button.dataset.delete));
    }
    async function removeArchive(id){
      if(!confirm('이 회차 기록을 삭제할까요?'))return;
      try{await CreoPlatform.api(`channels/${encodeURIComponent(channelId)}/archives/${encodeURIComponent(id)}`,{method:'DELETE'});await load();toast('삭제했습니다.')}catch(error){toast(error.message)}
    }
    $('save').onclick=async()=>{
      const title=$('archive-title').value.trim();if(!title)return toast('회차 이름을 입력해 주세요.');$('save').disabled=true;
      try{await CreoPlatform.api(`channels/${encodeURIComponent(channelId)}/archives`,{method:'POST',body:JSON.stringify({title})});$('archive-title').value='';await load();toast('회차를 저장했습니다.')}catch(error){toast(error.message)}finally{$('save').disabled=false}
    };
    $('login-form').onsubmit=async event=>{event.preventDefault();try{CreoPlatform.setAdmin($('password').value);if(!await CreoPlatform.verifyAdmin())throw new Error('비밀번호가 맞지 않습니다.');$('login').hidden=true;await load()}catch(error){toast(error.message)}};
    (async()=>{try{if(await CreoPlatform.verifyAdmin()){$('login').hidden=true;return load()}}catch(_){}$('login').hidden=false})();
  </script>
</body>
</html>
