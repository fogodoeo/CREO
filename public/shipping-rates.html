<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>배송지·요금표 관리 · CREO</title>
    <script src="supabase-bridge.js?v=20260811-shipping-rates"></script>
    <script src="assets/vendor/xlsx.mini.min.js?v=0.18.5"></script>
    <link rel="stylesheet" href="common.css?v=20260707-nav-dropdown2">
    <style>
        :root { --ink:#172033; --muted:#667085; --line:#dfe5ed; --blue:#2563eb; --soft:#f4f7fb; }
        * { box-sizing:border-box; }
        body { margin:0; background:var(--soft); color:var(--ink); font-family:Pretendard,"Noto Sans KR",sans-serif; }
        .wrap { width:min(1040px,calc(100% - 28px)); margin:36px auto 80px; }
        .head { display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:20px; }
        h1 { margin:0 0 7px; font-size:28px; letter-spacing:-.04em; }
        .head p { margin:0; color:var(--muted); font-size:13px; }
        .back { color:#475569; font-size:13px; font-weight:800; text-decoration:none; }
        .card { padding:24px; border:1px solid var(--line); border-radius:20px; background:#fff; box-shadow:0 12px 34px rgba(15,23,42,.07); }
        .steps { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:20px; }
        .step { padding:14px; border:1px solid #e5e9f0; border-radius:14px; background:#fafbfd; }
        .step b { display:block; margin-bottom:5px; color:var(--blue); font-size:11px; }
        .step strong { font-size:14px; }
        .actions { display:flex; flex-wrap:wrap; gap:9px; margin:18px 0; }
        button,.file-label { display:inline-flex; align-items:center; justify-content:center; min-height:42px; padding:0 16px; border:1px solid #cfd7e3; border-radius:11px; background:#fff; color:#334155; font:800 13px inherit; cursor:pointer; }
        button.primary,.file-label.primary { border-color:var(--blue); background:var(--blue); color:#fff; }
        button:disabled { opacity:.45; cursor:not-allowed; }
        input[type=file] { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
        .status { display:none; padding:14px 16px; border-radius:12px; background:#eff6ff; color:#1d4ed8; font-size:13px; font-weight:750; }
        .status.show { display:block; }
        .status.error { background:#fff1f2; color:#be123c; }
        .summary { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:18px; }
        .vendor { padding:18px; border:1px solid var(--line); border-radius:15px; background:#fff; }
        .vendor span { display:block; color:var(--muted); font-size:11px; font-weight:700; }
        .vendor strong { display:block; margin:5px 0 2px; font-size:25px; }
        .vendor small { color:#8993a3; }
        .preview { margin-top:18px; overflow:auto; border:1px solid var(--line); border-radius:14px; }
        table { width:100%; border-collapse:collapse; background:#fff; font-size:12px; white-space:nowrap; }
        th,td { padding:10px 12px; border-bottom:1px solid #edf0f4; text-align:left; }
        th { position:sticky; top:0; background:#f8fafc; color:#64748b; font-size:11px; }
        .note { margin-top:13px; color:#7b8493; font-size:11px; line-height:1.6; }
        .auth { display:flex; gap:8px; margin-top:18px; }
        .auth input { flex:1; min-width:0; height:42px; padding:0 13px; border:1px solid #cfd7e3; border-radius:11px; font:inherit; }
        @media(max-width:680px){ .wrap{margin-top:22px}.head{align-items:flex-start;flex-direction:column}.steps,.summary{grid-template-columns:1fr}.card{padding:18px} }
    </style>
</head>
<body>
<main class="wrap">
    <header class="head">
        <div><h1>배송지·요금표 관리</h1><p>도도시·파르게·랩팡 거점과 배송비를 엑셀 한 장으로 갱신합니다.</p></div>
        <a class="back" href="shipping.html">← 배송관리로</a>
    </header>
    <section class="card">
        <div class="steps">
            <div class="step"><b>01</b><strong>양식 또는 현재표 받기</strong></div>
            <div class="step"><b>02</b><strong>엑셀 수정 후 선택</strong></div>
            <div class="step"><b>03</b><strong>검토하고 저장</strong></div>
        </div>
        <div class="actions">
            <button type="button" onclick="downloadTemplate()">빈 양식 받기</button>
            <button type="button" onclick="downloadCurrent()">현재표 엑셀 받기</button>
            <label class="file-label primary" for="rate-file">수정한 엑셀 선택</label>
            <input id="rate-file" type="file" accept=".xlsx,.xls,.csv" onchange="readWorkbook(this.files[0])">
            <button class="primary" id="save-btn" type="button" onclick="saveWorkbook()" disabled>검토한 내용 저장</button>
        </div>
        <div class="status" id="status"></div>
        <div class="summary" id="summary"></div>
        <div class="preview" id="preview" hidden></div>
        <div class="auth">
            <input id="admin-pw" type="password" autocomplete="current-password" placeholder="관리자 비밀번호 (설정된 경우)">
        </div>
        <p class="note">필수 열: 배송사, 권역/노선, 거점명, 기본요금. 도도시는 지역·세부지역·링크ID를 함께 사용할 수 있습니다. 업로드 파일에 포함된 배송사만 교체되며 나머지 업체 표는 유지됩니다.</p>
    </section>
</main>
<script>
    const HEADERS = ['배송사','권역/노선','지역','세부지역','거점명','도착요일','기본요금','링크ID'];
    const COMPANY_NAMES = ['도도시','파르게','랩팡'];
    let importedRows = [];
    let currentRows = [];

    const text = value => String(value == null ? '' : value).trim();
    const money = value => {
        const numeric = Number(String(value == null ? '' : value).replace(/[^0-9.-]/g,''));
        return Number.isFinite(numeric) && numeric >= 0 ? Math.round(numeric) : NaN;
    };
    const escapeHtml = value => text(value).replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
    function setStatus(message, error=false){ const el=document.getElementById('status'); el.textContent=message; el.className='status show'+(error?' error':''); }
    function normalizeHeader(value){ return text(value).replace(/\s+/g,'').toLowerCase(); }
    function pick(row, aliases){ const keys=Object.keys(row); const found=keys.find(key=>aliases.includes(normalizeHeader(key))); return found ? row[found] : ''; }
    function normalizeRows(rawRows){
        const errors=[];
        const rows=rawRows.map((row,index)=>{
            const company=text(pick(row,['배송사','업체','회사']));
            const group=text(pick(row,['권역/노선','권역','노선','지역그룹','그룹']));
            const region=text(pick(row,['지역','시도']));
            const sub=text(pick(row,['세부지역','세부','구역','구군']));
            const shop=text(pick(row,['거점명','거점','배송지','업체명','샵']));
            const day=text(pick(row,['도착요일','배송요일','요일','도착일']));
            const price=money(pick(row,['기본요금','요금','배송비','가격']));
            const idx=text(pick(row,['링크id','idx','id','링크번호']));
            if(!COMPANY_NAMES.includes(company)) errors.push(`${index+2}행: 배송사를 확인하세요.`);
            if(!group) errors.push(`${index+2}행: 권역/노선이 없습니다.`);
            if(!shop) errors.push(`${index+2}행: 거점명이 없습니다.`);
            if(!Number.isFinite(price)) errors.push(`${index+2}행: 기본요금이 올바르지 않습니다.`);
            return {company,group,region,sub,shop,day,price,idx};
        }).filter(row=>row.company||row.group||row.shop);
        if(!rows.length) errors.push('저장할 행이 없습니다.');
        if(rows.length>2500) errors.push('한 번에 2,500행까지만 업로드할 수 있습니다.');
        return {rows,errors};
    }
    function rowsToSheet(rows){ return [HEADERS].concat(rows.map(row=>[row.company,row.group,row.region,row.sub,row.shop,row.day,row.price,row.idx])); }
    function workbookDownload(rows,name){
        const ws=XLSX.utils.aoa_to_sheet(rowsToSheet(rows));
        ws['!cols']=[{wch:10},{wch:18},{wch:14},{wch:14},{wch:28},{wch:12},{wch:12},{wch:12}];
        const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'배송지 요금표'); XLSX.writeFile(wb,name);
    }
    function downloadTemplate(){ workbookDownload([
        {company:'도도시',group:'부산',region:'부산',sub:'해운대',shop:'예시 거점',day:'목·일',price:16000,idx:''},
        {company:'파르게',group:'서울/경기/인천',region:'',sub:'',shop:'예시 거점',day:'수·목',price:19000,idx:''},
        {company:'랩팡',group:'서울',region:'',sub:'',shop:'예시 거점',day:'토',price:25000,idx:''}
    ],'CREO_배송지요금표_양식.xlsx'); }
    function downloadCurrent(){ if(!currentRows.length){setStatus('현재표를 불러오는 중입니다.',true);return;} workbookDownload(currentRows,'CREO_배송지요금표_현재.xlsx'); }
    function flattenGrouped(company,data){ const rows=[]; Object.entries(data||{}).forEach(([group,items])=>(items||[]).forEach(item=>rows.push({company,group,region:'',sub:'',shop:item.shop||'',day:item.day||item.arrival_day||'',price:Number(item.cost||0),idx:''}))); return rows; }
    async function loadCurrent(){
        try{
            const [d,p,w]=await Promise.all([getDodosiData(),getPargeData(),getWrapangData()]);
            currentRows=(d.data||[]).map(item=>({company:'도도시',group:item.route||'',region:item.region||'',sub:item.sub||'',shop:item.shop||'',day:item.day||'',price:Number(item.price||0),idx:item.idx||''}))
                .concat(flattenGrouped('파르게',p.data),flattenGrouped('랩팡',w.data));
            renderSummary(currentRows);
        }catch(error){ setStatus('현재 배송표를 불러오지 못했습니다: '+error.message,true); }
    }
    async function readWorkbook(file){
        if(!file)return;
        try{
            const bytes=await file.arrayBuffer(); const wb=XLSX.read(bytes,{type:'array'}); const ws=wb.Sheets[wb.SheetNames[0]];
            const raw=XLSX.utils.sheet_to_json(ws,{defval:''}); const parsed=normalizeRows(raw);
            if(parsed.errors.length){ importedRows=[]; document.getElementById('save-btn').disabled=true; setStatus(parsed.errors.slice(0,8).join(' / ')+(parsed.errors.length>8?` 외 ${parsed.errors.length-8}건`:''),true); return; }
            importedRows=parsed.rows; document.getElementById('save-btn').disabled=false;
            setStatus(`${file.name} · ${importedRows.length.toLocaleString()}행 검토 완료`);
            renderSummary(importedRows); renderPreview(importedRows);
        }catch(error){ importedRows=[]; document.getElementById('save-btn').disabled=true; setStatus('엑셀을 읽지 못했습니다: '+error.message,true); }
    }
    function renderSummary(rows){ const el=document.getElementById('summary'); el.innerHTML=COMPANY_NAMES.map(company=>{const list=rows.filter(row=>row.company===company); const groups=new Set(list.map(row=>row.group)); return `<div class="vendor"><span>${company}</span><strong>${list.length.toLocaleString()}</strong><small>${groups.size}개 권역/노선</small></div>`;}).join(''); }
    function renderPreview(rows){ const box=document.getElementById('preview'); box.hidden=false; const sample=rows.slice(0,30); box.innerHTML=`<table><thead><tr>${HEADERS.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${sample.map(row=>`<tr><td>${escapeHtml(row.company)}</td><td>${escapeHtml(row.group)}</td><td>${escapeHtml(row.region)}</td><td>${escapeHtml(row.sub)}</td><td>${escapeHtml(row.shop)}</td><td>${escapeHtml(row.day)}</td><td>${row.price.toLocaleString()}</td><td>${escapeHtml(row.idx)}</td></tr>`).join('')}</tbody></table>`; }
    async function saveWorkbook(){
        if(!importedRows.length)return;
        const pw=document.getElementById('admin-pw').value;
        const status=await getAdminPwStatus();
        if(status.isSet && !(await verifyAdmin(pw))){ setStatus('관리자 비밀번호가 올바르지 않습니다.',true); return; }
        const button=document.getElementById('save-btn'); button.disabled=true; button.textContent='저장 중...';
        try{
            const updated=new Date().toLocaleString('ko-KR');
            for(const company of COMPANY_NAMES){
                const rows=importedRows.filter(row=>row.company===company); if(!rows.length)continue;
                if(company==='도도시'){
                    await saveShippingRateData(company,{updated,items:rows.map((row,index)=>({route:row.group,idx:row.idx||index+1,region:row.region,sub:row.sub,shop:row.shop,day:row.day,price:row.price}))});
                }else{
                    const data={}; rows.forEach(row=>{if(!data[row.group])data[row.group]=[]; data[row.group].push({shop:row.shop,cost:row.price,day:row.day});});
                    await saveShippingRateData(company,{updated,data});
                }
            }
            currentRows=importedRows.slice(); setStatus(`저장 완료 · ${updated} · 배송관리 화면을 새로 열면 적용됩니다.`); importedRows=[]; document.getElementById('rate-file').value='';
        }catch(error){ setStatus('저장 실패: '+error.message,true); button.disabled=false; }
        finally{ button.textContent='검토한 내용 저장'; }
    }
    loadCurrent();
</script>
</body>
</html>
