<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>변경 요청 · 옹동2</title>
<script src="/platform-client.js"></script>
<script src="/carrier-request-review.js"></script><link rel="stylesheet" href="/carrier-request-review.css">
<script src="/checkout-change-review.js?v=20261023-guided-review"></script><link rel="stylesheet" href="/checkout-change-review.css?v=20261023-guided-review">
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#191f28;font-family:system-ui,sans-serif;font-size:16px;line-height:1.5}main{max-width:740px;margin:auto;padding:24px 18px 64px}header{display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:26px;margin:24px 0 8px}h2{font-size:21px;margin:0}p{color:#6b7684;margin:8px 0 20px}article,.login{background:white;border-radius:20px;padding:24px;margin:16px 0}button,input,textarea{font:inherit}button,.back{border:0;border-radius:12px;padding:13px 18px;min-height:48px;cursor:pointer;background:#e8edf3;color:#333d4b;text-decoration:none}button.primary{background:#3182f6;color:white}button:disabled{opacity:.45;cursor:wait}.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}.compare section{padding:16px;background:#f5f6f8;border-radius:12px;overflow-wrap:anywhere}.compare section:last-child{background:#edf5ff}.caption{font-size:14px;color:#6b7684}.amount{font-weight:750;font-size:24px;font-variant-numeric:tabular-nums}.vendor{padding:12px 0;border-top:1px solid #e5e8eb}label{display:flex;align-items:start;gap:10px;margin:14px 0}input[type=checkbox]{width:22px;height:22px;flex-shrink:0}input[type=password],textarea{width:100%;border:1px solid #d1d6db;border-radius:10px;padding:12px}textarea{min-height:80px;resize:vertical}.actions{display:flex;gap:8px;margin-top:18px}.actions button{flex:1}.badge{display:inline-block;padding:4px 10px;background:#edf5ff;color:#1b64da;border-radius:8px;font-size:14px}.error{color:#b42318;white-space:pre-wrap}#notice{min-height:24px}small{color:#6b7684}[hidden]{display:none!important}@media(max-width:420px){article{padding:18px}.compare{gap:8px}.compare section{padding:12px}.amount{font-size:21px}}
</style><link rel="stylesheet" href="/ongdong-brand.css?v=20260908-logo"><script src="/ongdong-brand.js?v=20260908-logo"></script></head><body><main>
<header><strong data-ongdong-brand>옹동2</strong><a id="back" class="back" href="/shipping.html">배송 관리</a></header>
<h1>배송·결제 요청</h1><button id="reload-requests" type="button">새로고침</button>
<form id="login" class="login" hidden><label for="password">운영자 비밀번호</label><input id="password" type="password" autocomplete="current-password" required><button class="primary" style="width:100%;margin-top:12px">로그인</button></form>
<div id="notice" role="status" tabindex="-1">요청을 불러오는 중…</div><section id="carrier-requests" aria-label="도도시 이용 신청" hidden></section><section class="payment-change-requests"><h2>배송·결제 변경</h2><div id="list"></div></section>
</main><script>
'use strict';
const client=window.CreoPlatform,$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let channel=new URLSearchParams(location.search).get('channel')||'',focusId='',carrierFocusId='',busy=false;
let archive=new URLSearchParams(location.search).get('archive')||'';
const hasDraft=()=>busy||[...document.querySelectorAll('textarea')].some(n=>n.value.trim())||Boolean(document.querySelector('input[type=checkbox]:checked'));
function publishDraft(){if(window.parent!==window)window.parent.postMessage({type:'creo:operator-dirty',dirty:hasDraft()},location.origin);}
document.addEventListener('input',publishDraft);
window.addEventListener('beforeunload',event=>{if(window.parent===window&&hasDraft()){event.preventDefault();event.returnValue='';}});
function setBusy(value,owner){busy=value;$('reload-requests').disabled=value;for(const [id,type] of [['list','changes'],['carrier-requests','carrier']])if(type!==owner){const other=$(id);other.dataset.busy=String(value);other.inert=value;}publishDraft();}
async function load(){
 if(busy)return;
 setBusy(true,'load');try{
 if(!await client.verifyAdmin()){ $('login').hidden=false;$('list').replaceChildren();$('carrier-requests').replaceChildren();$('carrier-requests').hidden=true;$('notice').textContent='운영자 로그인 후 요청을 확인할 수 있어요.';$('notice').className='';publishDraft();return; }$('login').hidden=true;
 const code=location.pathname.match(/^\/w\/(op_[A-Za-z0-9_-]{16})$/)?.[1];
 if(code){const link=await client.api('checkout-change-link?code='+encodeURIComponent(code));channel=link.channelId;focusId=link.id;}
 const carrierCode=location.pathname.match(/^\/w\/(ds_[A-Za-z0-9_-]{16})$/)?.[1];let carrierData;
 if(carrierCode){const link=await client.api('carrier-request-link?code='+encodeURIComponent(carrierCode));channel=link.channelId;carrierFocusId=link.id;carrierData=await client.api('channels/'+encodeURIComponent(channel)+'/carrier-requests?recordId='+encodeURIComponent(carrierFocusId));archive=carrierData.archiveId||'';}
 if(!channel)throw Error('배송 관리에서 채널을 선택한 뒤 변경 요청을 열어 주세요.');
 const scope=new URLSearchParams({...((archive)?{archive}:{}),...(focusId?{recordId:focusId}:{})});
 const data=await client.api('channels/'+encodeURIComponent(channel)+'/checkout-changes'+(scope.size?'?'+scope:''));
 archive=data.archiveId||archive;$('back').href='/shipping.html?'+new URLSearchParams({channel,...(archive?{archive}:{})});
 if(!carrierData)carrierData=await client.api('channels/'+encodeURIComponent(channel)+'/carrier-requests'+(archive?'?archive='+encodeURIComponent(archive):''));
 CreoCarrierRequestReview.render({document,container:$('carrier-requests'),records:carrierData.records,focusId:carrierFocusId,onBusy:value=>setBusy(value,'carrier'),review:(id,body)=>client.api('channels/'+encodeURIComponent(channel)+'/carrier-requests/'+encodeURIComponent(id),{method:'POST',body:JSON.stringify(body)})});
 CreoCheckoutChangeReview.render({document,container:$('list'),records:data.records,focusId,onBusy:value=>setBusy(value,'changes'),review:(id,body)=>client.api('channels/'+encodeURIComponent(channel)+'/checkout-changes/'+encodeURIComponent(id),{method:'POST',body:JSON.stringify(body)})});
 $('notice').textContent='';$('notice').className='';
 }finally{setBusy(false,'load');}
}
$('login').onsubmit=async e=>{e.preventDefault();try{if(!await client.verifyAdmin($('password').value))throw Error('비밀번호를 확인해 주세요.');$('password').value='';await load();$('notice').textContent='';}catch(e){$('notice').textContent=e.message;}};
load().catch(e=>{$('notice').textContent=(e.message||'요청을 불러오지 못했어요.')+' 새로고침으로 다시 시도해 주세요.';$('notice').className='error';$('notice').focus();});
$('reload-requests').onclick=async()=>{if(busy||hasDraft()&&!confirm('작성 중인 내용을 확인한 뒤 새로고침할까요?'))return;$('reload-requests').disabled=true;try{await load();$('notice').textContent=$('login').hidden?'최신 요청을 불러왔어요.':'다시 로그인해 주세요.';$('notice').className='';publishDraft();}catch(e){$('notice').textContent=(e.message||'불러오지 못했어요.')+' 새로고침으로 다시 시도해 주세요.';$('notice').className='error';$('notice').focus();}finally{$('reload-requests').disabled=false;}};
</script></body></html>
