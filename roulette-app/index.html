<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07111f" />
    <meta name="description" content="채널과 행사에 관계없이 사용할 수 있는 공용 마블 추첨기" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MARBLE DRAW" />
    <meta property="og:description" content="공이 달리고, 결과가 남는 라이브 추첨" />
    <title>MARBLE DRAW</title>
    <link rel="stylesheet" href="./assets/app.scss" />
  </head>
  <body>
    <main class="app-shell" id="appShell">
      <section class="stage" aria-label="마블 추첨 화면">
        <div id="canvasHost" class="canvas-host" data-roulette-canvas-host></div>

        <header class="stage-header">
          <div class="brand-lockup">
            <span class="brand-kicker" id="brandName">MARBLE DRAW</span>
            <strong class="brand-title" id="brandTitle">공정하고 즐거운 추첨</strong>
            <span class="brand-channel" id="brandChannel" hidden></span>
          </div>
          <div class="stage-actions">
            <span class="status-pill" id="statusPill" data-state="loading">
              <i aria-hidden="true"></i><span id="statusText">엔진 준비 중</span>
            </span>
            <button class="icon-button" id="fullscreenButton" type="button" aria-label="전체 화면" title="전체 화면">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" /></svg>
            </button>
            <button class="panel-button" id="openPanelButton" type="button" aria-controls="controlPanel" aria-expanded="true">
              설정
            </button>
            <span class="version-badge" id="versionBadge">v1.5.0</span>
          </div>
        </header>

        <div class="stage-help" id="stageHelp">
          <span>화면 중앙을 누르고 있으면 2배속</span>
          <span aria-hidden="true">·</span>
          <span>우측 순위를 두 번 누르면 결과 복사</span>
        </div>

        <aside class="control-panel" id="controlPanel" aria-label="추첨 설정">
          <div class="panel-head">
            <div>
              <span class="eyebrow">LIVE DRAW CONTROL</span>
              <h1>추첨 준비</h1>
            </div>
            <button class="icon-button panel-close" id="closePanelButton" type="button" aria-label="설정 닫기">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
            </button>
          </div>

          <div class="panel-scroll">
            <section class="control-section">
              <div class="section-title">
                <h2>행사 정보</h2>
                <span>화면 상단에 표시됩니다</span>
              </div>
              <label class="field">
                <span>행사명</span>
                <input id="eventTitleInput" type="text" maxlength="40" autocomplete="off" />
              </label>
              <label class="field">
                <span>채널명 <small>선택</small></span>
                <input id="channelNameInput" type="text" maxlength="30" autocomplete="off" placeholder="예: BAND LIVE · 유튜브 · 오프라인" />
              </label>
            </section>

            <section class="control-section entries-section">
              <div class="section-title">
                <h2>참가자</h2>
                <div class="entry-stats" aria-live="polite">
                  <span><b id="personCount">0</b>명</span>
                  <span><b id="ballCount">0</b>개 공</span>
                </div>
              </div>
              <label class="field">
                <span class="sr-only">참가자 목록</span>
                <textarea id="entriesInput" rows="8" spellcheck="false" placeholder="한 줄에 한 명씩 입력"></textarea>
              </label>
              <p class="field-help"><code>이름*3</code>은 공 3개, <code>이름/5</code>는 물리 가중치 5입니다.</p>
              <div class="text-actions">
                <button id="sampleButton" type="button">예시 입력</button>
                <button id="importEntriesButton" type="button">파일 불러오기</button>
                <button id="clearEntriesButton" type="button">전체 삭제</button>
                <input id="entriesFileInput" type="file" accept=".txt,.csv,text/plain,text/csv" hidden />
              </div>
            </section>

            <section class="control-section">
              <div class="section-title"><h2>추첨 방식</h2></div>
              <div class="field-grid">
                <label class="field">
                  <span>맵</span>
                  <select id="mapSelect"></select>
                </label>
                <label class="field">
                  <span>속도</span>
                  <select id="speedSelect">
                    <option value="0.75">차분하게 · 0.75×</option>
                    <option value="1">기본 · 1×</option>
                    <option value="1.5">빠르게 · 1.5×</option>
                    <option value="2">매우 빠르게 · 2×</option>
                  </select>
                </label>
              </div>
              <fieldset class="winner-fieldset">
                <legend>당첨 기준</legend>
                <div class="segmented" id="winnerModeGroup">
                  <label><input type="radio" name="winnerMode" value="first" checked /><span>첫 번째</span></label>
                  <label><input type="radio" name="winnerMode" value="last" /><span>마지막</span></label>
                  <label><input type="radio" name="winnerMode" value="rank" /><span>직접 지정</span></label>
                </div>
              </fieldset>
              <label class="field rank-field" id="rankField" hidden>
                <span>당첨 순위</span>
                <input id="winningRankInput" type="number" min="1" value="1" inputmode="numeric" />
              </label>
              <div class="toggle-list">
                <label class="toggle-row">
                  <span><b>변수 스킬</b><small>공끼리 밀어내는 변수를 추가합니다</small></span>
                  <input id="skillsInput" type="checkbox" role="switch" />
                </label>
                <label class="toggle-row">
                  <span><b>자동 녹화</b><small>지원 브라우저에서 종료 후 영상을 저장합니다</small></span>
                  <input id="recordingInput" type="checkbox" role="switch" />
                </label>
              </div>
            </section>

            <details class="control-section advanced-section">
              <summary><span>화면 디자인</span><small>테마와 결과 문구</small></summary>
              <div class="advanced-body">
                <div class="theme-options" id="themeOptions">
                  <label><input type="radio" name="theme" value="midnight" checked /><span class="theme-swatch midnight">미드나잇</span></label>
                  <label><input type="radio" name="theme" value="arena" /><span class="theme-swatch arena">아레나</span></label>
                  <label><input type="radio" name="theme" value="clean" /><span class="theme-swatch clean">클린</span></label>
                </div>
                <div class="field-grid">
                  <label class="field">
                    <span>강조색</span>
                    <input id="accentColorInput" type="color" value="#f2c66d" />
                  </label>
                  <label class="field">
                    <span>결과 문구</span>
                    <input id="winnerLabelInput" type="text" maxlength="12" value="당첨" />
                  </label>
                </div>
                <div class="text-actions">
                  <button id="exportPresetButton" type="button">설정 내보내기</button>
                  <button id="importPresetButton" type="button">설정 가져오기</button>
                  <input id="presetFileInput" type="file" accept="application/json,.json" hidden />
                </div>
              </div>
            </details>

            <details class="control-section history-section">
              <summary><span>최근 추첨 기록</span><small id="historyCount">0건</small></summary>
              <div class="history-list" id="historyList"></div>
              <div class="text-actions history-actions">
                <button id="exportHistoryButton" type="button">전체 기록 저장</button>
                <button id="clearHistoryButton" type="button">기록 삭제</button>
              </div>
            </details>

            <div class="license-note">
              <span>브라우저 안에서만 처리되며 참가자 목록은 서버로 전송되지 않습니다.</span>
              <a href="./LICENSE.txt" target="_blank" rel="noopener">MIT 오픈소스 고지</a>
            </div>
          </div>

          <div class="panel-footer">
            <button class="secondary-action" id="shuffleButton" type="button" disabled>공 배치</button>
            <button class="primary-action" id="startButton" type="button" disabled>
              <span>추첨 시작</span><small id="startBallCount">0개 공</small>
            </button>
          </div>
        </aside>

        <button class="panel-backdrop" id="panelBackdrop" type="button" aria-label="설정 닫기" tabindex="-1"></button>
      </section>
    </main>

    <dialog class="result-dialog" id="resultDialog">
      <div class="result-card">
        <span class="result-kicker" id="resultLabel">당첨</span>
        <strong class="result-winner" id="resultWinner"></strong>
        <p id="resultEvent"></p>
        <dl class="result-meta">
          <div><dt>추첨 시드</dt><dd id="resultSeed"></dd></div>
          <div><dt>진행 시간</dt><dd id="resultDuration"></dd></div>
        </dl>
        <div class="result-actions">
          <button id="copyResultButton" type="button">결과 복사</button>
          <button id="replayButton" type="button">같은 시드로 재현</button>
          <button class="primary-action" id="newRoundButton" type="button">새 추첨</button>
        </div>
      </div>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./src/index.ts"></script>
  </body>
</html>
